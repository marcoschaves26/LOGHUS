squistossomose e verminoses: qual a medida preventiva mais cobrada?","v":"<b>Saneamento básico<\/b> (rede de esgoto, água tratada) e higiene; na teníase, também cozinhar bem a carne.","x":"Doenças tropicais negligenciadas aparecem associadas à pobreza e falta de saneamento.","r":"ENEM PPL 2025 · Q120 — Teníase (saneamento básico)","h":"H30","q":676},{"id":"CN-054","a":"CN","d":"Biologia","t":"Botânica: fisiologia e anatomia vegetal","k":"conceito","f":"Como as plantas CAM economizam água?","v":"Abrem os estômatos à <b>noite<\/b> e fixam CO<sub>2<\/sub> em ácidos orgânicos; de dia, com estômatos fechados, liberam o CO<sub>2<\/sub> para a fotossíntese.","x":"Típico de cactos, abacaxi e plantas de ambiente seco.","r":"ENEM PPL 2025 · Q99 — Metabolismo CAM (escassez de água)","h":"H28","q":639},{"id":"CN-055","a":"CN","d":"Biologia","t":"Botânica: fisiologia e anatomia vegetal","k":"conceito","f":"Qual hormônio vegetal promove o amadurecimento dos frutos?","v":"O <b>etileno<\/b>, um gás — por isso frutos maduros aceleram o amadurecimento de outros próximos.","x":"Auxina: crescimento/tropismos; giberelina: germinação/alongamento; citocinina: divisão celular.","r":"ENEM 2023 · Q97 — Amadurecimento de frutos (etileno)","h":"H3","q":627},{"id":"CN-056","a":"CN","d":"Biologia","t":"Botânica: fisiologia e anatomia vegetal","k":"conceito","f":"Quais adaptações permitiram a conquista do ambiente terrestre pelas plantas?","v":"Cutícula, estômatos, <b>tecidos condutores<\/b> (xilema/floema), grão de pólen (independência da água) e sementes.","x":"Briófitas ainda dependem de água para a fecundação.","r":"ENEM 2023 · Q103 — Conquista do ambiente terrestre (plantas)","h":"H16","q":697},{"id":"CN-057","a":"CN","d":"Biologia","t":"Impacto ambiental, poluição e conservação","k":"conceito","f":"Descreva a sequência da eutrofização.","v":"Excesso de nutrientes (N, P de esgoto/fertilizantes) → explosão de algas → morte e <b>decomposição aeróbia<\/b> → queda do O<sub>2<\/sub> dissolvido → morte de peixes.","x":"Quem consome o oxigênio são os decompositores, não as algas vivas.","r":"ENEM PPL 2023 · Q117 — Eutrofização e hipóxia (peixes na superfície)","h":"H10","q":529},{"id":"CN-058","a":"CN","d":"Biologia","t":"Impacto ambiental, poluição e conservação","k":"conceito","f":"Por que espécies exóticas invasoras ameaçam a biodiversidade?","v":"Sem predadores e competidores naturais, crescem sem controle, <b>competem com nativas<\/b>, predam ou transmitem doenças.","x":"Ex.: javali, caramujo-africano, rã-touro.","r":"ENEM PPL 2025 · Q95 — Controle de espécie invasora (javali)","h":"H4","q":485},{"id":"CN-059","a":"CN","d":"Biologia","t":"Impacto ambiental, poluição e conservação","k":"conceito","f":"Qual a função da mata ciliar?","v":"Protege as margens contra a erosão, evitando o <b>assoreamento<\/b> dos rios, filtra poluentes e serve de corredor ecológico.","x":"Sem mata ciliar: rio mais raso, enchentes e perda de biodiversidade.","r":"ENEM PPL 2024 · Q132 — Mata ciliar e assoreamento","h":"H4","q":590},{"id":"CN-060","a":"CN","d":"Biologia","t":"Fisiologia humana e animal: sistemas do corpo","k":"conceito","f":"Como funciona o arco reflexo?","v":"Receptor → neurônio <b>sensitivo<\/b> → <b>medula espinal<\/b> (interneurônio) → neurônio <b>motor<\/b> → músculo. Resposta involuntária sem passar pelo encéfalo.","x":"Ex.: reflexo patelar.","r":"ENEM 2021 · Q114 — Arco reflexo (reflexo patelar)","h":"H14","q":666},{"id":"CN-061","a":"CN","d":"Biologia","t":"Fisiologia humana e animal: sistemas do corpo","k":"conceito","f":"Qual a diferença entre fibras musculares vermelhas (lentas) e brancas (rápidas)?","v":"<b>Vermelhas<\/b>: muita mioglobina e mitocôndrias, metabolismo <b>aeróbio<\/b>, resistência (maratona, aves migratórias).<br><b>Brancas<\/b>: anaeróbias, contração rápida, fadiga fácil (explosão).","x":"Aves migratórias têm músculo peitoral rico em fibras vermelhas.","r":"ENEM 2024 · Q109 — Fibras musculares (tipos e metabolismo)","h":"H14","q":599},{"id":"CN-062","a":"CN","d":"Biologia","t":"Fisiologia humana e animal: sistemas do corpo","k":"conceito","f":"Como o corpo se adapta à altitude elevada?","v":"Com menos O<sub>2<\/sub> disponível, os rins liberam <b>eritropoetina<\/b> → aumenta a produção de hemácias e hemoglobina.","x":"Doping sanguíneo com EPO imita essa adaptação.","r":"ENEM PPL 2024 · Q111 — Hemoglobina e adaptação à altitude","h":"H28","q":629},{"id":"CN-063","a":"CN","d":"Biologia","t":"Ecologia: relações ecológicas e cadeias alimentares","k":"conceito","f":"Diferencie mutualismo, comensalismo e parasitismo.","v":"<b>Mutualismo<\/b> (+/+), obrigatório: cupins e protozoários que digerem celulose.<br><b>Comensalismo<\/b> (+/0).<br><b>Parasitismo<\/b> (+/−).","x":"Protocooperação é (+/+) não obrigatória.","r":"ENEM PPL 2025 · Q133 — Mutualismo (cupins e microrganismos)","h":"H9","q":549},{"id":"CN-064","a":"CN","d":"Biologia","t":"Ecologia: relações ecológicas e cadeias alimentares","k":"aplicação","f":"O que acontece com a diversidade quando se remove um predador de topo?","v":"Uma presa dominante cresce sem controle e exclui outras por competição → <b>diversidade cai<\/b> (espécie-chave).","x":"Experimento clássico: estrela-do-mar <i>Pisaster<\/i>.","r":"ENEM PPL 2024 · Q122 — Predador de topo (Pisaster) e diversidade","h":"H15","q":538},{"id":"CN-065","a":"CN","d":"Biologia","t":"Ecologia: relações ecológicas e cadeias alimentares","k":"conceito","f":"O que é efeito de borda na fragmentação de hábitats?","v":"Nas bordas do fragmento mudam luz, temperatura, umidade e vento, prejudicando espécies do interior; fragmentos pequenos têm proporcionalmente mais borda.","x":"Solução cobrada: corredores ecológicos ligando fragmentos.","r":"ENEM PPL 2022 · Q109 — Fragmentação de hábitat e efeito de borda","h":"H12","q":713},{"id":"CN-066","a":"CN","d":"Biologia","t":"Evolução, filogenia e classificação dos seres vivos","k":"conceito","f":"Diferencie Darwin e Lamarck.","v":"<b>Lamarck<\/b>: uso e desuso + herança dos caracteres adquiridos.<br><b>Darwin<\/b>: variabilidade preexistente + <b>seleção natural<\/b> dos mais aptos.","x":"Alternativa que diz \"o organismo se adaptou porque precisou\" é lamarckista.","r":"ENEM 2022 · Q110 — Seleção natural e reprodução (anuros)","h":"H16","q":591},{"id":"CN-067","a":"CN","d":"Biologia","t":"Evolução, filogenia e classificação dos seres vivos","k":"conceito","f":"O que é mimetismo? Dê o exemplo clássico do ENEM.","v":"Espécie imita outra (geralmente perigosa) e engana predadores. Ex.: <b>falsas corais<\/b> imitando a coral verdadeira peçonhenta.","x":"Camuflagem é imitar o ambiente; mimetismo é imitar outra espécie.","r":"ENEM 2024 · Q110 — Mimetismo (cobras-corais)","h":"H28","q":505},{"id":"CN-068","a":"CN","d":"Biologia","t":"Evolução, filogenia e classificação dos seres vivos","k":"aplicação","f":"Como ler o parentesco num cladograma?","v":"Quanto mais <b>recente o ancestral comum<\/b> (nó mais próximo), maior o parentesco. Ex.: aves são mais próximas de crocodilos/dinossauros que de lagartos.","x":"Posição lado a lado nos ramos finais NÃO indica parentesco.","r":"ENEM PPL 2021 · Q102 — Cladograma e grau de parentesco","h":"H16","q":592},{"id":"CN-069","a":"CN","d":"Biologia","t":"Citologia: célula, membranas, organelas e divisão celular","k":"conceito","f":"Onde se produz a maior parte do ATP na respiração aeróbia?","v":"Na <b>cadeia transportadora de elétrons<\/b> (membrana interna da mitocôndria), com O<sub>2<\/sub> como aceptor final → forma H<sub>2<\/sub>O.","x":"Glicólise (citosol) gera só 2 ATP; fermentação não usa O<sub>2<\/sub>.","r":"ENEM 2023 · Q127 — Cadeia transportadora de elétrons (ATP)","h":"H15","q":724},{"id":"CN-070","a":"CN","d":"Biologia","t":"Citologia: célula, membranas, organelas e divisão celular","k":"conceito","f":"O que acontece com uma hemácia em meio hipotônico e hipertônico?","v":"<b>Hipotônico<\/b>: água entra → incha e pode romper (hemólise).<br><b>Hipertônico<\/b>: água sai → murcha (crenação).","x":"Osmose: água vai do meio menos concentrado para o mais concentrado.","r":"ENEM PPL 2021 · Q131 — Fragilidade osmótica de hemácias","h":"H15","q":358},{"id":"CN-071","a":"CN","d":"Biologia","t":"Citologia: célula, membranas, organelas e divisão celular","k":"conceito","f":"Que evidências sustentam a teoria endossimbiótica?","v":"Mitocôndrias e cloroplastos têm <b>DNA circular próprio<\/b>, ribossomos semelhantes aos bacterianos, dupla membrana e se dividem sozinhos.","x":"Proposta por Lynn Margulis.","r":"ENEM PPL 2020 · Q100 — Teoria endossimbiótica (Margulis)","h":"H16","q":609},{"id":"CN-072","a":"CN","d":"Biologia","t":"Ecologia: ciclos biogeoquímicos e fluxo de energia","k":"conceito","f":"Quais as etapas do ciclo do nitrogênio e quem as realiza?","v":"<b>Fixação<\/b> (N<sub>2<\/sub>→NH<sub>3<\/sub>, bactérias como <i>Rhizobium<\/i>) → <b>amonificação<\/b> (decompositores) → <b>nitrificação<\/b> (NH<sub>3<\/sub>→NO<sub>2<\/sub>⁻→NO<sub>3<\/sub>⁻, <i>Nitrosomonas<\/i>/<i>Nitrobacter<\/i>) → <b>desnitrificação<\/b> (volta a N<sub>2<\/sub>).","x":"Leguminosas adubam o solo pela associação com bactérias fixadoras.","r":"ENEM 2023 · Q116 — Ciclo do nitrogênio (microrganismos)","h":"H9","q":682},{"id":"CN-073","a":"CN","d":"Biologia","t":"Ecologia: ciclos biogeoquímicos e fluxo de energia","k":"conceito","f":"Por que a energia diminui a cada nível trófico?","v":"Cada nível usa parte da energia na respiração (calor) e não assimila tudo: só ~10% passa adiante. Fluxo de energia é <b>unidirecional<\/b>; matéria é <b>cíclica<\/b>.","x":"Fitoplâncton é o grande fixador de carbono nos oceanos.","r":"ENEM 2016 · Q62 — Fixação de carbono pelo fitoplâncton","h":"H9","q":624},{"id":"CN-074","a":"CN","d":"Biologia","t":"Biotecnologia e engenharia genética","k":"conceito","f":"Como se produz insulina humana por bactérias (DNA recombinante)?","v":"Corta-se o gene humano com <b>enzimas de restrição<\/b>, insere-se num <b>plasmídeo<\/b> (ligase) e transforma-se a bactéria, que passa a produzir a proteína.","x":"Transgênico = organismo com gene de outra espécie.","r":"ENEM 2024 · Q95 — Clonagem gênica e produção de proteínas","h":"H11","q":703},{"id":"CN-075","a":"CN","d":"Biologia","t":"Biotecnologia e engenharia genética","k":"conceito","f":"Para que serve a PCR no diagnóstico?","v":"Amplifica (copia milhões de vezes) um trecho específico de DNA/RNA do patógeno, permitindo detectar o <b>material genético<\/b> mesmo em pequena quantidade.","x":"Para vírus de RNA, faz-se antes a transcrição reversa (RT-PCR).","r":"ENEM 2022 · Q102 — Diagnóstico por PCR (covid-19)","h":"H29","q":819},{"id":"CN-076","a":"CN","d":"Biologia","t":"Microbiologia, vírus, fungos e reinos","k":"conceito","f":"Por que o HIV é um retrovírus e como agem os antirretrovirais?","v":"Tem RNA e usa a <b>transcriptase reversa<\/b> para fazer DNA a partir do RNA. Inibidores dessa enzima impedem a integração no genoma do linfócito T CD4.","x":"Vírus são parasitas intracelulares obrigatórios: antibiótico não age sobre eles.","r":"ENEM PPL 2024 · Q129 — Inibição da transcriptase reversa (HIV)","h":"H11","q":649},{"id":"CN-077","a":"CN","d":"Biologia","t":"Microbiologia, vírus, fungos e reinos","k":"conceito","f":"Por que embalagem a vácuo e esterilização conservam alimentos?","v":"Vácuo remove O<sub>2<\/sub> e impede <b>aeróbios<\/b>; calor elimina microrganismos — mas endósporos bacterianos resistem e exigem autoclave.","x":"Anaeróbios (ex.: <i>Clostridium botulinum<\/i>) ainda podem crescer em conservas mal processadas.","r":"ENEM PPL 2021 · Q133 — Embalagem a vácuo e microrganismos aeróbios","h":"H2","q":486},{"id":"CN-078","a":"CN","d":"Biologia","t":"Metabolismo celular: fotossíntese, respiração e fermentação","k":"fórmula","f":"Equações gerais da fotossíntese e da respiração aeróbia.","v":"Fotossíntese: 6 CO<sub>2<\/sub> + 6 H<sub>2<\/sub>O → C<sub>6<\/sub>H<sub>12<\/sub>O<sub>6<\/sub> + 6 O<sub>2<\/sub> (luz).<br>Respiração: o inverso, liberando energia (ATP).","x":"O O<sub>2<\/sub> liberado na fotossíntese vem da <b>fotólise da água<\/b>, não do CO<sub>2<\/sub>.","r":"ENEM PPL 2023 · Q123 — Fotólise da água (reposição de elétrons)","h":"H9","q":711},{"id":"CN-079","a":"CN","d":"Biologia","t":"Metabolismo celular: fotossíntese, respiração e fermentação","k":"conceito","f":"Diferencie fermentação alcoólica e lática.","v":"<b>Alcoólica<\/b> (leveduras): glicose → etanol + CO<sub>2<\/sub> (pão, cerveja).<br><b>Lática<\/b> (bactérias, músculo em esforço): glicose → ácido lático (iogurte). Ambas rendem só 2 ATP.","x":"O CO<sub>2<\/sub> da alcoólica é o que faz a massa do pão crescer.","r":"ENEM PPL 2022 · Q117 — Fermentação alcoólica e lática","h":"H29","q":657},{"id":"CN-080","a":"CN","d":"Biologia","t":"Zoologia e diversidade animal","k":"conceito","f":"Que novidade evolutiva permitiu aos répteis a independência da água para reprodução?","v":"O <b>ovo amniótico<\/b> (com casca e anexos: âmnio, cório, alantoide, saco vitelínico).","x":"Anfíbios ainda dependem de água e têm pele permeável usada na respiração.","r":"ENEM PPL 2015 · Q48 — Ovo amniótico no cladograma","h":null,"q":556},{"id":"CN-081","a":"CN","d":"Biologia","t":"Zoologia e diversidade animal","k":"conceito","f":"Por que os crustáceos e insetos fazem muda (ecdise)?","v":"O <b>exoesqueleto de quitina<\/b> é rígido e não cresce; para crescer, o animal precisa trocá-lo.","x":"Holometábolos (borboleta) passam por ovo, larva, pupa e adulto.","r":"ENEM 2024 · Q111 — Exoesqueleto dos crustáceos","h":"H14","q":600},{"id":"CN-082","a":"CN","d":"Biologia","t":"Bioquímica: água, sais, proteínas e enzimas","k":"conceito","f":"Como temperatura e pH afetam as enzimas?","v":"Cada enzima tem <b>temperatura e pH ótimos<\/b>; extremos desnaturam a proteína (alteram sua forma) e a atividade cai.","x":"Pepsina (estômago) atua em pH ácido (~2); amilase salivar, em pH neutro.","r":"ENEM PPL 2017 · Q133 — Atividade enzimática e pH","h":"H17","q":494},{"id":"CN-083","a":"CN","d":"Biologia","t":"Bioquímica: água, sais, proteínas e enzimas","k":"conceito","f":"Quais vitaminas e minerais mais aparecem associados a doenças no ENEM?","v":"<b>Vitamina A<\/b>: cegueira noturna. <b>Iodo<\/b>: bócio (hipotireoidismo). <b>Ferro<\/b>: anemia. <b>Vitamina C<\/b>: escorbuto. <b>Vitamina D<\/b>: raquitismo.","x":"Aminoácidos essenciais precisam vir da dieta (dietas veganas combinam arroz + feijão).","r":"ENEM PPL 2018 · Q127 — Cegueira noturna (vitamina A)","h":"H18","q":519},{"id":"CN-084","a":"CN","d":"Química","t":"Química orgânica: funções, isomeria e reações","k":"conceito","f":"Como reconhecer as funções orgânicas mais cobradas?","v":"<b>Álcool<\/b> –OH em C saturado · <b>Fenol<\/b> –OH no anel · <b>Aldeído<\/b> –CHO · <b>Cetona<\/b> C=O entre carbonos · <b>Ác. carboxílico<\/b> –COOH · <b>Éster<\/b> –COO– · <b>Amina<\/b> –NH<sub>2<\/sub> · <b>Amida<\/b> –CONH<sub>2<\/sub>.","x":"O ENEM dá a estrutura de um produto natural ou fármaco e pede a função presente.","r":"ENEM 2025 · Q115 — Identificação de compostos orgânicos","h":"H24","q":614},{"id":"CN-085","a":"CN","d":"Química","t":"Química orgânica: funções, isomeria e reações","k":"conceito","f":"O que é isomeria óptica e por que importa nos fármacos?","v":"Ocorre com <b>carbono quiral<\/b> (4 ligantes diferentes): dois enantiômeros, imagens especulares, que podem ter efeitos biológicos distintos.","x":"Ex.: ibuprofeno, talidomida. Só um enantiômero costuma ser ativo.","r":"ENEM 2023 · Q123 — Isomeria óptica (ibuprofeno)","h":"H24","q":661},{"id":"CN-086","a":"CN","d":"Química","t":"Química orgânica: funções, isomeria e reações","k":"conceito","f":"O que é isomeria geométrica (cis-trans) e onde aparece no ENEM?","v":"Em ligação dupla C=C com ligantes diferentes em cada carbono. A luz converte o <b>retinal<\/b> de cis para trans, disparando o sinal da visão.","x":"Lentes fotocrômicas também usam rearranjo molecular induzido pela luz.","r":"ENEM PPL 2025 · Q119 — Isomeria do retinal (visão)","h":"H22","q":675},{"id":"CN-087","a":"CN","d":"Química","t":"Química orgânica: funções, isomeria e reações","k":"aplicação","f":"O que é octanagem da gasolina?","v":"Resistência à detonação (autoignição) sob compressão. Hidrocarbonetos <b>ramificados<\/b> (iso-octano) têm octanagem maior que os de cadeia linear.","x":"Adicionar etanol à gasolina aumenta a octanagem.","r":"ENEM 2023 · Q118 — Octanagem e hidrocarbonetos (gasolina)","h":"H18","q":647},{"id":"CN-088","a":"CN","d":"Química","t":"Química ambiental: poluição, resíduos e tratamento","k":"conceito","f":"Diferencie efeito estufa, aquecimento global e destruição da camada de ozônio.","v":"<b>Efeito estufa<\/b>: natural, retenção de IV por CO<sub>2<\/sub>, CH<sub>4<\/sub>, H<sub>2<\/sub>O. <b>Aquecimento global<\/b>: intensificação por emissões humanas. <b>Ozônio<\/b>: destruído por CFCs, aumenta a radiação UV.","x":"Pegadinha frequente: CFC e buraco na camada de ozônio NÃO são a causa do aquecimento global.","r":"ENEM 2025 · Q104 — CO2 e aquecimento global","h":"H4","q":533},{"id":"CN-089","a":"CN","d":"Química","t":"Química ambiental: poluição, resíduos e tratamento","k":"conceito","f":"O que são biorremediação e fitorremediação?","v":"Uso de <b>microrganismos<\/b> (bio) ou <b>plantas<\/b> (fito) para degradar ou acumular contaminantes do solo e da água.","x":"Alternativa de baixo custo e menor impacto que remover o solo.","r":"ENEM 2024 · Q134 — Fitorremediação de solos","h":"H27","q":739},{"id":"CN-090","a":"CN","d":"Química","t":"Química ambiental: poluição, resíduos e tratamento","k":"conceito","f":"Quais as etapas do tratamento de água para consumo?","v":"Coagulação/floculação (Al<sub>2<\/sub>(SO<sub>4<\/sub>)<sub>3<\/sub>) → decantação → filtração → desinfecção (cloro) → fluoretação e correção de pH.","x":"Decantação e filtração são separações físicas; cloração é química.","r":"ENEM 2022 · Q126 — Tratamento de água (potabilização)","h":"H8","q":752},{"id":"CN-091","a":"CN","d":"Química","t":"Ácidos, bases, pH e neutralização","k":"fórmula","f":"Como interpretar pH e quanto varia [H⁺] entre pH 3 e pH 5?","v":"<b>pH = −log[H⁺]<\/b>. pH < 7 ácido, = 7 neutro, > 7 básico (25 °C). Cada unidade = fator 10: pH 3 tem <b>100×<\/b> mais H⁺ que pH 5.","x":"pH + pOH = 14.","r":"ENEM PPL 2025 · Q110 — Correção do pH da água (íons H⁺)","h":"H7","q":632},{"id":"CN-092","a":"CN","d":"Química","t":"Ácidos, bases, pH e neutralização","k":"aplicação","f":"Como corrigir um solo ácido?","v":"Calagem: adicionar substância de caráter <b>básico<\/b> como CaCO<sub>3<\/sub> (calcário) ou CaO (óxido básico), que neutraliza o H⁺.","x":"Sal de caráter ácido (ex.: NH<sub>4<\/sub>Cl, sulfato de alumínio) corrige solo alcalino.","r":"ENEM PPL 2022 · Q106 — Correção da acidez do solo (óxido básico)","h":"H2","q":654},{"id":"CN-093","a":"CN","d":"Química","t":"Ácidos, bases, pH e neutralização","k":"aplicação","f":"Como eliminar o cheiro de peixe (aminas) com produtos de cozinha?","v":"Aminas são <b>bases<\/b>; ácidos como limão ou vinagre as neutralizam formando sais não voláteis (sem odor).","x":"Reação ácido + base → sal + água: o ENEM pede o reagente de caráter oposto.","r":"ENEM PPL 2023 · Q127 — Neutralização de amina (odor de peixe)","h":"H7","q":647},{"id":"CN-094","a":"CN","d":"Química","t":"Soluções, concentração e solubilidade","k":"fórmula","f":"Como calcular concentração e diluição de soluções?","v":"C = m/V (g/L); M = n/V (mol/L). Diluição: <b>C<sub>1<\/sub>·V<sub>1<\/sub> = C<sub>2<\/sub>·V<sub>2<\/sub><\/b> (soluto constante).","x":"Atenção às unidades: mL → L, mg → g, ppm = mg/kg ≈ mg/L em água.","r":"ENEM 2024 · Q97 — Preparo do soro caseiro (concentração)","h":"H25","q":695},{"id":"CN-095","a":"CN","d":"Química","t":"Soluções, concentração e solubilidade","k":"conceito","f":"Qual a regra de solubilidade \"semelhante dissolve semelhante\"?","v":"Substâncias <b>polares<\/b> dissolvem polares (água, sal, açúcar); <b>apolares<\/b> dissolvem apolares (óleo, gasolina, gorduras).","x":"Pesticidas lipossolúveis se acumulam na gordura dos animais (bioacumulação).","r":"ENEM PPL 2022 · Q108 — Lipossolubilidade de pesticidas (bioacumulação)","h":"H24","q":656},{"id":"CN-096","a":"CN","d":"Química","t":"Soluções, concentração e solubilidade","k":"conceito","f":"O que é água dura e por que é um problema?","v":"Água rica em íons <b>Ca²⁺ e Mg²⁺<\/b>: forma incrustações em caldeiras e canos e reduz a ação do sabão (forma precipitado).","x":"Deionização com resinas troca esses íons por H⁺/OH⁻.","r":"ENEM 2023 · Q94 — Dureza da água (sais e caldeiras)","h":"H7","q":767},{"id":"CN-097","a":"CN","d":"Química","t":"Eletroquímica, pilhas, eletrólise e corrosão","k":"conceito","f":"Numa pilha, onde ocorre oxidação e redução e qual o sentido dos elétrons?","v":"<b>Ânodo<\/b> (−): oxidação, perde elétrons. <b>Cátodo<\/b> (+): redução, ganha elétrons. Elétrons fluem do ânodo para o cátodo pelo fio.","x":"Metal com maior potencial de redução sofre redução; o outro se corrói.","r":"ENEM 2025 · Q124 — Limpeza da prata (oxirredução)","h":"H24","q":718},{"id":"CN-098","a":"CN","d":"Química","t":"Eletroquímica, pilhas, eletrólise e corrosão","k":"conceito","f":"Como funciona o metal de sacrifício na proteção contra corrosão?","v":"Liga-se ao ferro um metal mais reativo (<b>menor potencial de redução<\/b>, ex.: Zn, Mg), que se oxida no lugar do ferro.","x":"Galvanização = revestir ferro com zinco. Ambiente salino (litoral) acelera a corrosão.","r":"ENEM PPL 2020 · Q115 — Corrosão e ambiente litorâneo","h":"H3","q":711},{"id":"CN-099","a":"CN","d":"Química","t":"Eletroquímica, pilhas, eletrólise e corrosão","k":"conceito","f":"Diferença entre pilha e eletrólise.","v":"<b>Pilha<\/b>: reação espontânea gera corrente (química → elétrica).<br><b>Eletrólise<\/b>: corrente força reação não espontânea (elétrica → química). Ex.: NaCl(aq) → NaOH, Cl<sub>2<\/sub> e H<sub>2<\/sub>.","x":"Recarregar bateria é fazer eletrólise.","r":"ENEM PPL 2021 · Q105 — Eletrólise de NaCl (soda cáustica)","h":"H18","q":653},{"id":"CN-100","a":"CN","d":"Química","t":"Materiais, propriedades da matéria e separação de misturas","k":"conceito","f":"Qual método separa cada tipo de mistura?","v":"<b>Filtração<\/b>: sólido + líquido. <b>Decantação<\/b>: líquidos imiscíveis ou sólido denso. <b>Destilação simples<\/b>: sólido dissolvido. <b>Destilação fracionada<\/b>: líquidos miscíveis. <b>Cromatografia<\/b>: pigmentos.","x":"O ENEM descreve o processo e pede o nome ou a propriedade explorada (densidade, TE, solubilidade).","r":"ENEM 2017 · Q130 — Cromatografia em papel","h":"H18","q":634},{"id":"CN-101","a":"CN","d":"Química","t":"Materiais, propriedades da matéria e separação de misturas","k":"pegadinha","f":"Gelo seco \"fumegando\" está evaporando?","v":"Não: é <b>sublimação<\/b> do CO<sub>2<\/sub> (sólido → gás). A \"fumaça\" visível é vapor d'água do ar condensado pelo frio.","x":"Mudança de estado é fenômeno físico.","r":"ENEM 2020 · Q103 — Propriedades do CO2 (gelo seco)","h":"H10","q":686},{"id":"CN-102","a":"CN","d":"Química","t":"Estequiometria e cálculos químicos","k":"fórmula","f":"Qual o roteiro de um cálculo estequiométrico?","v":"1) Equação balanceada; 2) proporção em mol; 3) converter (1 mol = M g = 6·10²³ partículas = 22,4 L nas CNTP); 4) regra de três; 5) aplicar rendimento/pureza.","x":"Rendimento de 80% → multiplique o produto teórico por 0,8.","r":"ENEM PPL 2023 · Q95 — Massa de bauxita para produção de alumínio","h":"H25","q":671},{"id":"CN-103","a":"CN","d":"Química","t":"Estequiometria e cálculos químicos","k":"aplicação","f":"Quanto CO<sub>2<\/sub> é emitido na queima de 1 mol de etanol?","v":"C<sub>2<\/sub>H<sub>5<\/sub>OH + 3 O<sub>2<\/sub> → <b>2 CO<sub>2<\/sub><\/b> + 3 H<sub>2<\/sub>O. 46 g de etanol → 88 g de CO<sub>2<\/sub>.","x":"Massas molares-chave: C = 12, H = 1, O = 16, CO<sub>2<\/sub> = 44 g/mol.","r":"ENEM PPL 2025 · Q116 — Produção de etanol (fermentação da sacarose)","h":"H25","q":741},{"id":"CN-104","a":"CN","d":"Química","t":"Combustíveis, biocombustíveis e fontes de energia","k":"conceito","f":"O que é biogás e como é produzido?","v":"Mistura rica em <b>metano (CH<sub>4<\/sub>)<\/b> gerada pela decomposição <b>anaeróbia<\/b> de matéria orgânica em biodigestores (esterco, lixo, esgoto).","x":"Sobra biofertilizante; queimar o metano reduz o efeito estufa (CH<sub>4<\/sub> é mais potente que CO<sub>2<\/sub>).","r":"ENEM 2024 · Q133 — Biogás a partir de resíduos","h":"H25","q":722},{"id":"CN-105","a":"CN","d":"Química","t":"Combustíveis, biocombustíveis e fontes de energia","k":"conceito","f":"Como se produz o biodiesel?","v":"<b>Transesterificação<\/b>: óleo/gordura (triglicerídeo) + álcool (metanol/etanol) com catalisador → ésteres (biodiesel) + glicerina.","x":"Biocombustível é \"renovável\": o CO<sub>2<\/sub> emitido foi absorvido na fotossíntese.","r":"ENEM PPL 2025 · Q108 — Produção de biodiesel a partir de vinhaça","h":"H27","q":639},{"id":"CN-106","a":"CN","d":"Química","t":"Polímeros e materiais","k":"conceito","f":"Diferencie polímeros de adição e de condensação.","v":"<b>Adição<\/b>: monômeros com C=C se somam sem subprodutos (PE, PVC, PP, PS).<br><b>Condensação<\/b>: libera molécula pequena, geralmente água (PET, náilon).","x":"PET é poliéster: pode ser reciclado quimicamente por hidrólise.","r":"ENEM PPL 2017 · Q119 — Polímeros de adição","h":"H4","q":611},{"id":"CN-107","a":"CN","d":"Química","t":"Polímeros e materiais","k":"conceito","f":"Por que polímeros biodegradáveis se decompõem mais rápido?","v":"Têm grupos hidrolisáveis (ex.: <b>éster<\/b>) que microrganismos conseguem quebrar, ao contrário de cadeias só de C–C (polietileno).","x":"Sacolas comuns persistem por séculos.","r":"ENEM 2020 · Q92 — Polímeros biodegradáveis (resíduos)","h":"H19","q":492},{"id":"CN-108","a":"CN","d":"Química","t":"Bioquímica e química de alimentos","k":"conceito","f":"O que é gordura trans e como ela se forma?","v":"Gordura com dupla C=C em configuração <b>trans<\/b>, formada na <b>hidrogenação parcial<\/b> de óleos vegetais (margarina).","x":"Associada a doenças cardiovasculares.","r":"ENEM PPL 2018 · Q112 — Hidrogenação e gorduras trans","h":"H2","q":636},{"id":"CN-109","a":"CN","d":"Química","t":"Bioquímica e química de alimentos","k":"conceito","f":"Como o vinagre é produzido a partir do vinho?","v":"Fermentação <b>acética<\/b>: bactérias oxidam o etanol a ácido acético na presença de O<sub>2<\/sub>.","x":"Alcoólica é anaeróbia (leveduras); acética é aeróbia (bactérias).","r":"ENEM PPL 2019 · Q104 — Vinagre e fermentação acética","h":"H7","q":611},{"id":"CN-110","a":"CN","d":"Química","t":"Metalurgia, mineração e processos industriais","k":"conceito","f":"Como se obtém o ferro no alto-forno?","v":"Redução do minério (Fe<sub>2<\/sub>O<sub>3<\/sub>) pelo <b>monóxido de carbono<\/b> vindo do carvão: Fe<sub>2<\/sub>O<sub>3<\/sub> + 3 CO → 2 Fe + 3 CO<sub>2<\/sub>.","x":"O carvão é agente redutor e combustível; o calcário remove impurezas (escória).","r":"ENEM PPL 2017 · Q99 — Obtenção do ferro (alto-forno)","h":"H11","q":545},{"id":"CN-111","a":"CN","d":"Química","t":"Metalurgia, mineração e processos industriais","k":"aplicação","f":"Por que reciclar alumínio é tão vantajoso?","v":"Obter Al da bauxita exige <b>eletrólise ígnea<\/b>, de altíssimo consumo de energia; refundir latas gasta cerca de 5% dessa energia.","x":"Bauxita → alumina (processo Bayer) → alumínio (eletrólise).","r":"ENEM 2024 · Q135 — Produção e reciclagem de alumínio","h":"H26","q":622},{"id":"CN-112","a":"CN","d":"Química","t":"Radioatividade e química nuclear","k":"conceito","f":"Diferencie fissão e fusão nuclear.","v":"<b>Fissão<\/b>: núcleo pesado (U-235) se divide → usinas nucleares e lixo radioativo.<br><b>Fusão<\/b>: núcleos leves se unem (H → He) → energia do Sol.","x":"Enriquecer urânio = aumentar a proporção de U-235 físsil.","r":"ENEM 2022 · Q97 — Enriquecimento de urânio","h":"H26","q":661},{"id":"CN-113","a":"CN","d":"Química","t":"Radioatividade e química nuclear","k":"aplicação","f":"Por que o iodo-131 é usado na medicina e quais os riscos em acidentes nucleares?","v":"A tireoide absorve iodo: o I-131 serve para diagnóstico e tratamento. Em acidentes, ingere-se iodo estável para saturar a tireoide.","x":"Meia-vida curta (~8 dias) reduz o tempo de exposição.","r":"ENEM 2022 · Q109 — Radioisótopos e saúde (iodo-131)","h":"H22","q":621},{"id":"CN-114","a":"CN","d":"Química","t":"Reações químicas e transformações da matéria","k":"conceito","f":"O que acontece quando ácido reage com carbonato (mármore, calcário)?","v":"Libera <b>CO<sub>2<\/sub><\/b> (efervescência): CaCO<sub>3<\/sub> + 2 HCl → CaCl<sub>2<\/sub> + H<sub>2<\/sub>O + CO<sub>2<\/sub>.","x":"Chuva ácida corrói monumentos de mármore pela mesma reação.","r":"ENEM 2022 · Q117 — Reação ácido-carbonato (mármore + HCl)","h":"H17","q":602},{"id":"CN-115","a":"CN","d":"Química","t":"Reações químicas e transformações da matéria","k":"conceito","f":"Como o calcário remove SO<sub>2<\/sub> dos gases de chaminés?","v":"CaCO<sub>3<\/sub> → CaO + CO<sub>2<\/sub>; o CaO (básico) reage com o SO<sub>2<\/sub> (ácido) formando CaSO<sub>3<\/sub>/CaSO<sub>4<\/sub> sólidos.","x":"Óxido ácido + óxido básico → sal.","r":"ENEM PPL 2022 · Q120 — Remoção de SO2 por calcário","h":"H27","q":666},{"id":"CN-116","a":"CN","d":"Química","t":"Termoquímica e energia nas reações","k":"conceito","f":"Diferencie reação exotérmica e endotérmica.","v":"<b>Exotérmica<\/b>: libera calor, <b>ΔH < 0<\/b> (combustão). <b>Endotérmica<\/b>: absorve calor, ΔH > 0. Energia de ativação é a \"barreira\" em ambas.","x":"Catalisador reduz a energia de ativação, mas não altera ΔH.","r":"ENEM PPL 2021 · Q100 — Diagrama de energia (exotérmica com energia de ativação)","h":"H21","q":631},{"id":"CN-117","a":"CN","d":"Química","t":"Termoquímica e energia nas reações","k":"fórmula","f":"Como calcular ΔH por energias de ligação?","v":"<b>ΔH = Σ(ligações rompidas) − Σ(ligações formadas)<\/b>. Romper absorve energia; formar libera.","x":"Lei de Hess: ΔH total = soma dos ΔH das etapas (inverteu a equação → troque o sinal).","r":"ENEM PPL 2025 · Q123 — Entalpia de reação (energia de ligação)","h":"H21","q":623},{"id":"CN-118","a":"CN","d":"Química","t":"Estrutura atômica, tabela periódica e ligações","k":"conceito","f":"O que explica as cores no teste de chama e nos fogos de artifício?","v":"Elétrons excitados saltam para níveis maiores e, ao voltar, emitem <b>fótons de energia definida<\/b> (modelo de Bohr). Cada elemento tem cor característica (Na amarelo, Cu verde, Sr vermelho).","x":"Fenômeno eletrônico, não nuclear.","r":"ENEM 2019 · Q105 — Teste de chama (cátions metálicos)","h":"H22","q":629},{"id":"CN-119","a":"CN","d":"Química","t":"Estrutura atômica, tabela periódica e ligações","k":"conceito","f":"Por que elementos da mesma família têm propriedades semelhantes?","v":"Têm o <b>mesmo número de elétrons na camada de valência<\/b>. Ex.: Nb e Ta (família 5); gases nobres, camada completa e baixa reatividade.","x":"A tabela é organizada por número atômico crescente.","r":"ENEM 2018 · Q105 — Semelhança química (nióbio e tântalo)","h":"H26","q":706},{"id":"CN-120","a":"CN","d":"Química","t":"Cinética química e equilíbrio químico","k":"conceito","f":"Que fatores aumentam a velocidade de uma reação?","v":"Maior <b>temperatura<\/b>, <b>concentração<\/b>, <b>superfície de contato<\/b> e presença de <b>catalisador<\/b>.","x":"Comprimido triturado reage mais rápido; geladeira retarda o apodrecimento.","r":"ENEM 2025 · Q127 — Cinética química (velocidade de reação)","h":"H8","q":612},{"id":"CN-121","a":"CN","d":"Química","t":"Cinética química e equilíbrio químico","k":"conceito","f":"O que diz o Princípio de Le Chatelier?","v":"Um equilíbrio perturbado se desloca para <b>minimizar a perturbação<\/b>: adicionar reagente → sentido dos produtos; retirar produto → idem; aumentar pressão → lado com menos mols de gás.","x":"Ácidos no açúcar da placa bacteriana deslocam o equilíbrio da hidroxiapatita → desmineralização do esmalte.","r":"ENEM 2024 · Q118 — Equilíbrio químico (esmalte dentário)","h":"H2","q":627},{"id":"CN-122","a":"CN","d":"Química","t":"Química do cotidiano e produtos de uso diário","k":"conceito","f":"Como o hipoclorito de sódio (água sanitária) desinfeta?","v":"Forma ácido hipocloroso (HClO), <b>oxidante<\/b> que destrói microrganismos. Nunca misturar com ácidos ou amônia (libera gases tóxicos).","x":"Também é usado na cloração da água tratada.","r":"ENEM PPL 2018 · Q133 — Hipoclorito de sódio (desinfecção)","h":"H7","q":748},{"id":"CN-123","a":"CN","d":"Química","t":"Química do cotidiano e produtos de uso diário","k":"conceito","f":"Como o detergente remove gordura?","v":"Moléculas <b>anfifílicas<\/b>: cauda apolar se liga à gordura e cabeça polar à água, formando <b>micelas<\/b> que são arrastadas pela água.","x":"Tensoativos também reduzem a tensão superficial da água.","r":"ENEM PPL 2016 · Q90 — Ação do detergente na molhabilidade","h":"H18","q":623},{"id":"CN-124","a":"CN","d":"Química","t":"Análise química e controle de qualidade","k":"conceito","f":"O que significa a DL<sub>50<\/sub> de uma substância?","v":"Dose (mg/kg de massa corporal) que mata 50% da população testada. <b>Quanto menor a DL<sub>50<\/sub>, mais tóxica<\/b>.","x":"Pegadinha: DL<sub>50<\/sub> alta indica baixa toxicidade.","r":"ENEM 2017 · Q91 — Índice de toxicidade DL50","h":"H7","q":661},{"id":"CN-125","a":"CN","d":"Química","t":"Análise química e controle de qualidade","k":"conceito","f":"Quais parâmetros indicam a qualidade da água?","v":"pH, <b>oxigênio dissolvido<\/b>, DBO (demanda bioquímica de O<sub>2<\/sub>), turbidez, coliformes e metais pesados.","x":"DBO alta = muita matéria orgânica (esgoto) → pouco O<sub>2<\/sub> disponível.","r":"ENEM PPL 2019 · Q110 — Parâmetros de qualidade da água","h":"H7","q":681},{"id":"MT-001","a":"MT","d":"Matemática","t":"Razão, proporção, regra de três e variação de grandezas","k":"conceito","f":"Como saber se duas grandezas são diretamente ou inversamente proporcionais?","v":"<b>Diretas:<\/b> a razão é constante (y/x = k) — dobra uma, dobra a outra.<br><b>Inversas:<\/b> o produto é constante (x·y = k) — dobra uma, a outra cai pela metade.","x":"Antes de montar a regra de três, pergunte: \"se eu aumentar esta, a outra aumenta ou diminui?\".","r":"ENEM 2025 · Q150 — Regra de três composta (produção)","h":"H16","q":653},{"id":"MT-002","a":"MT","d":"Matemática","t":"Razão, proporção, regra de três e variação de grandezas","k":"aplicação","f":"6 funcionários instalam as placas em 10 dias. Mantido o ritmo, em quantos dias 4 funcionários fazem o mesmo serviço?","v":"Inversa: 6 × 10 = 4 × d → <b>d = 15 dias<\/b>.","x":"Menos gente → mais tempo: se a resposta diminuiu, você montou a regra de três como direta.","r":"ENEM PPL 2025 · Q144 — Instalação de placas (mais funcionários)","h":"H18","q":733},{"id":"MT-003","a":"MT","d":"Matemática","t":"Razão, proporção, regra de três e variação de grandezas","k":"aplicação","f":"5 máquinas produzem 400 peças em 8 h. Quantas peças 10 máquinas iguais produzem em 6 h?","v":"Peças ∝ máquinas × horas: 400 × (10/5) × (6/8) = <b>600 peças<\/b>.","x":"Na regra de três composta, compare cada grandeza isoladamente com a incógnita.","r":"ENEM 2025 · Q150 — Regra de três composta (produção)","h":"H16","q":653},{"id":"MT-004","a":"MT","d":"Matemática","t":"Razão, proporção, regra de três e variação de grandezas","k":"fórmula","f":"O que significa uma escala 1 : 500 numa maquete ou planta?","v":"Escala = medida no desenho ÷ medida real (mesma unidade). <b>1 cm no desenho = 500 cm = 5 m no real.<\/b>","x":"Converta tudo para a mesma unidade antes de dividir — o erro clássico é misturar cm com m.","r":"ENEM PPL 2025 · Q174 — Escala da maquete de Artur","h":"H11","q":743},{"id":"MT-005","a":"MT","d":"Matemática","t":"Razão, proporção, regra de três e variação de grandezas","k":"pegadinha","f":"Uma miniatura está na escala 1 : 10. Qual a razão entre as áreas e entre os volumes (miniatura : real)?","v":"Comprimentos 1 : 10 → <b>áreas 1 : 100<\/b> (k²) → <b>volumes 1 : 1.000<\/b> (k³).","x":"Massa, tinta e capacidade seguem o volume (k³), não a escala linear.","r":"ENEM PPL 2025 · Q143 — Escala da miniatura (dinossauro)","h":"H11","q":607},{"id":"MT-006","a":"MT","d":"Matemática","t":"Razão, proporção, regra de três e variação de grandezas","k":"conceito","f":"A intensidade de um sinal é inversamente proporcional ao quadrado da distância. Se a distância triplicar, o que acontece com a intensidade?","v":"I ∝ 1/d² → (1/3)² = <b>1/9 da intensidade original<\/b>.","x":"\"Inverso do quadrado\" aparece em sinal, luz, som e gravidade — eleve o fator ao quadrado e inverta.","r":"ENEM PPL 2025 · Q161 — Intensidade de sinal (inverso do quadrado)","h":"H15","q":740},{"id":"MT-007","a":"MT","d":"Matemática","t":"Razão, proporção, regra de três e variação de grandezas","k":"aplicação","f":"200 mL de suco têm 20 g de açúcar. Acrescentam-se 300 mL de água. Qual a nova concentração?","v":"A massa de açúcar não muda: 20 g ÷ 500 mL = <b>0,04 g/mL (40 g/L)<\/b> — antes era 100 g/L.","x":"Na diluição, o soluto fica constante e só o volume cresce: C·V = constante.","r":"ENEM 2025 · Q140 — Concentração de solução (variação)","h":"H18","q":792},{"id":"MT-008","a":"MT","d":"Matemática","t":"Razão, proporção, regra de três e variação de grandezas","k":"aplicação","f":"Produto A: 150 kcal em 30 g. Produto B: 200 kcal em 50 g. Qual é mais calórico por grama?","v":"A: 150/30 = 5 kcal/g. B: 200/50 = 4 kcal/g. <b>A é mais calórico<\/b>, mesmo tendo menos kcal no total.","x":"Para comparar rótulos, reduza tudo à mesma base (por grama, por 100 g, por porção).","r":"ENEM 2025 · Q143 — Informações nutricionais (comparação)","h":"H17","q":577},{"id":"MT-009","a":"MT","d":"Matemática","t":"Razão, proporção, regra de três e variação de grandezas","k":"aplicação","f":"Uma fazenda colhe 3.000 sacas em 50 ha. Se a produtividade subir 20% e a área cair para 40 ha, quantas sacas serão colhidas?","v":"Produtividade: 3.000/50 = 60 sacas/ha → ×1,2 = 72. Produção: 72 × 40 = <b>2.880 sacas<\/b>.","x":"Produção = área × produtividade: aplique cada variação no seu fator antes de multiplicar.","r":"ENEM 2025 · Q169 — Produtividade e variação (soja)","h":"H15","q":719},{"id":"MT-010","a":"MT","d":"Matemática","t":"Razão, proporção, regra de três e variação de grandezas","k":"aplicação","f":"A 80 km/h, um trem faz o trajeto em 3 h. Quanto tempo leva a 120 km/h?","v":"Velocidade e tempo são inversas: 80 × 3 = 120 × t → <b>t = 2 h<\/b>.","x":"Distância fixa → velocidade × tempo constante.","r":"ENEM 2025 · Q176 — Cálculo de tempo (partida)","h":"H16","q":606},{"id":"MT-011","a":"MT","d":"Matemática","t":"Razão, proporção, regra de três e variação de grandezas","k":"pegadinha","f":"O rebanho A foi de 200 para 300 cabeças; o B, de 50 para 100. Qual cresceu mais?","v":"Em <b>valor absoluto<\/b>, A (+100 contra +50). Em <b>termos relativos<\/b>, B (+100% contra +50%).","x":"Leia se o enunciado pede \"quantidade\" ou \"taxa/percentual\" de crescimento — as respostas costumam ser opostas.","r":"ENEM PPL 2025 · Q138 — Razão entre taxas de crescimento (rebanhos)","h":"H20","q":719},{"id":"MT-012","a":"MT","d":"Matemática","t":"Razão, proporção, regra de três e variação de grandezas","k":"pegadinha","f":"Uma obra exige 1.000 horas de trabalho em 8 dias de 8 h. Qual o número mínimo de operários?","v":"8 × 8 = 64 h por operário → 1.000 ÷ 64 = 15,6 → <b>16 operários<\/b>.","x":"Pessoas, viagens e embalagens \"no mínimo\" arredondam sempre para cima.","r":"ENEM PPL 2025 · Q163 — Contratação para a ponte (menor número)","h":"H17","q":679},{"id":"MT-013","a":"MT","d":"Matemática","t":"Razão, proporção, regra de três e variação de grandezas","k":"pegadinha","f":"A mensalidade sobe 10% e o número de alunos cai 10%. O que acontece com a receita?","v":"Receita = preço × quantidade → 1,10 × 0,90 = 0,99 → <b>cai 1%<\/b> (não fica igual).","x":"Variações percentuais em fatores de um produto se multiplicam, não se somam.","r":"ENEM 2025 · Q158 — Mensalidade e vagas (variação)","h":"H18","q":683},{"id":"MT-014","a":"MT","d":"Matemática","t":"Razão, proporção, regra de três e variação de grandezas","k":"conceito","f":"y é diretamente proporcional a x e inversamente proporcional a z². Se x e z dobrarem, o que acontece com y?","v":"y = k·x/z² → fator 2 ÷ 2² = <b>1/2: y cai pela metade<\/b>.","x":"Monte a \"fórmula com k\" e aplique os fatores de cada grandeza — mais rápido que regra de três.","r":"ENEM 2025 · Q179 — Grandezas e razão (luminância)","h":"H10","q":546},{"id":"MT-015","a":"MT","d":"Matemática","t":"Estatística: amostragem, projeção e interpretação de dados","k":"aplicação","f":"Prevê-se para 2025 o mesmo total de matrículas de 2024 (1.200) com a distribuição percentual de 2023 (francês = 15%). Quantos alunos de francês?","v":"15% de 1.200 = <b>180 alunos<\/b>.","x":"O ENEM mistura dados de anos diferentes: identifique qual tabela fornece o total e qual fornece o percentual.","r":"ENEM 2025 · Q147 — Interpretação de dados (matrículas)","h":"H24","q":597},{"id":"MT-016","a":"MT","d":"Matemática","t":"Estatística: amostragem, projeção e interpretação de dados","k":"pegadinha","f":"Uma taxa passou de 20% para 25%. Ela aumentou 5% ou 25%?","v":"Aumentou <b>5 pontos percentuais<\/b> — o que equivale a um aumento <b>relativo de 25%<\/b> (5/20).","x":"Ponto percentual é diferença entre taxas; \"aumento percentual\" é sobre o valor inicial.","r":"ENEM 2025 · Q137 — Interpretação de infográfico (redes sociais)","h":"H28","q":690},{"id":"MT-017","a":"MT","d":"Matemática","t":"Estatística: amostragem, projeção e interpretação de dados","k":"aplicação","f":"Um corredor faz 10 km em 50 min. Qual o pace e a velocidade média?","v":"Pace = tempo ÷ distância = <b>5 min/km<\/b>. Velocidade = 10 km ÷ (5/6) h = <b>12 km/h<\/b>.","x":"Pace é o inverso da velocidade: pace menor = corredor mais rápido.","r":"ENEM 2025 · Q166 — Pace e ritmo de corrida (dados)","h":"H30","q":673},{"id":"MT-018","a":"MT","d":"Matemática","t":"Estatística: amostragem, projeção e interpretação de dados","k":"aplicação","f":"Carro flex: 10 km/L com gasolina (R$ 6,00) e 7 km/L com etanol (R$ 4,50). Qual sai mais barato por km?","v":"Gasolina: 6,00/10 = R$ 0,60/km. Etanol: 4,50/7 ≈ R$ 0,64/km. <b>Gasolina compensa.<\/b>","x":"Compare custo por km (preço ÷ rendimento), nunca só o preço do litro.","r":"ENEM 2025 · Q167 — Consumo bicombustível (dados)","h":"H25","q":672},{"id":"MT-019","a":"MT","d":"Matemática","t":"Estatística: amostragem, projeção e interpretação de dados","k":"conceito","f":"A tabela pede a escola que \"aumentou o Ideb e atingiu a meta\". Escola X: 5,0 → 5,4, meta 5,5. Ela serve?","v":"<b>Não.<\/b> Aumentou, mas 5,4 < 5,5. Teste cada condição separadamente em cada linha.","x":"Em comandos com \"e\", elimine quem falha em qualquer uma das condições.","r":"ENEM PPL 2025 · Q155 — Ideb (aumento e meta atingida)","h":"H26","q":644},{"id":"MT-020","a":"MT","d":"Matemática","t":"Estatística: amostragem, projeção e interpretação de dados","k":"fórmula","f":"Numa pesquisa com 400 pessoas, 90 praticam corrida. Qual a frequência relativa?","v":"90 ÷ 400 = 0,225 = <b>22,5%<\/b>.","x":"Confira sempre qual é o total (base) do percentual: entrevistados, praticantes ou respostas múltiplas?","r":"ENEM 2023 · Q166 — Atividades físicas (dados)","h":"H26","q":617},{"id":"MT-021","a":"MT","d":"Matemática","t":"Estatística: amostragem, projeção e interpretação de dados","k":"pegadinha","f":"Cidade A: 500 casos em 200 mil hab. Cidade B: 300 casos em 60 mil hab. Qual tem situação pior?","v":"Taxa por 100 mil: A = 250; B = 500. <b>B é pior<\/b>, apesar de ter menos casos.","x":"Comparar populações de tamanhos diferentes exige taxa (por habitante, por 1.000, por 100 mil).","r":"ENEM 2023 · Q140 — Interpretação de dados (motoristas)","h":"H27","q":720},{"id":"MT-022","a":"MT","d":"Matemática","t":"Estatística: amostragem, projeção e interpretação de dados","k":"conceito","f":"O que indicam a amplitude e o desvio padrão de um conjunto de dados?","v":"<b>Amplitude<\/b> = máximo − mínimo. <b>Desvio padrão<\/b> mede a dispersão em torno da média: quanto menor, mais <b>regulares/homogêneos<\/b> os dados.","x":"\"Mais regular\", \"mais estável\", \"menos variação\" = menor desvio padrão.","r":"ENEM 2024 · Q178 — Umidade relativa (estatística)","h":"H27","q":573},{"id":"MT-023","a":"MT","d":"Matemática","t":"Geometria espacial: volume e capacidade","k":"fórmula","f":"Qual o volume de uma embalagem cilíndrica de raio 5 cm e altura 10 cm (use π = 3)?","v":"V = π·r²·h = 3 × 25 × 10 = <b>750 cm³ = 750 mL<\/b>.","x":"Cuidado: o enunciado costuma dar o diâmetro — divida por 2 antes de elevar ao quadrado.","r":"ENEM 2024 · Q149 — Volume do cilindro (embalagem)","h":"H14","q":703},{"id":"MT-024","a":"MT","d":"Matemática","t":"Geometria espacial: volume e capacidade","k":"fórmula","f":"Quais as conversões entre volume e capacidade mais usadas no ENEM?","v":"<b>1 cm³ = 1 mL<\/b> · <b>1 dm³ = 1 L<\/b> · <b>1 m³ = 1.000 L<\/b>. Ex.: caixa 2 m × 1,5 m × 1 m = 3 m³ = 3.000 L.","x":"Converta as medidas para dm antes de multiplicar e o resultado já sai em litros.","r":"ENEM 2025 · Q170 — Volume da caixa de descarga","h":"H14","q":702},{"id":"MT-025","a":"MT","d":"Matemática","t":"Geometria espacial: volume e capacidade","k":"aplicação","f":"Um telhado com 50 m² de projeção recebe chuva de 20 mm. Quantos litros podem ser captados?","v":"1 mm de chuva sobre 1 m² = 1 L. Logo 50 × 20 = <b>1.000 L<\/b>.","x":"Índice pluviométrico em mm é altura de água: volume = área × altura.","r":"ENEM PPL 2025 · Q151 — Altura do reservatório (captação de chuva)","h":"H14","q":702},{"id":"MT-026","a":"MT","d":"Matemática","t":"Geometria espacial: volume e capacidade","k":"pegadinha","f":"Num cilindro, o que acontece com o volume se dobrarmos o raio? E se dobrarmos a altura?","v":"Raio ×2 → volume <b>×4<\/b> (r²). Altura ×2 → volume <b>×2<\/b>.","x":"Para triplicar o volume gastando menos material, compare as opções pela fórmula, não pela intuição.","r":"ENEM PPL 2024 · Q172 — Lata de triplo volume (menor custo)","h":"H9","q":701},{"id":"MT-027","a":"MT","d":"Matemática","t":"Geometria espacial: volume e capacidade","k":"fórmula","f":"Qual o volume da esfera e qual a menor caixa cúbica que a contém?","v":"V = (4/3)·π·r³. A menor caixa cúbica tem <b>aresta = diâmetro = 2r<\/b>.","x":"Objetos \"que cabem\" na caixa: a dimensão limitante é sempre o diâmetro.","r":"ENEM PPL 2025 · Q136 — Caixa para a escultura (esfera e pedestal)","h":"H13","q":717},{"id":"MT-028","a":"MT","d":"Matemática","t":"Geometria espacial: volume e capacidade","k":"fórmula","f":"Volume de uma casquinha cônica de raio 3 cm e altura 10 cm (π = 3)?","v":"Cone (e pirâmide) = <b>(1/3) × área da base × altura<\/b> = (1/3) × 3 × 9 × 10 = <b>90 cm³<\/b>.","x":"Esquecer o 1/3 do cone é o erro que vira distrator.","r":"ENEM 2025 · Q159 — Volume e conversão (sorvete)","h":"H12","q":639},{"id":"MT-029","a":"MT","d":"Matemática","t":"Geometria espacial: volume e capacidade","k":"aplicação","f":"Qual a menor caixa de base quadrada que acomoda um cilindro de raio 4 cm e altura 15 cm?","v":"Lado da base = diâmetro = 8 cm; altura = 15 cm → 8 × 8 × 15 = <b>960 cm³<\/b>.","x":"Círculo inscrito no quadrado: lado do quadrado = diâmetro.","r":"ENEM PPL 2024 · Q157 — Menor caixa para o cilindro (lado da base)","h":"H8","q":634},{"id":"MT-030","a":"MT","d":"Matemática","t":"Grandezas, unidades, escalas e estimativa","k":"aplicação","f":"Num mapa de escala 1 : 250.000, dois pontos distam 4 cm. Qual a distância real?","v":"4 × 250.000 = 1.000.000 cm = <b>10 km<\/b>.","x":"Para sair de cm para km, divida por 100.000.","r":"ENEM 2023 · Q149 — Escala e altitude (voo)","h":"H11","q":656},{"id":"MT-031","a":"MT","d":"Matemática","t":"Grandezas, unidades, escalas e estimativa","k":"aplicação","f":"A maquete de um museu, na escala 1 : 50, tem 30 cm de altura. Qual a altura real?","v":"30 × 50 = 1.500 cm = <b>15 m<\/b>.","x":"Real = desenho × denominador da escala; desenho = real ÷ denominador.","r":"ENEM 2024 · Q151 — Escala (maquete de museu)","h":"H11","q":750},{"id":"MT-032","a":"MT","d":"Matemática","t":"Grandezas, unidades, escalas e estimativa","k":"fórmula","f":"Quanto vale 1 micrômetro (µm) em metros e em milímetros?","v":"1 µm = <b>10⁻⁶ m = 10⁻³ mm<\/b> (um milésimo de milímetro).","x":"Prefixos: mili 10⁻³, micro 10⁻⁶, nano 10⁻⁹; quilo 10³, mega 10⁶, giga 10⁹.","r":"ENEM 2024 · Q136 — Unidades e ordem de grandeza (micrômetro)","h":"H13","q":755},{"id":"MT-033","a":"MT","d":"Matemática","t":"Grandezas, unidades, escalas e estimativa","k":"fórmula","f":"Calcule (3 × 10⁵) × (4 × 10³) em notação científica.","v":"12 × 10⁸ = <b>1,2 × 10⁹<\/b>.","x":"Em notação científica a mantissa fica entre 1 e 10 — ajuste a vírgula e o expoente.","r":"ENEM PPL 2025 · Q139 — Notação científica (número de bactérias)","h":"H1","q":630},{"id":"MT-034","a":"MT","d":"Matemática","t":"Grandezas, unidades, escalas e estimativa","k":"aplicação","f":"Uma torneira com vazão de 12 L/min enche uma caixa de 1.800 L em quanto tempo?","v":"Tempo = volume ÷ vazão = 1.800 ÷ 12 = 150 min = <b>2 h 30 min<\/b>.","x":"Vazão = volume/tempo; atenção a L/min × L/h (×60).","r":"ENEM 2024 · Q159 — Vazão e grandezas (tubulação)","h":"H10","q":678},{"id":"MT-035","a":"MT","d":"Matemática","t":"Grandezas, unidades, escalas e estimativa","k":"aplicação","f":"A luz viaja a 300.000 km/s e o Sol está a 150 milhões de km. Quantos minutos a luz leva até a Terra?","v":"1,5 × 10⁸ ÷ 3 × 10⁵ = 500 s ≈ <b>8,3 min<\/b>.","x":"\"Minuto-luz\" é distância (o quanto a luz anda em 1 min), não tempo.","r":"ENEM PPL 2024 · Q154 — Distância Sol-Terra (minutos-luz)","h":"H12","q":594},{"id":"MT-036","a":"MT","d":"Matemática","t":"Grandezas, unidades, escalas e estimativa","k":"conceito","f":"Uma correia liga uma polia de raio 10 cm a outra de raio 30 cm. Se a menor dá 90 voltas/min, quantas dá a maior?","v":"Mesma velocidade na correia: r₁·f₁ = r₂·f₂ → 10 × 90 = 30 × f → <b>30 voltas/min<\/b>.","x":"Polia maior gira mais devagar: raio e frequência são inversamente proporcionais.","r":"ENEM 2024 · Q163 — Polias e transmissão (medidas)","h":"H12","q":730},{"id":"MT-037","a":"MT","d":"Matemática","t":"Geometria plana: área, perímetro e figuras","k":"fórmula","f":"Uma pipa em forma de losango tem diagonais de 60 cm e 40 cm. Qual a sua área?","v":"Losango: A = (D × d)/2 = (60 × 40)/2 = <b>1.200 cm²<\/b>.","x":"Vale para qualquer quadrilátero com diagonais perpendiculares (pipa/deltoide).","r":"ENEM PPL 2024 · Q153 — Área da pipa (diagonais)","h":"H8","q":673},{"id":"MT-038","a":"MT","d":"Matemática","t":"Geometria plana: área, perímetro e figuras","k":"fórmula","f":"Fórmulas de comprimento e área do círculo. Quanto mede uma volta numa pista circular de raio 50 m (π = 3,14)?","v":"C = 2πr e A = πr². Volta: 2 × 3,14 × 50 = <b>314 m<\/b>.","x":"Perímetro → 2πr; área → πr². Trocar uma pela outra é o distrator mais comum.","r":"ENEM 2025 · Q139 — Circunferência e posições (lagoa)","h":"H9","q":791},{"id":"MT-039","a":"MT","d":"Matemática","t":"Geometria plana: área, perímetro e figuras","k":"aplicação","f":"Parede de 3 m × 2,5 m com janela de 1 m × 1,5 m. Usando 25 tijolos/m², quantos tijolos são necessários?","v":"Área útil: 7,5 − 1,5 = 6 m² → 6 × 25 = <b>150 tijolos<\/b>.","x":"Desconte portas e janelas antes de calcular o material.","r":"ENEM PPL 2024 · Q165 — Quantidade de tijolos (parede com janela)","h":"H12","q":700},{"id":"MT-040","a":"MT","d":"Matemática","t":"Geometria plana: área, perímetro e figuras","k":"aplicação","f":"Um terreno de 20 m × 35 m será cercado com 3 voltas de arame. Quantos metros de arame?","v":"Perímetro = 2 × (20 + 35) = 110 m → × 3 = <b>330 m<\/b>.","x":"Cerca, rodapé e moldura = perímetro; piso, pintura e grama = área.","r":"ENEM PPL 2025 · Q149 — Cerca do terreno (menor custo)","h":"H9","q":661},{"id":"MT-041","a":"MT","d":"Matemática","t":"Geometria plana: área, perímetro e figuras","k":"conceito","f":"Onde fica o ponto equidistante de três postos de saúde (vértices de um triângulo)?","v":"No <b>circuncentro<\/b>: encontro das <b>mediatrizes<\/b> dos lados — centro da circunferência que passa pelos três pontos.","x":"Equidistante dos vértices = circuncentro (mediatrizes); equidistante dos lados = incentro (bissetrizes).","r":"ENEM 2024 · Q164 — Pontos equidistantes (postos de saúde)","h":"H8","q":712},{"id":"MT-042","a":"MT","d":"Matemática","t":"Geometria plana: área, perímetro e figuras","k":"pegadinha","f":"Se as duas dimensões de um campo aumentam 10%, em quanto aumenta a área?","v":"1,1 × 1,1 = 1,21 → <b>21% maior<\/b> (e não 20%).","x":"Área escala com o quadrado do fator linear.","r":"ENEM 2024 · Q145 — Dimensões do campo (Maracanã)","h":"H8","q":613},{"id":"MT-043","a":"MT","d":"Matemática","t":"Geometria plana: área, perímetro e figuras","k":"aplicação","f":"Para 20 m²: piso A (caixa de 2 m² por R$ 90) ou piso B (caixa de 2,5 m² por R$ 105)?","v":"A: 10 caixas = R$ 900. B: 8 caixas = R$ 840. <b>B é mais barato<\/b> (R$ 42/m² contra R$ 45/m²).","x":"Calcule o número inteiro de caixas — sobra de piso também é paga.","r":"ENEM PPL 2025 · Q177 — Escolha de porcelanato (menor custo)","h":"H9","q":684},{"id":"MT-044","a":"MT","d":"Matemática","t":"Porcentagem, juros e matemática financeira","k":"pegadinha","f":"Um preço sobe 20% e depois cai 20%. Volta ao valor inicial?","v":"Não: 1,20 × 0,80 = 0,96 → <b>4% abaixo<\/b> do inicial.","x":"Use fatores multiplicativos: +x% → (1 + x/100); −x% → (1 − x/100).","r":"ENEM 2024 · Q153 — Representação decimal de porcentagem","h":"H1","q":623},{"id":"MT-045","a":"MT","d":"Matemática","t":"Porcentagem, juros e matemática financeira","k":"aplicação","f":"Qual promoção dá maior desconto: \"leve 3, pague 2\" ou \"50% na 2ª unidade\"?","v":"Leve 3 pague 2: paga 2 de 3 → <b>≈33,3%<\/b>. 50% na 2ª: paga 1,5 de 2 → <b>25%<\/b>. A primeira vence.","x":"Compare quanto se paga por unidade, não o percentual anunciado.","r":"ENEM PPL 2024 · Q140 — Maior desconto percentual (promoção)","h":"H3","q":677},{"id":"MT-046","a":"MT","d":"Matemática","t":"Porcentagem, juros e matemática financeira","k":"pegadinha","f":"A conta com 10% de serviço deu R$ 88. Qual o preço do prato?","v":"88 ÷ 1,10 = <b>R$ 80<\/b>. (Tirar 10% de 88 daria 79,20 — errado.)","x":"Para desfazer um acréscimo, divida pelo fator; não subtraia o mesmo percentual.","r":"ENEM PPL 2024 · Q146 — Preço do prato (taxa de serviço)","h":"H3","q":717},{"id":"MT-047","a":"MT","d":"Matemática","t":"Porcentagem, juros e matemática financeira","k":"fórmula","f":"R$ 1.000 aplicados a 10% ao mês por 2 meses: quanto rende a juros simples e a juros compostos?","v":"Simples: M = C(1 + i·t) = <b>R$ 1.200<\/b>. Compostos: M = C(1 + i)ᵗ = 1.000 × 1,21 = <b>R$ 1.210<\/b>.","x":"Juros compostos formam uma PG de razão (1 + i); simples, uma PA.","r":"ENEM 2024 · Q162 — Progressão (parcelamento)","h":"H5","q":761},{"id":"MT-048","a":"MT","d":"Matemática","t":"Porcentagem, juros e matemática financeira","k":"fórmula","f":"Um investimento foi de R$ 40 milhões para R$ 50 milhões. Qual o aumento percentual? E se fosse de 50 para 40?","v":"Variação = (novo − antigo)/antigo: 10/40 = <b>+25%<\/b>; 10/50 = <b>−20%<\/b>.","x":"A base é sempre o valor inicial — por isso subir e descer a mesma quantia dá percentuais diferentes.","r":"ENEM PPL 2025 · Q170 — Investimento em transplantes (maior aumento percentual)","h":"H26","q":753},{"id":"MT-049","a":"MT","d":"Matemática","t":"Porcentagem, juros e matemática financeira","k":"conceito","f":"Custo R$ 60, venda R$ 80. Qual o lucro percentual sobre o custo e sobre a venda?","v":"Lucro = R$ 20. Sobre o custo: 20/60 ≈ <b>33,3%<\/b>. Sobre a venda: 20/80 = <b>25%<\/b>.","x":"Leia \"sobre o preço de custo\" × \"sobre o preço de venda\" — muda a base.","r":"ENEM PPL 2024 · Q141 — Preço de venda (aumento do lucro)","h":"H18","q":680},{"id":"MT-050","a":"MT","d":"Matemática","t":"Estatística: médias e medidas de tendência central","k":"conceito","f":"Qual a mediana de 3, 9, 4, 7, 10, 2?","v":"Ordene: 2, 3, 4, 7, 9, 10. Com quantidade par, média dos centrais: (4 + 7)/2 = <b>5,5<\/b>.","x":"Sem ordenar os dados, a \"mediana\" vira distrator.","r":"ENEM PPL 2025 · Q153 — Mediana das precipitações mensais","h":"H27","q":573},{"id":"MT-051","a":"MT","d":"Matemática","t":"Estatística: médias e medidas de tendência central","k":"fórmula","f":"10 funcionários ganham 2 salários mínimos e 5 ganham 5. Qual o salário médio?","v":"Média ponderada: (10 × 2 + 5 × 5)/15 = 45/15 = <b>3 salários mínimos<\/b>.","x":"Média de grupos de tamanhos diferentes é ponderada pelo tamanho de cada grupo — não é (2 + 5)/2.","r":"ENEM PPL 2025 · Q160 — Média de salários mínimos (funcionários)","h":"H27","q":676},{"id":"MT-052","a":"MT","d":"Matemática","t":"Estatística: médias e medidas de tendência central","k":"pegadinha","f":"Salários: 2, 2, 3, 3 e 40 mil. Qual medida representa melhor o grupo: média ou mediana?","v":"Média = 10 mil; mediana = 3 mil. <b>A mediana<\/b>, pois não é distorcida pelo valor extremo.","x":"Com valores discrepantes (outliers), o ENEM costuma pedir a mediana.","r":"ENEM 2025 · Q142 — Medida de tendência central (conexão)","h":"H27","q":599},{"id":"MT-053","a":"MT","d":"Matemática","t":"Estatística: médias e medidas de tendência central","k":"conceito","f":"O que é a moda? Numa tabela: tamanho 38 (5 clientes), 40 (12), 42 (9). Qual a moda?","v":"Moda = valor de <b>maior frequência<\/b> → <b>40<\/b>. Pode haver mais de uma moda (bimodal).","x":"A moda é o valor (40), não a frequência (12).","r":"ENEM PPL 2023 · Q166 — Moda da distribuição (clientes)","h":"H27","q":576},{"id":"MT-054","a":"MT","d":"Matemática","t":"Estatística: médias e medidas de tendência central","k":"aplicação","f":"A média de 10 notas era 7, mas um 9 foi digitado como 4. Qual a média correta?","v":"Soma errada = 70; corrigida = 70 − 4 + 9 = 75 → <b>7,5<\/b>.","x":"Trabalhe com a soma (média × quantidade), corrija e divida de novo.","r":"ENEM 2024 · Q137 — Cálculo de média (erro)","h":"H28","q":662},{"id":"MT-055","a":"MT","d":"Matemática","t":"Estatística: médias e medidas de tendência central","k":"fórmula","f":"Lotes com massas 498, 503, 501 e 495 g. Qual a amplitude?","v":"Amplitude = máximo − mínimo = 503 − 495 = <b>8 g<\/b>.","x":"Critérios de descarte/qualidade costumam comparar a amplitude com um limite dado.","r":"ENEM PPL 2023 · Q149 — Amplitude dos lotes (descarte)","h":"H29","q":811},{"id":"MT-056","a":"MT","d":"Matemática","t":"Leitura e interpretação de gráficos","k":"conceito","f":"Num gráfico posição × tempo de dois carros, o que indica o ponto onde as retas se cruzam?","v":"Mesma posição no mesmo instante: <b>encontro/ultrapassagem<\/b>. Reta mais inclinada = maior velocidade; trecho horizontal = parado.","x":"Inclinação = taxa de variação: leia a velocidade pela inclinação, não pela altura.","r":"ENEM 2022 · Q166 — Movimento e ultrapassagem (gráfico)","h":"H20","q":678},{"id":"MT-057","a":"MT","d":"Matemática","t":"Leitura e interpretação de gráficos","k":"pegadinha","f":"Num gráfico de linhas, como achar a maior variação entre dois períodos consecutivos?","v":"Calcule a <b>diferença<\/b> entre pontos vizinhos e compare; o maior valor do gráfico não é necessariamente a maior variação.","x":"Segmento mais íngreme = maior variação (subida ou queda, conforme o comando).","r":"ENEM PPL 2023 · Q172 — Leitura de gráfico (variação de torcidas)","h":"H20","q":500},{"id":"MT-058","a":"MT","d":"Matemática","t":"Leitura e interpretação de gráficos","k":"conceito","f":"Num gráfico com as curvas de receita e despesa, onde está o maior lucro?","v":"Lucro = receita − despesa: no mês em que a receita está <b>mais acima<\/b> da despesa (maior distância vertical).","x":"Onde as curvas se cruzam o lucro é zero; despesa acima da receita = prejuízo.","r":"ENEM 2022 · Q138 — Receitas, despesas e lucro (gráfico)","h":"H27","q":728},{"id":"MT-059","a":"MT","d":"Matemática","t":"Leitura e interpretação de gráficos","k":"conceito","f":"O que é balança comercial superavitária?","v":"Saldo = exportações − importações. <b>Superávit:<\/b> saldo positivo (exporta mais do que importa); <b>déficit:<\/b> negativo.","x":"O gráfico costuma trazer as duas séries: o saldo é a distância entre elas.","r":"ENEM 2024 · Q152 — Balança comercial (gráfico)","h":"H25","q":604},{"id":"MT-060","a":"MT","d":"Matemática","t":"Leitura e interpretação de gráficos","k":"aplicação","f":"As vendas seguem uma reta de tendência: 800 em janeiro, crescendo 120 por mês. Qual a previsão para junho?","v":"Junho = 5 meses depois: 800 + 5 × 120 = <b>1.400<\/b>.","x":"Tendência linear = acréscimo constante (PA); conte os intervalos, não os meses.","r":"ENEM PPL 2025 · Q168 — Previsão de vendas (reta de tendência)","h":"H24","q":688},{"id":"MT-061","a":"MT","d":"Matemática","t":"Leitura e interpretação de gráficos","k":"conceito","f":"Num gráfico, como reconhecer uma grandeza que \"cresce cada vez mais rápido\"?","v":"Curva crescente com <b>concavidade para cima<\/b> (inclinação aumenta). \"Cresce cada vez mais devagar\" = concavidade para baixo.","x":"Associe trechos do texto (acelera, estabiliza, decresce) ao formato de cada trecho da curva.","r":"ENEM 2024 · Q141 — Relações entre grandezas (gráficos)","h":"H20","q":702},{"id":"MT-062","a":"MT","d":"Matemática","t":"Funções: conceito geral e modelagem","k":"conceito","f":"Um recipiente é enchido com vazão constante. Como fica o gráfico altura × tempo onde o recipiente é mais largo?","v":"A altura sobe <b>mais devagar<\/b> (reta menos inclinada); onde é estreito, sobe mais rápido.","x":"Recipiente de largura variável (cone, garrafa) gera curva, não reta.","r":"ENEM 2025 · Q160 — Enchimento e função (nível da água)","h":"H19","q":924},{"id":"MT-063","a":"MT","d":"Matemática","t":"Funções: conceito geral e modelagem","k":"aplicação","f":"Com 40 m de tela, cerca-se um retângulo encostado num muro (3 lados). Qual a área máxima?","v":"x + 2y = 40 → A = y(40 − 2y), máxima em y = 10 → x = 20: <b>A = 200 m²<\/b>.","x":"Sem muro, o retângulo de área máxima é o quadrado; com muro, o lado paralelo ao muro é o dobro do outro.","r":"ENEM 2024 · Q171 — Otimização de área (cerca)","h":"H22","q":787},{"id":"MT-064","a":"MT","d":"Matemática","t":"Funções: conceito geral e modelagem","k":"aplicação","f":"Uma bebida esfria segundo T(t) = 20 + 80 · 2<sup>−t/10<\/sup> (°C, t em min). Qual a temperatura em t = 10? E a longo prazo?","v":"T(10) = 20 + 80 · ½ = <b>60 °C<\/b>. Com t grande, 2<sup>−t/10<\/sup> → 0 e T → <b>20 °C<\/b> (temperatura ambiente).","x":"Substitua os valores com calma: o ENEM cobra leitura do modelo, não dedução dele.","r":"ENEM 2024 · Q148 — Resfriamento (função)","h":"H21","q":776},{"id":"MT-065","a":"MT","d":"Matemática","t":"Funções: conceito geral e modelagem","k":"aplicação","f":"Custo fixo R$ 2.000, custo por unidade R$ 15, preço de venda R$ 25. Quantas unidades para não ter prejuízo?","v":"Lucro = 25x − (2.000 + 15x) = 10x − 2.000 ≥ 0 → <b>x ≥ 200 unidades<\/b>.","x":"Lucro = receita − custo total (fixo + variável): não esqueça o custo fixo.","r":"ENEM 2024 · Q177 — Custo de produção (função)","h":"H25","q":674},{"id":"MT-066","a":"MT","d":"Matemática","t":"Funções: conceito geral e modelagem","k":"aplicação","f":"A pressão sob a água segue P = 1 + 0,1·h (atm, h em metros). Em que profundidade P = 3 atm?","v":"1 + 0,1h = 3 → 0,1h = 2 → <b>h = 20 m<\/b>.","x":"Identifique qual variável é dada e qual é pedida antes de isolar.","r":"ENEM 2025 · Q172 — Função e parâmetro (pressão)","h":"H22","q":null},{"id":"MT-067","a":"MT","d":"Matemática","t":"Funções: conceito geral e modelagem","k":"aplicação","f":"Locação A: R$ 100/dia + R$ 150 de seguro. Locação B: R$ 130/dia, sem seguro. A partir de quantos dias A é mais barata?","v":"100d + 150 < 130d → 150 < 30d → d > 5 → <b>a partir de 6 dias<\/b>.","x":"Para comparar planos, iguale as funções e analise o que acontece antes e depois do ponto de empate.","r":"ENEM PPL 2025 · Q157 — Valor de locação (aluguel e seguro)","h":"H25","q":658},{"id":"MT-068","a":"MT","d":"Matemática","t":"Aritmética, operações e representação numérica","k":"aplicação","f":"Ônibus A sai a cada 12 min e B a cada 18 min. Saíram juntos às 8h. Quando voltam a sair juntos?","v":"MMC(12, 18) = 36 → <b>8h36<\/b>.","x":"Eventos periódicos que coincidem = MMC; dividir em partes iguais máximas = MDC.","r":"ENEM 2023 · Q171 — Calendário maia (MMC)","h":"H3","q":654},{"id":"MT-069","a":"MT","d":"Matemática","t":"Aritmética, operações e representação numérica","k":"conceito","f":"Ordene as frações 3/4, 5/7 e 7/10.","v":"Em decimal: 0,75; ≈0,714; 0,70 → <b>7/10 &lt; 5/7 &lt; 3/4<\/b>.","x":"Converter em decimal ou igualar denominadores é mais seguro que \"olhar\" as frações.","r":"ENEM PPL 2023 · Q154 — Ordenação de frações (receita)","h":"H1","q":658},{"id":"MT-070","a":"MT","d":"Matemática","t":"Aritmética, operações e representação numérica","k":"aplicação","f":"O dígito verificador é o resto da divisão por 10 da soma dos dígitos. Qual o dígito do código 4738?","v":"Soma = 4 + 7 + 3 + 8 = 22 → resto por 10 = <b>2<\/b>.","x":"Problemas de resto (dígito verificador, dias da semana, ciclos) pedem a divisão euclidiana.","r":"ENEM 2022 · Q144 — Dígito verificador (aritmética)","h":"H1","q":692},{"id":"MT-071","a":"MT","d":"Matemática","t":"Aritmética, operações e representação numérica","k":"pegadinha","f":"Lâminas de 0,15 mm são empilhadas. Quantas deixam a espessura mais próxima de 2 mm?","v":"2 ÷ 0,15 ≈ 13,3. 13 lâminas = 1,95 mm (falta 0,05); 14 = 2,10 mm (sobra 0,10). <b>13 lâminas<\/b>.","x":"\"Mais próximo\" exige comparar as duas distâncias — nem sempre é arredondar para cima.","r":"ENEM PPL 2025 · Q137 — Espessura mais próxima de 2 mm (lâminas)","h":"H4","q":591},{"id":"MT-072","a":"MT","d":"Matemática","t":"Aritmética, operações e representação numérica","k":"aplicação","f":"Um chuveiro de 5.000 W fica ligado 30 min por dia durante 30 dias. Quanto custa, a R$ 0,80/kWh?","v":"Energia = 5 kW × 0,5 h × 30 = 75 kWh → 75 × 0,80 = <b>R$ 60,00<\/b>.","x":"Converta W em kW e minutos em horas antes de multiplicar.","r":"ENEM PPL 2022 · Q175 — Consumo de energia (custo e tarifa)","h":"H5","q":686},{"id":"MT-073","a":"MT","d":"Matemática","t":"Probabilidade","k":"fórmula","f":"Lançando dois dados, qual a probabilidade de a soma ser 7?","v":"Casos favoráveis: (1,6), (2,5), (3,4), (4,3), (5,2), (6,1) = 6 de 36 → <b>1/6<\/b>.","x":"Pares ordenados contam separadamente: (2,5) ≠ (5,2).","r":"ENEM 2025 · Q178 — Probabilidade com dados","h":"H29","q":781},{"id":"MT-074","a":"MT","d":"Matemática","t":"Probabilidade","k":"conceito","f":"Setor A: 40 pessoas (10 com pós). Setor B: 60 (30 com pós). Sorteado alguém do setor A, qual a chance de ter pós?","v":"Condicional: o espaço amostral vira o setor A → 10/40 = <b>1/4<\/b>.","x":"\"Sabendo que…\" ou \"dentre os…\" restringe o espaço amostral.","r":"ENEM 2024 · Q173 — Probabilidade (setores da empresa)","h":"H29","q":647},{"id":"MT-075","a":"MT","d":"Matemática","t":"Probabilidade","k":"fórmula","f":"Duas duchas independentes funcionam, cada uma, com probabilidade 0,9. Qual a chance de pelo menos uma funcionar?","v":"Complementar: 1 − P(nenhuma) = 1 − 0,1 × 0,1 = <b>0,99<\/b>.","x":"\"Pelo menos um\" → calcule o complemento (\"nenhum\") e subtraia de 1.","r":"ENEM PPL 2023 · Q141 — Probabilidade de funcionamento (duchas)","h":"H30","q":786},{"id":"MT-076","a":"MT","d":"Matemática","t":"Probabilidade","k":"aplicação","f":"Urna com 3 fichas vermelhas e 2 azuis. Retirando 2 sem reposição, qual a probabilidade de ambas serem vermelhas?","v":"3/5 × 2/4 = 6/20 = <b>3/10<\/b>.","x":"Sem reposição, numerador e denominador diminuem a cada retirada.","r":"ENEM PPL 2025 · Q145 — Fichas na urna (probabilidade > 50%)","h":"H30","q":673},{"id":"MT-077","a":"MT","d":"Matemática","t":"Probabilidade","k":"aplicação","f":"Embaralhando as letras de DETETIVE, qual a probabilidade de sair exatamente a palavra DETETIVE?","v":"Anagramas com repetição: 8!/(3!·2!) = 40.320/12 = 3.360 → <b>1/3.360<\/b>.","x":"Letras repetidas (E três vezes, T duas) dividem o total pelo fatorial de cada repetição.","r":"ENEM PPL 2025 · Q156 — Permutações da senha (DETETIVE)","h":"H28","q":735},{"id":"MT-078","a":"MT","d":"Matemática","t":"Análise combinatória e contagem","k":"fórmula","f":"Quantas senhas existem com 3 letras (26 opções) seguidas de 2 algarismos?","v":"Princípio multiplicativo: 26 × 26 × 26 × 10 × 10 = <b>1.757.600<\/b>.","x":"Etapas independentes → multiplique as possibilidades de cada posição.","r":"ENEM 2024 · Q138 — Contagem (senha alfanumérica)","h":"H3","q":705},{"id":"MT-079","a":"MT","d":"Matemática","t":"Análise combinatória e contagem","k":"conceito","f":"Entre 10 pessoas, quantas diretorias com presidente e vice? E quantas comissões de 2 pessoas?","v":"Diretoria (ordem importa — arranjo): 10 × 9 = <b>90<\/b>. Comissão (ordem não importa — combinação): 90/2 = <b>45<\/b>.","x":"Teste: trocar a ordem gera outra situação? Se sim, arranjo; se não, combinação.","r":"ENEM 2025 · Q155 — Contagem de possibilidades (diretoria)","h":"H2","q":729},{"id":"MT-080","a":"MT","d":"Matemática","t":"Análise combinatória e contagem","k":"aplicação","f":"Num grupo de 6 times, todos jogam contra todos uma vez. Quantas partidas?","v":"C(6, 2) = (6 × 5)/2 = <b>15 partidas<\/b>.","x":"Com turno e returno (ida e volta), dobra: 30.","r":"ENEM 2022 · Q140 — Contagem de partidas (grupos)","h":"H3","q":830},{"id":"MT-081","a":"MT","d":"Matemática","t":"Análise combinatória e contagem","k":"aplicação","f":"De quantos modos 3 presentes diferentes podem ser dados a 5 pessoas, cada pessoa recebendo no máximo um?","v":"5 × 4 × 3 = <b>60 modos<\/b>.","x":"Objetos distintos para pessoas distintas, sem repetir pessoa = arranjo A(5,3).","r":"ENEM 2025 · Q175 — Distribuição de presentes (combinatória)","h":"H3","q":846},{"id":"MT-082","a":"MT","d":"Matemática","t":"Análise combinatória e contagem","k":"pegadinha","f":"Um código tem 4 barras, cada uma fina ou grossa, mas não pode ter todas iguais. Quantos códigos?","v":"Total: 2⁴ = 16. Retira \"todas finas\" e \"todas grossas\": <b>14 códigos<\/b>.","x":"Às vezes é mais fácil contar tudo e subtrair os casos proibidos.","r":"ENEM PPL 2025 · Q176 — Códigos de barras (princípio multiplicativo)","h":"H2","q":707},{"id":"MT-083","a":"MT","d":"Matemática","t":"Geometria analítica e localização espacial","k":"pegadinha","f":"De (1, 2) a (4, 6): qual a distância em linha reta e qual a distância andando pelos quarteirões?","v":"Linha reta: √(3² + 4²) = <b>5<\/b>. Pela malha (só horizontal/vertical): 3 + 4 = <b>7<\/b>.","x":"Em mapas de ruas, o deslocamento é |Δx| + |Δy|, não a distância euclidiana.","r":"ENEM 2025 · Q161 — Localização em malha (quarteirões)","h":"H6","q":627},{"id":"MT-084","a":"MT","d":"Matemática","t":"Geometria analítica e localização espacial","k":"fórmula","f":"Qual o ponto médio entre A(2, 3) e B(8, 7)?","v":"M = ((2 + 8)/2, (3 + 7)/2) = <b>(5, 5)<\/b>.","x":"Ponto médio = média das coordenadas; útil para \"ponto equidistante entre dois locais\" sobre o segmento.","r":"ENEM PPL 2021 · Q137 — Coordenadas no plano cartesiano (localização)","h":"H6","q":645},{"id":"MT-085","a":"MT","d":"Matemática","t":"Geometria analítica e localização espacial","k":"conceito","f":"Como verificar se (1, 1), (3, 5) e (5, 9) estão alinhados?","v":"Coeficiente angular m = Δy/Δx: (5 − 1)/(3 − 1) = 2 e (9 − 5)/(5 − 3) = 2. Mesma inclinação → <b>colineares<\/b>.","x":"Pontos não colineares formam triângulo — o ENEM usa isso para trajetórias com mudança de direção.","r":"ENEM PPL 2023 · Q157 — Representação de trajetória (pontos não colineares)","h":"H6","q":658},{"id":"MT-086","a":"MT","d":"Matemática","t":"Geometria espacial: sólidos, planificação e poliedros","k":"fórmula","f":"Um poliedro tem 12 faces pentagonais. Quantas arestas e vértices ele tem?","v":"A = 12 × 5/2 = 30. Euler: V − A + F = 2 → V = 2 + 30 − 12 = <b>20 vértices<\/b>.","x":"Cada aresta é compartilhada por 2 faces: some os lados de todas as faces e divida por 2.","r":"ENEM 2025 · Q144 — Poliedros (impressão 3D)","h":"H7","q":798},{"id":"MT-087","a":"MT","d":"Matemática","t":"Geometria espacial: sólidos, planificação e poliedros","k":"conceito","f":"Que sólido surge ao girar um trapézio retângulo em torno do lado perpendicular às bases?","v":"Um <b>tronco de cone<\/b>. (Retângulo em torno de um lado → cilindro; triângulo retângulo em torno de um cateto → cone.)","x":"Imagine o giro de 360°: cada lado paralelo ao eixo vira superfície cilíndrica; o inclinado, cônica.","r":"ENEM 2024 · Q144 — Sólido de revolução (trapézio)","h":"H7","q":637},{"id":"MT-088","a":"MT","d":"Matemática","t":"Geometria espacial: sólidos, planificação e poliedros","k":"aplicação","f":"Truncando os 6 vértices de um octaedro (4 arestas em cada vértice), quantos vértices e faces terá o sólido?","v":"Cada vértice vira um quadrado: 6 × 4 = <b>24 vértices<\/b>; faces = 8 + 6 = <b>14<\/b>; arestas pela relação de Euler: 36.","x":"Truncar um vértice de grau n cria uma face nova com n vértices.","r":"ENEM PPL 2024 · Q156 — Vértices do octaedro truncado","h":"H7","q":684},{"id":"MT-089","a":"MT","d":"Matemática","t":"Função exponencial e logaritmo","k":"aplicação","f":"Um remédio tem meia-vida de 6 h. Tomou-se 80 mg. Quanto resta após 24 h?","v":"24 h = 4 meias-vidas → 80 × (1/2)⁴ = <b>5 mg<\/b>.","x":"Após n meias-vidas resta Q₀ · (1/2)ⁿ — conte quantos períodos cabem no tempo dado.","r":"ENEM PPL 2023 · Q176 — Meia-vida do medicamento (horário da dose)","h":"H17","q":637},{"id":"MT-090","a":"MT","d":"Matemática","t":"Função exponencial e logaritmo","k":"conceito","f":"Na escala Richter (logarítmica), quantas vezes a amplitude de um sismo de magnitude 7 supera a de um de magnitude 5?","v":"Cada ponto = ×10 na amplitude: 10² = <b>100 vezes<\/b>.","x":"Em escalas log (Richter, decibel, pH), somar 1 na escala = multiplicar a grandeza por 10.","r":"ENEM 2024 · Q170 — Escala Richter (logaritmos)","h":"H21","q":729},{"id":"MT-091","a":"MT","d":"Matemática","t":"Função exponencial e logaritmo","k":"fórmula","f":"A juros compostos de 10% ao período, em quanto tempo o capital dobra? (log 2 ≈ 0,301; log 1,1 ≈ 0,041)","v":"1,1ᵗ = 2 → t = log 2 / log 1,1 ≈ 0,301/0,041 ≈ <b>7,3 períodos<\/b>.","x":"Propriedades-chave: log(a·b) = log a + log b e log aⁿ = n·log a.","r":"ENEM PPL 2021 · Q145 — Capitalização composta (tempo para dobrar)","h":"H23","q":744},{"id":"MT-092","a":"MT","d":"Matemática","t":"Álgebra: equações, sistemas, inequações e matrizes","k":"aplicação","f":"3 cachorros-quentes e 2 sucos custam R$ 28; 1 cachorro-quente e 2 sucos, R$ 16. Qual o preço de cada?","v":"Subtraindo: 2 cachorros-quentes = 12 → <b>R$ 6<\/b>; suco: (16 − 6)/2 = <b>R$ 5<\/b>.","x":"Sistemas 2×2 de compras se resolvem rápido por subtração das equações.","r":"ENEM 2023 · Q175 — Sistema de equações (tíquetes)","h":"H21","q":683},{"id":"MT-093","a":"MT","d":"Matemática","t":"Álgebra: equações, sistemas, inequações e matrizes","k":"conceito","f":"Como se calcula cada elemento do produto de duas matrizes (ex.: notas × pesos)?","v":"c<sub>ij<\/sub> = linha i da 1ª × coluna j da 2ª (multiplica termo a termo e soma). Só existe se nº de colunas da 1ª = nº de linhas da 2ª.","x":"No ENEM, o produto de matrizes quase sempre é uma média ponderada disfarçada.","r":"ENEM PPL 2022 · Q136 — Produto de matrizes (notas e pesos)","h":"H19","q":728},{"id":"MT-094","a":"MT","d":"Matemática","t":"Função afim (1º grau)","k":"fórmula","f":"Táxi: bandeirada de R$ 5,00 + R$ 2,50 por km. Qual a função e o preço de 12 km?","v":"f(x) = 2,5x + 5 → f(12) = 30 + 5 = <b>R$ 35,00<\/b>. a = taxa por km; b = valor fixo.","x":"Valor fixo + valor por unidade = função afim; o gráfico é uma reta que corta o eixo y em b.","r":"ENEM PPL 2020 · Q158 — Tarifa de táxi (função afim)","h":"H15","q":688},{"id":"MT-095","a":"MT","d":"Matemática","t":"Função afim (1º grau)","k":"aplicação","f":"Converta 40 °C para Fahrenheit.","v":"C/5 = (F − 32)/9 → 40/5 = 8 → F = 8 × 9 + 32 = <b>104 °F<\/b>.","x":"Escalas termométricas são relações afins: monte a proporção entre os pontos fixos (0/100 °C e 32/212 °F).","r":"ENEM PPL 2024 · Q149 — Relação entre escalas termométricas (gráfico)","h":"H20","q":672},{"id":"MT-096","a":"MT","d":"Matemática","t":"Sequências e progressões (PA e PG)","k":"fórmula","f":"Lotes numerados 5, 9, 13, 17… Qual o número do 20º lote?","v":"PA de razão 4: a<sub>n<\/sub> = a₁ + (n − 1)r = 5 + 19 × 4 = <b>81<\/b>. Soma: S<sub>n<\/sub> = (a₁ + a<sub>n<\/sub>)·n/2.","x":"Acréscimo constante = PA; multiplicação constante = PG.","r":"ENEM PPL 2024 · Q136 — Numeração de lotes (PA)","h":"H2","q":570},{"id":"MT-097","a":"MT","d":"Matemática","t":"Sequências e progressões (PA e PG)","k":"aplicação","f":"Uma folha de 0,1 mm é dobrada ao meio 10 vezes. Qual a espessura final?","v":"Cada dobra dobra a espessura (PG de razão 2): 0,1 × 2¹⁰ = <b>102,4 mm<\/b>.","x":"Termo geral da PG: a<sub>n<\/sub> = a₁ · qⁿ⁻¹ (ou a₀ · qⁿ contando a partir do zero).","r":"ENEM PPL 2025 · Q148 — Espessura do laminado (dobras sucessivas)","h":"H2","q":683},{"id":"MT-098","a":"MT","d":"Matemática","t":"Função quadrática (2º grau)","k":"fórmula","f":"Uma bola segue h(t) = −5t² + 20t (m, s). Qual a altura máxima e quando ocorre?","v":"Vértice: t<sub>v<\/sub> = −b/2a = −20/(−10) = 2 s → h(2) = −20 + 40 = <b>20 m<\/b>.","x":"Máximo/mínimo de parábola = vértice; a &lt; 0 → máximo.","r":"ENEM 2022 · Q150 — Trajetória do saque (quadrática)","h":"H22","q":822},{"id":"MT-099","a":"MT","d":"Matemática","t":"Função quadrática (2º grau)","k":"aplicação","f":"Uma padaria vende q = 200 − 10p unidades ao preço p. Que preço maximiza a receita?","v":"R = p·q = 200p − 10p² → p<sub>v<\/sub> = −200/(−20) = <b>R$ 10<\/b>, com R = <b>R$ 1.000<\/b>.","x":"Receita = preço × quantidade; se a quantidade cai linearmente com o preço, a receita é uma p
