e <i>Anopheles<\/i>.","r":"Vol. 2 · Cap. 3 · 3.2 Protozoários · p. 56","e":"ENEM PPL 2016 · Q55 — Ciclo do Plasmodium e crises febris","h":"H14","q":660},{"id":"BIO-V2C3-04","a":"BIO","d":"Volume 2","t":"Cap. 3 · Algas, protozoários e fungos","k":"comparação","f":"Quais as diferenças entre a leishmaniose visceral e a tegumentar?","v":"<b>Visceral (calazar)<\/b>: <i>Leishmania chagasi<\/i>; ataca baço e fígado (febre, anemia, aumento desses órgãos); os <b>cães<\/b> também são atacados. <b>Tegumentar (úlcera de Bauru)<\/b>: <i>L. braziliensis<\/i>; feridas na pele e destruição de mucosas. Ambas são transmitidas pela picada do <b>mosquito-palha<\/b> (<i>Lutzomyia<\/i>).","x":"Por envolver cães infectados, é zoonose: o controle combina combate ao vetor, telas e mosquiteiros e atenção aos cães; o agente é um protozoário flagelado.","r":"Vol. 2 · Cap. 3 · 3.2 Protozoários · p. 53","e":"ENEM 2023 · Q99 — Leishmaniose visceral (zoonose)","h":"H30","q":736},{"id":"BIO-V2C3-05","a":"BIO","d":"Volume 2","t":"Cap. 3 · Algas, protozoários e fungos","k":"pegadinha","f":"Como o <i>Trypanosoma cruzi<\/i> chega ao ser humano na doença de Chagas?","v":"O barbeiro (<i>Triatoma infestans<\/i>) pica, geralmente no rosto, e <b>defeca<\/b>; os tripanossomos presentes nas <b>fezes<\/b> penetram pela ferida da picada quando a pessoa coça o local, ou por mucosas. Outras vias: da mãe para o filho (gravidez, amamentação), transfusão, transplante e ingestão de alimentos contaminados por barbeiros.","x":"Erro clássico: dizer que o parasita é injetado pela picada. A prevenção inclui casas de alvenaria sem frestas, onde o barbeiro se esconde.","r":"Vol. 2 · Cap. 3 · 3.2 Protozoários · p. 54","e":null,"h":null,"q":null},{"id":"BIO-V2C3-06","a":"BIO","d":"Volume 2","t":"Cap. 3 · Algas, protozoários e fungos","k":"conceito","f":"Como os fungos obtêm alimento e quais suas principais características?","v":"São eucariontes <b>heterotróficos<\/b>: as hifas liberam <b>enzimas digestivas<\/b> no substrato (digestão extracelular) e <b>absorvem<\/b> os produtos. O corpo (<b>micélio<\/b>) é formado por <b>hifas<\/b>; a parede celular tem <b>quitina<\/b>; a reserva é <b>glicogênio<\/b>, como nos animais. Reproduzem-se por esporos.","x":"Pegadinha: fungos não fazem fotossíntese nem são plantas; molecularmente são mais próximos dos animais.","r":"Vol. 2 · Cap. 3 · 3.3 Fungos · p. 59","e":"ENEM PPL 2024 · Q118 — Fungos (heterotrofia)","h":"H16","q":645},{"id":"BIO-V2C3-07","a":"BIO","d":"Volume 2","t":"Cap. 3 · Algas, protozoários e fungos","k":"comparação","f":"O que são liquens e micorrizas, e o que cada parceiro ganha?","v":"<b>Liquens<\/b>: ascomiceto + alga ou cianobactéria; o fungo obtém nutrientes da alga, e a alga, protegida pelo fungo, vive em rochas nuas e troncos secos. <b>Micorrizas<\/b>: hifas de fungos + raízes; a planta absorve melhor minerais escassos (fosfatos, nitratos, zinco, cobre), e o fungo recebe açúcares e aminoácidos. Ambos são <b>mutualismo<\/b>.","x":"Micorrizas explicam por que plantas de solos pobres e sementes de orquídeas dependem de fungos.","r":"Vol. 2 · Cap. 3 · 3.3 Fungos · p. 63","e":null,"h":null,"q":null},{"id":"BIO-V2C3-08","a":"BIO","d":"Volume 2","t":"Cap. 3 · Algas, protozoários e fungos","k":"aplicação","f":"Qual a importância ecológica e econômica dos fungos?","v":"Ecológica: com certas bactérias, são os grandes <b>decompositores<\/b>, devolvendo ao ambiente os elementos da matéria orgânica morta. Econômica: a levedura <i>Saccharomyces cerevisiae<\/i> fermenta açúcares na produção de etanol, pão, vinho e cerveja; outros fungos produzem queijos, antibióticos (penicilina), vitaminas e esteroides anti-inflamatórios (cortisona).","x":"Sem decompositores faltaria matéria-prima para a renovação da vida; o mesmo modo de vida faz os fungos estragarem alimentos e causarem micoses.","r":"Vol. 2 · Cap. 3 · 3.3 Fungos · p. 63","e":null,"h":null,"q":null},{"id":"BIO-V2C4-01","a":"BIO","d":"Volume 2","t":"Cap. 4 · A diversidade das plantas","k":"conceito","f":"Qual característica exclusiva define o reino Plantae e que ciclo de vida todas as plantas têm?","v":"Sinapomorfia: <b>embriões maciços<\/b> (sem cavidades) que se desenvolvem <b>à custa do organismo materno<\/b>; por isso algas multicelulares ficam fora do reino. Todas têm <b>ciclo alternante<\/b>: gametófito (n) forma gametas → zigoto (2n) → esporófito (2n) forma esporos por meiose → esporo germina e origina gametófito.","x":"Pegadinha: nas plantas a meiose produz esporos, não gametas; os gametas surgem por mitose no gametófito.","r":"Vol. 2 · Cap. 4 · 4.1 Origem e evolução das plantas · p. 70","e":null,"h":null,"q":null},{"id":"BIO-V2C4-02","a":"BIO","d":"Volume 2","t":"Cap. 4 · A diversidade das plantas","k":"processo","f":"Que novidades evolutivas permitiram às plantas ocupar ambientes secos e independer da água para a fecundação?","v":"Raízes e <b>vasos condutores<\/b> (absorção e transporte); <b>epiderme impermeável<\/b> e <b>estômatos<\/b> reguláveis (contra a perda de água). Depois, a <b>semente<\/b>: o gametófito passou a viver sobre o esporófito, nutrindo o embrião protegido, e o gameta masculino deixou de nadar. Nas angiospermas, o <b>fruto<\/b> protege e dissemina as sementes.","x":"Briófitas e pteridófitas (criptógamas) ainda dependem de água líquida para o anterozoide flagelado nadar até a oosfera.","r":"Vol. 2 · Cap. 4 · 4.1 Origem e evolução das plantas · p. 71","e":"ENEM 2023 · Q103 — Conquista do ambiente terrestre (plantas)","h":"H16","q":697},{"id":"BIO-V2C4-03","a":"BIO","d":"Volume 2","t":"Cap. 4 · A diversidade das plantas","k":"comparação","f":"Compare briófitas, pteridófitas, gimnospermas e angiospermas quanto a vasos condutores, sementes e frutos.","v":"<b>Briófitas<\/b>: sem vasos, sem sementes, sem frutos.<br><b>Pteridófitas<\/b>: com vasos, sem sementes.<br><b>Gimnospermas<\/b>: vasos e sementes nuas, sem frutos.<br><b>Angiospermas<\/b>: vasos, sementes, flores e <b>frutos<\/b>.","x":"Questões de evolução das plantas cobram a ordem de aquisição: vasos condutores → sementes → flores e frutos.","r":"Vol. 2 · Cap. 4 · 4.2 Grandes grupos de plantas atuais · p. 71","e":"ENEM 2019 · Q125 — Evolução das plantas (adaptações)","h":"H16","q":671},{"id":"BIO-V2C4-04","a":"BIO","d":"Volume 2","t":"Cap. 4 · A diversidade das plantas","k":"pegadinha","f":"No ciclo de vida de um musgo, qual é a fase duradoura e qual é a dependente?","v":"O <b>gametófito haploide<\/b> (a 'plantinha' verde) é a fase duradoura e predominante. O <b>esporófito diploide<\/b> é pequeno, cresce sobre o gametófito e depende dele para se nutrir até produzir esporos e morrer. Os anterozoides flagelados nadam na água (chuva, garoa) até a oosfera no arquegônio.","x":"Ao longo da evolução o gametófito se reduz: dominante nas briófitas, pequeno e temporário (prótalo) nas pteridófitas e totalmente dependente do esporófito nas plantas com semente.","r":"Vol. 2 · Cap. 4 · 4.2 Grandes grupos de plantas atuais · p. 73","e":null,"h":null,"q":null},{"id":"BIO-V2C4-05","a":"BIO","d":"Volume 2","t":"Cap. 4 · A diversidade das plantas","k":"aplicação","f":"O que são os pontinhos marrons na face inferior das folhas de samambaia e o que originam?","v":"São <b>soros<\/b>, agrupamentos de <b>esporângios<\/b> nas folhas férteis do esporófito (2n). Neles, por meiose, formam-se esporos haploides, dispersos pelo vento. O esporo germina e forma o <b>prótalo<\/b>, gametófito pequeno e cordiforme que produz anterídios e arquegônios.","x":"Pegadinha: não são fungos nem sementes; pteridófitas não formam sementes. A samambaia que vemos é o esporófito, com xilema e floema.","r":"Vol. 2 · Cap. 4 · 4.2 Grandes grupos de plantas atuais · p. 76","e":null,"h":null,"q":null},{"id":"BIO-V2C4-06","a":"BIO","d":"Volume 2","t":"Cap. 4 · A diversidade das plantas","k":"conceito","f":"O que forma a semente de uma gimnosperma e como ocorre sua polinização?","v":"Semente = <b>embrião<\/b> (esporófito jovem, 2n) mergulhado no <b>megagametófito<\/b> (n, tecido nutritivo) e envolto pelo <b>tegumento<\/b>. O grão de pólen, muitas vezes com expansões em forma de asa, é levado pelo <b>vento<\/b> (anemofilia) até o óvulo; o <b>tubo polínico<\/b> conduz as células espermáticas até a oosfera. Os órgãos reprodutivos são <b>estróbilos<\/b>; não há fruto.","x":"O pinhão da araucária é semente, não fruto: gimnospermas têm sementes nuas.","r":"Vol. 2 · Cap. 4 · 4.2 Grandes grupos de plantas atuais · p. 81","e":null,"h":null,"q":null},{"id":"BIO-V2C5-01","a":"BIO","d":"Volume 2","t":"Cap. 5 · Reprodução e desenvolvimento das angiospermas","k":"conceito","f":"Quais são os verticilos florais e qual a função de cada um?","v":"Da base para o ápice: <b>cálice<\/b> (sépalas) e <b>corola<\/b> (pétalas), estéreis, que protegem e atraem polinizadores; <b>androceu<\/b> (estames: filete + antera, onde se formam os grãos de pólen); <b>gineceu<\/b> (carpelos: ovário com óvulos, estilete e estigma, que recebe o pólen). Flor com os quatro verticilos é <b>completa<\/b>.","x":"A flor é um ramo modificado: o estame é um microsporofilo e o carpelo, um megasporofilo.","r":"Vol. 2 · Cap. 5 · 5.1 Reprodução das angiospermas · p. 87","e":null,"h":null,"q":null},{"id":"BIO-V2C5-02","a":"BIO","d":"Volume 2","t":"Cap. 5 · Reprodução e desenvolvimento das angiospermas","k":"comparação","f":"Compare as flores polinizadas pelo vento com as polinizadas por animais.","v":"<b>Pelo vento<\/b> (ex.: gramíneas): flores pequenas e discretas, sem atrativos, <b>muito pólen<\/b> e <b>estigmas desenvolvidos<\/b> para capturá-lo. <b>Por animais<\/b>: corolas coloridas e vistosas, glândulas odoríferas e <b>nectários<\/b>; estigmas menores e menos pólen.","x":"Pista clássica: muito pólen e ausência de cor, perfume e néctar indicam polinização pelo vento.","r":"Vol. 2 · Cap. 5 · 5.1 Reprodução das angiospermas · p. 89","e":"ENEM PPL 2024 · Q131 — Polinização anemófila (gramíneas)","h":"H28","q":547},{"id":"BIO-V2C5-03","a":"BIO","d":"Volume 2","t":"Cap. 5 · Reprodução e desenvolvimento das angiospermas","k":"processo","f":"Em que consiste a dupla fecundação das angiospermas?","v":"O tubo polínico leva <b>dois núcleos espermáticos<\/b> ao óvulo. Um se funde à <b>oosfera<\/b> → <b>zigoto (2n)<\/b>, que origina o embrião. O outro se funde aos <b>dois núcleos polares<\/b> → núcleo <b>triploide (3n)<\/b>, que origina o <b>endosperma<\/b>, tecido que nutre o embrião.","x":"Exclusiva das angiospermas; o ENEM cobra a ploidia: embrião 2n, endosperma 3n.","r":"Vol. 2 · Cap. 5 · 5.1 Reprodução das angiospermas · p. 89","e":"ENEM 2021 · Q129 — Dupla fecundação nas angiospermas","h":"H16","q":688},{"id":"BIO-V2C5-04","a":"BIO","d":"Volume 2","t":"Cap. 5 · Reprodução e desenvolvimento das angiospermas","k":"pegadinha","f":"De que estrutura da flor se origina o fruto, e o que é um fruto partenocárpico?","v":"O fruto se desenvolve da <b>parede do ovário<\/b>, estimulada por hormônios liberados pelas sementes em formação; a semente vem do <b>óvulo<\/b> fecundado. Frutos <b>partenocárpicos<\/b> se desenvolvem sem formação de sementes, como nas bananas cultivadas.","x":"Não confundir: ovário → fruto; óvulo → semente. Por isso, em geral, sem fecundação não há fruto.","r":"Vol. 2 · Cap. 5 · 5.1 Reprodução das angiospermas · p. 91","e":null,"h":null,"q":null},{"id":"BIO-V2C5-05","a":"BIO","d":"Volume 2","t":"Cap. 5 · Reprodução e desenvolvimento das angiospermas","k":"aplicação","f":"Qual a vantagem da dispersão das sementes e como os frutos a favorecem?","v":"Levar as sementes para longe da planta-mãe evita competição com a genitora e as irmãs e permite colonizar novos ambientes. Frutos coloridos, vistosos e perfumados atraem animais, que descartam as sementes ou as eliminam nas fezes; frutos e sementes alados são levados pelo vento; o coco flutua graças ao mesocarpo fibroso.","x":"Questões ambientais mostram que a perda de animais dispersores (como cutias) compromete a regeneração das plantas.","r":"Vol. 2 · Cap. 5 · 5.1 Reprodução das angiospermas · p. 91","e":"ENEM 2019 · Q97 — Dispersão de sementes (cutias)","h":"H28","q":548},{"id":"BIO-V2C5-06","a":"BIO","d":"Volume 2","t":"Cap. 5 · Reprodução e desenvolvimento das angiospermas","k":"comparação","f":"Diferencie epiderme e periderme como tecidos de revestimento.","v":"<b>Epiderme<\/b>: camada de células achatadas e bem encaixadas que reveste a planta jovem; secreta a <b>cutícula<\/b>, tem estômatos e tricomas (pelos absorventes na raiz). <b>Periderme<\/b>: substitui a epiderme em caules e raízes com crescimento secundário; o <b>felogênio<\/b> forma <b>feloderme<\/b> (viva, para dentro) e <b>súber<\/b> (células mortas com suberina, para fora). <b>Lenticelas<\/b> permitem trocas gasosas.","x":"A cortiça das rolhas é súber; tricomas abundantes em folhas do cerrado reduzem a perda de água.","r":"Vol. 2 · Cap. 5 · 5.2 Desenvolvimento e componentes celulares das plantas · p. 94","e":null,"h":null,"q":null},{"id":"BIO-V2C5-07","a":"BIO","d":"Volume 2","t":"Cap. 5 · Reprodução e desenvolvimento das angiospermas","k":"comparação","f":"Diferencie colênquima e esclerênquima.","v":"<b>Colênquima<\/b>: células <b>vivas<\/b> e alongadas, com reforço de <b>celulose<\/b> principalmente nos cantos; sustenta partes jovens. <b>Esclerênquima<\/b>: células <b>mortas<\/b>, com paredes impregnadas de <b>lignina<\/b>; forma fibras (juta, sisal, linho, casca de nozes e coco) e esclereídes (as 'pedrinhas' da pera).","x":"Pegadinha frequente: o tecido de sustentação rígido e lignificado é formado por células mortas.","r":"Vol. 2 · Cap. 5 · 5.2 Desenvolvimento e componentes celulares das plantas · p. 95","e":null,"h":null,"q":null},{"id":"BIO-V2C5-08","a":"BIO","d":"Volume 2","t":"Cap. 5 · Reprodução e desenvolvimento das angiospermas","k":"comparação","f":"Compare xilema e floema quanto à seiva transportada e às células condutoras.","v":"<b>Xilema<\/b> (lenho): seiva <b>mineral<\/b> (água e sais) da raiz às folhas; traqueídes e elementos de vaso lenhoso são células <b>mortas<\/b>, com paredes lignificadas. <b>Floema<\/b> (líber): seiva <b>orgânica<\/b> das folhas para o resto da planta; células crivadas e elementos de tubo crivado são <b>vivos<\/b>, sem núcleo, mantidos por <b>células-companheiras<\/b> (ou albuminosas).","x":"Elementos de vaso lenhoso e de tubo crivado só existem em angiospermas; gimnospermas e pteridófitas têm apenas traqueídes e células crivadas.","r":"Vol. 2 · Cap. 5 · 5.2 Desenvolvimento e componentes celulares das plantas · p. 96","e":null,"h":null,"q":null},{"id":"BIO-V2C5-09","a":"BIO","d":"Volume 2","t":"Cap. 5 · Reprodução e desenvolvimento das angiospermas","k":"processo","f":"Como ocorre o crescimento secundário (em espessura) de caules e raízes?","v":"Por dois meristemas secundários: o <b>câmbio vascular<\/b>, que produz <b>xilema para dentro<\/b> e <b>floema para fora<\/b>, e o <b>felogênio<\/b> (câmbio da casca), que forma a periderme. O tronco é quase todo xilema: <b>cerne<\/b> (central, escuro, inativo) e <b>alburno<\/b> (externo, conduz seiva mineral).","x":"A maioria das monocotiledôneas só tem crescimento primário; os anéis de crescimento registram a variação anual da atividade do câmbio.","r":"Vol. 2 · Cap. 5 · 5.3 Organização corporal das angiospermas · p. 100","e":null,"h":null,"q":null},{"id":"BIO-V2C6-01","a":"BIO","d":"Volume 2","t":"Cap. 6 · Fisiologia das plantas","k":"conceito","f":"O que é o ponto de compensação fótico e por que a planta precisa superá-lo para crescer?","v":"É a intensidade luminosa em que a taxa de <b>fotossíntese = taxa de respiração<\/b>: não há troca líquida de gases com o ambiente. A planta respira dia e noite; só cresce se, por algumas horas do dia, receber luz acima desse ponto, produzindo mais matéria orgânica do que consome. <b>Heliófilas<\/b> têm ponto de compensação alto; <b>umbrófilas<\/b>, baixo.","x":"Pegadinha: a planta não respira só à noite; a respiração nas mitocôndrias é contínua e consome parte do que a fotossíntese produz.","r":"Vol. 2 · Cap. 6 · 6.1 A nutrição das plantas · p. 108","e":"ENEM PPL 2025 · Q103 — Respiração celular (uso de energia pela planta)","h":"H9","q":661},{"id":"BIO-V2C6-02","a":"BIO","d":"Volume 2","t":"Cap. 6 · Fisiologia das plantas","k":"pegadinha","f":"De onde vem a maior parte da matéria que forma o corpo de uma planta?","v":"Do <b>CO<sub>2<\/sub> do ar<\/b> e da <b>água<\/b>, que fornecem carbono, hidrogênio e oxigênio para a síntese de moléculas orgânicas na fotossíntese. Do solo vêm apenas os <b>sais minerais<\/b> (macro e micronutrientes), em quantidade pequena.","x":"Experimento clássico de van Helmont: a planta ganhou muita massa e o solo quase não perdeu; a planta não 'come' terra.","r":"Vol. 2 · Cap. 6 · 6.1 A nutrição das plantas · p. 109","e":"ENEM PPL 2018 · Q97 — Nutrição vegetal (van Helmont)","h":"H3","q":545},{"id":"BIO-V2C6-03","a":"BIO","d":"Volume 2","t":"Cap. 6 · Fisiologia das plantas","k":"aplicação","f":"O que é hidroponia e por que ela funciona sem solo?","v":"É o cultivo com as raízes mergulhadas em <b>solução aquosa aerada<\/b>, com os <b>nutrientes minerais<\/b> necessários, circulando continuamente (em estufas). Funciona porque a planta produz sua matéria orgânica pela fotossíntese e precisa do solo apenas como fonte de água e de sais minerais.","x":"A solução deve conter macronutrientes (N, P, K, Ca, Mg, S) e micronutrientes; a falta de Mg, por exemplo, amarela as folhas por reduzir a produção de clorofila.","r":"Vol. 2 · Cap. 6 · 6.1 A nutrição das plantas · p. 111","e":"ENEM PPL 2021 · Q93 — Hidroponia e nutrição mineral","h":"H29","q":535},{"id":"BIO-V2C6-04","a":"BIO","d":"Volume 2","t":"Cap. 6 · Fisiologia das plantas","k":"processo","f":"Como a hipótese da coesão-tensão (Dixon) explica a subida da seiva mineral?","v":"A <b>transpiração foliar<\/b> faz as células das folhas perderem água e retirarem água das vizinhas, que sugam seiva do xilema. Cria-se uma <b>tensão<\/b> que puxa a coluna líquida contínua desde a raiz, como uma corda puxada para cima; a coluna se mantém pela <b>coesão<\/b> entre as moléculas de água e pode subir cerca de 160 m.","x":"O motor é a transpiração nas folhas; menos transpiração significa menor subida de seiva.","r":"Vol. 2 · Cap. 6 · 6.2 Absorção e condução da seiva mineral · p. 112","e":"ENEM 2016 · Q75 — Tensão-coesão-adesão (seiva xilêmica)","h":"H14","q":638},{"id":"BIO-V2C6-05","a":"BIO","d":"Volume 2","t":"Cap. 6 · Fisiologia das plantas","k":"processo","f":"Como funcionam os estômatos e em que condições eles se fecham?","v":"O ostíolo abre quando as <b>células-guarda ficam túrgidas<\/b> e fecha quando ficam <b>flácidas<\/b>. Abrem com luz intensa, CO<sub>2<\/sub> baixo e boa oferta de água; fecham com pouca luz, CO<sub>2<\/sub> alto e falta de água. Na seca, o <b>ácido abscísico<\/b> produzido nas raízes faz as células-guarda perderem potássio e água, fechando o ostíolo.","x":"Dilema da planta em ambiente seco: fechar os estômatos economiza água, mas reduz a entrada de CO<sub>2<\/sub> e a fotossíntese.","r":"Vol. 2 · Cap. 6 · 6.2 Absorção e condução da seiva mineral · p. 113","e":"ENEM PPL 2021 · Q92 — Adaptações à restrição hídrica (xerófitas)","h":"H28","q":740},{"id":"BIO-V2C6-06","a":"BIO","d":"Volume 2","t":"Cap. 6 · Fisiologia das plantas","k":"processo","f":"Como a hipótese do fluxo de massa explica o transporte da seiva orgânica?","v":"Nas <b>fontes<\/b> (folhas, órgãos de reserva), açúcares, principalmente sacarose, são bombeados ativamente para o floema; a pressão osmótica sobe, entra água e forma-se um fluxo que arrasta as substâncias até os <b>drenos<\/b> (células consumidoras, como as da raiz), onde são absorvidas. O desequilíbrio osmótico entre fonte e dreno mantém o fluxo.","x":"Diferente do xilema, o sentido no floema não é fixo: vai sempre da fonte para o dreno.","r":"Vol. 2 · Cap. 6 · 6.3 A condução da seiva orgânica · p. 114","e":null,"h":null,"q":null},{"id":"BIO-V2C6-07","a":"BIO","d":"Volume 2","t":"Cap. 6 · Fisiologia das plantas","k":"conceito","f":"O que é dominância apical e por que a poda faz a planta ramificar?","v":"As <b>auxinas<\/b> produzidas na gema apical do caule inibem as gemas laterais, mantendo-as dormentes. Ao eliminar o ápice (poda), cessa a inibição e as <b>citocininas<\/b> vindas das raízes estimulam as gemas laterais a formar ramos. Se for aplicada auxina no corte, as gemas continuam inibidas.","x":"As auxinas também explicam o fototropismo: migram para o lado menos iluminado, que se alonga mais e curva o caule para a luz.","r":"Vol. 2 · Cap. 6 · 6.4 Hormônios vegetais e controle do desenvolvimento · p. 117","e":null,"h":null,"q":null},{"id":"BIO-V2C6-08","a":"BIO","d":"Volume 2","t":"Cap. 6 · Fisiologia das plantas","k":"aplicação","f":"Qual hormônio vegetal induz o amadurecimento dos frutos e como isso é aproveitado?","v":"O <b>etileno<\/b> (C<sub>2<\/sub>H<sub>4<\/sub>), hormônio <b>gasoso<\/b> que se difunde pelos espaços intercelulares. Induz o amadurecimento dos frutos e participa da queda das folhas. Por isso é usado no comércio de frutas, e um fruto maduro acelera o amadurecimento de outros guardados junto.","x":"Abafar frutos (jornal, saco fechado) concentra etileno e acelera o amadurecimento; ventilar e refrigerar o retarda.","r":"Vol. 2 · Cap. 6 · 6.4 Hormônios vegetais e controle do desenvolvimento · p. 119","e":"ENEM 2023 · Q97 — Amadurecimento de frutos (etileno)","h":"H3","q":627},{"id":"BIO-V2C6-09","a":"BIO","d":"Volume 2","t":"Cap. 6 · Fisiologia das plantas","k":"pegadinha","f":"O que define uma planta de dia curto e uma de dia longo?","v":"O <b>fotoperíodo crítico<\/b> da espécie: plantas de <b>dia curto<\/b> florescem quando o período iluminado é <b>menor<\/b> que esse valor (noites longas; ex.: crisântemo, morango); as de <b>dia longo<\/b>, quando é <b>maior<\/b> (ex.: íris, alface, espinafre). O sinal é percebido pelo <b>fitocromo<\/b>; um lampejo de luz no meio da noite inibe a floração da planta de dia curto.","x":"Pegadinha: não importa a duração absoluta; a erva-touro (dia curto) e o espinafre (dia longo) florescem ambos com 14 h de luz.","r":"Vol. 2 · Cap. 6 · 6.5 Fitocromos e desenvolvimento · p. 120","e":null,"h":null,"q":null},{"id":"BIO-V2C7-01","a":"BIO","d":"Volume 2","t":"Cap. 7 · Tendências evolutivas nos grupos animais","k":"comparação","f":"Qual a diferença entre animais diblásticos e triblásticos? Dê exemplos.","v":"<b>Diblásticos<\/b> têm só dois folhetos embrionários (ectoderma e endoderma) — os <b>cnidários<\/b>. <b>Triblásticos<\/b> têm também o <b>mesoderma<\/b> — platelmintos, nematódeos, moluscos, anelídeos, artrópodes, equinodermos e cordados. Poríferos não formam tecidos verdadeiros.","x":"Armadilha: esponjas não são diblásticas — não têm tecidos nem folhetos organizados.","r":"Vol. 2 · Cap. 7 · 7.1 Parentesco evolutivo entre os principais grupos animais · p. 130","e":null,"h":null,"q":null},{"id":"BIO-V2C7-02","a":"BIO","d":"Volume 2","t":"Cap. 7 · Tendências evolutivas nos grupos animais","k":"conceito","f":"O que distingue protostômios de deuterostômios?","v":"O destino do <b>blastóporo<\/b> da gástrula. Nos <b>protostômios<\/b> ele origina a <b>boca<\/b> (nematódeos, moluscos, anelídeos, artrópodes); nos <b>deuterostômios<\/b> origina o <b>ânus<\/b> e a boca surge depois (equinodermos e cordados).","x":"Pegadinha clássica: equinodermos, apesar de invertebrados, são deuterostômios como nós.","r":"Vol. 2 · Cap. 7 · 7.1 Parentesco evolutivo entre os principais grupos animais · p. 131","e":null,"h":null,"q":null},{"id":"BIO-V2C7-03","a":"BIO","d":"Volume 2","t":"Cap. 7 · Tendências evolutivas nos grupos animais","k":"comparação","f":"Como se classificam os triblásticos quanto à cavidade corporal?","v":"<b>Acelomados<\/b>: sem cavidade além da digestiva (platelmintos). <b>Pseudocelomados<\/b>: cavidade revestida por mesoderma e endoderma (nematódeos). <b>Celomados<\/b>: celoma totalmente revestido por mesoderma (moluscos, anelídeos, artrópodes, equinodermos, cordados).","x":"Cobra-se a associação filo → tipo de cavidade em cladogramas; nematódeo é o único pseudocelomado do livro.","r":"Vol. 2 · Cap. 7 · 7.1 Parentesco evolutivo entre os principais grupos animais · p. 131","e":null,"h":null,"q":null},{"id":"BIO-V2C7-04","a":"BIO","d":"Volume 2","t":"Cap. 7 · Tendências evolutivas nos grupos animais","k":"pegadinha","f":"Por que a respiração traqueal dos insetos não depende do sangue (hemolinfa)?","v":"O ar entra pelos <b>espiráculos<\/b> e percorre <b>traqueias<\/b> ramificadas que levam o O<sub>2<\/sub> <b>diretamente às células<\/b>; o CO<sub>2<\/sub> faz o caminho inverso. Não há intermediação do fluido circulatório.","x":"Erro comum: dizer que a hemolinfa dos insetos transporta O<sub>2<\/sub> como o sangue dos vertebrados.","r":"Vol. 2 · Cap. 7 · 7.2 Sistemas corporais dos animais · p. 135","e":null,"h":null,"q":null},{"id":"BIO-V2C7-05","a":"BIO","d":"Volume 2","t":"Cap. 7 · Tendências evolutivas nos grupos animais","k":"aplicação","f":"Amoniotélicos, ureotélicos e uricotélicos: qual excreta cada um e por quê?","v":"<b>Amônia<\/b> (muito tóxica e solúvel, exige muita água): animais aquáticos, como girinos. <b>Ureia<\/b> (menos tóxica, solúvel): mamíferos. <b>Ácido úrico<\/b> (pouco tóxico, pouco solúvel, economiza água): insetos, répteis e aves.","x":"Questões relacionam o excreta ao ambiente e à economia de água — ácido úrico é adaptação ao meio terrestre e ao ovo com casca.","r":"Vol. 2 · Cap. 7 · 7.2 Sistemas corporais dos animais · p. 140","e":null,"h":null,"q":null},{"id":"BIO-V2C8-01","a":"BIO","d":"Volume 2","t":"Cap. 8 · Animais invertebrados","k":"conceito","f":"O que são cnidoblastos e qual sua função nos cnidários?","v":"Células urticantes da epiderme que contêm o <b>nematocisto<\/b>, cápsula com filamento enovelado e substâncias tóxicas. Ao toque ou estímulo químico, o filamento é disparado, injetando toxina — usado na <b>captura de presas e na defesa<\/b>. Após o disparo, o cnidoblasto degenera.","x":"É a característica exclusiva que dá nome ao filo (queimaduras por águas-vivas e caravelas).","r":"Vol. 2 · Cap. 8 · 8.2 Filo Cnidaria (cnidários) · p. 149","e":null,"h":null,"q":null},{"id":"BIO-V2C8-02","a":"BIO","d":"Volume 2","t":"Cap. 8 · Animais invertebrados","k":"processo","f":"Descreva o ciclo de <i>Schistosoma mansoni<\/i> e a forma de infecção humana.","v":"Ovos saem nas <b>fezes<\/b> → na água liberam <b>miracídios<\/b> → penetram no <b>caramujo<\/b> (planorbídeo, hospedeiro intermediário) → formam <b>cercárias<\/b> → cercárias nadam e <b>penetram ativamente pela pele<\/b> humana → adultos vivem nas veias do fígado (homem = hospedeiro definitivo).","x":"Armadilha: a esquistossomose não se pega comendo caramujo nem bebendo ovos — a cercária atravessa a pele em contato com a água.","r":"Vol. 2 · Cap. 8 · 8.3 Filo Platyhelminthes (platelmintos) · p. 152","e":"ENEM 2019 · Q93 — Esquistossomose: ciclo e prevenção","h":"H30","q":558},{"id":"BIO-V2C8-03","a":"BIO","d":"Volume 2","t":"Cap. 8 · Animais invertebrados","k":"aplicação","f":"Quais medidas interrompem o ciclo da esquistossomose?","v":"1) <b>Saneamento básico<\/b> (fossas, esgoto) para que ovos das fezes não cheguem à água; 2) <b>combate aos caramujos<\/b> hospedeiros (moluscicidas); 3) evitar contato com água de locais com caramujos (ou ferver a água antes do uso).","x":"O ENEM pede o ponto do ciclo atingido por cada medida — eliminar o caramujo impede a formação de cercárias.","r":"Vol. 2 · Cap. 8 · 8.3 Filo Platyhelminthes (platelmintos) · p. 155","e":"ENEM 2015 · Q89 — Combate ao caramujo (esquistossomose)","h":"H30","q":612},{"id":"BIO-V2C8-04","a":"BIO","d":"Volume 2","t":"Cap. 8 · Animais invertebrados","k":"comparação","f":"Teníase × cisticercose: como cada uma é adquirida?","v":"<b>Teníase<\/b>: ingestão de carne de porco ou boi <b>malcozida com cisticercos<\/b>; a tênia adulta vive no intestino (homem = hospedeiro definitivo). <b>Cisticercose<\/b>: ingestão de <b>ovos<\/b> de <i>Taenia solium<\/i> (água/alimentos contaminados por fezes); o homem vira hospedeiro intermediário e os cisticercos podem alojar-se no cérebro.","x":"Prevenção cobrada: saneamento (ovos não chegam aos animais), fiscalização de carnes e cozimento prolongado.","r":"Vol. 2 · Cap. 8 · 8.3 Filo Platyhelminthes (platelmintos) · p. 156","e":"ENEM PPL 2025 · Q120 — Teníase (saneamento básico)","h":"H30","q":676},{"id":"BIO-V2C8-05","a":"BIO","d":"Volume 2","t":"Cap. 8 · Animais invertebrados","k":"aplicação","f":"Como se adquire o amarelão (ancilostomose) e por que causa anemia?","v":"Larvas que vivem no solo contaminado por fezes <b>penetram ativamente pela pele<\/b> (pés descalços), passam pelos pulmões e chegam ao intestino. Os vermes lesam a parede intestinal e causam <b>hemorragias<\/b> → anemia e palidez (Jeca Tatu). Prevenção: saneamento e <b>uso de calçados<\/b>.","x":"Diferença cobrada: ascaridíase se pega ingerindo ovos; amarelão, pela penetração de larvas na pele.","r":"Vol. 2 · Cap. 8 · 8.4 Filo Nematoda (nematódeos) · p. 160","e":null,"h":null,"q":null},{"id":"BIO-V2C8-06","a":"BIO","d":"Volume 2","t":"Cap. 8 · Animais invertebrados","k":"aplicação","f":"Por que o sangue flui facilmente quando uma sanguessuga se alimenta?","v":"As glândulas salivares do hirudíneo produzem uma substância <b>anticoagulante<\/b>, que impede a coagulação no ferimento enquanto a faringe musculosa suga o sangue. Sanguessugas (<i>Hirudo medicinalis<\/i>) ainda são usadas para remover hematomas.","x":"Substâncias da saliva de hematófagos inspiram fármacos anticoagulantes — contexto típico de questão de aplicação.","r":"Vol. 2 · Cap. 8 · 8.6 Filo Annelida (anelídeos) · p. 166","e":"ENEM 2016 · Q65 — Toxinas de hematófagos (uso terapêutico)","h":"H30","q":594},{"id":"BIO-V2C8-07","a":"BIO","d":"Volume 2","t":"Cap. 8 · Animais invertebrados","k":"conceito","f":"De que é feito o exoesqueleto dos artrópodes e como eles crescem?","v":"De <b>quitina<\/b> (polissacarídio nitrogenado), que pode ser reforçada com <b>carbonato de cálcio<\/b> em caranguejos e lagostas. Rígido, ele impede o crescimento contínuo; o animal cresce trocando-o periodicamente na <b>ecdise (muda)<\/b>.","x":"O ENEM explora a composição (quitina + CaCO<sub>3<\/sub> nos crustáceos) e a vulnerabilidade do animal logo após a muda.","r":"Vol. 2 · Cap. 8 · 8.7 Filo Arthropoda (artrópodes) · p. 168","e":"ENEM 2024 · Q111 — Exoesqueleto dos crustáceos","h":"H14","q":600},{"id":"BIO-V2C8-08","a":"BIO","d":"Volume 2","t":"Cap. 8 · Animais invertebrados","k":"comparação","f":"Que características identificam um quelicerado (aranhas, escorpiões, ácaros)?","v":"<b>Quatro pares de pernas<\/b>, <b>ausência de antenas<\/b>, um par de <b>quelíceras<\/b> e corpo em cefalotórax (prossoma) + abdome (opistossoma). Aracnídeos injetam peçonha pelas quelíceras (aranhas) ou pelo aguilhão caudal (escorpiões).","x":"Pegadinha: aranha não é inseto — insetos têm 3 pares de pernas, 1 par de antenas e 3 tagmas.","r":"Vol. 2 · Cap. 8 · 8.7 Filo Arthropoda (artrópodes) · p. 170","e":"ENEM 2020 · Q118 — Aracnídeos e adaptações","h":"H28","q":619},{"id":"BIO-V2C8-09","a":"BIO","d":"Volume 2","t":"Cap. 8 · Animais invertebrados","k":"comparação","f":"Ametábolos, hemimetábolos e holometábolos: como se desenvolvem?","v":"<b>Ametábolos<\/b>: desenvolvimento direto. <b>Hemimetábolos<\/b> (gafanhoto, barata): <b>ninfas<\/b> se tornam gradualmente adultos (metamorfose incompleta). <b>Holometábolos<\/b> (borboleta, mosca): ovo → <b>larva<\/b> → <b>pupa<\/b> → adulto (imago); na pupa os tecidos larvais são destruídos e refeitos (metamorfose completa).","x":"Larva e adulto de holometábolos exploram recursos diferentes, o que reduz a competição dentro da espécie.","r":"Vol. 2 · Cap. 8 · 8.7 Filo Arthropoda (artrópodes) · p. 173","e":"ENEM 2018 · Q133 — Metamorfose dos insetos (holometabolia)","h":"H16","q":642},{"id":"BIO-V2C9-01","a":"BIO","d":"Volume 2","t":"Cap. 9 · Cordados","k":"conceito","f":"Quais são as quatro características presentes em todo embrião de cordado?","v":"<b>Notocorda<\/b> (cordão dorsal semirrígido, exclusivo do filo), <b>tubo nervoso dorsal<\/b>, <b>fendas faringianas<\/b> e <b>cauda pós-anal<\/b>. Na maioria dos cordados a notocorda desaparece no fim da fase embrionária.","x":"Pegadinha: ser cordado não é o mesmo que ser vertebrado — tunicados e anfioxos são cordados sem coluna vertebral.","r":"Vol. 2 · Cap. 9 · 9.1 Características gerais dos cordados · p. 180","e":null,"h":null,"q":null},{"id":"BIO-V2C9-02","a":"BIO","d":"Volume 2","t":"Cap. 9 · Cordados","k":"processo","f":"Em que ordem surgem as novidades no cladograma dos craniados atuais?","v":"<b>Crânio<\/b> (peixes-bruxa) → <b>vértebras<\/b> (lampreias) → <b>mandíbula<\/b> (gnatostomados: condrictes) → esqueleto ósseo (actinopterígios e sarcopterígios) → <b>quatro membros<\/b> (tetrápodes: anfíbios) → <b>ovo amniótico<\/b> (amniotas: répteis, aves e mamíferos).","x":"Questões pedem o caráter compartilhado a partir de um nó do cladograma; peixe não é grupo natural.","r":"Vol. 2 · Cap. 9 · 9.3 Características gerais dos craniados · p. 183","e":"ENEM 2024 · Q98 — Cladograma e evolução dos vertebrados","h":"H16","q":677},{"id":"BIO-V2C9-03","a":"BIO","d":"Volume 2","t":"Cap. 9 · Cordados","k":"aplicação","f":"Por que a maioria dos anfíbios depende de ambientes úmidos?","v":"A pele é fina, mantida úmida por <b>glândulas de muco<\/b>, e participa das trocas gasosas (<b>respiração cutânea<\/b>), mas perde água facilmente. Além disso, a fecundação é geralmente externa e as larvas (girinos) são aquáticas, com brânquias.","x":"Armadilha: a pele permeável é vantagem respiratória, mas limita a conquista de ambientes secos.","r":"Vol. 2 · Cap. 9 · 9.5 Tetrápodes (Tetrapoda) · p. 187","e":"ENEM 2015 · Q83 — Pele permeável dos anfíbios (umidade)","h":"H28","q":647},{"id":"BIO-V2C9-04","a":"BIO","d":"Volume 2","t":"Cap. 9 · Cordados","k":"conceito","f":"Que características do revestimento e da respiração adaptam os répteis à terra firme?","v":"Corpo recoberto por <b>espessa epiderme de queratina<\/b> (escamas), que reduz a perda de água, e <b>pulmões eficientes<\/b>, que dispensam a respiração cutânea.","x":"Comparação frequente com anfíbios: queratina impermeabiliza a pele e libera os répteis da umidade.","r":"Vol. 2 · Cap. 9 · 9.5 Tetrápodes (Tetrapoda) · p. 188","e":"ENEM PPL 2018 · Q99 — Adaptações dos répteis (queratina)","h":"H28","q":548},{"id":"BIO-V2C9-05","a":"BIO","d":"Volume 2","t":"Cap. 9 · Cordados","k":"conceito","f":"O que é o ovo amniótico e por que foi decisivo para os répteis?","v":"Ovo com <b>casca<\/b> (membranosa ou calcária) em que o embrião forma anexos extraembrionários — <b>saco vitelínico, âmnio e alantoide<\/b>. O âmnio, bolsa cheia de líquido, protege contra dessecação e choques; o ovo tem água e alimento para todo o desenvolvimento, sem depender da água externa.","x":"Define o clado Amniota (répteis, aves e mamíferos); anfíbios e peixes não o possuem.","r":"Vol. 2 · Cap. 9 · 9.5 Tetrápodes (Tetrapoda) · p. 189","e":null,"h":null,"q":null},{"id":"BIO-V2C9-06","a":"BIO","d":"Volume 2","t":"Cap. 9 · Cordados","k":"pegadinha","f":"Por que \"ectotérmico\" é mais adequado que \"animal de sangue frio\"?","v":"<b>Ectotérmicos<\/b> (peixes, anfíbios, répteis) obtêm calor do <b>ambiente<\/b>, não do metabolismo; seu sangue não é necessariamente frio. <b>Endotérmicos<\/b> (aves e mamíferos) mantêm a temperatura com calor gerado no <b>metabolismo<\/b>.","x":"Comportamentos como tomar sol (lagartos) são regulação térmica de ectotérmicos — não significam endotermia.","r":"Vol. 2 · Cap. 9 · 9.5 Tetrápodes (Tetrapoda) · p. 189","e":null,"h":null,"q":null},{"id":"BIO-V2C10-01","a":"BIO","d":"Volume 2","t":"Cap. 10 · Nutrição, respiração, circulação e excreção","k":"conceito","f":"Onde e em que condição atua a pepsina?","v":"No <b>estômago<\/b>, em pH em torno de <b>2<\/b> (ácido clorídrico). É secretada como <b>pepsinogênio<\/b> (inativo) pelas células principais e ativada pelo HCl; digere <b>proteínas<\/b> em peptídios.","x":"Questões mostram curvas de atividade × pH: a pepsina perde atividade no duodeno, onde o pH sobe para 8–8,5.","r":"Vol. 2 · Cap. 10 · 10.1 Nutrição humana · p. 204","e":"ENEM PPL 2015 · Q62 — Ação da pepsina no estômago (pH ácido)","h":null,"q":637},{"id":"BIO-V2C10-02","a":"BIO","d":"Volume 2","t":"Cap. 10 · Nutrição, respiração, circulação e excreção","k":"pegadinha","f":"A bile é uma enzima digestiva? Qual sua ação?","v":"<b>Não<\/b> — a bile não tem enzimas. Produzida no <b>fígado<\/b> e armazenada na vesícula biliar, seus sais <b>emulsionam<\/b> as gorduras (quebram gotas em gotículas), aumentando a superfície de ação da <b>lipase pancreática<\/b>.","x":"Pegadinha clássica: a bile age como um detergente (ação física), não quebra ligações químicas.","r":"Vol. 2 · Cap. 10 · 10.1 Nutrição humana · p. 204","e":"ENEM 2018 · Q96 — Digestão de lipídios (emulsificação/bile)","h":"H14","q":638},{"id":"BIO-V2C10-03","a":"BIO","d":"Volume 2","t":"Cap. 10 · Nutrição, respiração, circulação e excreção","k":"conceito","f":"Qual a função das vilosidades e microvilosidades do intestino delgado?","v":"As <b>vilosidades<\/b> (dobras da mucosa) e as <b>microvilosidades<\/b> (dobras da membrana das células epiteliais) <b>aumentam enormemente a superfície de absorção<\/b> dos nutrientes digeridos.","x":"O ENEM relaciona alterações na área das vilosidades à capacidade de absorção (ex.: animais em jejum prolongado).","r":"Vol. 2 · Cap. 10 · 10.1 Nutrição humana · p. 205","e":"ENEM 2013 · Q53 — Vilosidades e absorção (serpentes em jejum)","h":"H28","q":554},{"id":"BIO-V2C10-04","a":"BIO","d":"Volume 2","t":"Cap. 10 · Nutrição, respiração, circulação e excreção","k":"processo","f":"Como o aumento de CO<sub>2<\/sub> no exercício acelera a respiração?","v":"Mais respiração celular → mais CO<sub>2<\/sub> → CO<sub>2<\/sub> + H<sub>2<\/sub>O forma <b>ácido carbônico<\/b> → o sangue fica <b>mais ácido<\/b> → o sistema nervoso detecta e estimula mais o <b>diafragma e os músculos intercostais<\/b> → aumenta a frequência ventilatória.","x":"Armadilha: o principal estímulo para respirar é o excesso de CO<sub>2<\/sub>/acidez, não a falta de O<sub>2<\/sub>.","r":"Vol. 2 · Cap. 10 · 10.2 Respiração · p. 211","e":null,"h":null,"q":null},{"id":"BIO-V2C10-05","a":"BIO","d":"Volume 2","t":"Cap. 10 · Nutrição, respiração, circulação e excreção","k":"conceito","f":"Como O<sub>2<\/sub> e CO<sub>2<\/sub> são transportados no sangue?","v":"Cerca de <b>98% do O<sub>2<\/sub><\/b> viaja nas hemácias ligado ao ferro do heme da <b>hemoglobina<\/b> (oxiemoglobina). Cerca de <b>70% do CO<sub>2<\/sub><\/b> vai no plasma como <b>íons bicarbonato (HCO<sub>3<\/sub><sup>−<\/sup>)<\/b>, formados nas hemácias.","x":"Gráficos de saturação da hemoglobina: nos tecidos o O<sub>2<\/sub> se dissocia; nos alvéolos (hematose) a hemoglobina se satura.","r":"Vol. 2 · Cap. 10 · 10.2 Respiração · p. 212","e":"ENEM PPL 2019 · Q101 — Saturação da hemoglobina (transporte de O2)","h":"H14","q":525},{"id":"BIO-V2C10-06","a":"BIO","d":"Volume 2","t":"Cap. 10 · Nutrição, respiração, circulação e excreção","k":"processo","f":"Como o sangue volta ao coração pelas veias se a pressão venosa é baixa?","v":"A contração dos <b>músculos esqueléticos<\/b> comprime as veias, e as <b>válvulas venosas<\/b> impedem o refluxo, de modo que o sangue só pode seguir em direção ao coração.","x":"O experimento de Harvey (pressionar veias do braço) demonstra o fluxo unidirecional garantido pelas válvulas.","r":"Vol. 2 · Cap. 10 · 10.3 Circulação sanguínea e linfática · p. 217","e":"ENEM 2013 · Q56 — Válvulas venosas (experimento de Harvey)","h":"H15","q":716},{"id":"BIO-V2C10-07","a":"BIO","d":"Volume 2","t":"Cap. 10 · Nutrição, respiração, circulação e excreção","k":"aplicação","f":"Quais as causas mais comuns da hipertensão arterial e por que medir a pressão?","v":"Estresse emocional, <b>alimentação rica em gorduras e em sais<\/b> e sedentarismo. Ela aumenta o risco de infarto e AVC e pode ser <b>assintomática<\/b> no início — por isso a aferição regular. Referência: sistólica acima de 140 e diastólica acima de 90 mmHg com frequência.","x":"Questões de saúde pública ligam o excesso de sódio na dieta à pressão alta.","r":"Vol. 2 · Cap. 10 · 10.3 Circulação sanguínea e linfática · p. 224","e":"ENEM PPL 2015 · Q47 — Excesso de sódio e hipertensão arterial","h":null,"q":511},{"id":"BIO-V2C10-08","a":"BIO","d":"Volume 2","t":"Cap. 10 · Nutrição, respiração, circulação e excreção","k":"processo","f":"Por que 180 L de filtrado viram só 1,5 L de urina por dia? E a glicose no diabetes?","v":"No túbulo proximal são <b>reabsorvidos<\/b> glicose, aminoácidos, vitaminas, grande parte dos sais e da água. No <b>diabetes melito<\/b>, a glicemia excede a capacidade de reabsorção e sobra glicose na urina (<b>glicosúria<\/b>).","x":"Glicose na urina não indica lesão do glomérulo: é o limite de reabsorção do túbulo que foi ultrapassado.","r":"Vol. 2 · Cap. 10 · 10.4 Sistema urinário humano · p. 227","e":null,"h":null,"q":null},{"id":"BIO-V2C10-09","a":"BIO","d":"Volume 2","t":"Cap. 10 · Nutrição, respiração, circulação e excreção","k":"processo","f":"Como o ADH regula a urina em uma pessoa desidratada?","v":"Desidratação → sangue mais concentrado → hipófise posterior libera <b>ADH<\/b> (produzido no hipotálamo) → maior <b>reabsorção de água<\/b> nos túbulos distais e ductos coletores → urina <b>escassa e concentrada<\/b>. O álcool inibe o ADH e aumenta a diurese.","x":"Cobra-se a relação desidratação → ADH alto → urina concentrada (e o inverso após beber muita água).","r":"Vol. 2 · Cap. 10 · 10.4 Sistema urinário humano · p. 228","e":"ENEM 2015 · Q67 — Osmorregulação renal (desidratação)","h":"H14","q":526},{"id":"BIO-V2C11-01","a":"BIO","d":"Volume 2","t":"Cap. 11 · Integração e controle corporal","k":"processo","f":"O que é o potencial de ação de um neurônio?","v":"Em repouso, a face interna da membrana é negativa (cerca de <b>−70 mV<\/b>). Ao estímulo, a permeabilidade a <b>Na<sup>+<\/sup><\/b> e <b>K<sup>+<\/sup><\/b> muda bruscamente e o potencial inverte para cerca de <b>+40 mV<\/b> (despolarização). Essa inversão se propaga pelo axônio como <b>impulso nervoso<\/b>.","x":"Toxinas que bloqueiam canais de Na<sup>+<\/sup> (como a do baiacu) impedem a despolarização e causam paralisia.","r":"Vol. 2 · Cap. 11 · 11.1 Sistema nervoso · p. 236","e":"ENEM 2025 · Q102 — Toxina do baiacu (fisiologia)","h":"H30","q":486},{"id":"BIO-V2C11-02","a":"BIO","d":"Volume 2","t":"Cap. 11 · Integração e controle corporal","k":"processo","f":"Quais neurônios participam do reflexo patelar e qual o papel do encéfalo?","v":"Apenas um <b>neurônio sensitivo<\/b> (leva o impulso da batida no joelho à <b>medula espinal<\/b>) e um <b>neurônio motor<\/b> (leva o impulso ao músculo da coxa, que se contrai). A resposta é elaborada <b>sem interferência do encéfalo<\/b>; reflexos mais complexos incluem um neurônio associativo.","x":"Armadilha: o arco reflexo não passa pelo cérebro — a consciência do estímulo vem depois da resposta.","r":"Vol. 2 · Cap. 11 · 11.1 Sistema nervoso · p. 240","e":"ENEM 2021 · Q114 — Arco reflexo (reflexo patelar)","h":"H14","q":666},{"id":"BIO-V2C11-03","a":"BIO","d":"Volume 2","t":"Cap. 11 · Integração e controle corporal","k":"conceito","f":"Que estruturas do olho controlam a entrada de luz e focalizam a imagem na retina?","v":"A <b>íris<\/b> ajusta a abertura da <b>pupila<\/b> conforme a luminosidade. A <b>lente<\/b> (cristalino), biconvexa, muda de curvatura pela ação dos <b>músculos ciliares<\/b> para focalizar a imagem sobre a <b>retina<\/b>, onde estão os fotorreceptores.","x":"O olho é comparado a uma câmara escura: pupila = orifício, lente = sistema óptico, retina = anteparo.","r":"Vol. 2 · Cap. 11 · 11.2 Os sentidos · p. 246","e":"ENEM 2015 · Q85 — Formação da imagem na retina (câmara escura)","h":"H15","q":593},{"id":"BIO-V2C11-04","a":"BIO","d":"Volume 2","t":"Cap. 11 · Integração e controle corporal","k":"comparação","f":"Cones × bastonetes: qual a função de cada um?","v":"<b>Bastonetes<\/b>: muito sensíveis à luz, <b>não distinguem cores<\/b> — visão na penumbra. <b>Cones<\/b>: menos sensíveis, discriminam comprimentos de onda — <b>visão em cores<\/b>, ativados com mais luz.","x":"Por isso no escuro enxergamos formas, mas não cores; falhas nos cones explicam alterações na percepção de cores.","r":"Vol. 2 · Cap. 11 · 11.2 Os sentidos · p. 246","e":"ENEM 2017 · Q128 — Fisiologia da visão (cones da retina)","h":"H14","q":667},{"id":"BIO-V2C11-05","a":"BIO","d":"Volume 2","t":"Cap. 11 · Integração e controle corporal","k":"processo","f":"Como a luz que atinge a retina vira impulso nervoso?","v":"A luz altera a estrutura de um <b>pigmento fotossensível<\/b> do cone ou bastonete → reações químicas na célula → mudança na <b>permeabilidade da membrana<\/b> → impulsos transmitidos a outras células da retina → <b>nervo óptico<\/b> → córtex visual.","x":"Questões de fototransdução exigem distinguir a captação (retina) da interpretação (córtex cerebral).","r":"Vol. 2 · Cap. 11 · 11.2 Os sentidos · p. 247","e":"ENEM 2022 · Q130 — Fototransdução (cones e bastonetes)","h":"H22","q":579},{"id":"BIO-V2C11-06","a":"BIO","d":"Volume 2","t":"Cap. 11 · Integração e controle corporal","k":"pegadinha","f":"Diabetes insípido × diabetes melito: qual a causa de cada um?","v":"<b>Insípido<\/b>: produção insuficiente de <b>ADH<\/b> → pouca reabsorção de água nos rins → muita urina diluída, sede e risco de desidratação. <b>Melito<\/b>: falta de <b>insulina<\/b> ou de resposta a ela → glicose alta no sangue e na urina.","x":"Ambos causam poliúria, mas só o melito eleva a glicemia; o insípido é hormônio da neuro-hipófise.","r":"Vol. 2 · Cap. 11 · 11.3 Sistema endócrino · p. 249","e":"ENEM 2016 · Q87 — Ação do ADH (diabetes insipidus)","h":"H14","q":556},{"id":"BIO-V2C11-07","a":"BIO","d":"Volume 2","t":"Cap. 11 · Integração e controle corporal","k":"conceito","f":"Qual o efeito geral da tiroxina (T4) e da tri-iodotironina (T3)?","v":"Aumentam a <b>atividade metabólica<\/b> das células do corpo e ajudam a manter pressão, ritmo cardíaco e tônus muscular. Em excesso (<b>hipertireoidismo<\/b>): temperatura elevada, sudorese, perda de peso, irritabilidade. A produção depende de <b>iodo<\/b>; sua falta causa bócio carencial.","x":"Associação cobrada: hormônio tireoidiano alto → metabolismo acelerado; iodação do sal previne o bócio.","r":"Vol. 2 · Cap. 11 · 11.3 Sistema endócrino · p. 249","e":"ENEM PPL 2021 · Q130 — Hormônios tireoidianos (T3/T4)","h":"H10","q":577},{"id":"BIO-V2C11-08","a":"BIO","d":"Volume 2","t":"Cap. 11 · Integração e controle corporal","k":"comparação","f":"Insulina × glucagon: quem produz e o que fazem com a glicemia?","v":"Ilhotas pancreáticas: <b>células-beta → insulina<\/b>, que facilita a entrada de glicose em músculos, fígado e tecido adiposo e a formação de <b>glicogênio<\/b> (glicemia cai). <b>Células-alfa → glucagon<\/b>, que estimula a quebra de glicogênio hepático (glicemia sobe).","x":"Após refeição sobe a insulina; em jejum prolongado sobe o glucagon — leitura de gráficos é frequente.","r":"Vol. 2 · Cap. 11 · 11.3 Sistema endócrino · p. 251","e":"ENEM 2018 · Q94 — Regulação hormonal (insulina/glucagon)","h":"H14","q":655},{"id":"BIO-V2C11-09","a":"BIO","d":"Volume 2","t":"Cap. 11 · Integração e controle corporal","k":"aplicação","f":"Que efeitos a adrenalina provoca em uma situação de estresse?","v":"Liberada pela <b>medula da suprarrenal<\/b>, causa <b>taquicardia<\/b>, aumento da <b>pressão arterial<\/b>, vasoconstrição da pele (palidez), desvio de sangue para músculos e maior excitabilidade nervosa — prepara o corpo para reação rápida.","x":"Drogas estimulantes como as anfetaminas imitam esses efeitos, típicos também do sistema nervoso simpático.","r":"Vol. 2 · Cap. 11 · 11.3 Sistema endócrino · p. 252","e":"ENEM PPL 2023 · Q128 — Anfetaminas e ação da adrenalina","h":"H30","q":684},{"id":"BIO-V2C12-01","a":"BIO","d":"Volume 2","t":"Cap. 12 · Revestimento, suporte e movimento do corpo humano","k":"pegadinha","f":"Pessoas de pele clara têm menos melanócitos que as de pele escura?","v":"<b>Não<\/b>. O número de <b>melanócitos<\/b> é semelhante em todas as pessoas; a diferença está na <b>quantidade de melanina<\/b> que produzem. A melanina protege contra a radiação <b>ultravioleta<\/b>, e a exposição ao sol estimula sua produção.","x":"Armadilha frequente: confundir número de células com quantidade de pigmento.","r":"Vol. 2 · Cap. 12 · 12.1 Estrutura e funções da pele humana · p. 258","e":null,"h":null,"q":null},{"id":"BIO-V2C12-02","a":"BIO","d":"Volume 2","t":"Cap. 12 · Revestimento, suporte e movimento do corpo humano","k":"processo","f":"Como a pele ajuda a resfriar ou a conservar o calor do corpo?","v":"No calor: <b>vasodilatação<\/b> dos vasos da derme (mais irradiação de calor) e <b>suor<\/b>, cuja evaporação absorve calor da pele. No frio: <b>vasoconstrição<\/b> cutânea, reduzindo a perda de calor. A hipoderme (gordura) atua como isolante térmico.","x":"Lembre: o suor resfria ao evaporar; em ambiente muito úmido a evaporação diminui e o resfriamento piora.","r":"Vol. 2 · Cap. 12 · 12.1 Estrutura e funções da pele humana · p. 259","e":null,"h":null,"q":null},{"id":"BIO-V2C12-03","a":"BIO","d":"Volume 2","t":"Cap. 12 · Revestimento, suporte e movimento do corpo humano","k":"comparação","f":"Osteoblastos, osteócitos e osteoclastos: o que faz cada célula óssea?","v":"<b>Osteoblastos<\/b>: produzem a matriz óssea. <b>Osteócitos<\/b>: osteoblastos maduros presos em lacunas, mantêm o tecido. <b>Osteoclastos<\/b>: células multinucleadas que <b>destroem<\/b> áreas lesadas ou velhas. Juntos remodelam o osso continuamente.","x":"Matriz rígida = fibras colágenas + fosfato de cálcio; o osso é reserva de cálcio controlada por calcitonina e paratormônio.","r":"Vol. 2 · Cap. 12 · 12.2 Sistema esquelético humano · p. 260","e":null,"h":null,"q":null},{"id":"BIO-V2C12-04","a":"BIO","d":"Volume 2","t":"Cap. 12 · Revestimento, suporte e movimento do corpo humano","k":"comparação","f":"Mioglobina × hemoglobina: qual a diferença e a função da mioglobina?","v":"A <b>mioglobina<\/b> tem <b>uma<\/b> cadeia polipeptídica com um heme e liga uma molécula de O<sub>2<\/sub>; fica <b>dentro da fibra muscular<\/b>, armazenando O<sub>2<\/sub> para momentos de intensa atividade. A hemoglobina (4 cadeias, 4 hemes) transporta O<sub>2<\/sub> no sangue. A mioglobina dá a cor vermelha aos músculos.","x":"Músculos de esforço prolongado (voo de aves migratórias, maratonistas) são ricos em mioglobina.","r":"Vol. 2 · Cap. 12 · 12.3 Sistema muscular humano · p. 268","e":"ENEM 2023 · Q95 — Fibras musculares e migração (aves)","h":"H28","q":713},{"id":"BIO-V2C12-05","a":"BIO","d":"Volume 2","t":"Cap. 12 · Revestimento, suporte e movimento do corpo humano","k":"processo","f":"Como um estímulo nervoso provoca a contração de uma fibra muscular esquelética?","v":"O impulso da terminação nervosa se propaga pela fibra → o <b>retículo sarcoplasmático<\/b> libera <b>Ca<sup>2+<\/sup><\/b> → os filamentos de <b>actina deslizam sobre os de miosina<\/b> → os sarcômeros encurtam. A energia vem do <b>ATP<\/b>, reposto pela fosfocreatina.","x":"A fibra esquelética só contrai com estímulo nervoso direto; bloquear a liberação do neurotransmissor (toxina botulínica) paralisa o músculo.","r":"Vol. 2 · Cap. 12 · 12.3 Sistema muscular humano · p. 269","e":"ENEM PPL 2015 · Q81 — Toxina botulínica e tecido muscular","h":null,"q":534},{"id":"BIO-V2C12-06","a":"BIO","d":"Volume 2","t":"Cap. 12 · Revestimento, suporte e movimento do corpo humano","k":"comparação","f":"Fibras musculares lentas (tipo I) × rápidas (tipo II): diferenças e uso?","v":"<b>Lentas<\/b>: mais <b>mitocôndrias<\/b>, mais irrigação e mais <b>mioglobina<\/b> — esforço moderado e prolongado (maratona, ciclismo). <b>Rápidas<\/b>: contraem ~10 vezes mais depressa, pouca mioglobina e menos mitocôndrias — esforço intenso e curto (100 m rasos, levantamento de peso).","x":"O treinamento altera a proporção; questões cruzam tipo de fibra com metabolismo aeróbico × anaeróbico.","r":"Vol. 2 · Cap. 12 · 12.3 Sistema muscular humano · p. 271","e":"ENEM 2024 · Q109 — Fibras musculares (tipos e metabolismo)","h":"H14","q":599},{"id":"BIO-V3C1-01","a":"BIO","d":"Volume 3","t":"Cap. 1 · Lei da herança genética","k":"conceito","f":"Para Mendel, o que é linhagem pura e o que significam estado dominante e estado recessivo?","v":"<b>Linhagem pura<\/b>: a que, por autofecundação, só produz plantas iguais a si. Cruzando puras contrastantes (geração P), a F<sub>1<\/sub> mostra só um dos estados: o <b>dominante<\/b>. O estado que fica encoberto na F<sub>1<\/sub> e reaparece na F<sub>2<\/sub> é o <b>recessivo<\/b> (ex.: semente amarela domina a verde).","x":"Recessivo não significa raro nem 'mais fraco': só indica que não se manifesta no híbrido; ele não desaparece, volta na F<sub>2<\/sub>.","r":"Vol. 3 · Cap. 1 · 1.1 Mendel e as origens da Genética · p. 15","e":"ENEM PPL 2018 · Q103 — Leis de Mendel (ervilhas)","h":"H13","q":588},{"id":"BIO-V3C1-02","a":"BIO","d":"Volume 3","t":"Cap. 1 · Lei da herança genética","k":"conceito","f":"Qual é o enunciado da 1ª lei de Mendel e qual processo celular a explica?","v":"<b>Lei da segregação dos fatores<\/b>: cada característica é determinada por um par de fatores (um de cada genitor), que se <b>separam na formação dos gametas<\/b>; cada gameta recebe só um fator do par. A base física é a separação dos <b>cromossomos homólogos na meiose<\/b> (hipótese de Sutton, 1902).","x":"A lei fala da formação dos gametas, não da fecundação: o ponto central é que o gameta é 'puro', com um único alelo de cada gene.","r":"Vol. 3 · Cap. 1 · 1.1 Mendel e as origens da Genética · p. 17","e":"ENEM 2019 · Q110 — Leis de Mendel (segregação)","h":"H13","q":720},{"id":"BIO-V3C1-03","a":"BIO","d":"Volume 3","t":"Cap. 1 · Lei da herança genética","k":"aplicação","f":"No cruzamento Aa × Aa (dominância completa), quais as proporções genotípica e fenotípica? Entre os de fenótipo dominante, quantos são Aa?","v":"Genótipos: <b>1 AA : 2 Aa : 1 aa<\/b> (25% : 50% : 25%). Fenótipos: <b>3 dominantes : 1 recessivo<\/b> (75% : 25%). Entre os de fenótipo dominante, <b>2/3 são heterozigóticos (Aa)<\/b> e 1/3 homozigóticos (AA).","x":"Armadilha clássica: se o enunciado já diz que o descendente tem fenótipo dominante, a chance de ser Aa é 2/3, e não 1/2.","r":"Vol. 3 · Cap. 1 · 1.1 Mendel e as origens da Genética · p. 17","e":"ENEM 2025 · Q107 — Cruzamento e proporção fenotípica","h":"H13","q":563},{"id":"BIO-V3C1-04","a":"BIO","d":"Volume 3","t":"Cap. 1 · Lei da herança genética","k":"processo","f":"O que é o cruzamento-teste e como se interpreta o seu resultado?","v":"Cruza-se o indivíduo de fenótipo dominante e genótipo desconhecido (AA ou Aa) com um <b>homozigótico recessivo (aa)<\/b>. Se surgir algum descendente recessivo, o testado é <b>Aa<\/b> (esperado 1 : 1). Se uma prole grande for toda dominante, ele é muito provavelmente <b>AA<\/b>.","x":"O parceiro tem de ser aa porque só forma gametas a; assim o fenótipo dos filhos revela diretamente os gametas do indivíduo testado.","r":"Vol. 3 · Cap. 1 · 1.2 Conceitos básicos em Genética · p. 22","e":null,"h":null,"q":null},{"id":"BIO-V3C1-05","a":"BIO","d":"Volume 3","t":"Cap. 1 · Lei da herança genética","k":"aplicação","f":"Pedro (normal, pais normais, avó materna e avô paterno albinos) casa com Maria (normal, pai Aa, mãe AA). Qual o risco de um filho albino?","v":"Os pais de Pedro são Aa, e ele é normal: chance de ser <b>Aa = 2/3<\/b>. Maria recebeu A da mãe e tem 1/2 de ter recebido a do pai: <b>Aa = 1/2<\/b>. Ambos Aa geram aa com 1/4. Regra do 'e': 2/3 × 1/2 × 1/4 = <b>1/12<\/b>.<br>Se já tiveram um filho albino, ambos são certamente Aa e o risco de outro filho albino passa a ser <b>1/4<\/b>.","x":"Multiplique a chance de cada genitor ser portador; quando nasce um filho afetado, essa dúvida desaparece e só resta o 1/4.","r":"Vol. 3 · Cap. 1 · 1.2 Conceitos básicos em Genética · p. 24","e":"ENEM PPL 2015 · Q66 — Probabilidade na fenilcetonúria","h":null,"q":754},{"id":"BIO-V3C1-06","a":"BIO","d":"Volume 3","t":"Cap. 1 · Lei da herança genética","k":"pegadinha","f":"Por que o cruzamento de camundongos amarelos entre si dá 2 amarelos : 1 cinzento, e não 3 : 1?","v":"O alelo para amarelo (A<sup>Y<\/sup>) é dominante na cor, mas <b>letal em homozigose<\/b>: os embriões A<sup>Y<\/sup>A<sup>Y<\/sup> morrem no início do desenvolvimento. De 1 A<sup>Y<\/sup>A<sup>Y<\/sup> : 2 A<sup>Y<\/sup>A : 1 AA, sobram <b>2/3 amarelos (todos heterozigóticos) : 1/3 cinzentos<\/b>. Na espécie humana, a acondroplasia (DD letal) segue o mesmo padrão.","x":"Proporção 2 : 1 no cruzamento de heterozigóticos é a 'assinatura' de alelo letal; indivíduos com o fenótipo do alelo letal são sempre heterozigóticos.","r":"Vol. 3 · Cap. 1 · 1.3 Variações do modelo mendeliano de herança · p. 25","e":"ENEM PPL 2020 · Q98 — Gene letal (herança)","h":"H13","q":694},{"id":"BIO-V3C1-07","a":"BIO","d":"Volume 3","t":"Cap. 1 · Lei da herança genética","k":"comparação","f":"Diferencie dominância completa, dominância incompleta e codominância pelo fenótipo do heterozigótico.","v":"<b>Completa<\/b>: heterozigótico igual a um dos homozigóticos. <b>Incompleta<\/b>: fenótipo <i>intermediário<\/i> (boca-de-leão rosa; galinha andaluza cinza-azulada, de pretas × brancas). <b>Codominância<\/b>: expressa <i>os dois<\/i> fenótipos ao mesmo tempo (grupo MN; I<sup>A<\/sup>I<sup>B<\/sup> → AB). Nos dois últimos casos, F<sub>2<\/sub> = <b>1 : 2 : 1<\/b> também no fenótipo.","x":"Quando a proporção fenotípica é igual à genotípica (1 : 2 : 1), não há alelo dominante; não confunda com o 3 : 1 mendeliano.","r":"Vol. 3 · Cap. 1 · 1.3 Variações do modelo mendeliano de herança · p. 26","e":"ENEM PPL 2019 · Q93 — Herança da coloração (aves)","h":"H13","q":526},{"id":"BIO-V3C1-08","a":"BIO","d":"Volume 3","t":"Cap. 1 · Lei da herança genética","k":"aplicação","f":"Como se determina o tipo ABO com soros anti-A e anti-B, e quais aglutininas existem no plasma de cada grupo?","v":"Aglutina só com anti-A → <b>A<\/b>; só com anti-B → <b>B<\/b>; com ambos → <b>AB<\/b>; com nenhum → <b>O<\/b>. Plasma: A tem anti-B; B tem anti-A; AB não tem aglutininas (<b>receptor universal<\/b>); O tem anti-A e anti-B, mas hemácias sem aglutinogênio (<b>doador universal<\/b>).","x":"Na transfusão importam os aglutinogênios das hemácias do doador e as aglutininas do plasma do receptor; o plasma do doador se dilui.","r":"Vol. 3 · Cap. 1 · 1.4 Herança de grupos sanguíneos na espécie humana · p. 33","e":"ENEM 2014 · Q79 — Aglutinação e tipagem sanguínea (soros)","h":"H18","q":619},{"id":"BIO-V3C1-09","a":"BIO","d":"Volume 3","t":"Cap. 1 · Lei da herança genética","k":"processo","f":"Como ocorre a eritroblastose fetal (DHRN) e como ela é prevenida?","v":"Mãe <b>Rh<sup>−<\/sup> (rr)<\/b> é sensibilizada no parto de um filho <b>Rh<sup>+<\/sup><\/b>, quando hemácias fetais entram na sua circulação. Numa gestação seguinte de feto Rh<sup>+<\/sup>, os anticorpos <b>anti-Rh<\/b> atravessam a placenta e destroem as hemácias fetais: anemia, icterícia e eritroblastos no sangue. Prevenção: injetar <b>anti-Rh na mãe logo após o parto<\/b>, o que impede a sensibilização.","x":"Só ocorre com mãe Rh<sup>−<\/sup> e filho Rh<sup>+<\/sup>; o primeiro filho em geral não é afetado (a não ser que a mãe já tenha sido sensibilizada antes, por exemplo por transfusão).","r":"Vol. 3 · Cap. 1 · 1.4 Herança de grupos sanguíneos na espécie humana · p. 32","e":"ENEM PPL 2016 · Q50 — Herança do sistema ABO e do fator Rh","h":"H14","q":598},{"id":"BIO-V3C2-01","a":"BIO","d":"Volume 3","t":"Cap. 2 · As bases cromossômicas da herança","k":"conceito","f":"O que diz a 2ª lei de Mendel e que proporções ela prevê para um duplo-heterozigótico VvRr?","v":"<b>Lei da segregação independente<\/b>: os fatores para duas ou mais características separam-se no híbrido e distribuem-se independentemente para os gametas. VvRr forma <b>4 tipos de gameta em igual proporção<\/b> (1 VR : 1 Vr : 1 vR : 1 vr), e VvRr × VvRr dá F<sub>2<\/sub> <b>9 : 3 : 3 : 1<\/b> (amarela lisa : amarela rugosa : verde lisa : verde rugosa).","x":"Atalho: trate cada gene como um monoibridismo (3/4 × 3/4 = 9/16 duplo-dominante) e multiplique.","r":"Vol. 3 · Cap. 2 · 2.1 A segregação independente de genes · p. 41","e":null,"h":null,"q":null},{"id":"BIO-V3C2-02","a":"BIO","d":"Volume 3","t":"Cap. 2 · As bases cromossômicas da herança","k":"pegadinha","f":"Uma única célula AaBb (genes em pares diferentes de homólogos) forma quantos tipos de gameta na meiose? E o indivíduo?","v":"Cada célula forma <b>apenas 2 tipos<\/b>: AB e ab <i>ou<\/i> Ab e aB, conforme os homólogos se orientaram na placa equatorial. Como as duas orientações são igualmente prováveis, o <b>indivíduo<\/b> produz <b>4 tipos em 1 : 1 : 1 : 1<\/b>. Segregação independente só vale para genes em <b>pares diferentes<\/b> de cromossomos homólogos.","x":"Confusão comum: '4 tipos de gameta' se refere ao conjunto de meioses do organismo, não ao produto de uma única célula.","r":"Vol. 3 · Cap. 2 · 2.1 A segregação independente de genes · p. 43","e":null,"h":null,"q":null},{"id":"BIO-V3C2-03","a":"BIO","d":"Volume 3","t":"Cap. 2 · As bases cromossômicas da herança","k":"aplicação","f":"Mulher A/Rh<sup>−<\/sup> (I<sup>A<\/sup>i rr) e homem O/Rh<sup>+<\/sup> (ii Rr): qual a chance de um filho O/Rh<sup>+<\/sup>? O homem pode ser pai de um filho A?","v":"Os genes ABO e Rh segregam-se independentemente, então multiplicam-se as chances: P(O) = 1/2 e P(Rh<sup>+<\/sup>) = 1/2, logo P(O/Rh<sup>+<\/sup>) = <b>1/4<\/b>. Uma criança A filha de mãe O precisa ter recebido I<sup>A<\/sup> do pai; um homem do grupo O (ii) fica <b>excluído<\/b> como pai.","x":"Tipagem sanguínea só exclui paternidade, nunca a confirma; hoje foi substituída pelo exame de DNA.","r":"Vol. 3 · Cap. 2 · 2.1 A segregação independente de genes · p. 44","e":null,"h":null,"q":null},{"id":"BIO-V3C2-04","a":"BIO","d":"Volume 3","t":"Cap. 2 · As bases cromossômicas da herança","k":"aplicação","f":"Em labradores, como os genes B/b e E/e interagem? Qual a proporção em BbEe × BbEe?","v":"B: pigmento preto; b: chocolate. E: deposita pigmento no pelo; <b>ee impede a deposição<\/b> e torna o pelo dourado, seja qual for o gene B. Resultado: <b>9 pretos (B_E_) : 3 chocolate (bbE_) : 4 dourados (__ee)<\/b>. Entre os dourados, os portadores de B têm nariz e lábios pretos e os bb têm nariz marrom.","x":"Proporções como 9 : 3 : 4 (soma 16) indicam dois genes com segregação independente interagindo (aqui, epistasia do ee), não um novo padrão de herança.","r":"Vol. 3 · Cap. 2 · 2.2 Interações entre genes com segregação independente · p. 52","e":null,"h":null,"q":null},{"id":"BIO-V3C2-05","a":"BIO","d":"Volume 3","t":"Cap. 2 · As bases cromossômicas da herança","k":"conceito","f":"O que caracteriza a herança quantitativa (poligênica)? Como saber o número de genes envolvidos?","v":"Vários genes com <b>alelos aditivos<\/b>, cada alelo 'contribuinte' somando uma parcela igual ao fenótipo, com forte efeito do ambiente e distribuição em curva normal (sino). Trigo (Nilsson-Ehle): AABB × aabb → F<sub>2<\/sub> <b>1 : 4 : 6 : 4 : 1<\/b>. Com n pares: <b>2n + 1 classes<\/b> fenotípicas e cada extremo na fração <b>(1/4)<sup>n<\/sup><\/b> (1/16 → 2 pares).","x":"Valor de cada alelo = (fenótipo máximo − mínimo) ÷ nº de alelos aditivos; na cevada do livro, (3,2 − 2,1) ÷ 4 = 0,275 cm.","r":"Vol. 3 · Cap. 2 · 2.2 Interações entre genes com segregação independente · p. 53","e":null,"h":null,"q":null},{"id":"BIO-V3C2-06","a":"BIO","d":"Volume 3","t":"Cap. 2 · As bases cromossômicas da herança","k":"processo","f":"Por que genes ligados formam gametas recombinantes? Como se calcula a distância entre eles?","v":"Na <b>prófase I da meiose<\/b>, cromátides de cromossomos homólogos podem quebrar e trocar pedaços: é a <b>permutação (crossing-over)<\/b>, que gera cromossomos com combinações novas de alelos. A taxa de recombinação é a soma das classes recombinantes no cruzamento-teste: 8,5% + 8,5% = <b>17% = 17 UR (centimorgans)<\/b>. Quanto mais distantes os locos, maior a chance de permutação.","x":"Ligação gênica se reconhece por quatro classes desiguais (duas parentais grandes e duas recombinantes pequenas), e não pelo 1 : 1 : 1 : 1.","r":"Vol. 3 · Cap. 2 · 2.3 Genes localizados no mesmo cromossomo · p. 57","e":"ENEM 2016 · Q83 — Crossing-over na meiose (formação de gametas)","h":"H13","q":620},{"id":"BIO-V3C2-07","a":"BIO","d":"Volume 3","t":"Cap. 2 · As bases cromossômicas da herança","k":"aplicação","f":"Cruzamento-teste de fêmea MmVv: 48,5% MV, 48,5% mv, 1,5% Mv, 1,5% mV. Qual o arranjo dos alelos e a distância entre os locos?","v":"As classes mais frequentes são as <b>parentais<\/b>: MV e mv. Logo, a fêmea tinha os dominantes no mesmo cromossomo, arranjo <b>cis (MV/mv)<\/b>. As classes raras são recombinantes: 1,5% + 1,5% = 3% → <b>3 UR<\/b>. Se as parentais fossem Mv e mV, o arranjo seria <b>trans<\/b>.","x":"As maiores classes revelam o arranjo dos alelos no heterozigótico; as menores dão a taxa de permutação (1% = 1 UR).","r":"Vol. 3 · Cap. 2 · 2.3 Genes localizados no mesmo cromossomo · p. 59","e":null,"h":null,"q":null},{"id":"BIO-V3C3-01","a":"BIO","d":"Volume 3","t":"Cap. 3 · Herança e sexo","k":"comparação","f":"Compare os sistemas XY, XO, ZW e haploide/diploide: quem é o sexo heterogamético em cada um?","v":"<b>XY<\/b> (mamíferos, drosófila): fêmea XX, macho XY. <b>XO<\/b> (gafanhotos): fêmea XX, macho X0. Nos dois, o macho é heterogamético e define o sexo da prole. <b>ZW<\/b> (aves, borboletas): macho ZZ, <b>fêmea ZW<\/b>, e é a fêmea que define o sexo da prole. <b>Haploide/diploide<\/b> (abelhas): zangões n, vindos de óvulos não fecundados (partenogênese); fêmeas 2n, rainha ou operária conforme a alimentação da larva.","x":"Em aves, quem determina o sexo dos filhotes é a fêmea; em abelhas, o sexo depende da fecundação e não de cromossomo sexual.","r":"Vol. 3 · Cap. 3 · 3.1 Os cromossomos e o sexo · p. 65","e":null,"h":null,"q":null},{"id":"BIO-V3C3-02","a":"BIO","d":"Volume 3","t":"Cap. 3 · Herança e sexo","k":"pegadinha","f":"Na herança ligada ao X, de quem o filho e a filha recebem o X? O que isso implica para um alelo dominante no X?","v":"O homem é <b>hemizigoto<\/b>: tem um só X, herdado <b>sempre da mãe<\/b>. O pai passa seu X <b>a todas as filhas<\/b> e nunca aos filhos (a eles passa o Y). Assim, se o alelo é <b>dominante<\/b> ligado ao X, um pai afetado tem <b>todas as filhas afetadas e nenhum filho afetado<\/b>.","x":"Transmissão de pai para filho homem descarta herança ligada ao X; no heredograma, esse é o primeiro teste a fazer.","r":"Vol. 3 · Cap. 3 · 3.2 Herança de genes localizados em cromossomos sexuais · p. 67","e":"ENEM 2014 · Q74 — Herança dominante ligada ao sexo","h":"H13","q":648},{"id":"BIO-V3C3-03","a":"BIO","d":"Volume 3","t":"Cap. 3 · Herança e sexo","k":"aplicação","f":"Mulher portadora do daltonismo (X<sup>D<\/sup>X<sup>d<\/sup>) × homem de visão normal (X<sup>D<\/sup>Y): como serão os filhos e as filhas?","v":"Filhas: todas de visão normal (recebem X<sup>D<\/sup> do pai), sendo <b>metade portadoras<\/b>. Filhos: <b>50% daltônicos<\/b> (X<sup>d<\/sup>Y), pois o X vem da mãe. Por isso o daltonismo é muito mais comum em homens (5% a 8%) que em mulheres (0,04%): a mulher precisa ser X<sup>d<\/sup>X<sup>d<\/sup>.","x":"Filha de pai não daltônico nunca é daltônica; mulher daltônica tem obrigatoriamente pai daltônico.","r":"Vol. 3 · Cap. 3 · 3.2 Herança de genes localizados em cromossomos sexuais · p. 68","e":"ENEM 2024 · Q112 — Herança ligada ao X (daltonismo)","h":"H13","q":577},{"id":"BIO-V3C3-04","a":"BIO","d":"Volume 3","t":"Cap. 3 · Herança e sexo","k":"conceito","f":"Que padrão de heredograma indica herança recessiva ligada ao X, como na hemofilia A?","v":"Afeta sobretudo <b>homens<\/b> (X<sup>h<\/sup>Y), que recebem o alelo de <b>mães portadoras<\/b> sem a doença (X<sup>H<\/sup>X<sup>h<\/sup>); a característica pode 'pular' gerações pelas mulheres. Mulher afetada (X<sup>h<\/sup>X<sup>h<\/sup>) exige pai afetado e mãe ao menos portadora. Na hemofilia A, o alelo não produz <b>fator VIII<\/b> funcional; basta um alelo normal para coagular normalmente.","x":"Homem afetado não transmite a doença aos filhos homens, mas todas as suas filhas serão portadoras.","r":"Vol. 3 · Cap. 3 · 3.2 Herança de genes localizados em cromossomos sexuais · p. 68","e":"ENEM 2017 · Q117 — Herança ligada ao X (distrofia de Duchenne)","h":"H13","q":582},{"id":"BIO-V3C3-05","a":"BIO","d":"Volume 3","t":"Cap. 3 · Herança e sexo","k":"pegadinha","f":"Casal X<sup>D<\/sup>X<sup>d<\/sup> × X<sup>D<\/sup>Y: diferença entre 'chance de uma criança ser menino daltônico' e 'chance de um filho homem ser daltônico'?","v":"Os descendentes possíveis são X<sup>D<\/sup>X<sup>D<\/sup>, X<sup>D<\/sup>X<sup>d<\/sup>, X<sup>D<\/sup>Y e X<sup>d<\/sup>Y (1/4 cada). <b>Criança qualquer ser menino daltônico = 1/4<\/b>. <b>Um filho já do sexo masculino ser daltônico = 1/2<\/b>, pois, quando o sexo é dado, as filhas saem do cálculo.","x":"Leia se o enunciado já fixou o sexo ('um filho homem') ou não ('uma criança'); a resposta muda de 1/4 para 1/2.","r":"Vol. 3 · Cap. 3 · 3.2 Herança de genes localizados em cromossomos sexuais · p. 70","e":null,"h":null,"q":null},{"id":"BIO-V3C3-06","a":"BIO","d":"Volume 3","t":"Cap. 3 · Herança e sexo","k":"conceito","f":"O que é a compensação de dose (hipótese de Lyon) e por que fêmeas de mamíferos são 'mosaicos'?","v":"Nas células somáticas da fêmea, <b>um dos X é inativado<\/b> no início do embrião e fica condensado como <b>cromatina sexual<\/b>, igualando a dose de genes do X à do macho. A escolha (X materno ou paterno) é <b>aleatória<\/b> e mantida nas células-filhas. Por isso heterozigotas expressam alelos diferentes em regiões diferentes: gatas pretas e amarelas, mulher daltônica de um só olho.","x":"Gato macho normal (XY) não é malhado preto e amarelo, pois tem um só X; a inativação não ocorre nas células germinativas.","r":"Vol. 3 · Cap. 3 · 3.2 Herança de genes localizados em cromossomos sexuais · p. 71","e":"ENEM 2022 · Q125 — Inativação do cromossomo X (mosaicismo)","h":"H13","q":647},{"id":"BIO-V3C3-07","a":"BIO","d":"Volume 3","t":"Cap. 3 · Herança e sexo","k":"aplicação","f":"Em galinhas, galo não barrado (Z<sup>b<\/sup>Z<sup>b<\/sup>) × galinha barrada (Z<sup>B<\/sup>W): como sai a F<sub>1<\/sub>?","v":"<b>Machos todos barrados (Z<sup>B<\/sup>Z<sup>b<\/sup>)<\/b>, pois recebem o Z<sup>B<\/sup> da mãe, e <b>fêmeas todas não barradas (Z<sup>b<\/sup>W)<\/b>, pois recebem o único Z do pai. É o padrão inverso ao do X, porque nas aves o sexo heterogamético é a fêmea.","x":"Em aves, filha herda o Z do pai, e não da mãe; esse cruzamento permite separar os pintinhos por sexo pela plumagem.","r":"Vol. 3 · Cap. 3 · 3.2 Herança de genes localizados em cromossomos sexuais · p. 72","e":null,"h":null,"q":null},{"id":"BIO-V3C4-01","a":"BIO","d":"Volume 3","t":"Cap. 4 · Genética e biotecnologia na atualidade","k":"comparação","f":"Como diferem os genes bacterianos e os eucarióticos quanto à organização? O que são éxons e íntrons?","v":"Em <b>bactérias<\/b> há <b>colinearidade<\/b>: toda a sequência transcrita corresponde aos aminoácidos do polipeptídio. Nos <b>eucariotos<\/b> o gene é <b>interrompido<\/b>: <b>éxons<\/b> são os trechos que codificam aminoácidos, e <b>íntrons<\/b> são trechos intercalados que não codificam.","x":"Gene, no livro, é um segmento de DNA com informação para um polipeptídio ou um RNA, delimitado pela região promotora e pela sequência de término de transcrição.","r":"Vol. 3 · Cap. 4 · 4.1 O controvertido conceito de gene · p. 78","e":null,"h":null,"q":null},{"id":"BIO-V3C4-02","a":"BIO","d":"Volume 3","t":"Cap. 4 · Genética e biotecnologia na atualidade","k":"processo","f":"O que é o splicing do RNA e o que muda no splicing alternativo?","v":"O gene eucariótico é transcrito inteiro em <b>pré-RNA mensageiro<\/b> (éxons + íntrons). No <b>splicing<\/b>, os íntrons são cortados e degradados e os éxons, emendados, formando o RNAm. No <b>splicing alternativo<\/b>, tipos celulares diferentes removem segmentos diferentes do mesmo pré-RNAm, gerando <b>RNAm e proteínas distintos a partir de um só gene<\/b>.","x":"Cerca de 95% dos genes humanos com vários éxons têm splicing alternativo; um gene não corresponde necessariamente a uma única proteína.","r":"Vol. 3 · Cap. 4 · 4.1 O controvertido conceito de gene · p. 79","e":null,"h":null,"q":null},{"id":"BIO-V3C4-03","a":"BIO","d":"Volume 3","t":"Cap. 4 · Genética e biotecnologia na atualidade","k":"conceito","f":"O que é heterose (vigor híbrido) e como ela é aproveitada no milho?","v":"Cruzando linhagens puras (muito homozigóticas) diferentes, obtêm-se <b>híbridos mais vigorosos, resistentes e produtivos<\/b>, atribuídos aos <b>muitos genes em heterozigose<\/b>. No milho <b>duplo-híbrido<\/b>, cruzam-se dois híbridos simples [(A × B) × (C × D)], obtidos de quatro linhagens puras; é a maior parte do milho consumido no mundo.","x":"O vigor depende da heterozigose: na geração seguinte os alelos segregam e o vigor se perde; por isso as sementes híbridas são refeitas a cada safra.","r":"Vol. 3 · Cap. 4 · 4.2 Melhoramento genético · p. 80","e":"ENEM 2018 · Q107 — Hibridação e propagação por enxertia","h":"H11","q":703},{"id":"BIO-V3C4-04","a":"BIO","d":"Volume 3","t":"Cap. 4 · Genética e biotecnologia na atualidade","k":"aplicação","f":"Por que lavouras de monocultura geneticamente uniformes correm risco? Que exemplos o livro cita?","v":"Com pouca <b>variabilidade genética<\/b>, não há indivíduos resistentes quando surge uma praga ou doença, e toda a lavoura pode ser perdida. Exemplos: a <b>fome da batata na Irlanda<\/b> (século XIX, uma única variedade) e o <b>milho híbrido dos EUA em 1970<\/b>, recuperado com um alelo de resistência vindo de um milho nativo da Colômbia.","x":"Variedades nativas e bancos de germoplasma são reservas de alelos (como os de resistência a pragas) para o melhoramento.","r":"Vol. 3 · Cap. 4 · 4.2 Melhoramento genético · p. 81","e":"ENEM PPL 2017 · Q98 — Melhoramento e resistência a pragas","h":"H7","q":600},{"id":"BIO-V3C4-05","a":"BIO","d":"Volume 3","t":"Cap. 4 · Genética e biotecnologia na atualidade","k":"conceito","f":"No sentido biológico original, o que é um clone?","v":"Conjunto de indivíduos originados de <b>um único genitor por reprodução assexuada<\/b>, e por isso <b>geneticamente idênticos<\/b> entre si e ao genitor (salvo mutações). Ex.: bactérias vindas de uma só célula, plantas obtidas por estacas. Por extensão, clonar é fazer cópias de genes, células ou organismos.","x":"Clones têm o mesmo genótipo, mas podem ter fenótipos diferentes se crescerem em ambientes diferentes.","r":"Vol. 3 · Cap. 4 · 4.3 Engenharia Genética · p. 81","e":"ENEM PPL 2015 · Q83 — Propagação por estacas (clonagem)","h":null,"q":682},{"id":"BIO-V3C4-06","a":"BIO","d":"Volume 3","t":"Cap. 4 · Genética e biotecnologia na atualidade","k":"conceito","f":"O que são endonucleases de restrição e por que são úteis na Engenharia Genética?","v":"Enzimas bacterianas (defesa contra bacteriófagos) que funcionam como <b>'tesouras' moleculares<\/b>: reconhecem uma <b>sequência específica<\/b> de bases, em geral de 4 ou 6 pares (ex.: EcoRI, GAATTC), e cortam o DNA nesse ponto. DNAs idênticos geram os mesmos fragmentos; DNAs com sequências diferentes geram fragmentos de tamanhos diferentes.","x":"Cada enzima corta só no seu sítio de reconhecimento; para unir DNAs de origens diferentes, ambos são cortados com a mesma enzima.","r":"Vol. 3 · Cap. 4 · 4.3 Engenharia Genética · p. 82","e":null,"h":null,"q":null},{"id":"BIO-V3C4-07","a":"BIO","d":"Volume 3","t":"Cap. 4 · Genética e biotecnologia na atualidade","k":"processo","f":"Na eletroforese em gel, para onde migram os fragmentos de DNA e quais chegam mais longe?","v":"O DNA tem <b>carga negativa<\/b> (grupos fosfato), então migra do polo negativo para o <b>polo positivo<\/b>. O gel funciona como obstáculo: os <b>fragmentos menores migram mais rápido e vão mais longe<\/b>. Fragmentos de mesmo tamanho formam uma banda, revelada com brometo de etídio sob luz UV.","x":"Banda mais distante do poço = fragmento menor; banda mais espessa = mais DNA daquele tamanho.","r":"Vol. 3 · Cap. 4 · 4.3 Engenharia Genética · p. 83","e":null,"h":null,"q":null},{"id":"BIO-V3C4-08","a":"BIO","d":"Volume 3","t":"Cap. 4 · Genética e biotecnologia na atualidade","k":"aplicação","f":"Num teste de paternidade por DNA (VNTRs), como se decide se um homem pode ser o pai?","v":"Cada pessoa tem duas versões de cada região VNTR (uma de cada homólogo), e as bandas da criança vêm metade da mãe e metade do pai. Retiram-se as bandas que a criança compartilha com a mãe; <b>as restantes têm de estar todas no suposto pai<\/b>. Faltando alguma, ele é excluído.","x":"O padrão de bandas é uma 'impressão digital' molecular única, exceto em gêmeos univitelinos, que têm DNA idêntico.","r":"Vol. 3 · Cap. 4 · 4.3 Engenharia Genética · p. 84","e":"ENEM 2013 · Q70 — Teste de DNA (bandas dos genitores)","h":"H13","q":477},{"id":"BIO-V3C4-09","a":"BIO","d":"Volume 3","t":"Cap. 4 · Genética e biotecnologia na atualidade","k":"processo","f":"Quais as etapas da clonagem molecular de um gene em plasmídio bacteriano?","v":"1) Cortar o plasmídio e o DNA de interesse com a <b>mesma endonuclease de restrição<\/b>; 2) unir os fragmentos com <b>ligases<\/b>, formando o <b>plasmídio recombinante<\/b>; 3) introduzi-lo em bactérias (<b>transformação bacteriana<\/b>); 4) a bactéria se divide e gera um clone com bilhões de cópias do DNA inserido.","x":"Plasmídio é DNA circular extracromossômico que se replica independentemente do cromossomo bacteriano; por isso serve de vetor.","r":"Vol. 3 · Cap. 4 · 4.4 Clonagem do DNA · p. 86","e":"ENEM 2024 · Q95 — Clonagem gênica e produção de proteínas","h":"H11","q":703},{"id":"BIO-V3C4-10","a":"BIO","d":"Volume 3","t":"Cap. 4 · Genética e biotecnologia na atualidade","k":"aplicação","f":"Que vantagem tem a insulina produzida por bactérias transgênicas sobre a de boi ou porco?","v":"O gene humano da insulina, ligado a um plasmídio e introduzido em bactérias, faz delas 'fábricas' de uma proteína com <b>sequência de aminoácidos idêntica à humana<\/b>. Ela não provoca as reações alérgicas que a insulina animal podia causar e substituiu quase totalmente a de origem animal (uso aprovado em 1982).","x":"A bactéria só fornece a maquinaria de síntese; a sequência da proteína é ditada pelo gene humano inserido.","r":"Vol. 3 · Cap. 4 · 4.4 Clonagem do DNA · p. 88","e":"ENEM 2015 · Q74 — DNA recombinante (insulina humana)","h":"H11","q":652},{"id":"BIO-V3C4-11","a":"BIO","d":"Volume 3","t":"Cap. 4 · Genética e biotecnologia na atualidade","k":"processo","f":"O que é um organismo transgênico e como se produz um mamífero transgênico?","v":"<b>Transgênico<\/b> (OGM) é o organismo que carrega DNA de <b>outra espécie<\/b>. Em mamíferos, o DNA é <b>microinjetado na célula-ovo<\/b> obtida por fecundação in vitro (em geral no pronúcleo masculino), e o embrião é implantado numa 'mãe de aluguel'. Integrado ao cromossomo do zigoto, o gene passa por mitose a todas as células e é <b>herdado pela descendência<\/b>.","x":"O gene vem de outra espécie, mas a proteína é produzida pelo organismo receptor (ex.: camundongo com hemoglobina de coelho).","r":"Vol. 3 · Cap. 4 · 4.5 Misturando genes entre espécies: transgênicos · p. 89","e":"ENEM PPL 2021 · Q108 — DNA recombinante e origem do gene","h":"H11","q":540},{"id":"BIO-V3C4-12","a":"BIO","d":"Volume 3","t":"Cap. 4 · Genética e biotecnologia na atualidade","k":"comparação","f":"Que técnicas introduzem genes em plantas e por que a transgenia vegetal é mais fácil que a animal?","v":"É possível regenerar uma <b>planta inteira a partir de uma única célula<\/b> transformada, por cultura de tecidos com hormônios. Vetores: o <b>plasmídio de <i>Agrobacterium tumefaciens<\/i><\/b>, que se integra aos cromossomos vegetais, e a <b>biobalística<\
