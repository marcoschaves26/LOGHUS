<body>
<title>Flashcards ENEM Loghus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: faixa azul Loghus no topo; abaixo, uma coluna de até 980px que alterna três telas (áreas → tópicos → estudo). */
:root{
  --page:#f3f5f9; --surface:#ffffff; --surface-2:#eaeef5;
  --ink:#0e1726; --ink-2:#465166; --muted:#7a8599; --line:#dbe1eb;
  --brand:#0b3d91; --brand-2:#082d6d; --brand-ink:#ffffff; --brand-soft:rgba(11,61,145,.09);
  --LC:#2a6fd0; --CH:#d9582a; --CN:#14946a; --MT:#c98a00;
  --bad:#d64545; --mid:#d99400; --good:#17935f;
  --bad-soft:rgba(214,69,69,.11); --mid-soft:rgba(217,148,0,.13); --good-soft:rgba(23,147,95,.12);
  --shadow:0 1px 2px rgba(14,23,38,.06),0 8px 24px rgba(14,23,38,.07);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --sans:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0a0e16; --surface:#131a27; --surface-2:#1b2333;
    --ink:#eef2f8; --ink-2:#b8c1d1; --muted:#8490a5; --line:#273145;
    --brand:#0d3a86; --brand-2:#0a2c66; --brand-ink:#ffffff; --brand-soft:rgba(92,145,235,.14);
    --LC:#5b97ec; --CH:#ef7a4c; --CN:#33b98a; --MT:#e7aa2a;
    --bad:#ec6a6a; --mid:#e7aa2a; --good:#3cc187;
    --bad-soft:rgba(236,106,106,.15); --mid-soft:rgba(231,170,42,.15); --good-soft:rgba(60,193,135,.15);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0a0e16; --surface:#131a27; --surface-2:#1b2333;
  --ink:#eef2f8; --ink-2:#b8c1d1; --muted:#8490a5; --line:#273145;
  --brand:#0d3a86; --brand-2:#0a2c66; --brand-ink:#ffffff; --brand-soft:rgba(92,145,235,.14);
  --LC:#5b97ec; --CH:#ef7a4c; --CN:#33b98a; --MT:#e7aa2a;
  --bad:#ec6a6a; --mid:#e7aa2a; --good:#3cc187;
  --bad-soft:rgba(236,106,106,.15); --mid-soft:rgba(231,170,42,.15); --good-soft:rgba(60,193,135,.15);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* faixa da marca */
.band{background:var(--brand);color:var(--brand-ink)}
.band .wrap{padding-block:18px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.band img{height:44px;width:auto;filter:brightness(0) invert(1);display:block}
.band .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.82;line-height:1.4}
.band .sep{width:1px;align-self:stretch;background:rgba(255,255,255,.28)}
.tema{margin-left:auto;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:var(--brand-ink);border-radius:99px;padding:7px 14px 7px 10px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.tema:hover{background:rgba(255,255,255,.2)}
.tema:focus-visible{outline-color:#fff}
.tema svg{width:16px;height:16px;flex:none}
@media (max-width:520px){.band img{height:34px}.band .sep{display:none}.band .tag{order:3;flex-basis:100%}}

h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* HOME */
.hero{padding-block:28px 8px;display:grid;gap:10px}
.hero h1{font-size:clamp(30px,5vw,46px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.hero p{margin:0;color:var(--ink-2);max-width:62ch}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:6px}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.1}
.stats span{font-size:13px;color:var(--muted)}

.areas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding-block:22px 10px}
@media (max-width:680px){.areas{grid-template-columns:1fr}}
.area{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;display:grid;gap:12px;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s}
.area:hover{transform:translateY(-2px);border-color:var(--c)}
.area .top{display:flex;align-items:flex-start;gap:12px}
.area .code{font-family:var(--mono);font-weight:600;font-size:13px;letter-spacing:.06em;color:#fff;background:var(--c);border-radius:8px;width:42px;height:42px;display:grid;place-items:center;flex:none}
.area h2{font-size:22px;font-weight:700;line-height:1.15}
.area .sub{font-size:13.5px;color:var(--muted)}
.area ol{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:14px;color:var(--ink-2)}
.area ol li{display:flex;gap:8px;align-items:baseline;min-width:0}
.area ol li span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.area ol li .num{font-size:12px;color:var(--muted);flex:none}
.prog{display:grid;gap:6px}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.bar i{display:block;height:100%}
.bar .g{background:var(--good)} .bar .m{background:var(--mid)} .bar .b{background:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.legend em{font-style:normal;display:inline-flex;align-items:center;gap:6px}
.legend em::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--dot)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between;margin-block:6px 0}
.panel p{margin:0;color:var(--ink-2);min-width:0;flex:1 1 280px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding-block:22px 8px}
@media (max-width:680px){.how{grid-template-columns:1fr}}
.how div{display:grid;gap:4px;font-size:14.5px;color:var(--ink-2)}
.how b{font-family:var(--display);font-size:16px;color:var(--ink)}

footer{padding-block:28px 40px;color:var(--muted);font-size:13px;display:grid;gap:10px}
footer p{margin:0;max-width:80ch}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;color:var(--muted);font-size:13px}
.linkbtn.danger{color:var(--bad)}

/* ÁREA */
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--ink-2);font-weight:600;font-size:14.5px}
.back:hover{color:var(--ink)}
.ahead{padding-block:22px 6px;display:grid;gap:10px}
.ahead h1{font-size:clamp(28px,4.4vw,40px);font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:12px}
.ahead h1 .code{font-family:var(--mono);font-size:14px;color:#fff;background:var(--c);border-radius:8px;padding:6px 9px;font-weight:600;letter-spacing:.06em}
.ahead p{margin:0;color:var(--ink-2);max-width:66ch}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-block:12px 4px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:14px;font-weight:600;color:var(--ink-2)}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--page);border-color:var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding-block:10px;font-size:14px;color:var(--ink-2)}
.tools label{display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.tools select{font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.tools .grow{flex:1}
.topics{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.trow{display:grid;grid-template-columns:auto minmax(0,1fr) 150px 64px;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}
.trow:first-child{border-top:0}
.trow:hover{background:var(--brand-soft)}
.trow input{width:18px;height:18px;accent-color:var(--brand);margin:0}
.tname{min-width:0;display:grid;gap:2px}
.tname b{font-weight:600;font-size:15px;line-height:1.3}
.tname small{color:var(--muted);font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.trend{font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:99px;letter-spacing:.02em}
.trend.up{background:var(--good-soft);color:var(--good)}
.trend.down{background:var(--bad-soft);color:var(--bad)}
.freq{display:grid;gap:4px}
.freq .num{font-size:12.5px;color:var(--ink-2)}
.freq .track{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.freq .track i{display:block;height:100%;background:var(--c);border-radius:99px}
.tprog{font-family:var(--mono);font-size:12.5px;color:var(--muted);text-align:right}
.tprog.done{color:var(--good);font-weight:600}
@media (max-width:640px){
  .trow{grid-template-columns:auto minmax(0,1fr) 54px;gap:10px;padding:12px}
  .freq{grid-column:2/4;grid-row:2}
}
.dhead{padding:9px 16px;background:var(--surface-2);font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.dhead:first-child{border-top:0}
.startbar{position:sticky;bottom:0;z-index:5;margin-top:14px;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--page) 70%,transparent)}
.startbar .inner{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 16px;box-shadow:var(--shadow)}
.startbar .info{font-size:14.5px;color:var(--ink-2);min-width:0}
.startbar .info b{color:var(--ink)}

/* ESTUDO */
.sbar{display:flex;align-items:center;gap:14px;padding-block:18px 10px}
.sbar .count{margin-left:auto;font-size:13px;color:var(--muted)}
.sprog{height:4px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.sprog i{display:block;height:100%;background:var(--c);transition:width .25s ease}
.stage{padding-block:18px 8px;perspective:1600px}
.card{position:relative;width:100%;max-width:720px;margin:0 auto;display:grid;cursor:pointer;-webkit-tap-highlight-color:transparent}
.card .inner{display:grid;transition:transform .5s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:22px 24px 20px;display:flex;flex-direction:column;gap:14px;min-height:340px;min-width:0}
.face.back{transform:rotateY(180deg)}
@media (prefers-reduced-motion: reduce){
  .card .inner{transition:none}
  .card.flipped .inner{transform:none}
  .face.back{transform:none}
  .card:not(.flipped) .face.back,.card.flipped .face.front{visibility:hidden}
}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:12.5px;color:var(--muted)}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
.chip.area{background:var(--c);color:#fff}
.chip.k-pegadinha{background:var(--bad-soft);color:var(--bad)}
.chip.k-fórmula{background:var(--brand-soft);color:var(--brand)}
:root[data-theme="dark"] .chip.k-fórmula{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.k-fórmula{color:var(--ink)}}
.chip.k-aplicação{background:var(--good-soft);color:var(--good)}
.topicline{font-size:13.5px;color:var(--ink-2);line-height:1.35}
.front .q{font-family:var(--display);font-weight:700;font-size:clamp(21px,3.2vw,28px);line-height:1.25;letter-spacing:-.01em;margin:auto 0;padding-block:10px;text-wrap:balance}
.front .hint{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.back .qmini{font-size:14px;color:var(--muted);line-height:1.35}
.back .a{font-size:18px;line-height:1.55}
.back .a b{font-weight:700}
.tip{border-radius:10px;background:var(--mid-soft);padding:10px 12px;font-size:14.5px;color:var(--ink);display:grid;gap:2px}
.tip .eyebrow{color:var(--mid)}
.ref{margin-top:auto;border-top:1px dashed var(--line);padding-top:12px;display:grid;gap:6px;font-size:13.5px;color:var(--ink-2)}
.ref .row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.lvl{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:720px;margin:16px auto 0}
.rate button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 8px;display:grid;gap:2px;justify-items:center;font-weight:700;font-size:15.5px}
.rate button small{font-weight:400;font-size:12px;color:var(--muted)}
.rate .r0{border-color:var(--bad);color:var(--bad)} .rate .r0:hover{background:var(--bad-soft)}
.rate .r1{border-color:var(--mid);color:var(--mid)} .rate .r1:hover{background:var(--mid-soft)}
.rate .r2{border-color:var(--good);color:var(--good)} .rate .r2:hover{background:var(--good-soft)}
.flipbtn{display:flex;justify-content:center;margin-top:16px}
.keys{text-align:center;font-size:12px;color:var(--muted);padding-block:14px 30px}
@media (hover:none){.keys{display:none}}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}

/* FIM */
.done{max-width:620px;margin:0 auto;padding-block:36px 40px;display:grid;gap:18px;text-align:center;justify-items:center}
.done h2{font-size:clamp(26px,4vw,34px);font-weight:800}
.done p{margin:0;color:var(--ink-2)}
.tally{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.tally div{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 8px;display:grid;gap:2px}
.tally b{font-family:var(--display);font-size:30px;line-height:1}
.tally span{font-size:13px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
</style>

<script type="application/json" id="data">{"cards":[{"id":"LC-001","a":"LC","d":"Português e Artes","t":"Literatura: prosa, conto, romance e crônica","k":"conceito","f":"Quais são os traços que definem a crônica?","v":"Texto curto, publicado originalmente em jornal/revista, que parte de um <b>fato cotidiano<\/b> para uma reflexão pessoal, em tom leve, coloquial, muitas vezes humorístico ou lírico. Fica na fronteira entre jornalismo e literatura.","x":"O ENEM pede para reconhecer o gênero pelo flagrante do cotidiano + subjetividade do cronista, não pelo tamanho do texto.","r":"ENEM 2025 · Q7 — Características do gênero crônica","h":"H1","q":590},{"id":"LC-002","a":"LC","d":"Português e Artes","t":"Literatura: prosa, conto, romance e crônica","k":"aplicação","f":"Quando uma crônica incorpora outro gênero (bilhete, carta, receita), qual efeito o ENEM costuma cobrar?","v":"É <b>intergenericidade<\/b> (hibridismo de gêneros): a forma de um gênero é usada com a função de outro. O efeito é expressivo — aproxima o leitor, cria humor ou intimidade — sem deixar de ser crônica.","x":"A resposta certa fala do efeito de sentido criado pela mistura, não de 'erro' de gênero.","r":"ENEM 2025 · Q6 — O gênero bilhete na crônica","h":"H4","q":549},{"id":"LC-003","a":"LC","d":"Português e Artes","t":"Literatura: prosa, conto, romance e crônica","k":"conceito","f":"Qual a diferença essencial entre conto e romance?","v":"O <b>conto<\/b> é narrativa curta, com conflito único, poucas personagens e unidade de efeito. O <b>romance<\/b> é longo, com vários núcleos de conflito, tempo e espaço amplos e personagens complexas.","x":"Questões sobre gêneros narrativos curtos cobram a concisão e o foco num único conflito.","r":"ENEM 2025 · Q32 — Conto e outros gêneros narrativos curtos","h":"H29","q":650},{"id":"LC-004","a":"LC","d":"Português e Artes","t":"Literatura: prosa, conto, romance e crônica","k":"aplicação","f":"Em Machado de Assis ('Esaú e Jacó', 'Dom Casmurro'), qual recurso de narração o ENEM mais cobra?","v":"O <b>narrador intruso/irônico<\/b>, que conversa com o leitor, comenta a própria narrativa e deixa ambiguidades. Em 'Esaú e Jacó', o narrador (Conselheiro Aires) observa as personagens com distanciamento irônico.","x":"Desconfie de alternativas que tratam o narrador machadiano como neutro ou objetivo.","r":"ENEM 2024 · Q31 — Narrador e personagem ('Esaú e Jacó')","h":"H15","q":707},{"id":"LC-005","a":"LC","d":"Português e Artes","t":"Literatura: prosa, conto, romance e crônica","k":"conceito","f":"Que traço romântico aparece em 'Senhora' (José de Alencar)?","v":"Idealização do amor, que acaba vencendo o interesse; mas o romance também <b>critica o casamento por dinheiro<\/b> na sociedade burguesa do Rio (Aurélia 'compra' Fernando Seixas).","x":"O ENEM gosta da tensão entre idealização amorosa e crítica social no romance urbano de Alencar.","r":"ENEM 2024 · Q35 — Amor e idealização ('Senhora')","h":"H15","q":461},{"id":"LC-006","a":"LC","d":"Português e Artes","t":"Literatura: prosa, conto, romance e crônica","k":"conceito","f":"O que caracteriza o regionalismo de 30 (Graciliano, Rachel de Queiroz, José Lins do Rego)?","v":"Prosa neorrealista de <b>denúncia social<\/b>: seca, migração, latifúndio, engenho de cana, opressão do trabalhador nordestino. José Lins do Rego retrata a decadência dos engenhos (ciclo da cana-de-açúcar).","x":"Itens sobre migração e universo canavieiro pedem relacionar a obra ao contexto social, não só ao enredo.","r":"ENEM 2025 · Q29 — O universo canavieiro na prosa","h":"H17","q":607},{"id":"LC-007","a":"LC","d":"Português e Artes","t":"Literatura: prosa, conto, romance e crônica","k":"aplicação","f":"Como Guimarães Rosa representa o sertão e a fala sertaneja?","v":"Recria a oralidade sertaneja com <b>neologismos<\/b>, sintaxe inventiva e regionalismos, transformando o sertão em espaço universal ('o sertão é o mundo'). O diálogo e o monólogo (Riobaldo) são centrais.","x":"A linguagem 'estranha' é recurso estético intencional — não é erro nem simples registro regional.","r":"ENEM PPL 2025 · Q22 — Diálogo e sertão na narrativa","h":"H16","q":560},{"id":"LC-008","a":"LC","d":"Português e Artes","t":"Literatura: prosa, conto, romance e crônica","k":"aplicação","f":"Narrativas que tratam de religiosidade afro-brasileira e saberes de comunidade costumam cobrar o quê?","v":"A <b>valorização de identidades e saberes<\/b> historicamente marginalizados (candomblé, oralidade, ancestralidade), entendendo a literatura como espaço de representação e resistência cultural.","x":"Evite alternativas que leem esses elementos como exotismo ou folclore; o foco é pertencimento e memória.","r":"ENEM PPL 2025 · Q45 — Religiosidade afro-brasileira na narrativa","h":"H17","q":652},{"id":"LC-009","a":"LC","d":"Português e Artes","t":"Literatura: prosa, conto, romance e crônica","k":"pegadinha","f":"Narrador-personagem x narrador-observador: como distinguir rapidamente?","v":"<b>Narrador-personagem<\/b>: narra em 1ª pessoa e participa da história (visão limitada). <b>Observador<\/b>: 3ª pessoa, sem participar. <b>Onisciente<\/b>: 3ª pessoa que conhece pensamentos e sentimentos das personagens.","x":"A 1ª pessoa nem sempre é o protagonista — pode ser um personagem secundário que testemunha.","r":"ENEM 2024 · Q19 — Descoberta e sentimento na narrativa","h":"H15","q":573},{"id":"LC-010","a":"LC","d":"Português e Artes","t":"Tecnologias da informação, gêneros digitais e redes sociais","k":"conceito","f":"O que é o podcast e por que o ENEM o relaciona ao rádio?","v":"Programa em áudio, <b>sob demanda<\/b>, distribuído pela internet. Herda a linguagem oral do rádio, mas o ouvinte escolhe quando e o que ouvir, e qualquer pessoa pode produzir (descentralização).","x":"A palavra-chave das alternativas corretas costuma ser 'autonomia do ouvinte' ou 'convergência de mídias'.","r":"ENEM 2025 · Q39 — Do rádio ao podcast","h":"H30","q":537},{"id":"LC-011","a":"LC","d":"Português e Artes","t":"Tecnologias da informação, gêneros digitais e redes sociais","k":"conceito","f":"Novas tecnologias substituem as antigas? Como o ENEM costuma tratar isso?","v":"Em geral, <b>não há substituição total<\/b>: as tecnologias convivem e se reconfiguram (escrita manuscrita e digital, livro e e-book, rádio e podcast). O novo meio altera práticas de leitura e escrita.","x":"Alternativas com 'eliminou', 'tornou obsoleto' ou generalizações absolutas costumam estar erradas.","r":"ENEM 2025 · Q9 — Novas e velhas tecnologias da escrita","h":"H30","q":604},{"id":"LC-012","a":"LC","d":"Português e Artes","t":"Tecnologias da informação, gêneros digitais e redes sociais","k":"aplicação","f":"Que função os emojis assumem na comunicação digital?","v":"Funcionam como <b>recursos multimodais<\/b> que suprem gestos e entonação da fala, marcam atitude/afetividade e podem ganhar novos sentidos conforme o grupo (ex.: usos irônicos pela geração Z).","x":"O sentido do emoji é social e variável — não é fixo como um dicionário.","r":"ENEM PPL 2025 · Q14 — Novos usos dos emojis (geração Z)","h":"H29","q":604},{"id":"LC-013","a":"LC","d":"Português e Artes","t":"Tecnologias da informação, gêneros digitais e redes sociais","k":"conceito","f":"O que são fake news e qual competência o ENEM espera do leitor diante delas?","v":"Informações falsas produzidas para parecer notícia e circular em redes. Espera-se <b>leitura crítica<\/b>: checar fonte, data, autoria e intenção; memes também podem desinformar.","x":"Itens sobre desinformação valorizam a checagem e o letramento digital, não a censura das redes.","r":"ENEM 2024 · Q45 — Memes e desinformação na educação","h":"H4","q":499},{"id":"LC-014","a":"LC","d":"Português e Artes","t":"Tecnologias da informação, gêneros digitais e redes sociais","k":"aplicação","f":"Qual o principal risco social apontado em textos sobre aplicativos de rastreamento e controle parental?","v":"Tensão entre <b>segurança e privacidade/autonomia<\/b>: o monitoramento pode proteger, mas também vigiar e invadir a intimidade.","x":"O ENEM costuma premiar a alternativa que reconhece a ambivalência da tecnologia.","r":"ENEM PPL 2024 · Q30 — Aplicativos de rastreamento e controle parental","h":"H30","q":645},{"id":"LC-015","a":"LC","d":"Português e Artes","t":"Tecnologias da informação, gêneros digitais e redes sociais","k":"conceito","f":"Algoritmos e redes sociais: o que é 'bolha' ou câmara de eco?","v":"O algoritmo mostra conteúdos semelhantes ao que o usuário já consome, <b>reforçando opiniões<\/b> e reduzindo o contato com o diferente — o que favorece polarização e circulação de boatos.","x":"Relacione redes a impactos sociais (comportamento, fofoca, exposição), não só a vantagens técnicas.","r":"ENEM PPL 2025 · Q31 — Impactos sociais das tecnologias","h":"H28","q":493},{"id":"LC-016","a":"LC","d":"Português e Artes","t":"Tecnologias da informação, gêneros digitais e redes sociais","k":"aplicação","f":"Telemedicina e serviços digitais: que ponto o ENEM costuma destacar?","v":"Ampliam o acesso (distância, tempo), mas dependem de <b>inclusão digital<\/b>; a desigualdade de acesso à internet pode excluir parte da população.","x":"Tecnologia + cidadania é combinação frequente; procure a alternativa que fala de acesso/inclusão.","r":"ENEM 2024 · Q15 — Telemedicina e acesso","h":"H30","q":546},{"id":"LC-017","a":"LC","d":"Português e Artes","t":"Tecnologias da informação, gêneros digitais e redes sociais","k":"pegadinha","f":"O corretor ortográfico garante um texto adequado?","v":"Não. Ele corrige grafia, mas <b>não avalia sentido, adequação ao contexto, coesão nem registro<\/b>; pode até sugerir palavras erradas para o contexto.","x":"O ENEM usa o corretor para discutir os limites da tecnologia e o papel do escritor.","r":"ENEM PPL 2024 · Q24 — O corretor ortográfico","h":"H29","q":481},{"id":"LC-018","a":"LC","d":"Português e Artes","t":"Tecnologias da informação, gêneros digitais e redes sociais","k":"aplicação","f":"Influenciadores e representatividade nas redes: qual a leitura esperada?","v":"As redes podem dar <b>visibilidade a grupos sub-representados<\/b> (ex.: influenciadores negros), mas o alcance é desigual e mediado por algoritmos e racismo estrutural.","x":"Questões desse tipo cruzam tecnologia com cidadania e diversidade.","r":"ENEM 2024 · Q17 — Influenciadores negros e alcance nas redes","h":"H23","q":497},{"id":"LC-019","a":"LC","d":"Português e Artes","t":"Variação linguística, norma e preconceito linguístico","k":"conceito","f":"Quais são os tipos de variação linguística?","v":"<b>Diatópica<\/b> (regional), <b>diastrática<\/b> (social/grupo), <b>diafásica<\/b> (situação — formal/informal), <b>diacrônica<\/b> (histórica/tempo) e diamésica (fala x escrita).","x":"O ENEM raramente pede o nome técnico; pede identificar a marca de variação no texto e seu efeito.","r":"ENEM 2024 · Q6 — Expressões regionais do Amazonas","h":"H20","q":517},{"id":"LC-020","a":"LC","d":"Português e Artes","t":"Variação linguística, norma e preconceito linguístico","k":"conceito","f":"O que é preconceito linguístico?","v":"Discriminação de pessoas pela forma como falam, tratando variedades populares ou regionais como 'erradas'. Para a linguística, <b>toda variedade é sistemática<\/b>; existe adequação ou inadequação à situação, não 'certo/errado'.","x":"Alternativa que diz que a variedade popular é 'pobre' ou 'deturpada' é sempre a errada.","r":"ENEM 2024 · Q12 — A Língua da Tabatinga (variação estigmatizada)","h":"H20","q":530},{"id":"LC-021","a":"LC","d":"Português e Artes","t":"Variação linguística, norma e preconceito linguístico","k":"conceito","f":"Norma-padrão x norma culta: qual a diferença?","v":"<b>Norma-padrão<\/b>: modelo idealizado, prescrito pelas gramáticas. <b>Norma culta<\/b>: usos reais de falantes escolarizados em situações monitoradas. A norma culta varia e nem sempre segue a padrão.","x":"O ENEM valoriza a ideia de adequação: usar o registro que a situação comunicativa pede.","r":"ENEM PPL 2025 · Q43 — O e-mail na comunicação institucional","h":"H27","q":565},{"id":"LC-022","a":"LC","d":"Português e Artes","t":"Variação linguística, norma e preconceito linguístico","k":"aplicação","f":"Linguagem jurídica rebuscada ou jargão corporativo: o que o ENEM costuma cobrar?","v":"Que o <b>jargão<\/b> (vocabulário técnico de um grupo profissional) cria identidade e precisão no grupo, mas pode <b>excluir<\/b> quem está de fora e dificultar o acesso à informação/direitos.","x":"Procure a alternativa que liga o jargão a restrição de acesso ou à marca de grupo.","r":"ENEM 2025 · Q42 — Linguagem jurídica rebuscada","h":"H25","q":573},{"id":"LC-023","a":"LC","d":"Português e Artes","t":"Variação linguística, norma e preconceito linguístico","k":"aplicação","f":"Por que canções em variedade popular ('nós vai', 'a gente fomos') aparecem no ENEM?","v":"Para mostrar que o uso de uma variedade não padrão é um <b>recurso expressivo intencional<\/b>: aproxima da oralidade, constrói identidade e legitimidade da voz popular.","x":"O desvio da norma em texto artístico é escolha estética, não falta de conhecimento.","r":"ENEM PPL 2025 · Q41 — Variedade popular na canção ('Andar com fé')","h":"H26","q":490},{"id":"LC-024","a":"LC","d":"Português e Artes","t":"Variação linguística, norma e preconceito linguístico","k":"conceito","f":"O que é o talian e o que ele exemplifica?","v":"Variedade de base vêneta falada por descendentes de imigrantes italianos no Sul do Brasil, reconhecida como patrimônio. Exemplifica o <b>multilinguismo brasileiro<\/b> e a língua como herança cultural.","x":"O Brasil não é monolíngue: há línguas indígenas, de imigração, de sinais (Libras) e afro-brasileiras.","r":"ENEM PPL 2025 · Q27 — O talian (dialeto vêneto brasileiro)","h":"H20","q":522},{"id":"LC-025","a":"LC","d":"Português e Artes","t":"Variação linguística, norma e preconceito linguístico","k":"aplicação","f":"Qual a importância de textos sobre línguas indígenas (ex.: tukano) no ENEM?","v":"Mostram a <b>diversidade linguística<\/b> do país, a ameaça de extinção dessas línguas e o papel de tecnologias, escolas e registros na sua revitalização e na afirmação identitária.","x":"Associe língua a identidade e direito cultural.","r":"ENEM 2024 · Q34 — Tecnologia e línguas indígenas (tukano)","h":"H28","q":624},{"id":"LC-026","a":"LC","d":"Português e Artes","t":"Variação linguística, norma e preconceito linguístico","k":"pegadinha","f":"Transcrever a fala espontânea por escrito: quais marcas indicam oralidade?","v":"Marcadores conversacionais (<i>né, tipo, aí, então<\/i>), repetições, hesitações, frases fragmentadas, reduções ('tá', 'pra'). São <b>próprios da fala<\/b> e não indicam incompetência.","x":"Item comum: identificar no trecho qual marca revela que o texto foi produzido oralmente.","r":"ENEM 2025 · Q36 — Transcrição de fala (relato de filme)","h":"H26","q":601},{"id":"LC-027","a":"LC","d":"Português e Artes","t":"Artes visuais, artes plásticas e patrimônio artístico","k":"conceito","f":"Quais as características centrais da Semana de Arte Moderna (1922) e do Modernismo nas artes visuais?","v":"Ruptura com o academicismo, influência das <b>vanguardas europeias<\/b> (cubismo, expressionismo, futurismo) e busca de uma arte brasileira (Tarsila, Anita Malfatti, Di Cavalcanti; Antropofagia).","x":"O ENEM relaciona obra e contexto: experimentação formal + identidade nacional.","r":"ENEM 2024 · Q25 — Pintura de Eliseu Visconti","h":"H13","q":616},{"id":"LC-028","a":"LC","d":"Português e Artes","t":"Artes visuais, artes plásticas e patrimônio artístico","k":"conceito","f":"O que o ENEM entende por arte popular?","v":"Produção de artistas não acadêmicos, ligada a comunidades e tradições locais (bordado, cerâmica, xilogravura, entalhe), que expressa <b>saberes e identidade coletiva<\/b> e é patrimônio cultural.","x":"Não trate arte popular como 'menor' ou 'artesanato sem valor' — essa é a alternativa errada.","r":"ENEM 2025 · Q22 — Arte popular (Ilha do Ferro)","h":"H12","q":528},{"id":"LC-029","a":"LC","d":"Português e Artes","t":"Artes visuais, artes plásticas e patrimônio artístico","k":"aplicação","f":"Adriana Varejão e a arte contemporânea que dialoga com a história: o que se cobra?","v":"A <b>releitura crítica<\/b> da história colonial (azulejaria portuguesa, corpo, violência da colonização), usando materiais e referências históricas para questionar narrativas oficiais.","x":"Arte contemporânea no ENEM = conceito e crítica social mais do que técnica.","r":"ENEM 2025 · Q23 — Arte e história visual (Adriana Varejão)","h":"H14","q":601},{"id":"LC-030","a":"LC","d":"Português e Artes","t":"Artes visuais, artes plásticas e patrimônio artístico","k":"conceito","f":"Como a arte afro-brasileira é tratada nas questões do ENEM?","v":"Como produção que afirma <b>identidade, ancestralidade e resistência<\/b> negra, rompendo com a visão eurocêntrica de arte; o conceito é debatido (autoria negra x temática africana).","x":"Fique atento a alternativas que reduzem a arte afro-brasileira a folclore ou religião.","r":"ENEM 2024 · Q16 — Conceito de arte afro-brasileira","h":"H13","q":561},{"id":"LC-031","a":"LC","d":"Português e Artes","t":"Artes visuais, artes plásticas e patrimônio artístico","k":"aplicação","f":"O que é diálogo entre obras (intertextualidade/interdiscursividade) nas artes?","v":"Quando uma obra retoma outra (tema, forma, estilo): ex.: Modigliani inspirado na escultura cicládica; Portinari e Graciliano tratando da seca e dos retirantes.","x":"O ENEM pede o ponto em comum entre as obras (tema ou procedimento), não só a descrição de cada uma.","r":"ENEM 2024 · Q30 — Diálogo entre Graciliano e Portinari","h":"H22","q":599},{"id":"LC-032","a":"LC","d":"Português e Artes","t":"Artes visuais, artes plásticas e patrimônio artístico","k":"conceito","f":"O que é solarigrafia e por que ela é exemplo de arte contemporânea?","v":"Técnica fotográfica de longa exposição com câmera artesanal (pinhole), que registra o percurso do Sol durante meses. Mostra a arte contemporânea valorizando <b>processo, tempo e experimentação<\/b>.","x":"Questões sobre técnicas inusitadas pedem a relação entre processo e efeito estético.","r":"ENEM 2024 · Q43 — Solarigrafia (Regina Valkenborgh)","h":"H12","q":550},{"id":"LC-033","a":"LC","d":"Português e Artes","t":"Artes visuais, artes plásticas e patrimônio artístico","k":"aplicação","f":"Escultura abstrata (ex.: Tomie Ohtake): como interpretar?","v":"A abstração não representa objetos reconhecíveis; explora <b>forma, cor, curva, espaço e movimento<\/b>, convidando o espectador a uma experiência sensorial.","x":"Não procure 'figura escondida': o ENEM pede os elementos formais da obra.","r":"ENEM PPL 2025 · Q9 — Escultura de Tomie Ohtake","h":"H12","q":569},{"id":"LC-034","a":"LC","d":"Português e Artes","t":"Publicidade, campanhas e textos multimodais","k":"conceito","f":"O que diferencia campanha (propaganda institucional) de publicidade comercial?","v":"<b>Publicidade<\/b> vende produto/serviço; <b>campanha/propaganda institucional<\/b> busca mudar comportamento ou divulgar ideia de interesse público (saúde, trânsito, violência).","x":"Identifique o objetivo: comprar algo ou adotar uma atitude.","r":"ENEM 2025 · Q24 — Campanha do UNICEF","h":"H2","q":563},{"id":"LC-035","a":"LC","d":"Português e Artes","t":"Publicidade, campanhas e textos multimodais","k":"conceito","f":"Que recursos linguísticos são típicos de anúncios e campanhas?","v":"<b>Verbos no imperativo<\/b>, vocativo, 2ª pessoa (você), slogans curtos, perguntas retóricas, jogos de palavras e relação texto-imagem (função apelativa/conativa).","x":"O imperativo e o 'você' são pistas de função conativa — muito cobrada.","r":"ENEM 2025 · Q33 — Campanha social (TJDFT)","h":"H2","q":521},{"id":"LC-036","a":"LC","d":"Português e Artes","t":"Publicidade, campanhas e textos multimodais","k":"aplicação","f":"Em um texto multimodal, como a imagem se relaciona com o verbal?","v":"Os dois modos se <b>complementam<\/b>: a imagem pode reforçar, ilustrar, contradizer (ironia) ou completar o sentido do texto verbal. O sentido só é pleno na leitura conjunta.","x":"Questões de cartaz pedem o efeito produzido pela articulação verbo-visual.","r":"ENEM 2024 · Q33 — Cartaz da Defesa Civil (enchentes)","h":"H21","q":421},{"id":"LC-037","a":"LC","d":"Português e Artes","t":"Publicidade, campanhas e textos multimodais","k":"conceito","f":"O que é o Maio Amarelo e que recurso visual a campanha usa?","v":"Movimento de conscientização para a <b>segurança no trânsito<\/b>. O laço/selo amarelo remete ao sinal de atenção do semáforo — símbolo que sintetiza a mensagem.","x":"Símbolos e cores de campanhas têm motivação; o ENEM pergunta o que eles representam.","r":"ENEM 2023 · Q11 — Campanha 'Maio Amarelo'","h":"H23","q":452},{"id":"LC-038","a":"LC","d":"Português e Artes","t":"Publicidade, campanhas e textos multimodais","k":"aplicação","f":"Charge, cartum e tirinha: qual a diferença?","v":"<b>Charge<\/b>: crítica a fato atual e datado (política, notícia). <b>Cartum<\/b>: humor crítico atemporal. <b>Tirinha<\/b>: sequência curta de quadrinhos, geralmente com personagens fixos e desfecho humorístico.","x":"Se depende de uma notícia específica para ser entendida, é charge.","r":"ENEM PPL 2025 · Q44 — Crítica ao esporte de alto rendimento (charge)","h":"H11","q":476},{"id":"LC-039","a":"LC","d":"Português e Artes","t":"Publicidade, campanhas e textos multimodais","k":"aplicação","f":"Adaptação de clássico (ex.: Os Lusíadas) para quadrinhos: o que o ENEM cobra?","v":"A <b>retextualização<\/b> para outra linguagem: a HQ condensa o texto e usa imagens, balões e sequência para tornar a obra acessível, mantendo elementos do original.","x":"Foque no que muda de linguagem (verbal → verbo-visual) e no objetivo de democratizar a leitura.","r":"ENEM PPL 2025 · Q7 — Adaptação de Os Lusíadas em quadrinhos","h":"H1","q":550},{"id":"LC-040","a":"LC","d":"Inglês","t":"Leitura e compreensão: ideia central, inferência e propósito","k":"aplicação","f":"Qual a estratégia mais eficiente para as questões de inglês do ENEM?","v":"Ler <b>primeiro o enunciado e as alternativas<\/b> (em português), depois o texto procurando a informação pedida (scanning). Use título, fonte, imagem e cognatos para inferir o contexto.","x":"Não é preciso traduzir o texto inteiro; a resposta depende da ideia central ou de um detalhe.","r":"ENEM 2025 · Q2 — Texto sobre filosofia","h":"H8","q":632},{"id":"LC-041","a":"LC","d":"Inglês","t":"Leitura e compreensão: ideia central, inferência e propósito","k":"conceito","f":"Skimming x scanning: o que é cada um?","v":"<b>Skimming<\/b>: leitura rápida para captar a ideia geral. <b>Scanning<\/b>: busca de informação específica (nome, data, número, palavra-chave).","x":"Comece com skimming para o tema e use scanning para checar a alternativa.","r":"ENEM 2024 · Q3 — Texto sobre natureza e design","h":"H8","q":567},{"id":"LC-042","a":"LC","d":"Inglês","t":"Leitura e compreensão: ideia central, inferência e propósito","k":"pegadinha","f":"Falsos cognatos que caem: <i>actually, pretend, push, library, college<\/i>?","v":"<i>Actually<\/i> = na verdade; <i>pretend<\/i> = fingir; <i>push<\/i> = empurrar; <i>library<\/i> = biblioteca; <i>college<\/i> = faculdade; <i>sensible<\/i> = sensato; <i>eventually<\/i> = finalmente.","x":"Alternativas com tradução 'parecida' costumam ser a armadilha.","r":"ENEM 2024 · Q5 — Carta em língua estrangeira","h":"H6","q":597},{"id":"LC-043","a":"LC","d":"Inglês","t":"Leitura e compreensão: ideia central, inferência e propósito","k":"aplicação","f":"Como interpretar cartuns e quadrinhos em inglês (ex.: Calvin and Hobbes)?","v":"Integre imagem + fala: o humor geralmente vem de uma <b>quebra de expectativa<\/b>, ironia ou crítica de comportamento. Identifique o que o personagem diz x o que a imagem mostra.","x":"A pergunta costuma ser sobre o efeito/crítica, não a tradução literal do balão.","r":"ENEM PPL 2025 · Q3 — Quadrinhos em língua estrangeira (Calvin)","h":"H5","q":570},{"id":"LC-044","a":"LC","d":"Inglês","t":"Leitura e compreensão: ideia central, inferência e propósito","k":"aplicação","f":"Em resenhas (review) em inglês, o que normalmente se pergunta?","v":"O <b>posicionamento do resenhista<\/b> (avaliação positiva/negativa) e o que a obra aborda. Adjetivos avaliativos (<i>powerful, moving, disappointing<\/i>) são pistas.","x":"Diferencie o que a obra conta do que o autor da resenha opina.","r":"ENEM PPL 2025 · Q1 — Resenha de memórias (Viola Davis)","h":"H6","q":563},{"id":"LC-045","a":"LC","d":"Inglês","t":"Leitura e compreensão: ideia central, inferência e propósito","k":"pegadinha","f":"Citações atribuídas a famosos (ex.: Einstein) em textos do ENEM costumam discutir o quê?","v":"A <b>autoria falsa<\/b> e a circulação de citações sem checagem na internet — leitura crítica de fontes.","x":"Leia o texto inteiro: a 'citação' pode estar sendo desmentida, não endossada.","r":"ENEM 2024 · Q1 — Citações atribuídas (Einstein)","h":"H7","q":622},{"id":"LC-046","a":"LC","d":"Português e Artes","t":"Música, canção e cultura popular","k":"aplicação","f":"Que leitura o ENEM faz do rap (ex.: Racionais MC's)?","v":"O rap é expressão da periferia que faz <b>denúncia social<\/b> (racismo, violência, desigualdade) e afirma identidade. Os Racionais ('Capítulo 4, versículo 3') são referência.","x":"A canção é lida como discurso crítico e como manifestação cultural legítima.","r":"ENEM 2024 · Q22 — Denúncia social no rap ('Capítulo 4, versículo 3')","h":"H22","q":682},{"id":"LC-047","a":"LC","d":"Português e Artes","t":"Música, canção e cultura popular","k":"conceito","f":"Qual a crítica presente em 'Ai, que saudades da Amélia' em leituras atuais?","v":"A canção idealiza a mulher submissa e resignada ('Amélia é que era mulher de verdade'); a leitura contemporânea a vê como <b>reprodução de papéis de gênero patriarcais<\/b>.","x":"O ENEM pede a representação da mulher, relacionando canção e contexto histórico.","r":"ENEM PPL 2025 · Q8 — Papel da mulher na canção ('Amélia')","h":"H22","q":560},{"id":"LC-048","a":"LC","d":"Português e Artes","t":"Música, canção e cultura popular","k":"conceito","f":"O que foi o Tropicalismo ('Alegria, alegria', Caetano Veloso)?","v":"Movimento de 1967-68 que misturou MPB, rock, guitarra elétrica e referências pop, com <b>colagem de imagens da cidade moderna<\/b> e crítica à ditadura e ao conservadorismo cultural.","x":"Em 'Alegria, alegria', o fluxo de imagens urbanas (bancas, notícias) é a marca cobrada.","r":"ENEM 2023 · Q18 — A cidade moderna na canção ('Alegria, alegria')","h":"H28","q":741},{"id":"LC-049","a":"LC","d":"Português e Artes","t":"Música, canção e cultura popular","k":"aplicação","f":"Festival de Parintins e manifestações populares: como o ENEM aborda?","v":"Como <b>patrimônio cultural imaterial<\/b>: festa do boi-bumbá (Garantido x Caprichoso) que une teatro, dança, música e lendas amazônicas, expressando identidade regional.","x":"Associe festas populares a identidade, tradição e reinvenção (espetacularização).","r":"ENEM 2024 · Q40 — Festival de Parintins (bumbá)","h":"H9","q":582},{"id":"LC-050","a":"LC","d":"Português e Artes","t":"Música, canção e cultura popular","k":"aplicação","f":"Instrumentos populares (pífano, viola, cavaquinho) aparecem em quais tipos de questão?","v":"Questões sobre <b>valorização da música tradicional<\/b> e de mestres populares (ex.: Zabé da Loca), sua transmissão oral e o preconceito contra expressões rurais/populares.","x":"A alternativa correta costuma reconhecer o valor cultural e a resistência dessas práticas.","r":"ENEM PPL 2025 · Q42 — Zabé da Loca e o pífano","h":"H13","q":562},{"id":"LC-051","a":"LC","d":"Português e Artes","t":"Educação Física: esporte, saúde e exercício","k":"conceito","f":"Qual a diferença entre luta e briga segundo a Educação Física escolar?","v":"<b>Luta<\/b> é prática corporal com regras, oponente, objetivo definido (imobilizar, desequilibrar, tocar) e respeito à integridade do outro. <b>Briga<\/b> é confronto sem regras, com intenção de ferir.","x":"Tema recorrente: a definição de luta como prática corporal sistematizada.","r":"ENEM 2025 · Q27 — A diferença entre briga e luta","h":"H9","q":496},{"id":"LC-052","a":"LC","d":"Português e Artes","t":"Educação Física: esporte, saúde e exercício","k":"conceito","f":"O que diferencia esporte de alto rendimento de esporte de participação/lazer?","v":"<b>Alto rendimento<\/b>: busca de resultados, competição, especialização, pressão e mercantilização. <b>Participação/lazer<\/b>: prazer, socialização, saúde e inclusão.","x":"O ENEM critica a lógica do rendimento quando ela gera exclusão, doping ou adoecimento.","r":"ENEM PPL 2024 · Q23 — Doping no esporte","h":"H9","q":536},{"id":"LC-053","a":"LC","d":"Português e Artes","t":"Educação Física: esporte, saúde e exercício","k":"aplicação","f":"Saúde mental no esporte (Naomi Osaka, Simone Biles): qual a abordagem cobrada?","v":"Reconhecer que atletas sofrem <b>pressão e adoecimento psíquico<\/b>; a saúde vai além do corpo físico, e o cuidado com a saúde mental é legítimo mesmo no alto rendimento.","x":"Conceito ampliado de saúde (física, mental e social) é a chave.","r":"ENEM 2024 · Q9 — Saúde mental no esporte (Naomi Osaka)","h":"H10","q":456},{"id":"LC-054","a":"LC","d":"Português e Artes","t":"Educação Física: esporte, saúde e exercício","k":"aplicação","f":"Mulheres no esporte: que tema o ENEM mais explora?","v":"A <b>desigualdade de gênero<\/b>: proibições históricas (o futebol feminino foi proibido no Brasil de 1941 a 1979), menor visibilidade, salários e patrocínio, e as conquistas de pioneiras como Maria Lenk.","x":"Liga esporte a cidadania e luta por direitos.","r":"ENEM PPL 2025 · Q6 — Mulheres nos Jogos Olímpicos (Maria Lenk)","h":"H9","q":568},{"id":"LC-055","a":"LC","d":"Português e Artes","t":"Educação Física: esporte, saúde e exercício","k":"conceito","f":"O que o ENEM entende por esporte inclusivo/paradesporto?","v":"Práticas adaptadas que garantem a participação de pessoas com deficiência, promovendo <b>inclusão, autonomia e combate ao capacitismo<\/b>.","x":"Valorize a ideia de adaptação das regras e do ambiente, não de 'superação heroica' individual.","r":"ENEM 2025 · Q12 — Programa Maré Inclusiva (paradesporto)","h":"H11","q":519},{"id":"LC-056","a":"LC","d":"Português e Artes","t":"Gêneros textuais e propósito comunicativo","k":"conceito","f":"Como identificar o gênero textual numa questão do ENEM?","v":"Observe <b>função social, suporte, interlocutores e estrutura<\/b>. Ex.: carta aberta (destinatário público, defesa de posição), editorial (opinião do veículo), bula (instruções técnicas).","x":"A função social (para que serve o texto) pesa mais que a forma.","r":"ENEM 2023 · Q17 — Editorial de revista (']cultura[')","h":"H27","q":560},{"id":"LC-057","a":"LC","d":"Português e Artes","t":"Gêneros textuais e propósito comunicativo","k":"conceito","f":"O que caracteriza uma carta aberta?","v":"Texto argumentativo dirigido a um destinatário, mas <b>publicado para toda a sociedade<\/b>, com o objetivo de expor um problema, reivindicar ou se posicionar publicamente.","x":"Diferente da carta pessoal, o objetivo é mobilizar a opinião pública.","r":"ENEM PPL 2025 · Q12 — Carta aberta a fãs (Caetano Veloso)","h":"H4","q":517},{"id":"LC-058","a":"LC","d":"Português e Artes","t":"Gêneros textuais e propósito comunicativo","k":"aplicação","f":"Crítica/resenha de série ou filme: qual o propósito comunicativo?","v":"<b>Avaliar<\/b> uma obra, combinando descrição/síntese com julgamento fundamentado, para orientar o público.","x":"Procure as marcas de avaliação (adjetivos, comparações) para achar o propósito.","r":"ENEM 2024 · Q23 — Crítica de série (Game of Thrones)","h":"H1","q":588},{"id":"LC-059","a":"LC","d":"Português e Artes","t":"Gêneros textuais e propósito comunicativo","k":"aplicação","f":"Textos normativos (leis) e instrucionais (bulas, guias): o que o ENEM pergunta?","v":"O <b>propósito<\/b> (regulamentar, orientar, prevenir) e a linguagem objetiva/impessoal; ex.: a Lei 10.639/2003 tornou obrigatório o ensino de História e Cultura Afro-Brasileira.","x":"Leis no ENEM aparecem para cobrar a finalidade social do texto.","r":"ENEM 2025 · Q13 — Lei sobre ensino de História e Cultura Afro-Brasileira","h":"H27","q":581},{"id":"LC-060","a":"LC","d":"Português e Artes","t":"Gêneros textuais e propósito comunicativo","k":"pegadinha","f":"Postagem institucional em rede social é que tipo de texto?","v":"Gênero digital de <b>divulgação<\/b> de órgão público/empresa, com linguagem mais próxima do cidadão, multimodal e com objetivo informativo ou de engajamento.","x":"O suporte digital não muda a função institucional; identifique quem fala e para quê.","r":"ENEM PPL 2023 · Q31 — Postagem institucional (Senado)","h":"H2","q":600},{"id":"LC-061","a":"LC","d":"Português e Artes","t":"Argumentação, tese e estratégias persuasivas","k":"conceito","f":"Quais são as principais estratégias argumentativas?","v":"Argumento de <b>autoridade<\/b> (especialista/pesquisa), <b>exemplificação<\/b>, dados estatísticos, comparação, causa e consequência, contra-argumentação (concessão + refutação), apelo emocional.","x":"O ENEM pede qual estratégia sustenta a tese — localize a tese primeiro.","r":"ENEM 2025 · Q44 — A importância de ler para crianças","h":"H24","q":566},{"id":"LC-062","a":"LC","d":"Português e Artes","t":"Argumentação, tese e estratégias persuasivas","k":"aplicação","f":"Quais marcas linguísticas revelam a opinião do autor?","v":"<b>Modalizadores<\/b> (certamente, talvez, é preciso), adjetivos e advérbios avaliativos, verbos de opinião, aspas irônicas, escolhas lexicais (ex.: 'invasão' x 'ocupação').","x":"Até um texto 'informativo' pode trazer opinião via escolha lexical.","r":"ENEM 2025 · Q10 — Marcas da opinião no texto","h":"H22","q":608},{"id":"LC-063","a":"LC","d":"Português e Artes","t":"Argumentação, tese e estratégias persuasivas","k":"conceito","f":"O que é 'escrevivência' (Conceição Evaristo)?","v":"Escrita que nasce da <b>vivência<\/b>, especialmente das mulheres negras: une experiência individual e coletiva, memória e denúncia.","x":"Conceito recorrente em Linguagens e Humanas; associe a autoria negra e feminina.","r":"ENEM PPL 2025 · Q39 — A Escrevivência (Conceição Evaristo)","h":"H22","q":543},{"id":"LC-064","a":"LC","d":"Português e Artes","t":"Argumentação, tese e estratégias persuasivas","k":"pegadinha","f":"Concessão: como reconhecer e qual seu efeito?","v":"Conectivos como <i>embora, ainda que, apesar de, mesmo que<\/i> admitem um argumento contrário para depois refutá-lo, <b>fortalecendo a tese<\/b> e mostrando equilíbrio.","x":"A ideia mais importante está na oração principal, não na concessiva.","r":"ENEM PPL 2025 · Q30 — A não neutralidade do professor","h":"H18","q":600},{"id":"LC-065","a":"LC","d":"Português e Artes","t":"Argumentação, tese e estratégias persuasivas","k":"aplicação","f":"Textos sobre padrões de beleza: qual a tese mais comum?","v":"A <b>crítica aos padrões estéticos impostos<\/b> pela mídia/indústria, que geram exclusão e sofrimento, e a defesa da diversidade dos corpos.","x":"O ENEM espera reconhecimento do caráter social (não natural) dos padrões.","r":"ENEM 2025 · Q35 — Padrões de beleza e crítica ao corpo","h":"H23","q":631},{"id":"LC-066","a":"LC","d":"Português e Artes","t":"Literatura: poesia e texto poético","k":"conceito","f":"O que é eu lírico?","v":"A <b>voz que fala no poema<\/b>, que não se confunde com o autor real. Ele expressa sentimentos e visões de mundo, podendo inclusive ter gênero ou idade diferentes do poeta.","x":"Nunca responda 'o autor sente…' quando a questão fala do eu lírico.","r":"ENEM 2025 · Q21 — Medos e expectativas na poesia","h":"H17","q":580},{"id":"LC-067","a":"LC","d":"Português e Artes","t":"Literatura: poesia e texto poético","k":"conceito","f":"Quais recursos sonoros o ENEM cobra na poesia?","v":"<b>Aliteração<\/b> (repetição de consoantes), <b>assonância<\/b> (de vogais), rima, ritmo, paronomásia e repetição (anáfora), que reforçam o sentido do poema.","x":"Pergunte-se: que efeito o som produz (movimento, tensão, musicalidade)?","r":"ENEM 2023 · Q13 — Lirismo amoroso na poesia ('Girassol da madrugada')","h":"H16","q":581},{"id":"LC-068","a":"LC","d":"Português e Artes","t":"Literatura: poesia e texto poético","k":"aplicação","f":"Poesia sobre o cotidiano: o que o ENEM espera que você perceba?","v":"Que o poema transforma <b>situações banais em matéria lírica<\/b>, revelando afeto, cuidado ou reflexão existencial nos pequenos gestos.","x":"A alternativa certa costuma falar da valorização do simples/cotidiano.","r":"ENEM 2024 · Q32 — Cotidiano e cuidado na poesia ('Marília acorda')","h":"H16","q":589},{"id":"LC-069","a":"LC","d":"Português e Artes","t":"Literatura: poesia e texto poético","k":"conceito","f":"O que é prosa poética?","v":"Texto em prosa (sem versos) que usa recursos da poesia: <b>ritmo, imagens, metáforas e subjetividade<\/b>. João do Rio e Clarice Lispector são exemplos frequentes.","x":"Não confunda forma (prosa) com linguagem (poética).","r":"ENEM PPL 2024 · Q11 — A rua na prosa poética (João do Rio)","h":"H16","q":641},{"id":"LC-070","a":"LC","d":"Português e Artes","t":"Literatura: poesia e texto poético","k":"aplicação","f":"Poesia que trata da memória da escravidão e do corpo negro: qual a leitura cobrada?","v":"<b>Resgate da memória<\/b> e denúncia da violência histórica, com afirmação de identidade e resistência (poetas negros contemporâneos).","x":"Relacione forma poética e posicionamento político do texto.","r":"ENEM 2023 · Q26 — Memória da escravidão na poesia","h":"H17","q":745},{"id":"LC-071","a":"LC","d":"Espanhol","t":"Leitura e compreensão: ideia central, inferência e propósito","k":"pegadinha","f":"Falsos amigos do espanhol que mais derrubam: <i>exquisito, embarazada, oficina, rato, polvo<\/i>?","v":"<i>Exquisito<\/i> = delicioso; <i>embarazada<\/i> = grávida; <i>oficina<\/i> = escritório; <i>rato<\/i> = momento/instante; <i>polvo<\/i> = poeira; <i>borrar<\/i> = apagar; <i>apellido<\/i> = sobrenome; <i>todavía<\/i> = ainda.","x":"A palavra 'parecida' com o português costuma ser a armadilha das alternativas.","r":"ENEM 2024 · Q1 — Texto sobre a cultura do cancelamento","h":"H7","q":622},{"id":"LC-072","a":"LC","d":"Espanhol","t":"Leitura e compreensão: ideia central, inferência e propósito","k":"pegadinha","f":"Conectores do espanhol: o que significam <i>sin embargo, aunque, pues, ya que, además<\/i>?","v":"<i>Sin embargo<\/i> = no entanto; <i>aunque<\/i> = embora; <i>pues/ya que<\/i> = pois/já que; <i>además<\/i> = além disso; <i>es decir<\/i> = ou seja; <i>a pesar de<\/i> = apesar de.","x":"Conectores revelam a progressão do argumento — essenciais para achar a ideia central.","r":"ENEM 2023 · Q4 — Texto argumentativo em língua estrangeira","h":"H5","q":586},{"id":"LC-073","a":"LC","d":"Espanhol","t":"Leitura e compreensão: ideia central, inferência e propósito","k":"aplicação","f":"Que temas predominam nos textos de espanhol do ENEM?","v":"Temas sociais e culturais da América Latina e Espanha: <b>línguas originárias<\/b>, direitos das crianças, bullying, lixo eletrônico, mulheres e mídia, identidade.","x":"A pergunta costuma ser a finalidade do texto ou a ideia central, não gramática.","r":"ENEM PPL 2024 · Q5 — Texto sobre línguas originárias","h":"H6","q":507},{"id":"LC-074","a":"LC","d":"Espanhol","t":"Leitura e compreensão: ideia central, inferência e propósito","k":"aplicação","f":"Como lidar com uma palavra desconhecida num texto em espanhol?","v":"Inferir pelo <b>contexto<\/b> e pela formação da palavra (radical semelhante ao português), sem travar. Muitas vezes a questão não depende dela.","x":"Volte ao enunciado: a resposta quase sempre está na ideia geral do parágrafo.","r":"ENEM PPL 2025 · Q2 — Texto sobre bullying","h":"H6","q":485},{"id":"LC-075","a":"LC","d":"Português e Artes","t":"Figuras de linguagem, ironia e humor","k":"conceito","f":"O que é ironia e como reconhecê-la?","v":"Dizer o <b>contrário do que se pensa<\/b> ou criar contraste entre o dito e a situação, com intenção crítica ou humorística. Pistas: exagero, aspas, elogio absurdo, incoerência com o contexto.","x":"Ironia é a figura mais cobrada em crônicas e charges do ENEM.","r":"ENEM PPL 2024 · Q6 — Ironia sobre a padronização","h":"H18","q":523},{"id":"LC-076","a":"LC","d":"Português e Artes","t":"Figuras de linguagem, ironia e humor","k":"conceito","f":"Metáfora x comparação x metonímia?","v":"<b>Comparação<\/b>: aproximação com conectivo (como, feito). <b>Metáfora<\/b>: aproximação sem conectivo ('a vida é um quebra-cabeça'). <b>Metonímia<\/b>: substituição por contiguidade (autor pela obra, parte pelo todo).","x":"No ENEM, pergunta-se o efeito de sentido da metáfora, não só o nome.","r":"ENEM PPL 2024 · Q45 — Cartaz e metáfora do quebra-cabeça","h":"H21","q":657},{"id":"LC-077","a":"LC","d":"Português e Artes","t":"Figuras de linguagem, ironia e humor","k":"aplicação","f":"Hipérbole na crônica: que efeito produz?","v":"O <b>exagero intencional<\/b> cria humor e reforça a crítica (ex.: crônica sobre a calçada portuguesa). Hipérbole + ironia são uma dupla frequente.","x":"Não leia o exagero literalmente; pergunte qual crítica ele sustenta.","r":"ENEM 2022 · Q18 — Ironia e exagero na crônica (calçada portuguesa)","h":"H18","q":677},{"id":"LC-078","a":"LC","d":"Espanhol","t":"Texto poético e canção em língua estrangeira","k":"aplicação","f":"Poemas e canções em espanhol no ENEM costumam tratar de quais temas?","v":"<b>Identidade, migração, xenofobia, resistência indígena e protesto social<\/b> (ex.: canção do Maná sobre migração, poema chicano de Gloria Anzaldúa).","x":"Identifique o eu lírico e a quem ele se dirige: a crítica social costuma estar aí.","r":"ENEM PPL 2023 · Q2 — Canção sobre migração (Maná)","h":"H5","q":565},{"id":"LC-079","a":"LC","d":"Espanhol","t":"Texto poético e canção em língua estrangeira","k":"conceito","f":"O que é a identidade chicana (Gloria Anzaldúa)?","v":"Identidade de mexicano-americanos, marcada pela <b>fronteira<\/b> entre culturas e pelo hibridismo linguístico (espanhol + inglês), vivida como conflito e afirmação.","x":"Associe fronteira a pertencimento duplo, não a perda de identidade.","r":"ENEM PPL 2021 · Q1 — Poema de identidade chicana (Anzaldúa)","h":"H8","q":558},{"id":"LC-080","a":"LC","d":"Espanhol","t":"Texto poético e canção em língua estrangeira","k":"aplicação","f":"Como abordar um poema em espanhol se a linguagem é figurada?","v":"Busque o <b>tema geral<\/b> (título, palavras repetidas, campo semântico) e o sentimento predominante; o ENEM pede a temática ou a crítica, não a tradução literal dos versos.","x":"Palavras repetidas no poema geralmente apontam para o tema.","r":"ENEM 2025 · Q1 — Poema de protesto social","h":"H6","q":537},{"id":"LC-081","a":"LC","d":"Português e Artes","t":"Léxico, formação de palavras e semântica","k":"conceito","f":"Quais os principais processos de formação de palavras?","v":"<b>Derivação<\/b> (prefixo/sufixo), <b>composição<\/b> (justaposição/aglutinação), <b>neologismo<\/b>, empréstimo (estrangeirismo), abreviação e onomatopeia.","x":"O ENEM foca no efeito expressivo de neologismos e regionalismos.","r":"ENEM PPL 2024 · Q17 — Neologismos e regionalismo ('Saciologia goiana')","h":"H22","q":597},{"id":"LC-082","a":"LC","d":"Português e Artes","t":"Léxico, formação de palavras e semântica","k":"aplicação","f":"O que o ENEM cobra sobre empréstimos de línguas indígenas e africanas no português?","v":"Que muitas palavras do cotidiano vêm de línguas indígenas (tupi: <i>mandioca, pipoca, capim<\/i>) e africanas (<i>quitanda, cafuné, moleque<\/i>), evidenciando a <b>formação plural<\/b> do português brasileiro.","x":"Associe léxico a história e identidade cultural.","r":"ENEM PPL 2025 · Q17 — Línguas indígenas e o vocabulário brasileiro","h":"H20","q":709},{"id":"LC-083","a":"LC","d":"Português e Artes","t":"Divulgação científica e textos de ciência/ambiente","k":"conceito","f":"O que caracteriza o texto de divulgação científica?","v":"Torna o conhecimento científico <b>acessível ao público leigo<\/b>: linguagem clara, exemplos, analogias, explicação de termos técnicos e referência a pesquisas/especialistas.","x":"Diferencie de artigo científico (para especialistas, linguagem técnica).","r":"ENEM PPL 2022 · Q26 — O lobo-guará (divulgação científica)","h":"H24","q":640},{"id":"LC-084","a":"LC","d":"Português e Artes","t":"Divulgação científica e textos de ciência/ambiente","k":"pegadinha","f":"Notícia alarmista sobre ciência: o que o ENEM espera do leitor?","v":"Perceber o <b>sensacionalismo<\/b> (títulos exagerados, ameaças sem dados) e confrontar com informações confiáveis e contexto.","x":"Leitura crítica da mídia: título nem sempre corresponde ao conteúdo.","r":"ENEM 2021 · Q6 — Notícia alarmante (asteroide)","h":"H1","q":523},{"id":"LC-085","a":"LC","d":"Português e Artes","t":"Funções da linguagem e metalinguagem","k":"conceito","f":"Quais são as seis funções da linguagem (Jakobson) e seus focos?","v":"<b>Referencial<\/b> (contexto/informação), <b>emotiva<\/b> (emissor), <b>conativa<\/b> (receptor), <b>fática<\/b> (canal), <b>metalinguística<\/b> (código) e <b>poética<\/b> (mensagem/forma).","x":"Pense no elemento da comunicação que o texto destaca.","r":"ENEM PPL 2024 · Q10 — Funções conativa e emotiva no anúncio","h":"H19","q":669},{"id":"LC-086","a":"LC","d":"Português e Artes","t":"Funções da linguagem e metalinguagem","k":"aplicação","f":"Quando um texto é metalinguístico?","v":"Quando a <b>linguagem fala de si mesma<\/b>: poema sobre fazer poesia, crônica sobre o ofício do cronista, verbete que define palavras.","x":"Crônicas sobre 'o que é a crônica' (Fernando Sabino) são clássicos do ENEM.","r":"ENEM 2022 · Q35 — O que é a crônica (Fernando Sabino)","h":"H1","q":733},{"id":"LC-087","a":"LC","d":"Português e Artes","t":"Literatura: movimentos e periodização literária","k":"conceito","f":"Simbolismo: características principais e autor-chave?","v":"Musicalidade, <b>sinestesia<\/b>, subjetividade, espiritualidade, imagens vagas e cor branca/névoa. No Brasil: <b>Cruz e Sousa<\/b> e Alphonsus de Guimaraens.","x":"Diferencie do Parnasianismo (objetividade, forma rígida, 'arte pela arte').","r":"ENEM 2019 · Q33 — Simbolismo e paisagem (Cruz e Sousa)","h":"H15","q":null},{"id":"LC-088","a":"LC","d":"Português e Artes","t":"Literatura: movimentos e periodização literária","k":"conceito","f":"Naturalismo: o que é o determinismo nessas obras?","v":"Ideia de que o indivíduo é <b>determinado pelo meio, raça e momento histórico<\/b> (influência cientificista). Exemplos: 'O Cortiço' (Aluísio Azevedo), 'O Bom-Crioulo' (Adolfo Caminha).","x":"Zoomorfização e linguagem 'científica' são pistas do Naturalismo.","r":"ENEM PPL 2021 · Q33 — Cientificismo e determinismo ('O Bom-Crioulo')","h":"H17","q":592},{"id":"LC-089","a":"LC","d":"Inglês","t":"Texto poético e canção em língua estrangeira","k":"aplicação","f":"Poemas em inglês no ENEM tratam frequentemente de quê?","v":"<b>Identidade, refugiados, hibridismo linguístico<\/b> (Spanglish, 'AmeRícan') e vozes indígenas/negras (Joy Harjo, Achebe).","x":"Identifique de onde fala o eu lírico — a questão costuma pedir o tema identitário.","r":"ENEM 2023 · Q3 — Poema sobre refugiados","h":"H8","q":552},{"id":"LC-090","a":"LC","d":"Inglês","t":"Texto poético e canção em língua estrangeira","k":"conceito","f":"O que é Spanglish e o que ele representa num poema?","v":"Mistura de espanhol e inglês usada por comunidades latinas nos EUA; no poema, marca <b>identidade híbrida<\/b> e resistência cultural.","x":"Não interprete a mistura como erro; é recurso identitário.","r":"ENEM 2023 · Q4 — Poema e hibridismo linguístico (Spanglish)","h":"H5","q":586},{"id":"LC-091","a":"LC","d":"Português e Artes","t":"Dança, corpo e práticas corporais","k":"conceito","f":"O que caracteriza a dança contemporânea?","v":"Liberdade de movimentos, rompimento com técnicas rígidas do balé clássico, <b>exploração do corpo como linguagem<\/b> e diálogo com temas sociais e culturais.","x":"Releituras de coreografias clássicas ('A morte do cisne') são comuns.","r":"ENEM 2023 · Q34 — Dança contemporânea ('Gira')","h":"H14","q":645},{"id":"LC-092","a":"LC","d":"Português e Artes","t":"Dança, corpo e práticas corporais","k":"aplicação","f":"Desigualdade no acesso às práticas corporais: qual a abordagem?","v":"Gênero, classe e território determinam quem pratica esporte/dança; o <b>acesso ao lazer é direito<\/b> e depende de políticas públicas e espaços adequados.","x":"Liga Educação Física a cidadania; evite explicações apenas individuais ('falta de interesse').","r":"ENEM 2023 · Q42 — Desigualdade no acesso às práticas corporais","h":"H10","q":497},{"id":"LC-093","a":"LC","d":"Português e Artes","t":"Sintaxe, morfologia, pontuação e gramática","k":"aplicação","f":"Que efeito tem o desvio proposital da norma (ex.: concordância) em textos literários ou publicitários?","v":"É <b>recurso expressivo<\/b>: reproduz oralidade, cria humor, caracteriza personagens ou chama atenção.","x":"O ENEM raramente pede a 'correção' gramatical; pede o efeito de sentido.","r":"ENEM PPL 2020 · Q7 — Desvio proposital de concordância","h":"H26","q":438},{"id":"LC-094","a":"LC","d":"Português e Artes","t":"Sintaxe, morfologia, pontuação e gramática","k":"conceito","f":"Qual o efeito das reticências e dos parênteses no texto?","v":"<b>Reticências<\/b>: suspensão, hesitação, implícito, ironia. <b>Parênteses<\/b>: comentário à parte, inclusão de informação — como em 'Você (não) está sozinho', que sobrepõe dois sentidos.","x":"Pontuação no ENEM é cobrada como produtora de sentido.","r":"ENEM 2025 · Q34 — Relação verbo-visual ('Você (não) está sozinho')","h":"H19","q":596},{"id":"LC-095","a":"LC","d":"Espanhol","t":"Textos multimodais, publicitários e digitais em língua estrangeira","k":"aplicação","f":"Mafalda, Gaturro e Liniers: o que costuma ser cobrado nessas tirinhas?","v":"A <b>crítica social<\/b> construída pelo humor: Mafalda (Quino) questiona política, guerra e desigualdade com o olhar infantil.","x":"Leia o último quadro: ele traz a quebra de expectativa que gera o humor.","r":"ENEM PPL 2017 · Q2 — Tirinha em língua estrangeira (Mafalda)","h":"H5","q":585},{"id":"LC-096","a":"LC","d":"Espanhol","t":"Textos multimodais, publicitários e digitais em língua estrangeira","k":"aplicação","f":"Em uma campanha ou cartaz em espanhol, o que identificar primeiro?","v":"O <b>objetivo<\/b> (conscientizar, alertar, mobilizar) e o público-alvo, observando imperativos (<i>recicla, no te calles<\/i>) e a imagem.","x":"Imperativos em espanhol são pista de função apelativa.","r":"ENEM PPL 2020 · Q3 — Campanha publicitária em língua estrangeira","h":"H5","q":582},{"id":"LC-097","a":"LC","d":"Espanhol","t":"Texto literário e narrativo em língua estrangeira","k":"conceito","f":"Que autores latino-americanos já apareceram no ENEM de espanhol?","v":"García Márquez, Borges, Cortázar, Galeano, Monterroso, Benedetti, Laura Esquivel, Bolaño — muitos ligados ao <b>realismo mágico<\/b> e à crítica social.","x":"Não é preciso conhecer a obra: a questão é de leitura do trecho.","r":"ENEM 2018 · Q1 — Trecho literário (García Márquez)","h":"H5","q":604},{"id":"LC-098","a":"LC","d":"Espanhol","t":"Texto literário e narrativo em língua estrangeira","k":"conceito","f":"O que é realismo mágico?","v":"Narrativa em que elementos <b>sobrenaturais aparecem como naturais<\/b> no cotidiano, sem espanto das personagens; marca da literatura latino-americana (García Márquez, Laura Esquivel).","x":"Se o fantástico é narrado com naturalidade, pense em realismo mágico.","r":"ENEM PPL 2019 · Q2 — Trecho literário (Laura Esquivel)","h":"H7","q":632},{"id":"LC-099","a":"LC","d":"Inglês","t":"Textos multimodais, publicitários e digitais em língua estrangeira","k":"aplicação","f":"Cartaz de campanha em inglês: como responder rápido?","v":"Identifique o <b>objetivo<\/b> (combater desperdício, promover diversidade) pelos imperativos (<i>don't waste, save, join<\/i>) e pela imagem.","x":"O enunciado costuma pedir a finalidade — ela está no slogan.","r":"ENEM 2023 · Q1 — Campanha contra o desperdício de alimentos","h":"H6","q":545},{"id":"LC-100","a":"LC","d":"Inglês","t":"Textos multimodais, publicitários e digitais em língua estrangeira","k":"pegadinha","f":"Em inglês, como identificar o imperativo e a negação em slogans?","v":"Imperativo = verbo no início sem sujeito (<i>Recycle, Think<\/i>); negativo com <b>Don't<\/b> + verbo (<i>Don't drink and drive<\/i>).","x":"O imperativo indica que o texto quer que o leitor aja — função conativa.","r":"ENEM 2020 · Q1 — Campanha publicitária em língua estrangeira","h":"H7","q":591},{"id":"LC-101","a":"LC","d":"Português e Artes","t":"Literatura: teatro e texto dramático","k":"conceito","f":"O que são rubricas no texto dramático?","v":"Indicações do autor (geralmente entre parênteses/itálico) sobre <b>cenário, gestos, entonação e movimentação<\/b> das personagens; orientam a encenação.","x":"Rubricas não são falas; o ENEM pergunta sua função na construção da cena.","r":"ENEM 2014 · Q126 — Teatro: rubricas no texto dramático","h":"H13","q":null},{"id":"LC-102","a":"LC","d":"Português e Artes","t":"Literatura: teatro e texto dramático","k":"aplicação","f":"Teatro de rua: que característica o ENEM destaca?","v":"Ocupação do <b>espaço público<\/b>, proximidade com o público, democratização do acesso e adaptação da encenação ao ambiente urbano.","x":"O espaço cênico não convencional é o ponto central.","r":"ENEM 2016 · Q126 — Teatro: teatro de rua e espaço cênico","h":"H12","q":578},{"id":"LC-103","a":"LC","d":"Português e Artes","t":"Coesão, coerência, referenciação e progressão textual","k":"conceito","f":"O que é coesão referencial?","v":"Retomada de termos por <b>pronomes, sinônimos, elipse<\/b> ou expressões nominais, evitando repetições e garantindo progressão do texto.","x":"Pergunta clássica: 'o termo X retoma…' — volte ao antecedente.","r":"ENEM PPL 2017 · Q34 — Referência do pronome 'o' no poema","h":"H18","q":488},{"id":"LC-104","a":"LC","d":"Português e Artes","t":"Coesão, coerência, referenciação e progressão textual","k":"aplicação","f":"Qual o valor argumentativo do 'mas'?","v":"Introduz <b>oposição<\/b> e, normalmente, o argumento mais forte — aquele com o qual o autor concorda.","x":"Em 'X, mas Y', o peso da conclusão está em Y.","r":"ENEM 2014 · Q128 — Relações lógico-semânticas: valor argumentativo do \"mas\"","h":"H24","q":715},{"id":"LC-105","a":"LC","d":"Espanhol","t":"Variação linguística e identidade em língua estrangeira","k":"conceito","f":"O espanhol é uma língua única? O que o ENEM cobra sobre variação?","v":"Há muitas variedades (rioplatense com <b>voseo<\/b> — 'vos tenés' —, caribenha, andina, peninsular); todas são legítimas, e a língua convive com línguas indígenas (mapuche, quéchua, guarani).","x":"O ENEM valoriza a diversidade, sem hierarquizar variantes.","r":"ENEM 2023 · Q3 — Variação do espanhol","h":"H8","q":552},{"id":"LC-106","a":"LC","d":"Espanhol","t":"Variação linguística e identidade em língua estrangeira","k":"aplicação","f":"Como interpretar uma expressão idiomática em espanhol?","v":"Pelo <b>contexto<\/b>, não literalmente (ex.: <i>tomar el pelo<\/i> = zombar de alguém; <i>estar en las nubes<\/i> = estar distraído).","x":"A tradução literal costuma ser a alternativa errada.","r":"ENEM 2024 · Q2 — Texto sobre expressão idiomática","h":"H8","q":609},{"id":"LC-107","a":"LC","d":"Inglês","t":"Texto literário e narrativo em língua estrangeira","k":"aplicação","f":"Trechos literários em inglês (Orwell, Bradbury, Butler): o que costuma ser cobrado?","v":"A <b>crítica social<\/b> ou temática central (vigilância e controle em '1984', tecnologia e futuro na ficção científica).","x":"Use o nome do autor/obra no rodapé como pista do tema.","r":"ENEM 2018 · Q5 — Trecho literário (1984, Orwell)","h":"H7","q":519},{"id":"LC-108","a":"LC","d":"Inglês","t":"Texto literário e narrativo em língua estrangeira","k":"conceito","f":"Fábula: qual é a característica central?","v":"Narrativa curta com animais personificados que termina com uma <b>moral<\/b> (ensinamento). Esopo é o autor clássico.","x":"Na questão, procure a lição implícita — é ela que o ENEM pergunta.","r":"ENEM PPL 2017 · Q1 — Fábula em língua estrangeira (Esopo)","h":"H8","q":657},{"id":"CH-001","a":"CH","d":"Filosofia","t":"Ética, moral e justiça","k":"conceito","f":"Para Aristóteles, o que é a felicidade (eudaimonia) e como se chega a ela?","v":"É o <b>bem supremo<\/b>, buscado por si mesmo. Alcança-se pela <b>prática das virtudes<\/b>, entendidas como o <b>justo meio<\/b> entre dois vícios (excesso e falta) — ex.: coragem entre temeridade e covardia.","x":"O ENEM associa Aristóteles a hábito: a virtude se adquire pela repetição de boas ações, não é dom inato.","r":"ENEM 2024 · Q58 — Felicidade e natureza (Aristóteles)","h":"H23","q":592},{"id":"CH-002","a":"CH","d":"Filosofia","t":"Ética, moral e justiça","k":"conceito","f":"O que é a prudência (phronesis) na ética de Aristóteles?","v":"Virtude <b>intelectual prática<\/b>: a capacidade de <b>deliberar bem<\/b> sobre o que é bom para a vida humana em situações concretas, escolhendo o meio-termo adequado.","x":"Não confunda com “cautela”: no texto aristotélico, prudência é sabedoria prática para agir bem.","r":"ENEM PPL 2025 · Q67 — Prudência e deliberação (Aristóteles)","h":"H23","q":507},{"id":"CH-003","a":"CH","d":"Filosofia","t":"Ética, moral e justiça","k":"conceito","f":"Qual o critério moral do utilitarismo de Jeremy Bentham?","v":"Uma ação é boa se produz <b>a maior felicidade para o maior número<\/b> de pessoas (princípio da utilidade). Para Bentham, a pena só se justifica se sua <b>utilidade<\/b> (prevenir crimes) superar o sofrimento que causa.","x":"Ética consequencialista: julga pelos resultados, ao contrário de Kant, que julga pela intenção/dever.","r":"ENEM 2025 · Q79 — Utilitarismo e lei penal (Bentham)","h":"H12","q":719},{"id":"CH-004","a":"CH","d":"Filosofia","t":"Ética, moral e justiça","k":"pegadinha","f":"Qual a diferença entre a “regra de ouro” e o imperativo categórico de Kant?","v":"A regra de ouro (“não faça ao outro o que não quer para si”) depende do <b>desejo<\/b> pessoal. O imperativo categórico exige agir apenas segundo uma máxima que se possa querer como <b>lei universal<\/b>, por <b>dever<\/b>, tratando a humanidade sempre como <b>fim<\/b>, nunca só como meio.","x":"Kant = dever, autonomia e universalidade; se o texto fala em consequências, não é Kant.","r":"ENEM 2024 · Q78 — Regra de ouro (ética universal)","h":"H23","q":698},{"id":"CH-005","a":"CH","d":"Filosofia","t":"Ética, moral e justiça","k":"conceito","f":"O que propõe o “princípio responsabilidade” de Hans Jonas?","v":"Uma ética para a era tecnológica: <b>“Age de tal modo que os efeitos de tua ação sejam compatíveis com a permanência de uma autêntica vida humana sobre a Terra”<\/b>. Inclui responsabilidade com as <b>gerações futuras<\/b> e a natureza.","x":"Aparece em textos sobre tecnologia, meio ambiente e riscos da ciência.","r":"ENEM PPL 2025 · Q69 — Fundamentação ontológica da ética (Jonas)","h":"H23","q":618},{"id":"CH-006","a":"CH","d":"Filosofia","t":"Teoria do conhecimento e epistemologia","k":"conceito","f":"O que é a dúvida metódica de Descartes e a que certeza ela leva?","v":"Duvidar de tudo o que possa ser posto em dúvida (sentidos, sonhos, gênio maligno) para achar uma base segura. A primeira certeza é o <b>cogito<\/b>: <b>“Penso, logo existo”<\/b>. É o marco do <b>racionalismo<\/b> moderno.","x":"A dúvida é método (provisória), não ceticismo radical — alternativa clássica de pegadinha.","r":"ENEM PPL 2020 · Q57 — Dúvida metódica (Descartes)","h":"H1","q":672},{"id":"CH-007","a":"CH","d":"Filosofia","t":"Teoria do conhecimento e epistemologia","k":"conceito","f":"Para David Hume, de onde vem nossa ideia de causa e efeito?","v":"Do <b>hábito<\/b> (costume): após ver repetidas vezes um evento seguir outro, esperamos que se repita. A razão não prova a conexão necessária — só observamos <b>conjunção constante<\/b>. Hume é <b>empirista<\/b>.","x":"Empirismo (Locke, Hume): conhecimento vem da experiência; racionalismo (Descartes): da razão.","r":"ENEM PPL 2023 · Q66 — Causalidade e hábito (Hume)","h":"H3","q":706},{"id":"CH-008","a":"CH","d":"Filosofia","t":"Teoria do conhecimento e epistemologia","k":"aplicação","f":"O que é o “problema da indução”, ilustrado por Russell com a galinha alimentada todo dia?","v":"Generalizações a partir de casos observados <b>não garantem<\/b> o próximo caso: a galinha conclui que sempre será alimentada — até o dia em que é abatida. A indução gera conclusões <b>prováveis<\/b>, não necessárias.","x":"Questões pedem o limite do método indutivo das ciências empíricas.","r":"ENEM 2024 · Q82 — Problema da indução (Russell)","h":"H1","q":716},{"id":"CH-009","a":"CH","d":"Filosofia","t":"Filosofia política: Estado, poder e contratualismo","k":"conceito","f":"O que Michel Foucault chama de poder disciplinar?","v":"Poder que atua sobre os corpos em instituições (escola, prisão, fábrica, quartel, hospital) por <b>vigilância, normalização e exame<\/b>, produzindo <b>“corpos dóceis”<\/b>. Modelo: o <b>panóptico<\/b>.","x":"Foucault vê o poder como rede microfísica, não só como algo que o Estado possui.","r":"ENEM PPL 2025 · Q52 — Poder disciplinar e docilização dos corpos","h":"H24","q":777},{"id":"CH-010","a":"CH","d":"Filosofia","t":"Filosofia política: Estado, poder e contratualismo","k":"conceito","f":"O que significam virtù e fortuna em Maquiavel?","v":"<b>Fortuna<\/b>: o acaso, as circunstâncias. <b>Virtù<\/b>: a habilidade do governante de agir com eficácia para conquistar e manter o poder. Maquiavel separa a <b>política da moral<\/b> cristã: o príncipe age conforme a necessidade.","x":"“Os fins justificam os meios” não é citação literal; o ENEM foca na autonomia da política.","r":"ENEM PPL 2022 · Q63 — Autonomia da política e virtù (Maquiavel)","h":"H1","q":508},{"id":"CH-011","a":"CH","d":"Filosofia","t":"Corpo, existência, subjetividade e tempo","k":"conceito","f":"O que significa “a existência precede a essência” no existencialismo?","v":"O ser humano não tem natureza predefinida: primeiro existe e depois <b>se define por suas escolhas<\/b>. Por isso está <b>condenado a ser livre<\/b> e é responsável pelo que faz de si (Sartre).","x":"Liberdade + responsabilidade + angústia são as palavras-chave do existencialismo.","r":"ENEM PPL 2022 · Q84 — Existencialismo e realidade humana (Abbagnano)","h":"H3","q":633},{"id":"CH-012","a":"CH","d":"Filosofia","t":"Corpo, existência, subjetividade e tempo","k":"conceito","f":"O que é o amor fati em Nietzsche?","v":"“Amor ao destino”: <b>aceitar e afirmar a vida<\/b> inteira, inclusive o sofrimento, sem desejar que nada fosse diferente. Liga-se à ideia de <b>eterno retorno<\/b>.","x":"Nietzsche aparece como crítico da moral cristã e defensor da afirmação da vida.","r":"ENEM 2021 · Q87 — Amor fati (Nietzsche)","h":"H3","q":658},{"id":"CH-013","a":"CH","d":"Filosofia","t":"Filosofia, ciência e natureza","k":"conceito","f":"O que buscavam os pré-socráticos e quais respostas se destacam?","v":"A <b>arché<\/b> (princípio de todas as coisas). Tales: água; Heráclito: <b>devir<\/b> e unidade dos opostos (“tudo flui”); Parmênides: o ser é imutável; Empédocles: quatro elementos; Demócrito: <b>átomos<\/b>.","x":"Marca a passagem do mito ao logos: explicação racional da natureza (physis).","r":"ENEM 2025 · Q72 — Unidade dos opostos (Heráclito)","h":"H1","q":623},{"id":"CH-014","a":"CH","d":"Filosofia","t":"Filosofia, ciência e natureza","k":"conceito","f":"Qual o projeto de ciência de Francis Bacon?","v":"<b>“Saber é poder”<\/b>: conhecer a natureza para <b>dominá-la<\/b> em benefício humano, pelo <b>método indutivo-experimental<\/b>, depois de eliminar os “ídolos” (preconceitos) da me
