arábola.","r":"ENEM 2015 · Q150 — Receita em função do preço (padaria)","h":"H18","q":null},{"id":"MT-100","a":"MT","d":"Matemática","t":"Semelhança, Pitágoras e trigonometria no triângulo","k":"aplicação","f":"Um cabo vai do topo de um mastro de 8 m a um ponto do chão a 6 m da base. Qual o comprimento do cabo?","v":"Pitágoras: √(8² + 6²) = √100 = <b>10 m<\/b>.","x":"Ternos pitagóricos frequentes: 3-4-5, 6-8-10, 5-12-13.","r":"ENEM 2023 · Q148 — Geometria (mastro e cabos)","h":"H9","q":727},{"id":"MT-101","a":"MT","d":"Matemática","t":"Semelhança, Pitágoras e trigonometria no triângulo","k":"fórmula","f":"Uma rampa de 10 m tem inclinação de 30°. Quanto ela sobe?","v":"Altura = 10 · sen 30° = 10 · ½ = <b>5 m<\/b>. (sen 30° = ½; cos 30° = √3/2; tg 45° = 1.)","x":"Cateto oposto ao ângulo → seno; adjacente → cosseno; oposto/adjacente → tangente.","r":"ENEM PPL 2018 · Q168 — Inclinação do telhado (geometria)","h":"H9","q":708},{"id":"MT-102","a":"MT","d":"Matemática","t":"Funções trigonométricas e periodicidade","k":"fórmula","f":"T(t) = 25 + 5·sen(πt/12), t em horas. Qual a temperatura máxima, a mínima e o período?","v":"sen varia de −1 a 1 → <b>máx. 30 °C<\/b>, <b>mín. 20 °C<\/b>. Período = 2π ÷ (π/12) = <b>24 h<\/b>.","x":"Em f = A + B·sen(ωt): máx = A + |B|, mín = A − |B|, período = 2π/ω.","r":"ENEM PPL 2023 · Q142 — Valor mínimo de função trigonométrica (temperatura)","h":"H21","q":775},{"id":"MT-103","a":"MT","d":"Matemática","t":"Funções trigonométricas e periodicidade","k":"aplicação","f":"Numa roda-gigante, h(t) = 12 − 10·cos(πt/5) (m, min). Quais as alturas mínima e máxima e o tempo de uma volta?","v":"cos = 1 → <b>h mín. = 2 m<\/b> (em t = 0); cos = −1 → <b>h máx. = 22 m<\/b>. Volta: 2π ÷ (π/5) = <b>10 min<\/b>.","x":"Com \"−cos\", a função começa no mínimo; com \"+cos\", no máximo.","r":"ENEM 2023 · Q177 — Função periódica (roda-gigante)","h":"H15","q":652},{"id":"BIO-V1C1-01","a":"BIO","d":"Volume 1","t":"Cap. 1 · Biologia: ciência e vida","k":"comparação","f":"Qual a diferença entre hipótese e teoria científica, segundo o livro?","v":"<b>Hipótese<\/b> é uma tentativa de explicação para um fenômeno isolado e precisa ser testável. <b>Teoria<\/b> é uma ideia ampla, um modelo que explica de forma coerente um conjunto abrangente de fatos e observações (ex.: teoria celular). <b>Fato<\/b> é o dado do mundo natural percebido objetivamente.","x":"Pegadinha comum: tratar teoria como 'palpite'; em ciência, teoria é o nível mais amplo de explicação, sustentado por muitos fatos.","r":"Vol. 1 · Cap. 1 · 1.1 Fundamentos do pensamento científico e surgimento da Biologia · p. 14","e":null,"h":null,"q":null},{"id":"BIO-V1C1-02","a":"BIO","d":"Volume 1","t":"Cap. 1 · Biologia: ciência e vida","k":"processo","f":"Quais são os passos do procedimento hipotético-dedutivo?","v":"1) Pergunta sobre um fenômeno; 2) formulação de uma hipótese; 3) deduções (previsões do que ocorreria se a hipótese fosse verdadeira); 4) teste das deduções por observações ou experimentos; 5) conclusão: a hipótese é aceita (enquanto não houver motivo para duvidar) ou modificada/substituída.","x":"Questões de texto pedem para separar a hipótese (explicação) da dedução (previsão testável) e do resultado do experimento.","r":"Vol. 1 · Cap. 1 · 1.2 Procedimentos em ciência · p. 15","e":null,"h":null,"q":null},{"id":"BIO-V1C1-03","a":"BIO","d":"Volume 1","t":"Cap. 1 · Biologia: ciência e vida","k":"aplicação","f":"No experimento dos Darwin sobre plantas que se curvam para a luz, quais eram os grupos experimentais e os de controle?","v":"<b>Experimentais<\/b> (com intervenção): plantas com a extremidade cortada e plantas com a extremidade coberta por papel à prova de luz — ficaram eretas. <b>Controles<\/b>: plantas intactas e plantas cobertas em outra parte do caule — curvaram-se. Conclusão: a extremidade do caule percebe a luz.","x":"O grupo controle é o que permite atribuir o resultado à variável testada; sem ele, a conclusão do experimento não se sustenta.","r":"Vol. 1 · Cap. 1 · 1.2 Procedimentos em ciência · p. 16","e":null,"h":null,"q":null},{"id":"BIO-V1C1-04","a":"BIO","d":"Volume 1","t":"Cap. 1 · Biologia: ciência e vida","k":"conceito","f":"O que é o julgamento por pares e por que ele é essencial na ciência?","v":"É a avaliação de um artigo por outros cientistas (árbitros, em geral anônimos) antes da publicação em revista especializada, verificando ineditismo, relevância e qualidade. Impede que a fama do autor baste para aceitar uma ideia. Jornais, revistas de divulgação e livros didáticos não passam por esse crivo e não trazem conhecimento novo à ciência.","x":"Distinção cobrada: a divulgação científica populariza o conhecimento, mas só a publicação revisada por pares o incorpora à ciência.","r":"Vol. 1 · Cap. 1 · 1.2 Procedimentos em ciência · p. 17","e":null,"h":null,"q":null},{"id":"BIO-V1C1-05","a":"BIO","d":"Volume 1","t":"Cap. 1 · Biologia: ciência e vida","k":"comparação","f":"Diferencie população, comunidade (biocenose), biótopo e ecossistema.","v":"<b>População<\/b>: indivíduos da mesma espécie numa região. <b>Comunidade<\/b>: populações de espécies diferentes que interagem numa região. <b>Biótopo<\/b>: o ambiente físico-químico (temperatura, umidade, luz, composição química). <b>Ecossistema<\/b>: comunidade + biótopo interagindo. A <b>biosfera<\/b> reúne todos os ecossistemas da Terra.","x":"Armadilha: ecossistema inclui os fatores abióticos; comunidade é só a parte viva.","r":"Vol. 1 · Cap. 1 · 1.3 A Biologia como ciência · p. 25","e":null,"h":null,"q":null},{"id":"BIO-V1C2-01","a":"BIO","d":"Volume 1","t":"Cap. 2 · Origem da vida na Terra","k":"conceito","f":"Qual era a composição provável da atmosfera da Terra primitiva, e quando a vida teria surgido?","v":"Predominavam gás carbônico (CO<sub>2<\/sub>), metano (CH<sub>4<\/sub>), monóxido de carbono (CO), gás nitrogênio (N<sub>2<\/sub>) e vapor-d'água; o gás oxigênio (O<sub>2<\/sub>) não fazia parte dessa mistura. A Terra formou-se há 4,6–4,5 bilhões de anos e a vida teria surgido há cerca de 3,5 bilhões de anos, após o resfriamento da crosta e a formação dos mares.","x":"Explica por que os primeiros seres não eram aeróbicos e por que a mistura usada por Miller (CH<sub>4<\/sub>, NH<sub>3<\/sub>, H<sub>2<\/sub>, H<sub>2<\/sub>O) é hoje considerada inadequada.","r":"Vol. 1 · Cap. 2 · 2.1 A origem do universo e do Sistema Solar · p. 33","e":null,"h":null,"q":null},{"id":"BIO-V1C2-02","a":"BIO","d":"Volume 1","t":"Cap. 2 · Origem da vida na Terra","k":"aplicação","f":"Como Redi testou a origem dos 'vermes' da carne em putrefação e o que concluiu?","v":"Hipótese: os 'vermes' são larvas de moscas, nascidas de ovos postos na carne. Dedução: impedindo as moscas de pousar, não surgem larvas. Teste: frascos com carne abertos × vedados com gaze fina. Só nos abertos apareceram larvas — evidência contra a geração espontânea (abiogênese) e a favor da biogênese.","x":"Questões pedem para identificar hipótese, dedução e grupo controle no experimento de Redi; os frascos abertos são o controle.","r":"Vol. 1 · Cap. 2 · 2.2 Como surgiu a vida na Terra? · p. 34","e":null,"h":null,"q":null},{"id":"BIO-V1C2-03","a":"BIO","d":"Volume 1","t":"Cap. 2 · Origem da vida na Terra","k":"pegadinha","f":"Por que o frasco 'pescoço de cisne' de Pasteur foi decisivo contra a geração espontânea?","v":"Needham alegava que a fervura destruía a 'força vital' e que o ar fresco a restabelecia, objeção que Spallanzani (frascos fechados no fogo) não conseguiu derrubar. Pasteur deixou o caldo fervido em contato livre com o ar, mas a curva do gargalo retinha as partículas (germes): não surgiram microrganismos. Ao quebrar o gargalo, o caldo contaminou-se.","x":"Pegadinha: o frasco de Pasteur NÃO era fechado — a curva funcionava como filtro, rebatendo o argumento do ar.","r":"Vol. 1 · Cap. 2 · 2.2 Como surgiu a vida na Terra? · p. 36","e":null,"h":null,"q":null},{"id":"BIO-V1C2-04","a":"BIO","d":"Volume 1","t":"Cap. 2 · Origem da vida na Terra","k":"conceito","f":"O que o experimento de Miller (1953) demonstrou — e o que ele não demonstrou?","v":"Num simulador com metano, amônia, hidrogênio e vapor-d'água submetidos a calor e descargas elétricas, Miller obteve aminoácidos (alanina, glicina) e outras substâncias orgânicas. Mostrou que moléculas orgânicas podem se formar a partir de gases inorgânicos. Não produziu seres vivos nem células e hoje tem valor histórico.","x":"Alternativa errada típica: 'Miller provou que a vida surgiu nos mares' ou 'obteve seres vivos em laboratório'.","r":"Vol. 1 · Cap. 2 · 2.3 Ideias modernas sobre a origem da vida · p. 38","e":null,"h":null,"q":null},{"id":"BIO-V1C2-05","a":"BIO","d":"Volume 1","t":"Cap. 2 · Origem da vida na Terra","k":"comparação","f":"Compare as hipóteses heterotrófica e autotrófica sobre a nutrição dos primeiros seres vivos.","v":"<b>Heterotrófica<\/b>: os primeiros seres se alimentavam das moléculas orgânicas do meio, com energia obtida por processo semelhante à fermentação. <b>Autotrófica<\/b> (hoje mais aceita): eram quimiolitoautotróficos, produzindo alimento com a energia de reações entre substâncias inorgânicas. Depois teriam surgido fermentadores, fotossintetizantes e, por fim, aeróbicos.","x":"A evidência a favor da hipótese autotrófica é a existência de microrganismos quimiossintetizantes em fontes termais e fendas vulcânicas submarinas.","r":"Vol. 1 · Cap. 2 · 2.3 Ideias modernas sobre a origem da vida · p. 40","e":null,"h":null,"q":null},{"id":"BIO-V1C3-01","a":"BIO","d":"Volume 1","t":"Cap. 3 · Bases moleculares da vida","k":"aplicação","f":"Que propriedades térmicas da água ajudam os seres vivos a evitar o superaquecimento?","v":"Alto <b>calor específico<\/b>: a água absorve ou cede muito calor com pequena variação de temperatura. Alto <b>calor latente de vaporização<\/b>: evaporar exige muito calor. Por isso a transpiração foliar resfria as folhas e a evaporação do suor resfria a pele.","x":"O ENEM liga isso à vegetação: menos plantas significa menos evapotranspiração, ar mais seco e temperatura local mais alta.","r":"Vol. 1 · Cap. 3 · 3.2 Água e sais minerais · p. 48","e":"ENEM PPL 2021 · Q106 — Evapotranspiração e desmatamento","h":"H9","q":553},{"id":"BIO-V1C3-02","a":"BIO","d":"Volume 1","t":"Cap. 3 · Bases moleculares da vida","k":"comparação","f":"Diferencie reação de condensação (síntese por desidratação) de reação de hidrólise.","v":"<b>Condensação<\/b>: união de moléculas com <i>liberação<\/i> de água (ex.: dois aminoácidos → dipeptídio + H<sub>2<\/sub>O). <b>Hidrólise<\/b>: quebra de moléculas com <i>consumo<\/i> de água como reagente (ex.: sacarose + H<sub>2<\/sub>O → glicose + frutose), como ocorre na digestão.","x":"Pegadinha: quebrar ligações peptídicas consome água, não gás oxigênio.","r":"Vol. 1 · Cap. 3 · 3.2 Água e sais minerais · p. 47","e":null,"h":null,"q":null},{"id":"BIO-V1C3-03","a":"BIO","d":"Volume 1","t":"Cap. 3 · Bases moleculares da vida","k":"conceito","f":"Quais monossacarídios formam a sacarose e a lactose, e qual o monômero do amido, do glicogênio e da celulose?","v":"Sacarose (cana) = glicose + frutose. Lactose (leite) = glicose + galactose. Amido, glicogênio e celulose são polissacarídios formados por glicose. A quitina (exoesqueleto de artrópodes, parede de fungos) é um polissacarídio nitrogenado.","x":"Cobra-se a diferença entre polissacarídios de reserva (amido, glicogênio) e estruturais (celulose, quitina), e a digestão da lactose pela lactase.","r":"Vol. 1 · Cap. 3 · 3.3 Glicídios e lipídios · p. 50","e":null,"h":null,"q":null},{"id":"BIO-V1C3-04","a":"BIO","d":"Volume 1","t":"Cap. 3 · Bases moleculares da vida","k":"pegadinha","f":"Existem duas moléculas de colesterol diferentes, uma 'boa' e outra 'ruim'?","v":"Não. A molécula de colesterol é sempre a mesma; muda a lipoproteína que a transporta. <b>LDL<\/b> leva colesterol aos tecidos e, em excesso, oxida e forma placas ateroscleróticas nas artérias ('ruim'). <b>HDL<\/b> recolhe o excesso e o leva ao fígado, que o elimina na bile ('bom').","x":"Também cai: alimentos de origem vegetal não têm colesterol; ele vem de gorduras animais ou é produzido no fígado.","r":"Vol. 1 · Cap. 3 · 3.3 Glicídios e lipídios · p. 53","e":null,"h":null,"q":null},{"id":"BIO-V1C3-05","a":"BIO","d":"Volume 1","t":"Cap. 3 · Bases moleculares da vida","k":"aplicação","f":"O que muda numa proteína desnaturada, e por que o leite 'coalha' no preparo de iogurtes e queijos?","v":"Calor excessivo, pH extremo, sais ou polaridade alteram a <b>estrutura espacial<\/b> da proteína, que se desenrola; a sequência de aminoácidos (estrutura primária) não muda. No leite, o ácido láctico liberado por microrganismos fermentadores acidifica o meio e desnatura as proteínas, que se emaranham e solidificam.","x":"Pegadinha clássica: desnaturação não é hidrólise — a proteína perde a forma e a função, mas não perde as ligações peptídicas.","r":"Vol. 1 · Cap. 3 · 3.4 Proteínas, vitaminas e ácidos nucleicos · p. 56","e":"ENEM PPL 2019 · Q115 — Experimento (coagulação do leite)","h":"H15","q":587},{"id":"BIO-V1C3-06","a":"BIO","d":"Volume 1","t":"Cap. 3 · Bases moleculares da vida","k":"conceito","f":"Como o modelo chave-fechadura explica a ação e a especificidade das enzimas?","v":"Enzimas são catalisadores biológicos com centros ativos cujo formato se encaixa apenas em substratos específicos, como chave e fechadura. O encaixe facilita a transformação do substrato em produtos; ao final, a enzima se solta intacta e pode atuar de novo.","x":"Armadilha: a enzima não é consumida na reação; perde a função apenas se for desnaturada (calor, pH).","r":"Vol. 1 · Cap. 3 · 3.4 Proteínas, vitaminas e ácidos nucleicos · p. 56","e":"ENEM 2022 · Q120 — Atividade enzimática (catalase)","h":"H15","q":653},{"id":"BIO-V1C3-07","a":"BIO","d":"Volume 1","t":"Cap. 3 · Bases moleculares da vida","k":"aplicação","f":"Em que pH a pepsina e a tripsina atuam melhor, e o que ocorre fora do pH ótimo?","v":"Cada enzima tem um pH ótimo de atividade máxima. <b>Pepsina<\/b> (estômago): pH ≈ 2, fortemente ácido. <b>Tripsina<\/b> (intestino delgado, meio alcalino): pH ≈ 8. A maioria das enzimas celulares: perto de 7. Fora da faixa, a atividade cai; as enzimas humanas também têm temperatura ótima entre 35 °C e 40 °C.","x":"Em experimentos com tubos de ensaio, a protease gástrica só digere a proteína no tubo ácido e próximo da temperatura corporal.","r":"Vol. 1 · Cap. 3 · 3.4 Proteínas, vitaminas e ácidos nucleicos · p. 57","e":"ENEM 2014 · Q75 — pH ótimo de protease gástrica (tubos)","h":"H15","q":585},{"id":"BIO-V1C3-08","a":"BIO","d":"Volume 1","t":"Cap. 3 · Bases moleculares da vida","k":"aplicação","f":"Por que a falta de vitamina A causa cegueira noturna, e de que alimentos ela pode vir?","v":"A vitamina A (retinol) é precursora do retinal, substância sensível à luz presente na retina. Sua carência causa cegueira noturna (xeroftalmia) e pode levar à cegueira total. É lipossolúvel e pode ser obtida do caroteno de vegetais amarelos e alaranjados (cenoura, abóbora), além de fígado e gema de ovo.","x":"Lipossolúveis (A, D, E, K) se acumulam no tecido adiposo e dependem de gordura para ser absorvidas; hidrossolúveis (B, C) devem ser ingeridas diariamente.","r":"Vol. 1 · Cap. 3 · 3.4 Proteínas, vitaminas e ácidos nucleicos · p. 60","e":"ENEM PPL 2018 · Q127 — Cegueira noturna (vitamina A)","h":"H18","q":519},{"id":"BIO-V1C4-01","a":"BIO","d":"Volume 1","t":"Cap. 4 · A descoberta das células","k":"pegadinha","f":"O que Robert Hooke realmente viu ao observar a cortiça em 1665?","v":"Viu cavidades microscópicas que chamou de <i>cells<\/i> (celas). Eram células vegetais mortas, sem conteúdo — restavam só as paredes celulares. Hooke usou um microscópio composto (ocular + objetiva); Leeuwenhoek, com microscópios simples de uma só lente, foi o primeiro a observar microrganismos.","x":"Pegadinha: Hooke deu nome à célula, mas a teoria celular só veio com Schleiden e Schwann (1838–1839).","r":"Vol. 1 · Cap. 4 · 4.1 A invenção do microscópio · p. 67","e":null,"h":null,"q":null},{"id":"BIO-V1C4-02","a":"BIO","d":"Volume 1","t":"Cap. 4 · A descoberta das células","k":"conceito","f":"Quais são as três premissas da teoria celular?","v":"1) Todos os seres vivos são formados por células e estruturas que elas produzem (unidade morfológica). 2) As atividades essenciais da vida ocorrem dentro das células (unidade funcional). 3) Novas células surgem apenas da divisão de células preexistentes.","x":"Os vírus, acelulares, são a exceção sempre lembrada quando se discute se a teoria celular define o que é vida.","r":"Vol. 1 · Cap. 4 · 4.3 A teoria celular · p. 69","e":null,"h":null,"q":null},{"id":"BIO-V1C4-03","a":"BIO","d":"Volume 1","t":"Cap. 4 · A descoberta das células","k":"aplicação","f":"Como se calcula a ampliação final de um microscópio fotônico com objetiva de 50× e ocular de 10×?","v":"Multiplica-se o aumento da objetiva pelo da ocular: 50 × 10 = <b>500 vezes<\/b>. A luz é concentrada pelo condensador, atravessa o objeto e passa pela objetiva e pela ocular. Microscópios fotônicos modernos ampliam entre 100 e 1.500 vezes.","x":"Erros comuns: somar os aumentos ou confundir ampliação com poder de resolução.","r":"Vol. 1 · Cap. 4 · 4.4 O desenvolvimento da Citologia · p. 69","e":null,"h":null,"q":null},{"id":"BIO-V1C4-04","a":"BIO","d":"Volume 1","t":"Cap. 4 · A descoberta das células","k":"comparação","f":"O que é limite de resolução, e quais os valores para olho nu, microscópio fotônico e eletrônico?","v":"É a menor distância entre dois pontos que ainda são vistos separados. Olho nu ≈ 0,1 mm (100 µm); microscópio fotônico ≈ 0,25 µm (cerca de 400× melhor que o olho); microscópio eletrônico ≈ 1 nm (cerca de 250× melhor que o fotônico), pois usa feixes de elétrons em vez de luz.","x":"Quanto <i>menor<\/i> o limite de resolução, <i>maior<\/i> o poder de resolução — inversão frequente nas alternativas.","r":"Vol. 1 · Cap. 4 · 4.4 O desenvolvimento da Citologia · p. 74","e":null,"h":null,"q":null},{"id":"BIO-V1C4-05","a":"BIO","d":"Volume 1","t":"Cap. 4 · A descoberta das células","k":"comparação","f":"Diferencie célula procariótica de célula eucariótica.","v":"<b>Procariótica<\/b> (bactérias e arqueas): sem núcleo e sem estruturas membranosas no citoplasma; o 'cromossomo' fica numa região chamada nucleoide. <b>Eucariótica<\/b> (protozoários, fungos, algas, plantas e animais): citoplasma repleto de canais e bolsas membranosas, entre eles o núcleo, que abriga os cromossomos.","x":"Pegadinha: procariontes também têm membrana plasmática, ribossomos e material genético; o que falta é a carioteca e as organelas membranosas.","r":"Vol. 1 · Cap. 4 · 4.5 Células procarióticas e eucarióticas · p. 75","e":null,"h":null,"q":null},{"id":"BIO-V1C5-01","a":"BIO","d":"Volume 1","t":"Cap. 5 · Membrana celular e citoplasma","k":"conceito","f":"O que propõe o modelo do mosaico fluido de Singer e Nicolson (1972)?","v":"A membrana é uma bicamada de fosfolipídios, com cabeças hidrofílicas voltadas para a água e caudas hidrofóbicas para o interior, onde ficam incrustadas proteínas como peças de um mosaico — algumas superficiais, outras atravessando a bicamada. Os componentes se deslocam no plano da membrana, o que lhe dá fluidez.","x":"Experimentos de fusão de células com proteínas marcadas mostram as proteínas se misturando na membrana: evidência da fluidez.","r":"Vol. 1 · Cap. 5 · 5.2 Características das membranas biológicas (biomembranas) · p. 82","e":"ENEM 2017 · Q116 — Modelo do mosaico fluido (fusão celular)","h":"H15","q":692},{"id":"BIO-V1C5-02","a":"BIO","d":"Volume 1","t":"Cap. 5 · Membrana celular e citoplasma","k":"comparação","f":"Diferencie transporte passivo de transporte ativo, com um exemplo de cada.","v":"<b>Passivo<\/b>: sem gasto de energia pela célula, a favor do gradiente — difusão (do mais concentrado para o menos concentrado) e osmose. <b>Ativo<\/b>: com gasto de ATP, contra o gradiente — ex.: bomba de sódio-potássio, que a cada ciclo envia 3 Na<sup>+<\/sup> para fora e 2 K<sup>+<\/sup> para dentro, mantendo K<sup>+<\/sup> alto no citoplasma e Na<sup>+<\/sup> alto fora.","x":"Se a substância se move contra a diferença de concentração, só pode ser transporte ativo.","r":"Vol. 1 · Cap. 5 · 5.2 Características das membranas biológicas (biomembranas) · p. 84","e":"ENEM PPL 2017 · Q113 — Difusão através de membranas","h":"H13","q":651},{"id":"BIO-V1C5-03","a":"BIO","d":"Volume 1","t":"Cap. 5 · Membrana celular e citoplasma","k":"aplicação","f":"O que acontece com hemácias e com células vegetais em soluções hipotônica, isotônica e hipertônica?","v":"<b>Hipotônica<\/b>: a água entra; a hemácia incha e pode estourar, enquanto a célula vegetal incha mas não estoura graças à parede celulósica. <b>Isotônica<\/b>: o volume não muda. <b>Hipertônica<\/b>: a água sai e a célula murcha; na vegetal, a membrana se descola da parede (plasmólise).","x":"Na osmose a água passa do meio hipotônico (menos soluto) para o hipertônico (mais soluto).","r":"Vol. 1 · Cap. 5 · 5.2 Características das membranas biológicas (biomembranas) · p. 84","e":"ENEM PPL 2021 · Q131 — Fragilidade osmótica de hemácias","h":"H15","q":358},{"id":"BIO-V1C5-04","a":"BIO","d":"Volume 1","t":"Cap. 5 · Membrana celular e citoplasma","k":"aplicação","f":"Por que salgar carne ou peixe ajuda a conservá-los?","v":"O sal torna o meio hipertônico em relação às células dos microrganismos. Por osmose, eles perdem água para o meio, desidratam e não conseguem se multiplicar; o próprio alimento também perde água.","x":"Mesma lógica do açúcar em compotas e doces: o efeito é osmótico, por retirada de água das células.","r":"Vol. 1 · Cap. 5 · 5.2 Características das membranas biológicas (biomembranas) · p. 84","e":"ENEM 2017 · Q132 — Osmose e conservação por salgamento","h":"H19","q":703},{"id":"BIO-V1C5-05","a":"BIO","d":"Volume 1","t":"Cap. 5 · Membrana celular e citoplasma","k":"comparação","f":"Compare o retículo endoplasmático granuloso (rugoso) e o não granuloso (liso).","v":"<b>Granuloso<\/b>: tem ribossomos aderidos à face voltada para o citosol e sintetiza proteínas destinadas a membranas ou à secreção. <b>Não granuloso<\/b>: sem ribossomos; sintetiza ácidos graxos, fosfolipídios e esteroides e é abundante nas células do fígado que inativam toxinas, álcool e outras drogas.","x":"Célula que secreta hormônio esteroide tem muito retículo liso; célula que secreta enzimas tem muito retículo rugoso.","r":"Vol. 1 · Cap. 5 · 5.3 Retículo endoplasmático · p. 87","e":null,"h":null,"q":null},{"id":"BIO-V1C5-06","a":"BIO","d":"Volume 1","t":"Cap. 5 · Membrana celular e citoplasma","k":"processo","f":"Qual é o caminho de uma proteína de secreção, como uma enzima digestiva do pâncreas, dentro da célula?","v":"Ribossomos do retículo granuloso sintetizam a proteína → ela entra nas bolsas do retículo → vesículas a levam à face <i>cis<\/i> do complexo golgiense → ali é modificada, concentrada e 'empacotada' → sai pela face <i>trans<\/i> em vesículas de secreção → exocitose na membrana plasmática.","x":"Em gráficos de marcação radioativa, o sinal aparece primeiro no retículo granuloso, depois no complexo golgiense e por fim nas vesículas de secreção.","r":"Vol. 1 · Cap. 5 · 5.4 Complexo golgiense · p. 88","e":"ENEM 2015 · Q48 — Rota de secreção de proteínas (gráfico)","h":"H15","q":588},{"id":"BIO-V1C5-07","a":"BIO","d":"Volume 1","t":"Cap. 5 · Membrana celular e citoplasma","k":"comparação","f":"Diferencie a função heterofágica da função autofágica dos lisossomos.","v":"<b>Heterofágica<\/b>: digestão de material vindo de fora — fagossomos ou pinossomos fundem-se a lisossomos e formam vacúolos digestivos; os restos ficam no vacúolo residual e são eliminados por clasmocitose. <b>Autofágica<\/b>: digestão de partes da própria célula (ex.: mitocôndria desgastada) envoltas num autofagossomo, para reciclagem ou sobrevivência em jejum.","x":"Os lisossomos nascem do complexo golgiense com enzimas feitas no retículo granuloso; seu mau funcionamento explica a silicose e a doença de Tay-Sachs.","r":"Vol. 1 · Cap. 5 · 5.5 Lisossomos e digestão intracelular · p. 90","e":null,"h":null,"q":null},{"id":"BIO-V1C5-08","a":"BIO","d":"Volume 1","t":"Cap. 5 · Membrana celular e citoplasma","k":"conceito","f":"Quais são os componentes do citoesqueleto e como ele permite o movimento ameboide?","v":"<b>Microtúbulos<\/b> (proteína tubulina, ~25 nm) e <b>microfilamentos de actina<\/b> (~7 nm). O citoesqueleto é dinâmico: microtúbulos se montam e desmontam, e os filamentos de actina mudam de comprimento. O deslizamento da miosina sobre a actina faz a célula mudar de forma e emitir pseudópodes.","x":"Substâncias que bloqueiam actina ou tubulina impedem pseudópodes, o transporte interno e a divisão celular.","r":"Vol. 1 · Cap. 5 · 5.6 Sustentação celular: paredes e citoesqueleto · p. 94","e":"ENEM 2024 · Q115 — Citoesqueleto e movimento celular (ameba)","h":"H15","q":715},{"id":"BIO-V1C5-09","a":"BIO","d":"Volume 1","t":"Cap. 5 · Membrana celular e citoplasma","k":"comparação","f":"Compare cílios e flagelos e diga de onde eles se originam.","v":"Ambos se originam de centríolos e têm a mesma estrutura interna: 9 duplas de microtúbulos periféricos + 1 par central. <b>Flagelos<\/b>: mais longos e em pequeno número, com movimento ondulatório (ex.: espermatozoide). <b>Cílios<\/b>: curtos e numerosos, batem como chicote (ex.: células da traqueia que varrem o muco).","x":"Troca frequente: o centríolo tem 9 <i>trincas<\/i> de microtúbulos; cílios e flagelos têm 9 <i>duplas<\/i> + 2 centrais.","r":"Vol. 1 · Cap. 5 · 5.7 Centríolos, flagelos e cílios · p. 95","e":null,"h":null,"q":null},{"id":"BIO-V1C5-10","a":"BIO","d":"Volume 1","t":"Cap. 5 · Membrana celular e citoplasma","k":"conceito","f":"Que características de mitocôndrias e cloroplastos sustentam a hipótese endossimbiótica?","v":"Têm duas membranas, DNA próprio, RNA e ribossomos semelhantes aos das bactérias, e surgem apenas por autoduplicação de organelas preexistentes. Por isso se supõe que derivem de procariontes que se instalaram no citoplasma de células eucarióticas primitivas (simbiogênese).","x":"Também cai: nos animais as mitocôndrias têm herança materna, pois as do espermatozoide degeneram após a fecundação.","r":"Vol. 1 · Cap. 5 · 5.8 Mitocôndrias e plastos · p. 95","e":"ENEM 2014 · Q73 — Origem das mitocôndrias (DNA circular)","h":"H16","q":653},{"id":"BIO-V1C6-01","a":"BIO","d":"Volume 1","t":"Cap. 6 · Núcleo celular, mitose e síntese de proteínas","k":"aplicação","f":"O que a clonagem da ovelha Dolly demonstrou sobre o núcleo de uma célula somática?","v":"O núcleo de uma célula da glândula mamária de Belinda, transferido para um óvulo sem núcleo de outra ovelha, originou um animal completo, cópia de Belinda. Logo, o núcleo de uma célula somática contém todas as informações para formar o organismo, e todas as nossas células têm núcleos com informações idênticas, copiadas do zigoto.","x":"Se todas as células têm o mesmo genoma, a diferença entre um neurônio e uma célula muscular está em quais genes cada uma expressa.","r":"Vol. 1 · Cap. 6 · Abertura do capítulo — Clones e a importância do núcleo celular · p. 102","e":"ENEM 2015 · Q87 — Diferenciação celular (mesmo genoma)","h":"H13","q":644},{"id":"BIO-V1C6-02","a":"BIO","d":"Volume 1","t":"Cap. 6 · Núcleo celular, mitose e síntese de proteínas","k":"pegadinha","f":"Um cromossomo duplicado, com duas cromátides-irmãs, conta como um ou como dois cromossomos?","v":"Conta como <b>um<\/b>. Após a duplicação na interfase, as duas cópias (cromátides-irmãs) ficam unidas pelo centrômero. Só quando ele se divide, na anáfase, elas se separam e passam a ser cromossomos-irmãos. Ex.: na prófase, uma célula humana tem 46 cromossomos e 92 cromátides.","x":"Contar cromátides como se fossem cromossomos é o erro mais comum em questões de quantidade de DNA e de cromossomos.","r":"Vol. 1 · Cap. 6 · 6.2 Características gerais dos cromossomos · p. 105","e":null,"h":null,"q":null},{"id":"BIO-V1C6-03","a":"BIO","d":"Volume 1","t":"Cap. 6 · Núcleo celular, mitose e síntese de proteínas","k":"processo","f":"Quais são as fases do ciclo celular e o que acontece em cada etapa da interfase?","v":"Ciclo = interfase + divisão celular (mitose + citocinese). A interfase ocupa ~95% do tempo: <b>G1<\/b> (antes da duplicação do DNA), <b>S<\/b> (síntese: o DNA é duplicado) e <b>G2<\/b> (após a duplicação). A mitose — prófase, metáfase, anáfase e telófase — dura de 30 a 60 min numa célula humana.","x":"Em gráficos de quantidade de DNA por célula, o valor dobra na fase S e volta ao inicial ao final da divisão.","r":"Vol. 1 · Cap. 6 · 6.3 Dividir para multiplicar: a divisão celular · p. 112","e":null,"h":null,"q":null},{"id":"BIO-V1C6-04","a":"BIO","d":"Volume 1","t":"Cap. 6 · Núcleo celular, mitose e síntese de proteínas","k":"aplicação","f":"Como a colchicina afeta a mitose e por que é usada no preparo de cariogramas?","v":"A colchicina liga-se à tubulina e impede a formação dos microtúbulos do fuso. A mitose para na metáfase, quando os cromossomos estão mais condensados e visíveis. Se a célula volta à interfase, o novo núcleo fica com o dobro de cromossomos, pois as cromátides-irmãs não se separaram.","x":"Mesma lógica de antitumorais que atuam nos microtúbulos: sem fuso funcional, as células não completam a divisão.","r":"Vol. 1 · Cap. 6 · 6.3 Dividir para multiplicar: a divisão celular · p. 114","e":"ENEM PPL 2022 · Q101 — Colchicina e fuso mitótico","h":"H7","q":711},{"id":"BIO-V1C6-05","a":"BIO","d":"Volume 1","t":"Cap. 6 · Núcleo celular, mitose e síntese de proteínas","k":"conceito","f":"Qual a diferença entre genes supressores de tumor e oncogenes na origem do câncer?","v":"<b>Supressores de tumor<\/b> produzem proteínas que interrompem o ciclo celular quando há problemas; mutações que os inativam permitem que células alteradas se reproduzam. <b>Oncogenes<\/b> estimulam as divisões; alterações neles levam à divisão descontrolada. O câncer exige várias mutações, por isso é mais frequente em idosos.","x":"O p53 é o supressor de tumor clássico: inativo, deixa células com DNA danificado escaparem da parada do ciclo e da apoptose.","r":"Vol. 1 · Cap. 6 · 6.3 Dividir para multiplicar: a divisão celular · p. 117","e":"ENEM 2018 · Q100 — Ciclo celular e p53 (apoptose)","h":"H15","q":545},{"id":"BIO-V1C6-06","a":"BIO","d":"Volume 1","t":"Cap. 6 · Núcleo celular, mitose e síntese de proteínas","k":"aplicação","f":"Num DNA de dupla-hélice, 30% das bases são adenina. Qual a porcentagem de citosina?","v":"Como A pareia com T e C com G, A = T = 30%, logo A + T = 60%. Restam 40% para C + G, e C = G = <b>20%<\/b>. A–T se unem por 2 ligações de hidrogênio e C–G por 3; as cadeias são complementares e a duplicação é semiconservativa.","x":"Essa igualdade vale só para DNA de fita dupla; no RNA, de fita simples e com uracila, ela não se aplica.","r":"Vol. 1 · Cap. 6 · 6.4 Cromossomos em ação: duplicação e transcrição gênicas · p. 118","e":"ENEM PPL 2016 · Q52 — Pareamento de bases do DNA (Chargaff)","h":"H15","q":609},{"id":"BIO-V1C6-07","a":"BIO","d":"Volume 1","t":"Cap. 6 · Núcleo celular, mitose e síntese de proteínas","k":"conceito","f":"O que significa dizer que o código genético é 'degenerado' e 'universal'?","v":"Cada códon (trinca de bases do RNAm) corresponde a um aminoácido; há 64 códons para 20 aminoácidos. <b>Degenerado<\/b>: vários códons codificam o mesmo aminoácido (só metionina e triptofano têm códon único). <b>Universal<\/b>: é praticamente o mesmo em todos os seres vivos. AUG inicia a tradução; UAA, UAG e UGA são códons de parada.","x":"Por ser degenerado, uma mutação pode trocar o códon sem trocar o aminoácido; por ser universal, uma bactéria consegue produzir uma proteína humana.","r":"Vol. 1 · Cap. 6 · 6.5 O mecanismo da síntese de proteínas: tradução gênica · p. 122","e":"ENEM 2021 · Q96 — Código genético e tradução (códons)","h":"H15","q":613},{"id":"BIO-V1C7-01","a":"BIO","d":"Volume 1","t":"Cap. 7 · Fotossíntese e quimiossíntese","k":"conceito","f":"Do que é formada a molécula de ATP e como ela fornece energia à célula?","v":"ATP (trifosfato de adenosina) = <b>adenina + ribose + 3 fosfatos<\/b>. Quando o fosfato terminal se separa (ligação de alta energia), forma-se <b>ADP + Pi<\/b> e a energia liberada é usada em transporte ativo, contração muscular, movimento de cílios e flagelos e síntese de substâncias.","x":"O ATP é a «moeda energética» de uso imediato, não reserva de longo prazo (função de amido, glicogênio e gorduras).","r":"Vol. 1 · Cap. 7 · 7.1 Energia para a vida · p. 140","e":null,"h":null,"q":null},{"id":"BIO-V1C7-02","a":"BIO","d":"Volume 1","t":"Cap. 7 · Fotossíntese e quimiossíntese","k":"pegadinha","f":"De qual reagente vem o O<sub>2<\/sub> liberado na fotossíntese? Como isso foi comprovado?","v":"Vem <b>exclusivamente da água<\/b>. Van Niel propôs a ideia estudando sulfobactérias púrpura (usam H<sub>2<\/sub>S e liberam S, não O<sub>2<\/sub>); a equipe de Calvin confirmou dando à alga <i>Chlorella<\/i> água com <sup>18<\/sup>O: o isótopo apareceu só no O<sub>2<\/sub>, nunca nos glicídios.","x":"Armadilha clássica: supor que o O<sub>2<\/sub> vem do CO<sub>2<\/sub>; o oxigênio do CO<sub>2<\/sub> vai para o glicídio e para a água formada.","r":"Vol. 1 · Cap. 7 · 7.2 O processo da fotossíntese · p. 142","e":null,"h":null,"q":null},{"id":"BIO-V1C7-03","a":"BIO","d":"Volume 1","t":"Cap. 7 · Fotossíntese e quimiossíntese","k":"aplicação","f":"Quais cores de luz a clorofila absorve melhor e qual ela reflete? Que consequência isso tem?","v":"A clorofila absorve principalmente a luz <b>vermelha<\/b> e a <b>violeta/azul<\/b> e reflete quase todo o <b>verde<\/b> (por isso é verde). Logo, a fotossíntese é mais intensa sob vermelho e azul-violeta e mínima sob luz verde.","x":"No experimento de Engelmann, bactérias aeróbias se acumulam junto aos trechos da alga iluminados por vermelho e azul, onde mais O<sub>2<\/sub> é liberado.","r":"Vol. 1 · Cap. 7 · 7.2 O processo da fotossíntese · p. 143","e":"ENEM 2020 · Q121 — Experimento de Engelmann","h":"H29","q":649},{"id":"BIO-V1C7-04","a":"BIO","d":"Volume 1","t":"Cap. 7 · Fotossíntese e quimiossíntese","k":"processo","f":"Como o cloroplasto produz ATP e NADPH na fotofosforilação?","v":"A luz excita elétrons da clorofila, que percorrem a <b>cadeia transportadora<\/b> da membrana do tilacoide até o NADP<sup>+<\/sup>, formando <b>NADPH<\/b>. A energia liberada bombeia H<sup>+<\/sup> do estroma para o interior do tilacoide; ao retornarem pela <b>sintase do ATP<\/b>, os H<sup>+<\/sup> giram seu «rotor» e unem ADP + Pi → <b>ATP<\/b>.","x":"ATP e NADPH, produtos da etapa luminosa, abastecem o ciclo das pentoses; o ENEM cobra essa ligação entre as fases.","r":"Vol. 1 · Cap. 7 · 7.2 O processo da fotossíntese · p. 144","e":null,"h":null,"q":null},{"id":"BIO-V1C7-05","a":"BIO","d":"Volume 1","t":"Cap. 7 · Fotossíntese e quimiossíntese","k":"processo","f":"O que é a fotólise da água e qual o destino de seus três produtos?","v":"Quebra da água acoplada à fotofosforilação (reação de Hill): 2H<sub>2<\/sub>O → O<sub>2<\/sub> + 4H<sup>+<\/sup> + 4e<sup>−<\/sup>.<br>• <b>O<sub>2<\/sub><\/b>: liberado no ambiente.<br>• <b>H<sup>+<\/sup><\/b>: captados pelo NADP, seguem para os glicídios.<br>• <b>elétrons<\/b>: repõem os que a clorofila perdeu na excitação.","x":"Questões perguntam quem repõe os elétrons da clorofila: é a água, não o CO<sub>2<\/sub> nem a glicose.","r":"Vol. 1 · Cap. 7 · 7.2 O processo da fotossíntese · p. 145","e":"ENEM PPL 2023 · Q123 — Fotólise da água (reposição de elétrons)","h":"H9","q":711},{"id":"BIO-V1C7-06","a":"BIO","d":"Volume 1","t":"Cap. 7 · Fotossíntese e quimiossíntese","k":"processo","f":"O que ocorre no ciclo das pentoses (Calvin-Benson) e qual é seu produto direto?","v":"No estroma, a enzima <b>rubisco<\/b> une CO<sub>2<\/sub> à ribulose-bifosfato (RuBP); com energia do <b>ATP<\/b> e hidrogênios do <b>NADPH<\/b>, formam-se glicídios de 3 carbonos, o <b>PGAL<\/b> (3-fosfato gliceraldeído), e a RuBP é regenerada. O PGAL vira sacarose (exportada) ou amido (armazenado).","x":"Pegadinha: o produto direto não é glicose, e a fase química depende da luminosa — sem luz por muito tempo, falta ATP/NADPH e o ciclo para.","r":"Vol. 1 · Cap. 7 · 7.2 O processo da fotossíntese · p. 145","e":"ENEM PPL 2018 · Q129 — Fases da fotossíntese","h":"H9","q":551},{"id":"BIO-V1C7-07","a":"BIO","d":"Volume 1","t":"Cap. 7 · Fotossíntese e quimiossíntese","k":"comparação","f":"Em que a quimiossíntese difere da fotossíntese? Cite exemplos de quimiossintetizantes.","v":"Ambas são autotróficas e usam CO<sub>2<\/sub> + H<sub>2<\/sub>O para produzir glicídios, mas na quimiossíntese a energia vem da <b>oxidação de substâncias inorgânicas<\/b>, não da luz. Ex.: <i>Nitrosomonas<\/i> (amônia → nitrito), <i>Nitrobacter<\/i> (nitrito → nitrato) e arqueas metanogênicas (CO<sub>2<\/sub> + H<sub>2<\/sub> → CH<sub>4<\/sub>).","x":"Aparece no ciclo do nitrogênio (nitrificação) e em ambientes sem luz, como o fundo oceânico com bactérias simbiontes de <i>Riftia<\/i>.","r":"Vol. 1 · Cap. 7 · 7.3 Quimiossíntese · p. 146","e":null,"h":null,"q":null},{"id":"BIO-V1C8-01","a":"BIO","d":"Volume 1","t":"Cap. 8 · Fermentação e respiração aeróbica","k":"processo","f":"O que é a glicólise, onde ocorre e qual é seu saldo energético?","v":"Conjunto de reações no <b>citosol<\/b> que quebra 1 glicose (6C) em <b>2 ácidos pirúvicos<\/b> (3C), sem usar O<sub>2<\/sub>. Gasta 2 ATP para «ativar» a glicose e produz 4: <b>saldo de 2 ATP<\/b>; forma também 2 NADH.","x":"É a etapa comum à fermentação e à respiração; provas cobram que não depende de O<sub>2<\/sub> nem de mitocôndria.","r":"Vol. 1 · Cap. 8 · 8.1 Fermentação como forma de obter energia · p. 151","e":"ENEM 2019 · Q95 — Glicólise e fermentação lática","h":"H9","q":721},{"id":"BIO-V1C8-02","a":"BIO","d":"Volume 1","t":"Cap. 8 · Fermentação e respiração aeróbica","k":"comparação","f":"Compare fermentação alcoólica e lática: quem realiza e quais são os produtos?","v":"<b>Alcoólica<\/b>: leveduras (<i>Saccharomyces<\/i>); piruvato → <b>etanol + CO<sub>2<\/sub><\/b> (pão, cerveja, vinho, álcool combustível).<br><b>Lática<\/b>: lactobacilos e músculo sem O<sub>2<\/sub> suficiente; piruvato → <b>ácido lático<\/b>, sem CO<sub>2<\/sub> (iogurte, queijos).<br>Ambas rendem 2 ATP por glicose.","x":"Pegadinha: a fermentação lática não libera gás; quem faz a massa do pão crescer é o CO<sub>2<\/sub> da fermentação alcoólica.","r":"Vol. 1 · Cap. 8 · 8.1 Fermentação como forma de obter energia · p. 152","e":"ENEM PPL 2022 · Q117 — Fermentação alcoólica e lática","h":"H29","q":657},{"id":"BIO-V1C8-03","a":"BIO","d":"Volume 1","t":"Cap. 8 · Fermentação e respiração aeróbica","k":"conceito","f":"Qual é o papel do NAD<sup>+<\/sup> na fermentação?","v":"Na glicólise, o NAD<sup>+<\/sup> recebe elétrons e H<sup>+<\/sup> e vira <b>NADH<\/b>. Na etapa final da fermentação, o NADH entrega esses H ao ácido pirúvico, que vira etanol + CO<sub>2<\/sub> ou ácido lático, e o <b>NAD<sup>+<\/sup> é regenerado<\/b>, permitindo que a glicólise continue.","x":"Por isso o produto final da fermentação ainda é rico em energia: ele serve para descarregar o NADH, não para gerar mais ATP.","r":"Vol. 1 · Cap. 8 · 8.1 Fermentação como forma de obter energia · p. 152","e":null,"h":null,"q":null},{"id":"BIO-V1C8-04","a":"BIO","d":"Volume 1","t":"Cap. 8 · Fermentação e respiração aeróbica","k":"aplicação","f":"Por que, na produção de cerveja e de saquê, o amido dos grãos precisa ser degradado antes da fermentação?","v":"Leveduras fermentam <b>açúcares simples<\/b>, não amido. Na cerveja, o amido da cevada é antes quebrado em açúcares (ação de amilases); no saquê, o fungo <i>Aspergillus oryzae<\/i> degrada o amido do arroz. Só então <i>Saccharomyces<\/i> converte os açúcares em etanol + CO<sub>2<\/sub>.","x":"O ENEM cobra a etapa enzimática (hidrólise do amido) que antecede a fermentação na cerveja e no etanol de milho.","r":"Vol. 1 · Cap. 8 · 8.1 Fermentação como forma de obter energia · p. 153","e":"ENEM PPL 2025 · Q105 — Mosturação e ação das amilases","h":"H25","q":673},{"id":"BIO-V1C8-05","a":"BIO","d":"Volume 1","t":"Cap. 8 · Fermentação e respiração aeróbica","k":"comparação","f":"Por que a respiração aeróbica rende cerca de 15 vezes mais ATP que a fermentação?","v":"Na fermentação, a glicose é degradada <b>parcialmente<\/b> e os produtos (etanol, ácido lático) ainda guardam muita energia: <b>2 ATP<\/b>. Na respiração aeróbica, a cadeia carbônica é degradada <b>totalmente<\/b> a CO<sub>2<\/sub> e H<sub>2<\/sub>O: até cerca de <b>30 ATP<\/b> por glicose (38 no rendimento teórico).","x":"Consequência cobrada: sem O<sub>2<\/sub>, a levedura consome muito mais glicose para obter a mesma energia.","r":"Vol. 1 · Cap. 8 · 8.2 A respiração aeróbica · p. 155","e":"ENEM 2015 · Q69 — Respiração e fermentação (consumo de glicose)","h":"H15","q":665},{"id":"BIO-V1C8-06","a":"BIO","d":"Volume 1","t":"Cap. 8 · Fermentação e respiração aeróbica","k":"conceito","f":"Onde ocorre cada etapa da respiração aeróbica em uma célula eucariótica?","v":"<b>Glicólise<\/b>: citosol.<br><b>Piruvato → acetilCoA e ciclo de Krebs<\/b>: matriz mitocondrial.<br><b>Cadeia respiratória e fosforilação oxidativa<\/b>: membrana interna da mitocôndria.","x":"Só a glicólise ocorre sem O<sub>2<\/sub>; na falta dele, Krebs e fosforilação param e o piruvato é fermentado no próprio citosol.","r":"Vol. 1 · Cap. 8 · 8.2 A respiração aeróbica · p. 155","e":"ENEM PPL 2023 · Q115 — Respiração aeróbia x fermentação","h":"H15","q":570},{"id":"BIO-V1C8-07","a":"BIO","d":"Volume 1","t":"Cap. 8 · Fermentação e respiração aeróbica","k":"processo","f":"O que entra e o que sai em cada volta do ciclo de Krebs?","v":"A <b>acetilCoA<\/b> (2C) une-se ao ácido oxalacético (4C), formando ácido cítrico (6C). Em 8 reações, cada volta libera <b>2 CO<sub>2<\/sub><\/b> e forma <b>3 NADH, 1 FADH<sub>2<\/sub> e 1 GTP<\/b> (≈ 1 ATP), regenerando o oxalacético.","x":"É a principal fonte do CO<sub>2<\/sub> exalado; ácidos graxos também entram no ciclo depois de convertidos em acetilCoA.","r":"Vol. 1 · Cap. 8 · 8.2 A respiração aeróbica · p. 156","e":null,"h":null,"q":null},{"id":"BIO-V1C8-08","a":"BIO","d":"Volume 1","t":"Cap. 8 · Fermentação e respiração aeróbica","k":"pegadinha","f":"Qual é o destino do O<sub>2<\/sub> que respiramos dentro da célula?","v":"O O<sub>2<\/sub> é o <b>aceptor final de elétrons<\/b> da cadeia respiratória: recebe os elétrons já «desenergizados» e íons H<sup>+<\/sup> e forma <b>água<\/b>. O CO<sub>2<\/sub> liberado vem dos carbonos da glicose (piruvato → acetilCoA e ciclo de Krebs), não do O<sub>2<\/sub>.","x":"Com <sup>18<\/sup>O<sub>2<\/sub> marcado, o isótopo aparece na água formada, e não no CO<sub>2<\/sub> exalado.","r":"Vol. 1 · Cap. 8 · 8.2 A respiração aeróbica · p. 157","e":"ENEM PPL 2022 · Q116 — Marcação com 18O2 na respiração","h":"H14","q":703},{"id":"BIO-V1C8-09","a":"BIO","d":"Volume 1","t":"Cap. 8 · Fermentação e respiração aeróbica","k":"processo","f":"Como a teoria quimiosmótica explica a síntese de ATP na mitocôndria?","v":"Elétrons do NADH e do FADH<sub>2<\/sub> percorrem a <b>cadeia respiratória<\/b> (complexos proteicos com citocromos) na membrana interna; a energia liberada bombeia H<sup>+<\/sup> da matriz para o espaço entre as membranas. Os H<sup>+<\/sup> voltam pela <b>sintase do ATP<\/b>, que usa esse fluxo para unir ADP + Pi.","x":"É o mesmo mecanismo do tilacoide; substâncias que bloqueiam a cadeia transportadora derrubam a produção de ATP.","r":"Vol. 1 · Cap. 8 · 8.2 A respiração aeróbica · p. 157","e":"ENEM 2023 · Q127 — Cadeia transportadora de elétrons (ATP)","h":"H15","q":724},{"id":"BIO-V1C8-10","a":"BIO","d":"Volume 1","t":"Cap. 8 · Fermentação e respiração aeróbica","k":"aplicação","f":"O que acontece se a membrana interna da mitocôndria ficar permeável a H<sup>+<\/sup> (efeito de um desacoplador)?","v":"Os H<sup>+<\/sup> retornam à matriz sem passar pela sintase do ATP: a cadeia respiratória continua consumindo O<sub>2<\/sub> e nutrientes, mas a <b>produção de ATP cai<\/b> e a energia se dissipa como <b>calor<\/b>.","x":"Base de questões sobre o DNP (emagrecedor que causa hipertermia) e a termogênese de mamíferos que hibernam.","r":"Vol. 1 · Cap. 8 · 8.2 A respiração aeróbica · p. 157","e":"ENEM 2019 · Q127 — Fosforilação oxidativa e desacopladores (DNP)","h":"H9","q":880},{"id":"BIO-V1C9-01","a":"BIO","d":"Volume 1","t":"Cap. 9 · Tipos de reprodução, meiose e fecundação","k":"conceito","f":"O que é partenogênese? Como ela ocorre nas abelhas?","v":"Desenvolvimento do gameta feminino <b>sem fecundação<\/b>, processo assexuado. Nas abelhas, óvulos não fecundados (n) originam os <b>zangões<\/b>, haploides; ovos fecundados (2n) originam fêmeas, que viram rainhas ou operárias conforme a alimentação.","x":"Descendentes partenogenéticos não recebem genes paternos; o ENEM usa espécies só de fêmeas (como o escorpião-amarelo) para cobrar isso.","r":"Vol. 1 · Cap. 9 · 9.1 Tipos de reprodução · p. 166","e":"ENEM PPL 2025 · Q128 — Partenogênese (escorpião-amarelo)","h":"H13","q":601},{"id":"BIO-V1C9-02","a":"BIO","d":"Volume 1","t":"Cap. 9 · Tipos de reprodução, meiose e fecundação","k":"comparação","f":"Qual é a diferença essencial entre a anáfase da mitose e a anáfase I da meiose?","v":"Na mitose (e na anáfase II), cada cromossomo liga-se a fibras dos dois polos e separam-se as <b>cromátides-irmãs<\/b>. Na metáfase I, cada homólogo duplicado liga-se a um só polo; na anáfase I separam-se os <b>cromossomos homólogos<\/b>, ainda duplicados. Por isso a meiose I é reducional (2n → n).","x":"Pegadinha: a redução cromossômica ocorre na meiose I, não na II; a meiose II é praticamente uma mitose.","r":"Vol. 1 · Cap. 9 · 9.2 Meiose e reprodução · p. 168","e":null,"h":null,"q":null},{"id":"BIO-V1C9-03","a":"BIO","d":"Volume 1","t":"Cap. 9 · Tipos de reprodução, meiose e fecundação","k":"processo","f":"O que é a permutação (crossing-over), quando ocorre e qual é sua importância?","v":"Troca de pedaços entre cromátides de cromossomos <b>homólogos<\/b> emparelhados na <b>prófase I<\/b>; os pontos de troca aparecem no diplóteno como <b>quiasmas<\/b> (figuras em X). Reúne no mesmo cromossomo genes maternos e paternos, aumentando a <b>variabilidade genética<\/b>.","x":"Não confundir: a troca é entre homólogos, não entre cromátides-irmãs, e não ocorre na mitose.","r":"Vol. 1 · Cap. 9 · 9.2 Meiose e reprodução · p. 169","e":null,"h":null,"q":null},{"id":"BIO-V1C9-04","a":"BIO","d":"Volume 1","t":"Cap. 9 · Tipos de reprodução, meiose e fecundação","k":"aplicação","f":"O que é não disjunção meiótica e por que o risco de síndrome de Down cresce com a idade materna?","v":"Falha na separação: na <b>meiose I<\/b>, homólogos migram juntos; na <b>meiose II<\/b>, cromátides-irmãs. Formam-se gametas com cromossomo a mais ou a menos, e o zigoto herda a alteração (ex.: trissomia do 21). Os ovócitos ficam parados em prófase I desde a vida fetal; quanto mais tempo parados, maior a chance de erro.","x":"Outros exemplos citados: síndromes de Turner e Klinefelter; o risco sobe muito após os 35 anos.","r":"Vol. 1 · Cap. 9 · 9.2 Meiose e reprodução · p. 172","e":"ENEM PPL 2025 · Q125 — Não disjunção meiótica (síndrome de Down)","h":"H13","q":645},{"id":"BIO-V1C9-05","a":"BIO","d":"Volume 1","t":"Cap. 9 · Tipos de reprodução, meiose e fecundação","k":"processo","f":"Quais eventos da fecundação garantem que só um espermatozoide penetre o gameta feminino?","v":"Ao tocar o gameta feminino, o espermatozoide libera enzimas do <b>acrossomo<\/b>, que digerem os envoltórios ovulares. O primeiro a alcançar o citoplasma induz a <b>membrana de fecundação<\/b>, que barra os demais. Nos mamíferos, a penetração faz o <b>ovócito II<\/b> (parado em metáfase II) completar a meiose; a união dos pronúcleos (cariogamia) forma o zigoto.","x":"Pegadinha: nos mamíferos quem é fecundado é um ovócito secundário; na fertilização in vitro esses mesmos passos ocorrem fora do corpo.","r":"Vol. 1 · Cap. 9 · 9.3 Gametas e fecundação nos animais · p. 174","e":"ENEM 2023 · Q107 — Fertilização in vitro (fecundação)","h":"H29","q":682},{"id":"BIO-V1C9-06","a":"BIO","d":"Volume 1","t":"Cap. 9 · Tipos de reprodução, meiose e fecundação","k":"comparação","f":"Compare meiose gamética, zigótica e espórica nos ciclos de vida.","v":"<b>Gamética<\/b> (haplobionte diplonte; animais): o adulto 2n faz meiose para formar gametas.<br><b>Zigótica<\/b> (haplobionte haplonte; clamidomonas, bolor): o zigoto, única fase 2n, faz meiose logo após se formar.<br><b>Espórica<\/b> (diplobionte; plantas): o esporófito 2n forma esporos por meiose; o gametófito n forma gametas por mitose.","x":"Armadilha: nas plantas os gametas não surgem por meiose, e sim por mitose no gametófito haploide.","r":"Vol. 1 · Cap. 9 · 9.4 Meiose e ciclos de vida · p. 176","e":null,"h":null,"q":null},{"id":"BIO-V1C10-01","a":"BIO","d":"Volume 1","t":"Cap. 10 · Desenvolvimento embrionário animal","k":"comparação","f":"Como a quantidade e a distribuição do vitelo determinam o tipo de segmentação?","v":"<b>Oligolécito/alécito<\/b> (anfioxo, mamíferos): pouco vitelo → holoblástica igual.<br><b>Mesolécito<\/b> (anfíbios): vitelo no polo vegetativo → holoblástica desigual (macrômeros e micrômeros).<br><b>Megalécito<\/b> (aves, répteis): muito vitelo → meroblástica discoidal, só no disco germinativo.<br><b>Centrolécito<\/b> (artrópodes): vitelo central → superficial.","x":"Regra geral: quanto mais vitelo, mais ele atrapalha a citocinese e mais incompleta é a segmentação.","r":"Vol. 1 · Cap. 10 · 10.1 Segmentação e formação da blástula · p. 184","e":null,"h":null,"q":null},{"id":"BIO-V1C10-02","a":"BIO","d":"Volume 1","t":"Cap. 10 · Desenvolvimento embrionário animal","k":"conceito","f":"O que diferencia animais protostômios de deuterostômios?","v":"Na gástrula, o arquêntero (esboço do tubo digestivo) abre-se pelo <b>blastóporo<\/b>. Nos <b>deuterostômios<\/b> (cordados e equinodermos), o blastóporo origina o <b>ânus<\/b> e a boca surge depois. Nos <b>protostômios<\/b> (nematódeos, moluscos, anelídeos, artrópodes), o blastóporo origina a <b>boca<\/b>.","x":"Equinodermos (estrelas e ouriços-do-mar) são deuterostômios como os vertebrados, dado usado para discutir parentesco evolutivo.","r":"Vol. 1 · Cap. 10 · 10.2 Gastrulação · p. 186","e":null,"h":null,"q":null},{"id":"BIO-V1C10-03","a":"BIO","d":"Volume 1","t":"Cap. 10 · Desenvolvimento embrionário animal","k":"comparação","f":"Que estruturas derivam de cada folheto germinativo?","v":"<b>Ectoderma<\/b>: epiderme e anexos (pelos, unhas, glândulas da pele) e <b>sistema nervoso<\/b>.<br><b>Mesoderma<\/b>: músculos, ossos, coração, vasos e sangue, sistemas urinário e genital.<br><b>Endoderma<\/b>: revestimento do tubo digestivo, glândulas digestivas (fígado, pâncreas) e sistema respiratório.","x":"Pegadinha frequente: o sistema nervoso vem do ectoderma; cnidários são diblásticos e esponjas não têm folhetos.","r":"Vol. 1 · Cap. 10 · 10.2 Gastrulação · p. 186","e":null,"h":null,"q":null},{"id":"BIO-V1C10-04","a":"BIO","d":"Volume 1","t":"Cap. 10 · Desenvolvimento embrionário animal","k":"aplicação","f":"Como se forma o tubo nervoso e que malformações surgem quando ele não se fecha?","v":"Na nêurula, o ectoderma dorsal forma a <b>placa neural<\/b>, que se dobra em sulco e se fecha em <b>tubo nervoso<\/b> (origem de encéfalo e medula), logo acima da <b>notocorda<\/b>. Falha no fechamento da região anterior causa <b>anencefalia<\/b>; na posterior (por volta do 27º dia), <b>espinha bífida<\/b>.","x":"Provas associam tubo nervoso ao ectoderma e notocorda ao mesoderma; a notocorda é exclusiva de cordados e induz a formação do tubo nervoso.","r":"Vol. 1 · Cap. 10 · 10.3 Organogênese · p. 189","e":null,"h":null,"q":null},{"id":"BIO-V1C10-05","a":"BIO","d":"Volume 1","t":"Cap. 10 · Desenvolvimento embrionário animal","k":"comparação","f":"Qual é a função de cada anexo embrionário no ovo de répteis e aves?","v":"<b>Saco vitelínico<\/b>: digere o vitelo e leva nutrientes ao embrião.<br><b>Âmnio<\/b>: bolsa com líquido que evita a dessecação e amortece choques.<br><b>Alantoide<\/b>: armazena excretas (ácido úrico) e participa das trocas gasosas.<br><b>Cório<\/b>: envolve todos os anexos; junto ao alantoide forma o <b>alantocório<\/b>, que respira através da casca.","x":"Ovo com casca e anexos foram adaptações à terra firme; nos mamíferos placentários os anexos persistem, mas a placenta assumiu suas funções.","r":"Vol. 1 · Cap. 10 · 10.4 Anexos embrionários · p. 194","e":null,"h":null,"q":null},{"id":"BIO-V1C11-01","a":"BIO","d":"Volume 1","t":"Cap. 11 · Reprodução humana","k":"pegadinha","f":"Que célula é liberada na ovulação humana e quando ela completa a meiose?","v":"Um <b>ovócito secundário<\/b> parado em <b>metáfase II<\/b>. Ele só termina a meiose (formando o 2º glóbulo polar) se for fecundado; sem fecundação, degenera em cerca de 24 h. O folículo rompido transforma-se no <b>corpo-amarelo<\/b> (corpo-lúteo).","x":"Chamamos de «óvulo», mas a meiose não terminou; os ovócitos I ficam parados em prófase I desde a vida intrauterina.","r":"Vol. 1 · Cap. 11 · 11.1 Sistema genital feminino · p. 202","e":null,"h":null,"q":null},{"id":"BIO-V1C11-02","a":"BIO","d":"Volume 1","t":"Cap. 11 · Reprodução humana","k":"processo","f":"Qual é o trajeto dos espermatozoides até a uretra e que células produzem testosterona?","v":"<b>Túbulos seminíferos<\/b> (produção) → <b>epidídimo<\/b> (amadurecimento e armazenamento) → <b>ductos deferentes<\/b> → ducto ejaculatório → <b>uretra<\/b>. Glândulas seminais (maior parte do volume do sêmen), próstata e bulbouretrais adicionam secreções. A testosterona vem das <b>células intersticiais<\/b> do testículo.","x":"Por isso a vasectomia (corte dos ductos deferentes) esteriliza sem alterar testosterona, ereção ou ejaculação: o sêmen só fica sem espermatozoides.","r":"Vol. 1 · Cap. 11 · 11.2 Sistema genital masculino · p. 203","e":null,"h":null,"q":null},{"id":"BIO-V1C11-03","a":"BIO","d":"Volume 1","t":"Cap. 11 · Reprodução humana","k":"processo","f":"Qual é a sequência hormonal do ciclo menstrual?","v":"FSH (adenoipófise) faz folículos crescerem → folículo secreta <b>estrógeno<\/b>, que espessa o endométrio → estrógeno alto provoca pico de <b>LH<\/b> → ovulação (~14º dia) → LH forma o <b>corpo-amarelo<\/b>, que secreta <b>progesterona<\/b> → estrógeno e progesterona inibem FSH e LH → corpo-amarelo regride → queda hormonal → menstruação.","x":"Gráficos hormonais do ciclo são clássicos; a queda de estrógeno e progesterona no fim do ciclo explica a menstruação e é associada à TPM.","r":"Vol. 1 · Cap. 11 · 11.3 Hormônios relacionados à reprodução · p. 206","e":"ENEM 2023 · Q101 — Tensão pré-menstrual (hormônios)","h":"H14","q":721},{"id":"BIO-V1C11-04","a":"BIO","d":"Volume 1","t":"Cap. 11 · Reprodução humana","k":"aplicação","f":"Como a pílula anticoncepcional combinada impede a gravidez?","v":"Contém <b>estrógeno e progesterona<\/b> sintéticos que, mantidos altos no sangue, <b>inibem a secreção de FSH e LH<\/b> pela adenoipófise (retroalimentação negativa): sem pico de LH, <b>não há ovulação<\/b>. Na pausa de 7 dias, a queda hormonal faz o endométrio descamar.","x":"O ENEM pede para reconhecer, em gráficos, que FSH e LH ficam baixos e sem pico em quem usa a pílula.","r":"Vol. 1 · Cap. 11 · 11.4 Gravidez e parto (quadro: O controle da reprodução humana) · p. 218","e":"ENEM 2013 · Q55 — Anticoncepcional e níveis hormonais","h":"H14","q":808},{"id":"BIO-V1C11-05","a":"BIO","d":"Volume 1","t":"Cap. 11 · Reprodução humana","k":"conceito","f":"Qual é a função da gonadotrofina coriônica (hCG) no início da gravidez?","v":"Secretada pelas <b>vilosidades coriônicas<\/b> do embrião após a nidação (~7º dia), a hCG mantém o <b>corpo-amarelo<\/b> ativo, conservando estrógeno e progesterona altos: o endométrio não descama e a menstruação não ocorre. A partir do 4º mês, a placenta assume a produção desses hormônios.","x":"Testes de gravidez de farmácia detectam o excesso de hCG eliminado na urina.","r":"Vol. 1 · Cap. 11 · 11.4 Gravidez e parto · p. 210","e":null,"h":null,"q":null},{"id":"BIO-V1C11-06","a":"BIO","d":"Volume 1","t":"Cap. 11 · Reprodução humana","k":"aplicação","f":"Como o feto obtém O<sub>2<\/sub> durante a gestação e o que dispara a respiração pulmonar ao nascer?","v":"As trocas ocorrem na <b>placenta<\/b>, através das paredes dos vasos, sem mistura do sangue materno e fetal; o cordão umbilical tem 2 artérias e 1 veia. Os pulmões fetais não fazem trocas gasosas. Ao nascer, com o desprendimento da placenta, o <b>CO<sub>2<\/sub> acumula<\/b> no sangue do bebê e estimula os centros respiratórios.","x":"Como o pulmão fetal não oxigena o sangue, a circulação fetal tem desvios, como o forame oval, que reduzem o fluxo pelos pulmões.","r":"Vol. 1 · Cap. 11 · 11.4 Gravidez e parto · p. 211","e":"ENEM 2021 · Q98 — Circulação fetal (forame oval)","h":"H14","q":881},{"id":"BIO-V1C12-01","a":"BIO","d":"Volume 1","t":"Cap. 12 · A diversidade celular dos vertebrados","k":"comparação","f":"Diferencie células-tronco totipotentes, pluripotentes e multipotentes, segundo o livro.","v":"<b>Totipotentes<\/b>: células do embrioblasto do blastocisto; originam qualquer tipo celular.<br><b>Pluripotentes<\/b>: ex. do cordão umbilical; originam muitos tipos celulares.<br><b>Multipotentes<\/b>: maioria das células-tronco adultas (ex.: hematopoiéticas da medula óssea); originam um ou poucos tipos e regeneram tecidos.","x":"Em terapia celular (transplante de medula, células produtoras de insulina no diabetes), células de doador podem ser rejeitadas e exigir imunossupressão.","r":"Vol. 1 · Cap. 12 · 12.1 A diversidade dos tecidos vivos (quadro: A importância das células-tronco) · p. 224","e":"ENEM PPL 2025 · Q109 — Terapia celular no diabetes (imunossupressão)","h":"H11","q":652},{"id":"BIO-V1C12-02","a":"BIO","d":"Volume 1","t":"Cap. 12 · A diversidade celular dos vertebrados","k":"comparação","f":"Quais são as características do epitélio e como diferem glândulas exócrinas e endócrinas?","v":"Epitélio: células <b>justapostas<\/b> e <b>sem vasos sanguíneos<\/b> (nutrição por difusão a partir do conjuntivo vizinho). Glândulas <b>exócrinas<\/b> têm ductos e lançam a secreção para fora do corpo ou em cavidades (sudoríparas, salivares); <b>endócrinas<\/b> não têm ductos e lançam <b>hormônios no sangue<\/b> (tireoide, hipófise).","x":"O critério cobrado é a presença de ducto; o pâncreas é o exemplo misto clássico (suco pancreático e insulina).","r":"Vol. 1 · Cap. 12 · 12.2 Tecido epitelial · p. 225","e":null,"h":null,"q":null},{"id":"BIO-V1C12-03","a":"BIO","d":"Volume 1","t":"Cap. 12 · A diversidade celular dos vertebrados","k":"comparação","f":"Qual é o papel de osteoblastos, osteócitos e osteoclastos no tecido ósseo?","v":"<b>Osteoblastos<\/b> produzem a matriz (fibras colágenas + fosfato de cálcio); presos em lacunas, amadurecem em <b>osteócitos<\/b>, nutridos por canalículos. <b>Osteoclastos<\/b>, gigantes e multinucleados (fusão de monócitos), destroem áreas velhas ou lesadas. Juntos, mantêm o osso em constante remodelação.","x":"Mnemônico: blasto constrói, clasto quebra; se a reabsorção supera a formação, a densidade óssea cai (osteoporose).","r":"Vol. 1 · Cap. 12 · 12.3 Tecido conjuntivo · p. 229","e":null,"h":null,"q":null},{"id":"BIO-V1C12-04","a":"BIO","d":"Volume 1","t":"Cap. 12 · A diversidade celular dos vertebrados","k":"comparação","f":"Compare os três tipos de tecido muscular quanto a núcleos, estrias e controle.","v":"<b>Estriado esquelético<\/b>: fibras longas multinucleadas (núcleos periféricos), estriadas, contração <b>voluntária<\/b>.<br><b>Estriado cardíaco<\/b>: fibras uninucleadas, estriadas, contração <b>involuntária<\/b>; só no coração.<br><b>Liso<\/b>: células fusiformes uninucleadas, <b>sem estrias<\/b>, involuntário (estômago, intestino, útero, vasos).","x":"Pegadinha: o cardíaco é estriado como o esquelético, mas involuntário como o liso; em todos, a contração vem do deslizamento de actina sobre miosina.","r":"Vol. 1 · Cap. 12 · 12.4 Tecido muscular · p. 232","e":null,"h":null,"q":null},{"id":"BIO-V1C12-05","a":"BIO","d":"Volume 1","t":"Cap. 12 · A diversidade celular dos vertebrados","k":"conceito","f":"Quais são as células do tecido nervoso e o que forma a bainha de mielina?","v":"<b>Neurônios<\/b> conduzem impulsos: corpo celular, <b>dendritos<\/b> (curtos e ramificados) e <b>axônio<\/b> (geralmente longo). <b>Gliócitos<\/b> envolvem, protegem e nutrem os neurônios; <b>oligodendrócitos<\/b> e <b>células de Schwann<\/b> formam a <b>bainha de mielina<\/b> ao redor das neurofibras.","x":"O número de neurônios fica quase constante desde o nascimento; o encéfalo cresce na infância pela multiplicação dos gliócitos.","r":"Vol. 1 · Cap. 12 · 12.5 Tecido nervoso · p. 233","e":null,"h":null,"q":null},{"id":"BIO-V2C1-01","a":"BIO","d":"Volume 2","t":"Cap. 1 · Sistemática e classificação biológica","k":"conceito","f":"Qual a sequência hierárquica dos táxons tradicionais, do mais abrangente ao mais restrito?","v":"<b>Reino → Filo → Classe → Ordem → Família → Gênero → Espécie<\/b>. Lineu criou reino, classe, ordem, gênero e espécie; seus seguidores acrescentaram o filo (entre reino e classe) e a família (entre ordem e gênero). Classificações botânicas antigas usam <i>divisão<\/i> no lugar de filo.","x":"Quanto mais restrito o táxon compartilhado, maior a semelhança: dois organismos da mesma ordem estão obrigatoriamente na mesma classe, mas não necessariamente na mesma família.","r":"Vol. 2 · Cap. 1 · 1.1 Fundamentos da classificação biológica · p. 14","e":null,"h":null,"q":null},{"id":"BIO-V2C1-02","a":"BIO","d":"Volume 2","t":"Cap. 1 · Sistemática e classificação biológica","k":"pegadinha","f":"Quais são as regras da nomenclatura binomial de Lineu para escrever um nome científico?","v":"Duas palavras em latim (ou latinizadas): <b>epíteto genérico<\/b> com inicial maiúscula + <b>epíteto específico<\/b> com inicial minúscula, destacados em itálico ou grifados (ex.: <i>Zea mays<\/i>, <i>Musca domestica<\/i>). O gênero pode aparecer sozinho (<i>Canis<\/i> sp., <i>Canis<\/i> spp.); o epíteto específico, nunca.","x":"Armadilha: 'domestica' sozinho não identifica a espécie, pois outros gêneros usam o mesmo epíteto (<i>Curcuma domestica<\/i>, <i>Nandina domestica<\/i>).","r":"Vol. 2 · Cap. 1 · 1.1 Fundamentos da classificação biológica · p. 14","e":null,"h":null,"q":null},{"id":"BIO-V2C1-03","a":"BIO","d":"Volume 2","t":"Cap. 1 · Sistemática e classificação biológica","k":"comparação","f":"Qual a diferença entre homologia e analogia evolutiva? Dê um exemplo de cada.","v":"<b>Homologia<\/b>: estruturas de mesma origem embrionária, herdadas de ancestral comum, que podem ter funções diferentes (braço humano, nadadeira de foca, asas de ave e de morcego); resulta de <b>divergência evolutiva<\/b>.<br><b>Analogia<\/b>: estruturas de origens diferentes com função semelhante, por adaptação a modos de vida parecidos (asa de inseto × asa de ave; corpo hidrodinâmico de marlim, pinguim e golfinho); resulta de <b>convergência evolutiva<\/b>.","x":"Só homologias indicam parentesco; analogias revelam adaptação ao ambiente, não ancestralidade comum.","r":"Vol. 2 · Cap. 1 · 1.2 A Sistemática moderna · p. 16","e":null,"h":null,"q":null},{"id":"BIO-V2C1-04","a":"BIO","d":"Volume 2","t":"Cap. 1 · Sistemática e classificação biológica","k":"aplicação","f":"Como ler uma árvore filogenética para saber quais espécies são mais aparentadas?","v":"Cada ramificação (<b>nó<\/b>) representa uma especiação: uma espécie ancestral originando duas. Descendo pelos ramos, o nó em que duas espécies se encontram indica seu <b>ancestral comum mais recente<\/b>. Quanto mais recente esse nó (mais perto das pontas), maior o parentesco.","x":"O ENEM dá árvores (ex.: hominídeos) e pede o grupo mais próximo: compare a posição dos nós, não a vizinhança dos nomes nas pontas.","r":"Vol. 2 · Cap. 1 · 1.2 A Sistemática moderna · p. 17","e":"ENEM PPL 2017 · Q95 — Filogenia dos hominídeos","h":"H16","q":538},{"id":"BIO-V2C1-05","a":"BIO","d":"Volume 2","t":"Cap. 1 · Sistemática e classificação biológica","k":"conceito","f":"Na cladística, o que são sinapomorfia, clado e grupo monofilético?","v":"<b>Sinapomorfia<\/b>: novidade evolutiva compartilhada por dois ou mais táxons e por seu ancestral comum mais recente (ex.: halteres dos dípteros, mandíbula dos Mandibulata). <b>Clado<\/b>: uma espécie ancestral e todos os seus descendentes. Grupo <b>monofilético<\/b> reúne só descendentes de um ancestral comum exclusivo; <b>polifilético<\/b> reúne espécies de ancestralidades diferentes.","x":"Em cladogramas, o parentesco é dado pelas sinapomorfias compartilhadas, e não pela semelhança geral (que pode incluir analogias).","r":"Vol. 2 · Cap. 1 · 1.2 A Sistemática moderna · p. 18","e":"ENEM PPL 2021 · Q102 — Cladograma e grau de parentesco","h":"H16","q":592},{"id":"BIO-V2C1-06","a":"BIO","d":"Volume 2","t":"Cap. 1 · Sistemática e classificação biológica","k":"pegadinha","f":"Por que, para a cladística, as aves devem ficar no mesmo grupo que os répteis?","v":"As aves apresentam as mesmas sinapomorfias dos répteis e compartilham ancestral comum com os dinossauros. As penas não são exclusivas das aves: ocorriam em grupos extintos com características típicas de répteis. O táxon <b>Reptilia monofilético<\/b> inclui tartarugas, lagartos, crocodilos, dinossauros e aves.","x":"Na classificação tradicional, aves e répteis são classes distintas; questões sobre <i>Archaeopteryx<\/i> e dinossauros com penas cobram a visão cladística.","r":"Vol. 2 · Cap. 1 · 1.2 A Sistemática moderna · p. 19","e":"ENEM PPL 2025 · Q131 — Parentesco evolutivo (aves e dinossauros)","h":"H16","q":421},{"id":"BIO-V2C1-07","a":"BIO","d":"Volume 2","t":"Cap. 1 · Sistemática e classificação biológica","k":"comparação","f":"Compare a proposta de cinco reinos de Whittaker com a de três domínios de Woese.","v":"<b>Whittaker (1969)<\/b>: Monera, Protista, Fungi, Plantae e Animalia (os fungos ganham reino próprio).<br><b>Woese (1990)<\/b>, com base em dados moleculares: domínios <b>Bacteria<\/b>, <b>Archaea<\/b> e <b>Eukarya<\/b>; os procariontes ficam em dois domínios e todos os eucariontes (protoctistas, fungos, plantas e animais) em Eukarya.","x":"Woese separou bactérias e arqueas por diferirem muito em nível molecular, apesar de ambas serem procarióticas. O livro adota 6 reinos.","r":"Vol. 2 · Cap. 1 · 1.3 Quantos reinos existem? · p. 20","e":"ENEM 2017 · Q98 — Classificação dos seres vivos (Whittaker/Woese)","h":"H16","q":703},{"id":"BIO-V2C2-01","a":"BIO","d":"Volume 2","t":"Cap. 2 · Vírus e bactérias","k":"conceito","f":"Quais são os componentes estruturais de um vírus?","v":"Ácido nucleico (<b>DNA ou RNA<\/b>) envolto por uma capa proteica, o <b>capsídio<\/b>; juntos formam o <b>nucleocapsídio<\/b>. Alguns vírus têm <b>envelope<\/b> lipoproteico, formado por fragmentos da membrana plasmática da célula hospedeira. A partícula completa é o <b>vírion<\/b>. Vírus são acelulares.","x":"Catapora e hepatite B são vírus de DNA; gripe, sarampo, pólio e HIV, de RNA. Fora da célula o vírus é inerte: parasita intracelular obrigatório.","r":"Vol. 2 · Cap. 2 · 2.1 Vírus · p. 27","e":null,"h":null,"q":null},{"id":"BIO-V2C2-02","a":"BIO","d":"Volume 2","t":"Cap. 2 · Vírus e bactérias","k":"conceito","f":"Por que cada vírus só infecta certos tipos de célula de uma ou poucas espécies?","v":"A infecção depende do encaixe tipo chave-fechadura entre <b>proteínas ligantes<\/b> da superfície do vírion e <b>receptores virais<\/b> específicos da membrana da célula hospedeira. Só células com receptores compatíveis podem ser infectadas.","x":"Explica por que mutações em proteínas de superfície (como na hemaglutinina da gripe aviária) podem permitir ao vírus infectar uma nova espécie, inclusive a humana.","r":"Vol. 2 · Cap. 2 · 2.1 Vírus · p. 27","e":"ENEM PPL 2025 · Q100 — Viroses emergentes (relação vírus-hospedeiro)","h":"H10","q":708},{"id":"BIO-V2C2-03","a":"BIO","d":"Volume 2","t":"Cap. 2 · Vírus e bactérias","k":"processo","f":"Quais são as etapas do ciclo reprodutivo do bacteriófago T4?","v":"1) <b>Adesão<\/b> da cauda a receptores da parede bacteriana; 2) <b>penetração<\/b>: só o DNA é injetado (cabeça e cauda ficam fora); 3) <b>biossíntese<\/b>: o DNA viral comanda a síntese dos componentes virais; 4) <b>maturação<\/b>: montagem de novos vírions; 5) <b>liberação<\/b>: a bactéria se rompe (cerca de 30 min) e libera dezenas de fagos.","x":"O vírus usa a maquinaria bioquímica da célula; por isso não tem metabolismo próprio fora da hospedeira.","r":"Vol. 2 · Cap. 2 · 2.1 Vírus · p. 28","e":null,"h":null,"q":null},{"id":"BIO-V2C2-04","a":"BIO","d":"Volume 2","t":"Cap. 2 · Vírus e bactérias","k":"aplicação","f":"Quais são as vias de transmissão de doenças virais e que medida bloqueia cada uma?","v":"<b>Gotículas<\/b> de muco ao falar, rir ou espirrar (gripe): máscaras e cuidados respiratórios. <b>Contato direto<\/b> (herpes). <b>Secreções<\/b>: saliva (raiva), sangue e esperma (HIV). <b>Água e alimentos<\/b> contaminados por fezes (pólio, hepatite A, gastrenterites): saneamento. <b>Vetores<\/b> artrópodes (arbovírus): controle do vetor.","x":"Questões pedem a medida coerente com a via: máscara protege contra vírus respiratórios, mas não contra os transmitidos por água ou mosquito.","r":"Vol. 2 · Cap. 2 · 2.1 Vírus · p. 28","e":"ENEM PPL 2024 · Q112 — Máscaras e transmissão viral","h":"H30","q":431},{"id":"BIO-V2C2-05","a":"BIO","d":"Volume 2","t":"Cap. 2 · Vírus e bactérias","k":"aplicação","f":"O que são arbovírus e por que combater o <i>Aedes aegypti<\/i> é a principal prevenção?","v":"Arbovírus são vírus transmitidos por artrópodes (dengue, febre amarela urbana, chikungunya, zika). A fêmea do <i>A. aegypti<\/i> adquire o vírus ao picar uma pessoa infectada ou por <b>transmissão vertical<\/b> (da fêmea para a prole). Ela põe ovos em água limpa e parada, e os ovos resistem ao dessecamento por mais de 1 ano; por isso é essencial evitar acúmulos de água.","x":"Pegadinha: o mosquito é o vetor, não o agente causador; ovos secos em recipientes eclodem quando voltam a ter água.","r":"Vol. 2 · Cap. 2 · 2.1 Vírus · p. 29","e":"ENEM 2024 · Q104 — Arboviroses e controle de vetores","h":"H12","q":741},{"id":"BIO-V2C2-06","a":"BIO","d":"Volume 2","t":"Cap. 2 · Vírus e bactérias","k":"comparação","f":"Diferencie epidemia, endemia, pandemia e surto.","v":"<b>Epidemia<\/b>: aumento súbito no número de casos de uma doença numa população. <b>Endemia<\/b>: doença mantida em frequência praticamente constante numa região. <b>Pandemia<\/b>: onda epidêmica que atinge mais de um continente, podendo durar anos. <b>Surto<\/b>: forma particular de epidemia em que todos os casos estão relacionados entre si.","x":"O critério não é o número absoluto de casos, e sim a variação no tempo (epidemia × endemia) e a extensão geográfica (pandemia).","r":"Vol. 2 · Cap. 2 · 2.1 Vírus · p. 29","e":null,"h":null,"q":null},{"id":"BIO-V2C2-07","a":"BIO","d":"Volume 2","t":"Cap. 2 · Vírus e bactérias","k":"conceito","f":"Como uma vacina antiviral protege o organismo?","v":"A vacina contém vírus <b>mortos ou atenuados<\/b> (ou partes deles). O organismo reage produzindo <b>anticorpos específicos<\/b>; se depois a pessoa for infectada, esses anticorpos combatem rapidamente a infecção. Campanhas amplas de vacinação erradicaram a varíola no mundo.","x":"Vacina é prevenção (o organismo produz a própria defesa), não tratamento; e antibióticos não eliminam vírus.","r":"Vol. 2 · Cap. 2 · 2.1 Vírus · p. 29","e":"ENEM 2013 · Q50 — Vacinação e prevenção (experimento de Jenner)","h":"H15","q":552},{"id":"BIO-V2C2-08","a":"BIO","d":"Volume 2","t":"Cap. 2 · Vírus e bactérias","k":"processo","f":"Por que surgem novos surtos de gripe, e até pandemias, mesmo após a população adquirir imunidade?","v":"O vírus da gripe tem espículas <b>H<\/b> (hemaglutinina, liga o vírus à célula) e <b>N<\/b> (neuraminidase, libera os novos vírus). <b>Mutações<\/b> alteram levemente H e N e dificultam a ação dos anticorpos, causando novos surtos. A <b>recombinação<\/b> entre vírus de aves, porcos e humanos numa mesma célula gera variedades não reconhecidas pelo sistema imune, capazes de causar pandemias.","x":"Por isso a vacina antigripal é refeita com as formas virais mais recentes; siglas como H1N1 e H5N1 indicam os tipos de espícula.","r":"Vol. 2 · Cap. 2 · 2.1 Vírus · p. 30","e":null,"h":null,"q":null},{"id":"BIO-V2C2-09","a":"BIO","d":"Volume 2","t":"Cap. 2 · Vírus e bactérias","k":"conceito","f":"Quais são as estruturas típicas de uma célula bacteriana?","v":"Célula <b>procariótica<\/b>: sem núcleo e sem organelas membranosas. Tem parede bacteriana, membrana plasmática, ribossomos, <b>cromossomo circular<\/b> no <b>nucleoide<\/b> (sem envoltório) e, às vezes, <b>plasmídios<\/b> (DNA circular extra, não essencial, com genes que destroem substâncias prejudiciais). Pode ter flagelos e cápsula.","x":"Estruturas exclusivas das bactérias, como a parede bacteriana, ajudam a entender por que antibióticos atingem bactérias sem destruir células humanas.","r":"Vol. 2 · Cap. 2 · 2.2 Bactérias e arqueas · p. 32","e":"ENEM PPL 2016 · Q58 — Procariontes e uso de antibióticos","h":"H2","q":595},{"id":"BIO-V2C2-10","a":"BIO","d":"Volume 2","t":"Cap. 2 · Vírus e bactérias","k":"comparação","f":"Diferencie bactérias aeróbicas, anaeróbicas facultativas e anaeróbicas obrigatórias.","v":"<b>Aeróbicas<\/b>: obtêm energia apenas por respiração aeróbica e dependem de O<sub>2<\/sub>. <b>Anaeróbicas facultativas<\/b>: fazem respiração aeróbica ou fermentação, conforme haja ou não O<sub>2<\/sub>. <b>Anaeróbicas obrigatórias<\/b>: não toleram O<sub>2<\/sub> e morrem se expostas a ele (ex.: bactéria do tétano).","x":"Aplicação típica: embalagem a vácuo barra as aeróbicas, mas não as anaeróbicas; ferimentos profundos e pouco oxigenados favorecem o tétano.","r":"Vol. 2 · Cap. 2 · 2.2 Bactérias e arqueas · p. 34","e":"ENEM 2024 · Q124 — Respiração bacteriana (aerobiose/anaerobiose)","h":"H15","q":570},{"id":"BIO-V2C2-11","a":"BIO","d":"Volume 2","t":"Cap. 2 · Vírus e bactérias","k":"comparação","f":"Como as bactérias, que não têm reprodução sexuada, adquirem novos genes?","v":"Por recombinação gênica: <b>transformação<\/b> (captação de DNA disperso no ambiente), <b>conjugação<\/b> (transferência de DNA por um pelo sexual oco, o <i>pilus<\/i>) e <b>transdução<\/b> (DNA bacteriano levado de uma bactéria a outra por bacteriófagos). A reprodução é assexuada, por <b>divisão binária<\/b>, gerando clones.","x":"A insulina humana comercial é feita por transformação: o gene humano é inserido em plasmídios absorvidos por <i>Escherichia coli<\/i>.","r":"Vol. 2 · Cap. 2 · 2.2 Bactérias e arqueas · p. 34","e":null,"h":null,"q":null},{"id":"BIO-V2C2-12","a":"BIO","d":"Volume 2","t":"Cap. 2 · Vírus e bactérias","k":"conceito","f":"O que caracteriza as arqueas e qual seu parentesco com bactérias e eucariontes?","v":"São procariontes parecidos com bactérias em tamanho e aparência, mas com organização e funcionamento gênicos distintos, revelados por análise molecular. Vivem em ambientes extremos: <b>halófilas<\/b> (alta salinidade), <b>termoacidófilas<\/b> (fontes termais ácidas, 60–80 °C) e <b>metanogênicas<\/b> (pântanos, tubo digestivo de cupins e herbívoros). São evolutivamente <b>mais próximas dos eucariontes<\/b> que das bactérias.","x":"Pegadinha: ser procarionte não significa ser bactéria; arqueas formam reino (e domínio) próprio.","r":"Vol. 2 · Cap. 2 · 2.2 Bactérias e arqueas · p. 35","e":null,"h":null,"q":null},{"id":"BIO-V2C2-13","a":"BIO","d":"Volume 2","t":"Cap. 2 · Vírus e bactérias","k":"aplicação","f":"O que é biorremediação e que exemplo o livro apresenta?","v":"É o uso de microrganismos, principalmente bactérias, para limpar áreas contaminadas por poluentes. Bactérias do gênero <i>Pseudomonas<\/i> oxidam pesticidas e petróleo, transformando-os em substâncias inócuas. É mais simples, barata e menos prejudicial que recolher e transportar os poluentes.","x":"Em derramamentos de petróleo, o ENEM pede para reconhecer a degradação biológica dos compostos orgânicos como alternativa aos métodos físicos.","r":"Vol. 2 · Cap. 2 · 2.2 Bactérias e arqueas · p. 36","e":"ENEM PPL 2020 · Q102 — Biorremediação por bactérias","h":"H29","q":579},{"id":"BIO-V2C2-14","a":"BIO","d":"Volume 2","t":"Cap. 2 · Vírus e bactérias","k":"conceito","f":"Qual o papel das bactérias que vivem normalmente em nosso corpo, e o que são bactérias oportunistas?","v":"A comunidade bacteriana da pele (cerca de 100 mil bactérias por cm²) <b>impede que agentes causadores de doenças<\/b> invadam o organismo. <b>Oportunistas<\/b> são bactérias que só causam doença quando as defesas estão debilitadas (ex.: <i>Streptococcus pneumoniae<\/i>; infecções oportunistas na aids).","x":"Base para entender probióticos: microrganismos benéficos ocupam espaço e recursos, dificultando a instalação de patógenos.","r":"Vol. 2 · Cap. 2 · 2.2 Bactérias e arqueas · p. 36","e":"ENEM 2016 · Q79 — Probióticos e exclusão de patógenos","h":"H29","q":553},{"id":"BIO-V2C2-15","a":"BIO","d":"Volume 2","t":"Cap. 2 · Vírus e bactérias","k":"pegadinha","f":"O que são antibióticos e por que não servem para tratar gripe ou dengue?","v":"São substâncias capazes de matar bactérias, extraídas de fungos e bactérias (a penicilina foi descoberta por Fleming, em 1929, no fungo <i>Penicillium<\/i>); muitas são modificadas quimicamente. Agem sobre bactérias e <b>não eliminam infecções virais<\/b>. O <b>antibiograma<\/b> testa a sensibilidade da bactéria a vários antibióticos para escolher o mais eficaz.","x":"Indicar antibiótico contra virose é erro clássico de alternativa; contra vírus usam-se vacinas e alguns antivirais.","r":"Vol. 2 · Cap. 2 · 2.2 Bactérias e arqueas · p. 37","e":"ENEM 2017 · Q92 — Antibióticos e doenças bacterianas","h":"H2","q":611},{"id":"BIO-V2C3-01","a":"BIO","d":"Volume 2","t":"Cap. 3 · Algas, protozoários e fungos","k":"conceito","f":"O que é fitoplâncton e qual sua importância ecológica?","v":"É o conjunto de seres planctônicos <b>fotossintetizantes<\/b> (algas microscópicas como diatomáceas, dinoflagelados e crisófitas, além de bactérias) que flutuam nas camadas superficiais de mares e lagos. É a base das cadeias alimentares aquáticas e mantém, por fotossíntese, o teor de O<sub>2<\/sub> atmosférico (cerca de 21%).","x":"Em cadeias alimentares marinhas, as algas são os produtores; seu desaparecimento afetaria todos os consumidores e o O<sub>2<\/sub> do planeta.","r":"Vol. 2 · Cap. 3 · 3.1 Algas · p. 43","e":"ENEM PPL 2021 · Q135 — Algas como produtores (base da cadeia)","h":"H4","q":517},{"id":"BIO-V2C3-02","a":"BIO","d":"Volume 2","t":"Cap. 3 · Algas, protozoários e fungos","k":"processo","f":"Como é a alternância de gerações na alga verde <i>Ulva<\/i> (alface-do-mar)?","v":"O <b>esporófito<\/b> (2n) produz, por <b>meiose espórica<\/b>, esporos haploides que originam <b>gametófitos<\/b> (n). Estes formam gametas flagelados por <b>mitose<\/b>; os gametas se fundem e geram o zigoto (2n), que se desenvolve em novo esporófito. Em <i>Ulva<\/i>, os dois tipos de talo têm aparência muito semelhante.","x":"Pegadinha: no gametófito os gametas surgem por mitose; a meiose ocorre na formação dos esporos.","r":"Vol. 2 · Cap. 3 · 3.1 Algas · p. 47","e":null,"h":null,"q":null},{"id":"BIO-V2C3-03","a":"BIO","d":"Volume 2","t":"Cap. 3 · Algas, protozoários e fungos","k":"processo","f":"Por que a malária causa picos de febre em intervalos regulares de 48 ou 72 horas?","v":"Os merozoítos de <i>Plasmodium<\/i> se multiplicam dentro das hemácias e as rompem de modo <b>sincrônico<\/b>, liberando novos parasitas e substâncias tóxicas no plasma. Isso ocorre a cada <b>48 h<\/b> (<i>P. vivax<\/i> e <i>P. falciparum<\/i>) ou <b>72 h<\/b> (<i>P. malariae<\/i>), coincidindo com febre de 39–40 °C e calafrios.","x":"O ENEM liga a crise febril à ruptura das hemácias, não à picada do mosquito nem à fase no fígado. Transmissão: picada da fêmea d
