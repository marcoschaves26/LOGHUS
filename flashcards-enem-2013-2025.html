/b> (micropartículas de tungstênio cobertas de DNA). Exemplo: tabaco com gene da luciferase de vaga-lume, que brilha ao receber luciferina.","x":"Como a planta vem de uma única célula transformada, todas as suas células carregam o transgene.","r":"Vol. 3 · Cap. 4 · 4.5 Misturando genes entre espécies: transgênicos · p. 90","e":"ENEM 2014 · Q69 — Planta transgênica (DNA recombinante)","h":"H11","q":555},{"id":"BIO-V3C4-13","a":"BIO","d":"Volume 3","t":"Cap. 4 · Genética e biotecnologia na atualidade","k":"comparação","f":"Qual a diferença entre a soja transgênica resistente a herbicida e o milho Bt?","v":"<b>Soja<\/b>: recebeu um gene bacteriano de <b>resistência a herbicida<\/b>; o produtor aplica herbicida que mata as ervas daninhas e poupa a soja. <b>Milho Bt<\/b>: recebeu um gene de <i>Bacillus thuringiensis<\/i> e produz uma substância <b>tóxica para insetos<\/b> e inofensiva para vertebrados, o que reduz o uso de inseticidas. No Brasil, OGMs são regulados pela <b>CTNBio<\/b> (Lei 11.105/2005).","x":"Não inverta: a soja tolera herbicida (não mata a planta daninha sozinha); o milho Bt é que combate insetos-praga.","r":"Vol. 3 · Cap. 4 · 4.5 Misturando genes entre espécies: transgênicos · p. 91","e":null,"h":null,"q":null},{"id":"BIO-V3C4-14","a":"BIO","d":"Volume 3","t":"Cap. 4 · Genética e biotecnologia na atualidade","k":"conceito","f":"O que é geneterapia (terapia gênica)?","v":"Tratamento de doenças genéticas pela <b>introdução de cópias normais de um gene em células doentes<\/b>, 'transformando-as' em células sadias. Na mesma linha, já é possível <b>silenciar<\/b> genes ligados a doenças (como no melanoma).","x":"Se só células somáticas forem modificadas, a correção beneficia o paciente mas não passa aos filhos.","r":"Vol. 3 · Cap. 4 · 4.6 Desvendando o genoma humano · p. 91","e":"ENEM 2022 · Q98 — Terapia gênica (distrofia da retina)","h":"H29","q":693},{"id":"BIO-V3C4-15","a":"BIO","d":"Volume 3","t":"Cap. 4 · Genética e biotecnologia na atualidade","k":"pegadinha","f":"O que o Projeto Genoma revelou sobre o número de genes humanos e a fração codificante do genoma?","v":"Cerca de <b>3,2 bilhões de pares de bases<\/b>, mas só cerca de <b>2% correspondem a genes<\/b>, que são <b>20 a 25 mil<\/b>, bem menos que os 100 mil previstos e próximo do camundongo. Há mais tipos de proteína que de genes graças ao <b>splicing alternativo<\/b>; boa parte do DNA não codificante (cerca de 80%) tem função reguladora. Cerca de 99,9% da sequência é igual entre as pessoas.","x":"Complexidade do organismo não é proporcional ao número de genes: um gene pode gerar várias proteínas.","r":"Vol. 3 · Cap. 4 · 4.6 Desvendando o genoma humano · p. 92","e":"ENEM 2018 · Q110 — Genoma e número de genes (cevada)","h":"H3","q":694},{"id":"BIO-V3C5-01","a":"BIO","d":"Volume 3","t":"Cap. 5 · Os fundamentos da evolução biológica","k":"conceito","f":"Quais são as duas \"leis\" com que Lamarck explicou a transformação das espécies?","v":"<b>Lei do uso e desuso<\/b>: o ambiente força mudanças de hábito; órgãos muito usados se desenvolvem e os pouco usados atrofiam. <b>Lei da transmissão das características adquiridas<\/b>: essas modificações passariam aos descendentes. Ex.: as serpentes teriam perdido as pernas por desuso.","x":"Modificações por uso ou desuso não são herdadas — esse é o erro central do lamarckismo; sua contribuição válida foi destacar a adaptação gradual ao ambiente.","r":"Vol. 3 · Cap. 5 · 5.1 O pensamento evolucionista · p. 104","e":null,"h":null,"q":null},{"id":"BIO-V3C5-02","a":"BIO","d":"Volume 3","t":"Cap. 5 · Os fundamentos da evolução biológica","k":"comparação","f":"Como Lamarck e Darwin explicariam o pescoço longo das girafas?","v":"<b>Lamarck<\/b>: os ancestrais esticavam o pescoço para alcançar folhas altas; o alongamento adquirido pelo uso seria herdado, geração após geração.<br><b>Darwin<\/b>: já havia <b>variação<\/b> no comprimento do pescoço; os de pescoço mais longo sobreviviam e deixavam mais descendentes (<b>seleção natural<\/b>), que herdavam a característica.","x":"Frases como \"para se adaptar\", \"por necessidade\" ou \"o uso desenvolveu\" denunciam raciocínio lamarckista; \"os que já tinham a característica deixaram mais descendentes\" é darwinista.","r":"Vol. 3 · Cap. 5 · 5.1 O pensamento evolucionista · p. 105","e":"ENEM PPL 2016 · Q74 — Adaptação em Darwin e em Lamarck","h":"H16","q":543},{"id":"BIO-V3C5-03","a":"BIO","d":"Volume 3","t":"Cap. 5 · Os fundamentos da evolução biológica","k":"conceito","f":"Que ideia central Darwin usou para explicar a semelhança entre espécies de ilhas vizinhas, como jabutis e pássaros de Galápagos?","v":"<b>Descendência com modificação<\/b>: as espécies das ilhas descendem de uma mesma espécie ancestral vinda do continente; em cada ilha, as populações sofreram adaptações próprias e se diversificaram. Ex.: fringilídeos de Galápagos com bicos adaptados a sementes, insetos ou cactos.","x":"Para a ciência, evolução é modificação das características ao longo das gerações — não \"progresso\" rumo a seres superiores, como sugere o senso comum.","r":"Vol. 3 · Cap. 5 · 5.1 O pensamento evolucionista · p. 107","e":"ENEM 2014 · Q53 — Evolução como modificação (senso comum)","h":"H3","q":null},{"id":"BIO-V3C5-04","a":"BIO","d":"Volume 3","t":"Cap. 5 · Os fundamentos da evolução biológica","k":"aplicação","f":"Por que a seleção artificial (raças de cães, variedades de couve) foi o principal argumento de Darwin contra a imutabilidade das espécies?","v":"Criadores deixam reproduzir só os indivíduos com as características desejadas, e em poucos séculos surgem formas muito diferentes: repolho, brócolis, couve-flor e couve-frisada vêm todos da mostarda selvagem <i>Brassica oleracea<\/i>. Darwin deduziu que a natureza exerce uma seleção análoga, em escala de tempo muito maior.","x":"Na seleção artificial o agente seletivo é o ser humano e o critério é o interesse dele, não a adaptação ao ambiente — por isso raças domésticas podem ter traços desvantajosos na natureza.","r":"Vol. 3 · Cap. 5 · 5.1 O pensamento evolucionista · p. 108","e":"ENEM PPL 2024 · Q113 — Raças de cães (seleção artificial)","h":"H16","q":750},{"id":"BIO-V3C5-05","a":"BIO","d":"Volume 3","t":"Cap. 5 · Os fundamentos da evolução biológica","k":"pegadinha","f":"Em última análise, o que a seleção natural favorece: a sobrevivência ou a reprodução?","v":"A <b>reprodução diferencial<\/b>: os mais bem adaptados têm maior chance de <b>deixar descendentes<\/b>. A \"luta pela vida\" inclui formas pouco evidentes, como machos disputando fêmeas e plantas competindo por luz, água e nutrientes.","x":"Um comportamento que mata o indivíduo (como o macho devorado após a cópula) pode ser favorecido se aumentar o número de descendentes que ele deixa.","r":"Vol. 3 · Cap. 5 · 5.3 A teoria sintética da evolução · p. 121","e":"ENEM 2013 · Q60 — Canibalismo sexual e sucesso reprodutivo","h":"H16","q":580},{"id":"BIO-V3C5-06","a":"BIO","d":"Volume 3","t":"Cap. 5 · Os fundamentos da evolução biológica","k":"conceito","f":"Quais são os principais tipos de fóssil descritos no livro?","v":"<b>Molde<\/b> (impressão deixada na rocha pelo organismo, que depois desaparece); <b>contramolde<\/b> (molde preenchido por minerais, cópia 3D); <b>permineralização<\/b> ou petrificação (matéria orgânica substituída por minerais, como os troncos petrificados do RS); <b>impressões<\/b> (pegadas); e preservação total em <b>âmbar<\/b> ou no <b>gelo<\/b> (mamutes).","x":"Fóssil é qualquer vestígio de ser que viveu no passado, não só osso petrificado; em rochas sedimentares, camadas mais profundas guardam fósseis mais antigos.","r":"Vol. 3 · Cap. 5 · 5.2 Evidências da evolução biológica · p. 112","e":"ENEM PPL 2025 · Q98 — Evidências evolutivas (fósseis)","h":"H16","q":633},{"id":"BIO-V3C5-07","a":"BIO","d":"Volume 3","t":"Cap. 5 · Os fundamentos da evolução biológica","k":"comparação","f":"Diferencie órgãos homólogos e análogos e o tipo de evolução que cada um indica.","v":"<b>Homólogos<\/b>: mesma origem embrionária e plano estrutural, funções que podem diferir (braço humano, nadadeira de golfinho, asa de morcego) → <b>divergência evolutiva<\/b> a partir de ancestral comum.<br><b>Análogos<\/b>: mesma função, origens diferentes (asa de ave × asa de inseto) → <b>convergência evolutiva<\/b> por pressões adaptativas semelhantes.","x":"A forma hidrodinâmica de golfinho, pirarucu, ictiossauro e pinguim é convergência; já asa de morcego e asa de ave são homólogas como membros anteriores.","r":"Vol. 3 · Cap. 5 · 5.2 Evidências da evolução biológica · p. 116","e":null,"h":null,"q":null},{"id":"BIO-V3C5-08","a":"BIO","d":"Volume 3","t":"Cap. 5 · Os fundamentos da evolução biológica","k":"conceito","f":"Por que os genes homeóticos (Hox, Pax-6) são considerados forte evidência de parentesco evolutivo?","v":"Esses genes comandam o plano corporal do embrião e são quase idênticos em moscas, camundongos e humanos, com a mesma função. O <i>Pax-6<\/i> de camundongo induziu olhos normais numa mosca mutante. A explicação evolutiva: foram herdados de um <b>ancestral comum<\/b> a todos os animais.","x":"Semelhanças moleculares — genes, código genético, maquinaria de síntese de proteínas — são usadas como evidência de ancestralidade comum entre espécies muito distintas.","r":"Vol. 3 · Cap. 5 · 5.2 Evidências da evolução biológica · p. 118","e":"ENEM 2016 · Q90 — Ancestralidade comum (síntese proteica)","h":"H16","q":575},{"id":"BIO-V3C5-09","a":"BIO","d":"Volume 3","t":"Cap. 5 · Os fundamentos da evolução biológica","k":"conceito","f":"Quais fatores evolutivos a teoria sintética considera e qual o papel de cada um?","v":"A teoria sintética (neodarwinismo) une a seleção natural à Genética. <b>Mutação gênica<\/b> (novos alelos) e <b>recombinação gênica<\/b> (segregação independente e crossing-over na meiose) geram a <b>variabilidade genética<\/b>; a <b>seleção natural<\/b> atua sobre ela e orienta o rumo da evolução.","x":"Seleção natural não cria variação, apenas a filtra; Darwin não sabia explicar a origem das variações, lacuna preenchida pela Genética.","r":"Vol. 3 · Cap. 5 · 5.3 A teoria sintética da evolução · p. 119","e":null,"h":null,"q":null},{"id":"BIO-V3C5-10","a":"BIO","d":"Volume 3","t":"Cap. 5 · Os fundamentos da evolução biológica","k":"pegadinha","f":"O antibiótico causa o surgimento de bactérias resistentes?","v":"Não. Mutantes resistentes surgem <b>ao acaso<\/b>, com ou sem antibiótico. O antibiótico é um <b>agente seletivo<\/b>: elimina as bactérias sensíveis e deixa os recursos para as resistentes, que se multiplicam. O uso indiscriminado acelera essa seleção (o mesmo vale para inseticidas).","x":"Alternativas erradas típicas: \"o antibiótico induziu mutações\" ou \"a bactéria criou resistência para sobreviver\" — o fármaco seleciona, não produz, a resistência.","r":"Vol. 3 · Cap. 5 · 5.3 A teoria sintética da evolução · p. 122","e":"ENEM PPL 2015 · Q64 — Resistência bacteriana a antibióticos","h":null,"q":581},{"id":"BIO-V3C5-11","a":"BIO","d":"Volume 3","t":"Cap. 5 · Os fundamentos da evolução biológica","k":"aplicação","f":"Como a seleção natural explica o melanismo industrial da mariposa <i>Biston betularia<\/i>?","v":"Com a fuligem das indústrias (a partir de 1850), os troncos perderam os liquens e escureceram. As mariposas claras ficaram visíveis e foram mais comidas por pássaros, enquanto a forma <b>melânica<\/b>, antes rara, ficou camuflada e passou a predominar. O agente seletivo é a <b>predação<\/b>.","x":"A poluição não escureceu as mariposas nem induziu mutação: mudou o ambiente e, com isso, qual variedade já existente era favorecida.","r":"Vol. 3 · Cap. 5 · 5.4 Adaptação e evolução · p. 126","e":null,"h":null,"q":null},{"id":"BIO-V3C5-12","a":"BIO","d":"Volume 3","t":"Cap. 5 · Os fundamentos da evolução biológica","k":"comparação","f":"Diferencie mimetismo batesiano e mülleriano.","v":"<b>Batesiano<\/b>: espécie inofensiva ou palatável se parece com um modelo tóxico ou perigoso (falsa-coral × coral-verdadeira; borboleta vice-rei × monarca) — o imitador se beneficia.<br><b>Mülleriano<\/b>: várias espécies tóxicas ou perigosas compartilham o mesmo padrão de aviso (corais-verdadeiras entre si) — todas ganham, pois o predador aprende um só padrão.","x":"Mimetismo é semelhança entre espécies diferentes reconhecida por um terceiro (o predador); semelhança com o ambiente é camuflagem.","r":"Vol. 3 · Cap. 5 · 5.4 Adaptação e evolução · p. 128","e":"ENEM 2024 · Q110 — Mimetismo (cobras-corais)","h":"H28","q":505},{"id":"BIO-V3C6-01","a":"BIO","d":"Volume 3","t":"Cap. 6 · A origem de novas espécies e dos grandes grupos de seres vivos","k":"conceito","f":"Qual é o conceito biológico de espécie proposto por Ernst Mayr e qual sua limitação?","v":"Espécie é um grupo de populações cujos indivíduos <b>cruzam entre si em condições naturais<\/b> e geram <b>descendentes férteis<\/b>, estando reprodutivamente isolados de outras espécies. O critério é reprodutivo, não a aparência. Limitação: não se aplica a seres de reprodução assexuada, como bactérias.","x":"Cavalo e jumento geram a mula, que é estéril — por isso são espécies diferentes; já raças muito distintas de cães pertencem à mesma espécie.","r":"Vol. 3 · Cap. 6 · 6.1 O processo evolutivo e a diversificação da vida · p. 136","e":null,"h":null,"q":null},{"id":"BIO-V3C6-02","a":"BIO","d":"Volume 3","t":"Cap. 6 · A origem de novas espécies e dos grandes grupos de seres vivos","k":"processo","f":"Quais são as etapas da especiação alopátrica?","v":"1) <b>Isolamento geográfico<\/b> separa populações e bloqueia o fluxo gênico. 2) Mutação, recombinação e <b>seleção natural<\/b> diferente em cada ambiente acumulam diferenças (anagênese em cada ramo). 3) Surge <b>isolamento reprodutivo<\/b>: mesmo reunidas, as populações não geram prole fértil → duas espécies (cladogênese).","x":"A barreira geográfica sozinha não cria nova espécie; ela só existe quando há isolamento reprodutivo. A especiação simpátrica dispensa a barreira geográfica.","r":"Vol. 3 · Cap. 6 · 6.1 O processo evolutivo e a diversificação da vida · p. 137","e":"ENEM 2020 · Q101 — Especiação por isolamento","h":"H16","q":572},{"id":"BIO-V3C6-03","a":"BIO","d":"Volume 3","t":"Cap. 6 · A origem de novas espécies e dos grandes grupos de seres vivos","k":"aplicação","f":"O que são subespécies (raças) e o que acontece se seus membros passam a cruzar livremente?","v":"São populações da mesma espécie que diferem em algumas características e se mantêm distintas porque raramente se cruzam, em geral por isolamento prévio. Com cruzamento livre, o <b>fluxo gênico<\/b> mistura os genes e as diferenças tendem a desaparecer. O cão é considerado subespécie do lobo (<i>Canis lupus familiaris<\/i>).","x":"Raças de cães se mantêm pelo controle humano dos cruzamentos; o fluxo gênico entre elas é possível porque continuam sendo uma só espécie.","r":"Vol. 3 · Cap. 6 · 6.1 O processo evolutivo e a diversificação da vida · p. 137","e":"ENEM 2015 · Q56 — Fluxo gênico entre raças (cães domésticos)","h":"H16","q":663},{"id":"BIO-V3C6-04","a":"BIO","d":"Volume 3","t":"Cap. 6 · A origem de novas espécies e dos grandes grupos de seres vivos","k":"comparação","f":"Quais mecanismos de isolamento reprodutivo o livro descreve?","v":"Antes da formação do zigoto: isolamento de <b>hábitat<\/b> (leão na savana × tigre na floresta), <b>sazonal<\/b> (épocas reprodutivas diferentes), <b>etológico<\/b> (corte nupcial incompatível) e <b>mecânico<\/b> (genitais ou tubo polínico incompatíveis).<br>Depois: <b>inviabilidade do híbrido<\/b> (embrião morre) e <b>esterilidade do híbrido<\/b> (mula, ligre).","x":"Gerar híbrido não prova que é a mesma espécie: se o híbrido é estéril, o isolamento reprodutivo continua existindo.","r":"Vol. 3 · Cap. 6 · 6.1 O processo evolutivo e a diversificação da vida · p. 139","e":"ENEM 2018 · Q106 — Especiação e isolamento reprodutivo","h":"H17","q":626},{"id":"BIO-V3C6-05","a":"BIO","d":"Volume 3","t":"Cap. 6 · A origem de novas espécies e dos grandes grupos de seres vivos","k":"comparação","f":"Por que os anfíbios não conquistaram totalmente a terra firme e que novidade resolveu isso nos répteis?","v":"A reprodução dos anfíbios segue dependente da água: fecundação externa e larva aquática com brânquias. A conquista definitiva veio com o <b>ovo amniótico<\/b> e seus <b>anexos embrionários<\/b>, que permitem o desenvolvimento do embrião fora da água — base do sucesso de répteis, aves e mamíferos (<b>amniotas<\/b>).","x":"Nas plantas, a novidade equivalente foi a <b>semente<\/b>, que tornou a reprodução independente da água líquida.","r":"Vol. 3 · Cap. 6 · 6.2 A origem dos grandes grupos de seres vivos · p. 149","e":null,"h":null,"q":null},{"id":"BIO-V3C6-06","a":"BIO","d":"Volume 3","t":"Cap. 6 · A origem de novas espécies e dos grandes grupos de seres vivos","k":"conceito","f":"O que é irradiação adaptativa? Dê o exemplo dos marsupiais australianos.","v":"Diversificação rápida de um grupo a partir de um ancestral, ocupando muitos nichos diferentes. Os marsupiais chegaram à Austrália há 60–55 Ma; isolada após se separar da Antártida e sem placentários competidores, a Austrália viu esses marsupiais se diversificarem em inúmeras formas.","x":"Irradiação adaptativa gera divergência (ancestral comum, formas diferentes); não confundir com convergência (grupos distantes, formas parecidas).","r":"Vol. 3 · Cap. 6 · 6.2 A origem dos grandes grupos de seres vivos · p. 153","e":null,"h":null,"q":null},{"id":"BIO-V3C7-01","a":"BIO","d":"Volume 3","t":"Cap. 7 · Evolução humana","k":"pegadinha","f":"O ser humano descende do chimpanzé?","v":"Não. Humanos e chimpanzés/bonobos compartilham um <b>ancestral comum<\/b> que viveu há cerca de 7–8 milhões de anos; as linhagens se separaram por cladogênese. Nenhuma espécie atual de macaco é ancestral da nossa. Somos cerca de 98% idênticos aos chimpanzés nas regiões do DNA que contêm genes.","x":"Espécies modernas não descendem de outras espécies modernas; a diferença de 46 × 48 cromossomos vem da fusão de dois cromossomos que formou o cromossomo 2 humano.","r":"Vol. 3 · Cap. 7 · 7.1 Nosso parentesco evolutivo com os grandes macacos · p. 163","e":null,"h":null,"q":null},{"id":"BIO-V3C7-02","a":"BIO","d":"Volume 3","t":"Cap. 7 · Evolução humana","k":"conceito","f":"Que adaptações à vida nas árvores marcaram a evolução dos primatas?","v":"<b>Polegar oponível<\/b> (agarrar com força e precisão); <b>visão binocular<\/b> ou estereoscópica (olhos frontais que permitem calcular distâncias nos saltos); membros superiores com ampla rotação; e <b>cuidado prolongado com a prole<\/b> (em geral um filhote por gestação), que favoreceu a vida social e a transmissão cultural.","x":"Essas características são do grupo dos primatas como um todo, não exclusivas da espécie humana; exclusivos da nossa linhagem são o bipedalismo pleno e o encéfalo muito grande.","r":"Vol. 3 · Cap. 7 · 7.2 História evolutiva dos primatas · p. 170","e":null,"h":null,"q":null},{"id":"BIO-V3C7-03","a":"BIO","d":"Volume 3","t":"Cap. 7 · Evolução humana","k":"pegadinha","f":"Na evolução humana, o que surgiu primeiro: o bipedalismo ou o cérebro grande?","v":"O <b>bipedalismo<\/b>. Australopitecos como <i>A. afarensis<\/i> (\"Lucy\", 3,2 Ma) já andavam eretos ou semieretos — confirmado por pegadas de 3,6 Ma na Tanzânia —, mas tinham volume craniano de 400–500 cm³, próximo ao de chimpanzés. O aumento marcante do encéfalo veio depois, no gênero <i>Homo<\/i>.","x":"O bipedalismo é associado à vida em savanas mais secas no leste da África; a fraude do \"homem de Piltdown\" (crânio humano grande) atrasou essa conclusão.","r":"Vol. 3 · Cap. 7 · 7.3 A ancestralidade humana · p. 172","e":null,"h":null,"q":null},{"id":"BIO-V3C7-04","a":"BIO","d":"Volume 3","t":"Cap. 7 · Evolução humana","k":"conceito","f":"Onde e quando surgiu o <i>Homo sapiens<\/i> moderno e qual sua relação com os neandertais?","v":"Surgiu na <b>África<\/b>, há cerca de 200 mil anos, e daí se irradiou para Ásia (70–100 mil anos), Europa (~40 mil) e Américas (~14 mil anos, pelo Estreito de Bering, na hipótese mais conservadora). Os neandertais foram um ramo paralelo, extinto há ~25 mil anos; 1–4% do DNA de pessoas não africanas é de origem neandertal.","x":"Neandertais não são nossos ancestrais diretos: o DNA neandertal em não africanos indica cruzamentos após a saída da África, não descendência.","r":"Vol. 3 · Cap. 7 · 7.3 A ancestralidade humana · p. 181","e":null,"h":null,"q":null},{"id":"BIO-V3C7-05","a":"BIO","d":"Volume 3","t":"Cap. 7 · Evolução humana","k":"aplicação","f":"Do ponto de vista genético, faz sentido dividir a humanidade em \"raças\" biológicas?","v":"Não. Lewontin mostrou que <b>85,4%<\/b> da diversidade genética ocorre <b>dentro<\/b> das populações e só 6,3% entre as supostas \"raças\". Traços como a cor da pele dependem de poucos genes e refletem adaptação local à radiação UV (preservar ácido fólico × sintetizar vitamina D).","x":"Diferenças visíveis entre grupos continentais são superficiais; a única divisão biologicamente coerente da espécie humana é em indivíduos.","r":"Vol. 3 · Cap. 7 · 7.3 A ancestralidade humana · p. 184","e":null,"h":null,"q":null},{"id":"BIO-V3C8-01","a":"BIO","d":"Volume 3","t":"Cap. 8 · O fluxo de energia e os ciclos da matéria na natureza","k":"aplicação","f":"Como se determina o nível trófico de um organismo? O que é um onívoro?","v":"Conta-se a partir do produtor: produtores (1º nível), consumidores primários ou herbívoros (2º), secundários (3º) e assim por diante. Quem se alimenta de um herbívoro é consumidor secundário. <b>Onívoros<\/b> ocupam mais de um nível trófico, como o ser humano.","x":"Leia de quem o organismo se alimenta naquela cadeia: um parasitoide que se desenvolve dentro de uma lagarta herbívora é consumidor secundário.","r":"Vol. 3 · Cap. 8 · 8.2 Transferências de energia entre seres vivos · p. 195","e":"ENEM 2014 · Q81 — Nível trófico do parasitoide (lagarta)","h":"H29","q":590},{"id":"BIO-V3C8-02","a":"BIO","d":"Volume 3","t":"Cap. 8 · O fluxo de energia e os ciclos da matéria na natureza","k":"conceito","f":"Quem são os principais produtores e consumidores primários nos ambientes aquáticos?","v":"Os produtores são o <b>fitoplâncton<\/b>: algas microscópicas e bactérias autotróficas que flutuam perto da superfície. Os consumidores primários formam o <b>zooplâncton<\/b> (protozoários, microcrustáceos, larvas); peixes ocupam os níveis seguintes.","x":"O fitoplâncton fixa grande quantidade de CO<sub>2<\/sub> pela fotossíntese — não são só as florestas que retiram carbono da atmosfera.","r":"Vol. 3 · Cap. 8 · 8.2 Transferências de energia entre seres vivos · p. 195","e":"ENEM 2016 · Q62 — Fixação de carbono pelo fitoplâncton","h":"H9","q":624},{"id":"BIO-V3C8-03","a":"BIO","d":"Volume 3","t":"Cap. 8 · O fluxo de energia e os ciclos da matéria na natureza","k":"processo","f":"Por que a energia diminui de um nível trófico para o seguinte?","v":"Porque (1) cada organismo gasta boa parte da energia do alimento na <b>respiração celular<\/b>, dissipada como calor, e (2) parte do que ingere não é aproveitada e sai nas <b>fezes<\/b>. Só cerca de <b>5% a 20%<\/b> passam ao nível seguinte; o fluxo de energia é <b>unidirecional<\/b>.","x":"Matéria é reciclada; energia flui e se dissipa — por isso a energia não volta aos produtores e as cadeias têm poucos níveis.","r":"Vol. 3 · Cap. 8 · 8.2 Transferências de energia entre seres vivos · p. 197","e":null,"h":null,"q":null},{"id":"BIO-V3C8-04","a":"BIO","d":"Volume 3","t":"Cap. 8 · O fluxo de energia e os ciclos da matéria na natureza","k":"comparação","f":"Qual pirâmide ecológica nunca se inverte e por que as outras podem inverter?","v":"A de <b>energia<\/b> (kcal/m²/ano) é sempre convencional. A de <b>biomassa<\/b> pode inverter em ambientes aquáticos: o fitoplâncton se reproduz e morre muito rápido e, num dado momento, tem menos biomassa que o zooplâncton. A de <b>números<\/b> inverte quando o produtor é grande (uma árvore sustenta 300 lagartas).","x":"A pirâmide de energia registra o fluxo ao longo do tempo, por isso reflete sempre a dissipação; as outras são retratos de um momento.","r":"Vol. 3 · Cap. 8 · 8.2 Transferências de energia entre seres vivos · p. 198","e":null,"h":null,"q":null},{"id":"BIO-V3C8-05","a":"BIO","d":"Volume 3","t":"Cap. 8 · O fluxo de energia e os ciclos da matéria na natureza","k":"conceito","f":"Diferencie produtividade primária bruta (PPB) e líquida (PPL).","v":"<b>PPB<\/b>: toda a matéria orgânica produzida na fotossíntese por unidade de tempo. <b>PPL = PPB − R<\/b> (respiração do próprio produtor): o que fica armazenado como biomassa e está disponível ao nível seguinte. Nos consumidores vale o mesmo raciocínio: PSL = PSB − R.","x":"Questões de engorda de animais ou de \"quanto chega ao predador\" pedem a produtividade líquida (o que vira biomassa), não a bruta.","r":"Vol. 3 · Cap. 8 · 8.2 Transferências de energia entre seres vivos · p. 199","e":null,"h":null,"q":null},{"id":"BIO-V3C8-06","a":"BIO","d":"Volume 3","t":"Cap. 8 · O fluxo de energia e os ciclos da matéria na natureza","k":"aplicação","f":"Por que, em termos energéticos, uma dieta baseada em vegetais sustenta mais pessoas do que uma baseada em carne?","v":"Cada transferência entre níveis tróficos perde a maior parte da energia. Comendo vegetais, o ser humano atua como consumidor primário e evita a perda da passagem pelos herbívoros; cadeias com menos níveis dissipam menos energia.","x":"O mesmo raciocínio explica por que produzir carne exige muito mais área e alimento vegetal do que produzir grãos.","r":"Vol. 3 · Cap. 8 · 8.2 Transferências de energia entre seres vivos · p. 199","e":null,"h":null,"q":null},{"id":"BIO-V3C8-07","a":"BIO","d":"Volume 3","t":"Cap. 8 · O fluxo de energia e os ciclos da matéria na natureza","k":"conceito","f":"Qual o papel dos detritívoros (como as minhocas) e dos decompositores na reciclagem dos nutrientes?","v":"<b>Detritívoros<\/b> (minhocas, urubus, larvas de insetos) comem e fragmentam cadáveres e resíduos, facilitando a ação dos <b>decompositores<\/b> (bactérias e fungos), que transformam a matéria orgânica em substâncias inorgânicas — o nitrogênio, por exemplo, volta ao solo como amônia — reaproveitadas pelas plantas.","x":"A Amazônia mantém floresta exuberante sobre solo pobre graças a essa reciclagem rápida: o estoque de nutrientes está na biomassa, não no solo.","r":"Vol. 3 · Cap. 8 · 8.3 O conceito de ciclo biogeoquímico · p. 200","e":"ENEM PPL 2022 · Q114 — Minhocas e amonificação","h":"H9","q":670},{"id":"BIO-V3C8-08","a":"BIO","d":"Volume 3","t":"Cap. 8 · O fluxo de energia e os ciclos da matéria na natureza","k":"processo","f":"Quais processos movimentam a água no ciclo hidrológico e como os seres vivos participam dele?","v":"Evaporação e <b>transpiração<\/b> levam vapor à atmosfera; ele se condensa em nuvens e precipita como chuva. Parte escoa pela superfície e parte <b>infiltra<\/b> no solo, abastecendo os aquíferos por <b>percolação<\/b>. Os seres vivos absorvem água, usam-na na fotossíntese e a devolvem por transpiração, respiração, excreção e decomposição.","x":"Impermeabilizar o solo urbano reduz a infiltração e a recarga dos aquíferos e aumenta o escoamento superficial e as enchentes.","r":"Vol. 3 · Cap. 8 · 8.4 Ciclo da água · p. 201","e":"ENEM PPL 2024 · Q92 — Impermeabilização do solo e infiltração","h":"H12","q":660},{"id":"BIO-V3C8-09","a":"BIO","d":"Volume 3","t":"Cap. 8 · O fluxo de energia e os ciclos da matéria na natureza","k":"processo","f":"Por quais processos o carbono entra nos seres vivos e retorna ao ambiente?","v":"<b>Entra<\/b> pela fotossíntese (ou quimiossíntese), que transforma CO<sub>2<\/sub> em matéria orgânica, e passa pelos níveis tróficos na alimentação. <b>Volta<\/b> ao ambiente como CO<sub>2<\/sub> pela respiração celular e pela fermentação de todos os organismos e pela decomposição feita por bactérias e fungos.","x":"Em esquemas do ciclo, a única seta do CO<sub>2<\/sub> do ar para os seres vivos é a fotossíntese; respiração, decomposição e combustão devolvem carbono à atmosfera.","r":"Vol. 3 · Cap. 8 · 8.5 Ciclo do carbono · p. 204","e":"ENEM PPL 2016 · Q88 — Identificação do ciclo do carbono","h":"H9","q":559},{"id":"BIO-V3C8-10","a":"BIO","d":"Volume 3","t":"Cap. 8 · O fluxo de energia e os ciclos da matéria na natureza","k":"aplicação","f":"Por que uma floresta madura, como a Amazônia, não é uma grande fonte líquida de gás oxigênio?","v":"Porque o O<sub>2<\/sub> liberado na fotossíntese é quase todo consumido na <b>respiração<\/b> das plantas, dos animais e, em grande parte, dos <b>decompositores<\/b> que degradam a enorme quantidade de matéria orgânica morta. Em equilíbrio, a produção e o consumo de O<sub>2<\/sub> se compensam.","x":"A importância da floresta madura está no grande estoque de carbono na biomassa; queimá-la libera esse carbono como CO<sub>2<\/sub>.","r":"Vol. 3 · Cap. 8 · 8.5 Ciclo do carbono · p. 204","e":"ENEM 2013 · Q59 — Consumo de O2 na decomposição (floresta)","h":"H9","q":655},{"id":"BIO-V3C8-11","a":"BIO","d":"Volume 3","t":"Cap. 8 · O fluxo de energia e os ciclos da matéria na natureza","k":"aplicação","f":"Por que o etanol de cana tem balanço de carbono mais favorável que a gasolina?","v":"O CO<sub>2<\/sub> liberado na queima do etanol foi retirado recentemente do ar pela <b>fotossíntese<\/b> da cana (o etanol vem da fermentação de açúcares vegetais). Já a queima de combustíveis fósseis devolve à atmosfera carbono estocado há milhões de anos, aumentando o CO<sub>2<\/sub> atmosférico.","x":"Não é \"emissão zero\": cultivo, transporte e produção também emitem; o ganho está em reciclar carbono do ciclo atual em vez de liberar carbono fóssil.","r":"Vol. 3 · Cap. 8 · 8.5 Ciclo do carbono · p. 204","e":"ENEM PPL 2022 · Q96 — Etanol (biocombustível) e emissão de CO2","h":"H30","q":483},{"id":"BIO-V3C8-12","a":"BIO","d":"Volume 3","t":"Cap. 8 · O fluxo de energia e os ciclos da matéria na natureza","k":"conceito","f":"O N<sub>2<\/sub> forma cerca de 79% do ar. Por que, então, os seres vivos dependem de bactérias para obter nitrogênio?","v":"A maioria dos seres vivos não consegue usar o N<sub>2<\/sub>. Só algumas <b>bactérias fixadoras<\/b>, a maioria no solo, incorporam o nitrogênio do ar em moléculas orgânicas; ao morrerem e se decomporem, liberam <b>amônia<\/b> (NH<sub>3<\/sub>), que entra no restante do ciclo.","x":"Esterilizar o solo elimina fixadoras e nitrificantes e corta o suprimento natural de nitrogênio das plantas.","r":"Vol. 3 · Cap. 8 · 8.6 Ciclo do nitrogênio · p. 205","e":"ENEM PPL 2024 · Q114 — Esterilização do solo e fixação de nitrogênio","h":"H9","q":643},{"id":"BIO-V3C8-13","a":"BIO","d":"Volume 3","t":"Cap. 8 · O fluxo de energia e os ciclos da matéria na natureza","k":"processo","f":"O que é nitrificação e quais bactérias a realizam?","v":"É a transformação de amônia em nitrato por bactérias do solo que usam esses compostos para obter energia: <b><i>Nitrosomonas<\/i><\/b> convertem NH<sub>3<\/sub> em <b>nitrito<\/b> (NO<sub>2<\/sub><sup>−<\/sup>) e <b><i>Nitrobacter<\/i><\/b> convertem nitrito em <b>nitrato<\/b> (NO<sub>3<\/sub><sup>−<\/sup>), principal fonte de nitrogênio das plantas para produzir proteínas e ácidos nucleicos.","x":"Nitrificação exige O<sub>2<\/sub>; em estações de tratamento de esgoto, ela é usada para converter amônia em nitrato.","r":"Vol. 3 · Cap. 8 · 8.6 Ciclo do nitrogênio · p. 205","e":"ENEM PPL 2023 · Q121 — Nitrificação no tratamento de esgoto","h":"H9","q":659},{"id":"BIO-V3C8-14","a":"BIO","d":"Volume 3","t":"Cap. 8 · O fluxo de energia e os ciclos da matéria na natureza","k":"pegadinha","f":"Qual etapa do ciclo do nitrogênio devolve N<sub>2<\/sub> à atmosfera e quem a realiza?","v":"A <b>desnitrificação<\/b>, feita por <b>bactérias desnitrificantes<\/b> do solo, que degradam compostos nitrogenados (como nitratos) para obter energia e liberam gás nitrogênio (N<sub>2<\/sub>). Ela reduz o nitrogênio disponível às plantas.","x":"Não confunda: nitrificação produz nitrato (útil às plantas); desnitrificação consome nitrato e libera N<sub>2<\/sub>, fechando o ciclo de volta à atmosfera.","r":"Vol. 3 · Cap. 8 · 8.6 Ciclo do nitrogênio · p. 205","e":"ENEM 2014 · Q63 — Etapa de desnitrificação (esquema)","h":"H9","q":662},{"id":"BIO-V3C8-15","a":"BIO","d":"Volume 3","t":"Cap. 8 · O fluxo de energia e os ciclos da matéria na natureza","k":"aplicação","f":"Por que a adubação verde e a rotação de culturas usam leguminosas (feijão, soja, alfafa)?","v":"As raízes das leguminosas formam <b>nódulos<\/b> com bactérias <i>Rhizobium<\/i>, que convertem N<sub>2<\/sub> em amônia; a planta fornece matéria orgânica e O<sub>2<\/sub> (via leghemoglobina), numa relação de <b>endossimbiose<\/b>. Após a decomposição das leguminosas, o solo fica enriquecido em nitrogênio para culturas não leguminosas, como o milho.","x":"É alternativa ao adubo nitrogenado industrial: reduz custos e a contaminação por excesso de fertilizante.","r":"Vol. 3 · Cap. 8 · 8.6 Ciclo do nitrogênio · p. 206","e":"ENEM PPL 2016 · Q62 — Fixação por leguminosas (adubação verde)","h":"H4","q":578},{"id":"BIO-V3C9-01","a":"BIO","d":"Volume 3","t":"Cap. 9 · A dinâmica das populações","k":"conceito","f":"Segundo o conceito biológico de espécie (Dobzhansky e Mayr), o que define uma espécie? Qual sua principal limitação?","v":"Espécies são <b>grupos de populações naturais que cruzam entre si<\/b>, gerando descendência fértil, e que estão <b>reprodutivamente isoladas<\/b> de outros grupos. O critério é o cruzamento, não a semelhança estrutural. Limitação: <b>não se aplica a organismos sem reprodução sexuada<\/b> (bactérias, arqueas) e é pouco operacional.","x":"Armadilha: cruzamento em cativeiro não prova que dois grupos são a mesma espécie; o critério exige cruzamento em condições naturais com prole fértil.","r":"Vol. 3 · Cap. 9 · 9.1 O que é uma espécie biológica? · p. 213","e":null,"h":null,"q":null},{"id":"BIO-V3C9-02","a":"BIO","d":"Volume 3","t":"Cap. 9 · A dinâmica das populações","k":"aplicação","f":"Quais quatro fatores determinam o tamanho de uma população? Quais aumentam e quais diminuem a população?","v":"<b>Natalidade<\/b> e <b>imigração<\/b> (chegada de indivíduos) aumentam a população; <b>mortalidade<\/b> e <b>emigração<\/b> (saída de indivíduos) a diminuem. O crescimento resulta do balanço: (N + I) − (M + E).","x":"O ENEM pede para explicar o aumento de uma população por natalidade ou migração; não esqueça a imigração quando o ambiente é aberto.","r":"Vol. 3 · Cap. 9 · 9.2 Características das populações · p. 216","e":"ENEM PPL 2025 · Q126 — Crescimento populacional (natalidade e migração)","h":"H17","q":630},{"id":"BIO-V3C9-03","a":"BIO","d":"Volume 3","t":"Cap. 9 · A dinâmica das populações","k":"aplicação","f":"A população A passou de 10.000 para 40.000 bactérias em 3 h; a B, de 200.000 para 500.000. Qual cresceu mais rápido?","v":"A <b>taxa de crescimento relativo<\/b> (TCR) = (N<sub>f<\/sub> − N<sub>i<\/sub>) / N<sub>i<\/sub> / t.<br>A: (40.000 − 10.000)/10.000/3 = <b>1 por hora<\/b> (dobra a cada hora).<br>B: (500.000 − 200.000)/200.000/3 = <b>0,5 por hora<\/b>.<br>A cresceu mais rápido, embora B tenha ganhado mais indivíduos em números brutos.","x":"Pegadinha: comparar o acréscimo bruto; a TCR divide pelo tamanho inicial para tornar populações comparáveis.","r":"Vol. 3 · Cap. 9 · 9.2 Características das populações · p. 215","e":null,"h":null,"q":null},{"id":"BIO-V3C9-04","a":"BIO","d":"Volume 3","t":"Cap. 9 · A dinâmica das populações","k":"processo","f":"Por que a curva real de crescimento de uma população tem forma de S, e não de J?","v":"A <b>taxa de crescimento intrínseco<\/b> (potencial biótico) daria crescimento geométrico (curva J). Mas a <b>resistência do meio<\/b> (falta de alimento e espaço, predadores, parasitas, competidores), proporcional à densidade, freia o crescimento até a população se estabilizar na <b>capacidade de suporte<\/b> do meio — curva sigmoide (logística).","x":"Gause mostrou que mais alimento (64 g × 16 g de farinha) eleva a capacidade de suporte: cada ambiente sustenta um número máximo de indivíduos.","r":"Vol. 3 · Cap. 9 · 9.2 Características das populações · p. 217","e":null,"h":null,"q":null},{"id":"BIO-V3C9-05","a":"BIO","d":"Volume 3","t":"Cap. 9 · A dinâmica das populações","k":"processo","f":"Como se explicam as oscilações defasadas das populações de lebres e linces no Canadá?","v":"Mais lebres → mais alimento → a população de <b>linces cresce<\/b> (com 1 a 2 anos de atraso) → aumenta a predação → <b>lebres diminuem<\/b> → falta alimento → linces diminuem → lebres voltam a crescer. A predação regula o tamanho das duas populações, que flutuam de forma cíclica.","x":"No gráfico, o pico do predador vem sempre depois do pico da presa; Gause mostrou que, sem esconderijos ou presas alternativas, o predador pode extinguir a presa e morrer de fome.","r":"Vol. 3 · Cap. 9 · 9.3 Fatores que regulam o tamanho populacional · p. 219","e":null,"h":null,"q":null},{"id":"BIO-V3C9-06","a":"BIO","d":"Volume 3","t":"Cap. 9 · A dinâmica das populações","k":"aplicação","f":"O que indica uma pirâmide etária de base larga e ápice estreito? E uma de base estreita e ápice largo?","v":"<b>Base larga e ápice estreito<\/b> (ex.: Nigéria): alta natalidade e alta mortalidade nas idades avançadas; população jovem, com tendência a crescer, pois muitos jovens chegarão à idade reprodutiva. <b>Base estreita e ápice largo<\/b> (ex.: Itália): controle da natalidade e alta expectativa de vida.","x":"Índice de fertilidade 2 repõe os pais (população estável); acima de 2, tendência de crescimento; abaixo de 2, de redução.","r":"Vol. 3 · Cap. 9 · 9.3 Fatores que regulam o tamanho populacional · p. 222","e":null,"h":null,"q":null},{"id":"BIO-V3C10-01","a":"BIO","d":"Volume 3","t":"Cap. 10 · Relações ecológicas","k":"comparação","f":"Qual a diferença entre hábitat e nicho ecológico?","v":"<b>Hábitat<\/b> é o <b>local<\/b> onde a espécie vive, com suas condições ambientais (o \"endereço\"). <b>Nicho ecológico<\/b> é o <b>modo de vida<\/b> da espécie no hábitat: o que come, como e quando se reproduz, seus abrigos, hábitos, inimigos naturais e estratégias de sobrevivência (a \"profissão\").","x":"Ex. de vestibular: anfíbio com larva aquática onívora e adulto terrestre carnívoro muda de hábitat e de nicho ao longo da vida.","r":"Vol. 3 · Cap. 10 · 10.1 Hábitat e nicho ecológico · p. 228","e":null,"h":null,"q":null},{"id":"BIO-V3C10-02","a":"BIO","d":"Volume 3","t":"Cap. 10 · Relações ecológicas","k":"conceito","f":"O que afirma o princípio da exclusão competitiva de Gause?","v":"Duas espécies com <b>nichos ecológicos muito semelhantes<\/b> não convivem indefinidamente no mesmo hábitat: a competição faz uma excluir a outra (<i>P. aurelia<\/i> levou <i>P. caudatum<\/i> à extinção). A convivência só é possível se os nichos forem distintos (<i>P. caudatum<\/i> livre no meio e <i>P. bursaria<\/i> aderido à parede; cormorões que pescam em profundidades diferentes).","x":"Mesmo hábitat não significa competição; o que gera exclusão é a sobreposição de nicho, especialmente por recurso escasso.","r":"Vol. 3 · Cap. 10 · 10.1 Hábitat e nicho ecológico · p. 229","e":"ENEM PPL 2024 · Q99 — Competição entre polinizadores","h":"H14","q":636},{"id":"BIO-V3C10-03","a":"BIO","d":"Volume 3","t":"Cap. 10 · Relações ecológicas","k":"comparação","f":"Qual a diferença entre colônia e sociedade? Dê um exemplo de cada.","v":"<b>Colônia<\/b>: indivíduos da mesma espécie <b>fisicamente unidos<\/b>, com divisão de tarefas — isomorfa (<i>Volvox<\/i>, corais) ou heteromorfa (caravela-portuguesa, com flutuador, indivíduos alimentares, tentáculos e gonozoides). <b>Sociedade<\/b>: indivíduos <b>independentes e móveis<\/b> que cooperam, se comunicam e dividem o trabalho (abelhas, cupins, formigas, seres humanos).","x":"Pegadinha: cupinzeiro e colmeia são sociedades, não colônias, porque os indivíduos não estão fisicamente ligados.","r":"Vol. 3 · Cap. 10 · 10.2 Relações ecológicas intraespecíficas · p. 231","e":null,"h":null,"q":null},{"id":"BIO-V3C10-04","a":"BIO","d":"Volume 3","t":"Cap. 10 · Relações ecológicas","k":"conceito","f":"O que é competição interespecífica e quais suas possíveis consequências?","v":"Disputa entre <b>espécies diferentes<\/b> pelos mesmos recursos, quando seus nichos se sobrepõem parcialmente. Quanto maior a sobreposição, mais intensa a competição, que pode levar uma espécie à <b>extinção local<\/b> ou forçá-la a <b>migrar<\/b> para área livre de competidores. Efeito (−/−) para ambas.","x":"O ENEM costuma descrever uma alteração ambiental que favorece uma espécie e pergunta qual relação explica o declínio da outra: competição.","r":"Vol. 3 · Cap. 10 · 10.3 Relações ecológicas interespecíficas · p. 231","e":"ENEM 2013 · Q63 — Competição interespecífica (represamento)","h":"H12","q":562},{"id":"BIO-V3C10-05","a":"BIO","d":"Volume 3","t":"Cap. 10 · Relações ecológicas","k":"aplicação","f":"O que é cascata trófica? Cite o exemplo dos lobos de Yellowstone.","v":"É o efeito em que a perda (ou volta) de um <b>predador de topo<\/b> altera em cadeia muitas espécies de níveis tróficos inferiores. Sem lobos, os alces mudaram de comportamento e população, consumindo mais arbustos e gramíneas; faltou alimento para os castores, que declinaram. A <b>reintrodução dos lobos<\/b> recuperou o ecossistema.","x":"É equivocado pensar que superpredadores pouco influenciam a comunidade: sua remoção pode reduzir a diversidade de todo o ecossistema.","r":"Vol. 3 · Cap. 10 · Abertura do capítulo — Novas razões para amar os superpredadores · p. 227","e":"ENEM PPL 2024 · Q122 — Predador de topo (Pisaster) e diversidade","h":"H15","q":538},{"id":"BIO-V3C10-06","a":"BIO","d":"Volume 3","t":"Cap. 10 · Relações ecológicas","k":"aplicação","f":"O que ocorreu com os veados do Planalto de Kaibab após a eliminação de pumas, lobos e coiotes?","v":"Sem predadores e com caça proibida, a população saltou de 4 mil para <b>100 mil<\/b> em 21 anos, ultrapassando a capacidade de suporte (~30 mil). Os veados comeram o capim até a raiz e pisotearam o solo; morreram de fome e doenças, caindo para menos de 10 mil, e o pasto não se recuperou.","x":"Mostra que a predação, prejudicial ao indivíduo predado, é benéfica para a população de presas e para o ecossistema por regular a densidade.","r":"Vol. 3 · Cap. 10 · 10.3 Relações ecológicas interespecíficas · p. 232","e":"ENEM 2013 · Q84 — Ausência de predadores naturais (corais)","h":"H12","q":538},{"id":"BIO-V3C10-07","a":"BIO","d":"Volume 3","t":"Cap. 10 · Relações ecológicas","k":"pegadinha","f":"Por que, em geral, o parasita causa prejuízos relativamente pequenos ao hospedeiro?","v":"Porque, se matar o hospedeiro, o parasita também morre. Ao longo da evolução, parasita e hospedeiro se ajustam mutuamente — <b>coadaptação<\/b> —, e a relação tende ao equilíbrio. Podem ser <b>ectoparasitas<\/b> (piolho, carrapato) ou <b>endoparasitas<\/b> (lombriga, solitária, bactérias, vírus).","x":"Diferente do predador, o parasita típico não mata quem o sustenta; o que mata o hospedeiro ao final é o parasitoide.","r":"Vol. 3 · Cap. 10 · 10.3 Relações ecológicas interespecíficas · p. 233","e":null,"h":null,"q":null},{"id":"BIO-V3C10-08","a":"BIO","d":"Volume 3","t":"Cap. 10 · Relações ecológicas","k":"conceito","f":"O que é parasitoidismo? Dê o exemplo clássico.","v":"Relação em que um organismo vive boa parte da vida <b>dentro do hospedeiro, parasitando-o<\/b>, e no fim o <b>mata e o consome<\/b>, como na predação. Ex.: vespas que põem ovos dentro de lagartas ou aranhas; as larvas devoram lentamente os tecidos vivos do hospedeiro e depois viram vespas adultas.","x":"Por matarem pragas agrícolas, vespas parasitoides são usadas no controle biológico; o ENEM cobra a identificação dessa relação em textos sobre larvas endoparasitoides.","r":"Vol. 3 · Cap. 10 · 10.3 Relações ecológicas interespecíficas · p. 233","e":"ENEM PPL 2023 · Q116 — Parasitoidismo (larva endoparasitoide)","h":"H16","q":607},{"id":"BIO-V3C10-09","a":"BIO","d":"Volume 3","t":"Cap. 10 · Relações ecológicas","k":"comparação","f":"Cipó-chumbo × erva-de-passarinho: qual é holoparasita e qual é hemiparasita?","v":"<b>Cipó-chumbo<\/b> (<i>Cuscuta<\/i>): sem folhas nem clorofila; seus haustórios penetram o <b>floema<\/b> e retiram <b>seiva orgânica<\/b> — parasita total. <b>Erva-de-passarinho<\/b>: tem folhas clorofiladas e faz fotossíntese; retira só <b>água e sais minerais<\/b> do <b>xilema<\/b> — <b>hemiparasita<\/b>.","x":"Para identificar o tipo de parasita, veja se a planta tem clorofila e qual seiva retira: floema (orgânica) ou xilema (mineral).","r":"Vol. 3 · Cap. 10 · 10.3 Relações ecológicas interespecíficas · p. 233","e":null,"h":null,"q":null},{"id":"BIO-V3C10-10","a":"BIO","d":"Volume 3","t":"Cap. 10 · Relações ecológicas","k":"comparação","f":"Diferencie protocooperação de mutualismo obrigatório, com exemplos.","v":"<b>Protocooperação<\/b> (mutualismo facultativo): ambos ganham, mas <b>podem viver separados<\/b> — caranguejo-eremita e anêmona, aves que comem carrapatos de capivaras. <b>Mutualismo obrigatório<\/b>: associação <b>indispensável<\/b> à sobrevivência — cupins e microrganismos intestinais que digerem a <b>celulose<\/b> da madeira, liquens, micorrizas.","x":"O cupim come madeira, mas quem digere a celulose são bactérias e protozoários do seu intestino; sem eles, o cupim morre de fome.","r":"Vol. 3 · Cap. 10 · 10.3 Relações ecológicas interespecíficas · p. 234","e":"ENEM PPL 2025 · Q133 — Mutualismo (cupins e microrganismos)","h":"H9","q":549},{"id":"BIO-V3C10-11","a":"BIO","d":"Volume 3","t":"Cap. 10 · Relações ecológicas","k":"conceito","f":"O que cada parceiro ganha no líquen e na micorriza?","v":"<b>Líquen<\/b>: a alga verde (ou cianobactéria) faz fotossíntese e fornece matéria orgânica; o fungo absorve água e nutrientes do ambiente. Juntos, colonizam locais onde nenhum sobreviveria sozinho. <b>Micorriza<\/b>: as hifas do fungo recebem açúcares (glicose, sacarose) da raiz; a planta ganha maior absorção de água e sais minerais.","x":"Ambos são mutualismo obrigatório (+/+); por isso os liquens são pioneiros na colonização de rochas nuas.","r":"Vol. 3 · Cap. 10 · 10.3 Relações ecológicas interespecíficas · p. 235","e":null,"h":null,"q":null},{"id":"BIO-V3C10-12","a":"BIO","d":"Volume 3","t":"Cap. 10 · Relações ecológicas","k":"comparação","f":"Qual a diferença entre comensalismo e inquilinismo?","v":"Nos dois, uma espécie ganha e a outra não é afetada (+/0). No <b>comensalismo<\/b> o recurso buscado é <b>alimento<\/b> (rêmora com tubarão, abutres com carnívoros). No <b>inquilinismo<\/b> é <b>abrigo ou suporte<\/b> (epífitas como orquídeas e bromélias sobre árvores, que ganham luz sem prejudicar a hospedeira).","x":"Pegadinha: epífita não é parasita, pois não retira seiva da árvore. E \"simbiose\" é termo ambíguo: na origem incluía até o parasitismo.","r":"Vol. 3 · Cap. 10 · 10.3 Relações ecológicas interespecíficas · p. 236","e":null,"h":null,"q":null},{"id":"BIO-V3C11-01","a":"BIO","d":"Volume 3","t":"Cap. 11 · Sucessão ecológica e biomas","k":"comparação","f":"Qual a diferença entre sucessão primária e sucessão secundária?","v":"<b>Primária<\/b>: começa em ambiente <b>sem vida prévia<\/b> e condições desfavoráveis (lava solidificada, rocha nua, dunas), como em Rakata após a erupção do Krakatoa. <b>Secundária<\/b>: ocorre em área <b>antes ocupada<\/b> e parcialmente destruída (lavoura abandonada, área desmatada ou queimada); costuma ser <b>mais rápida<\/b>, pois já há solo e condições mais favoráveis.","x":"O critério é o tipo de ambiente inicial, não a comunidade clímax final nem a biodiversidade alcançada.","r":"Vol. 3 · Cap. 11 · 11.1 Sucessão ecológica · p. 242","e":null,"h":null,"q":null},{"id":"BIO-V3C11-02","a":"BIO","d":"Volume 3","t":"Cap. 11 · Sucessão ecológica e biomas","k":"processo","f":"Qual o papel das espécies pioneiras na sucessão ecológica?","v":"Espécies pioneiras (<b>liquens<\/b>, gramíneas) instalam-se em locais inóspitos e <b>modificam o ambiente<\/b>: sua decomposição acumula matéria orgânica no solo, aumentando nutrientes e retenção de água; as raízes fixam o solo e a temperatura fica menos variável. Isso permite a chegada de novas espécies, que competem com as pioneiras e as substituem. A comunidade inicial chama-se <b>ecese<\/b>.","x":"O ENEM cobra que as pioneiras preparam o terreno para as próximas e acabam substituídas; elas não persistem dominantes no clímax.","r":"Vol. 3 · Cap. 11 · 11.1 Sucessão ecológica · p. 241","e":"ENEM 2020 · Q127 — Sucessão ecológica (plantas pioneiras)","h":"H4","q":563},{"id":"BIO-V3C11-03","a":"BIO","d":"Volume 3","t":"Cap. 11 · Sucessão ecológica e biomas","k":"pegadinha","f":"O que acontece com biodiversidade, biomassa e estabilidade ao longo da sucessão até o clímax?","v":"As três <b>aumentam<\/b>. Cada estágio (sere) cria um microclima que permite novas espécies; forma-se uma ampla rede de interações. Na <b>comunidade clímax<\/b>, biodiversidade, biomassa e microclima tendem a se estabilizar.","x":"Pegadinha: a sucessão não reduz biomassa nem diversidade; o clímax não é necessariamente uma floresta, pois depende do clima e do solo locais.","r":"Vol. 3 · Cap. 11 · 11.1 Sucessão ecológica · p. 243","e":null,"h":null,"q":null},{"id":"BIO-V3C11-04","a":"BIO","d":"Volume 3","t":"Cap. 11 · Sucessão ecológica e biomas","k":"aplicação","f":"Por que as florestas tropicais têm muitas plantas epífitas e como sua estrutura em camadas as favorece?","v":"As copas formam um <b>dossel<\/b> e andares inferiores (<b>estratificação<\/b>), criando microclimas com pouca luz no interior. Bromélias, orquídeas e samambaias <b>epífitas<\/b> crescem sobre troncos e galhos para obter <b>mais luz<\/b> para a fotossíntese, sem parasitar a árvore.","x":"Ao derrubar a floresta, o solo empobrece rápido: a reciclagem de nutrientes é rápida e, sem cobertura vegetal, as chuvas os lavam (lixiviação).","r":"Vol. 3 · Cap. 11 · 11.2 Grandes biomas do mundo · p. 248","e":"ENEM 2017 · Q123 — Plantas epífitas da Mata Atlântica","h":"H28","q":726},{"id":"BIO-V3C11-05","a":"BIO","d":"Volume 3","t":"Cap. 11 · Sucessão ecológica e biomas","k":"conceito","f":"Que características da vegetação do cerrado o livro destaca, e o que as explica?","v":"Árvores pequenas de <b>troncos retorcidos e cascas espessas<\/b>, arbustos e gramíneas (um tipo de savana). A fisionomia é influenciada sobretudo pelo <b>solo pobre em minerais<\/b> e pelos <b>incêndios naturais periódicos<\/b>, daí adaptações ao fogo: gemas subterrâneas, periderme grossa, sementes com germinação induzida pelo calor.","x":"Pegadinha: o aspecto \"seco\" do cerrado se deve mais ao solo do que à falta de chuva, que é de 1.100 a 2.000 mm por ano, concentrada no verão.","r":"Vol. 3 · Cap. 11 · 11.3 Domínios morfoclimáticos e biomas do Brasil · p. 256","e":"ENEM PPL 2016 · Q70 — Adaptações da vegetação do Cerrado","h":"H28","q":648},{"id":"BIO-V3C11-06","a":"BIO","d":"Volume 3","t":"Cap. 11 · Sucessão ecológica e biomas","k":"conceito","f":"O que é xeromorfismo e como ele aparece nas plantas da caatinga?","v":"Conjunto de adaptações ao clima seco: <b>folhas modificadas em espinhos<\/b>, revestimentos muito impermeáveis, <b>caules que armazenam água<\/b> (mandacaru, xiquexique) e perda das folhas na seca (<b>caducifolia<\/b>), que reduz a transpiração. O juazeiro é exceção: não perde as folhas.","x":"Chuvas de 500 a 700 mm por ano e irregulares; questões pedem relacionar cada adaptação à redução da perda de água.","r":"Vol. 3 · Cap. 11 · 11.3 Domínios morfoclimáticos e biomas do Brasil · p. 257","e":"ENEM PPL 2015 · Q57 — Plantas da Caatinga e falta de água","h":null,"q":578},{"id":"BIO-V3C11-07","a":"BIO","d":"Volume 3","t":"Cap. 11 · Sucessão ecológica e biomas","k":"aplicação","f":"Quais adaptações das árvores do manguezal permitem viver em solo lodoso, salgado e pobre em O<sub>2<\/sub>?","v":"<b>Rizóforos<\/b> do mangue-bravo (<i>Rhizophora<\/i>): ramos-escora que sustentam a planta em solo pouco firme. <b>Pneumatóforos<\/b> de <i>Avicennia<\/i>: raízes que crescem para cima, emergem do lodo e captam <b>O<sub>2<\/sub><\/b> para a respiração das raízes.","x":"Não confunda: pneumatóforo serve à respiração (O<sub>2<\/sub>), rizóforo serve à sustentação.","r":"Vol. 3 · Cap. 11 · 11.3 Domínios morfoclimáticos e biomas do Brasil · p. 258","e":"ENEM PPL 2019 · Q117 — Manguezal e adaptações vegetais","h":"H28","q":672},{"id":"BIO-V3C11-08","a":"BIO","d":"Volume 3","t":"Cap. 11 · Sucessão ecológica e biomas","k":"comparação","f":"Diferencie plâncton, nécton e bentos.","v":"<b>Plâncton<\/b>: seres que <b>flutuam à mercê das correntes<\/b> — fitoplâncton (diatomáceas, dinoflagelados; produtores) e zooplâncton (microcrustáceos, larvas). <b>Nécton<\/b>: nadam ativamente <b>contra as correntes<\/b> (peixes, baleias, lulas). <b>Bentos<\/b>: vivem no <b>fundo<\/b>, sésseis (esponjas, corais) ou errantes (estrelas-do-mar, caranguejos).","x":"O fitoplâncton fica na zona fótica (até cerca de 200 m) e produz quase todo o alimento dos mares.","r":"Vol. 3 · Cap. 11 · 11.4 Ecossistemas aquáticos · p. 259","e":null,"h":null,"q":null},{"id":"BIO-V3C12-01","a":"BIO","d":"Volume 3","t":"Cap. 12 · A humanidade e o ambiente","k":"conceito","f":"Como a Comissão Brundtland (1987) definiu desenvolvimento sustentável?","v":"É o desenvolvimento que <b>atende às necessidades atuais<\/b> da humanidade <b>sem comprometer a capacidade das futuras gerações<\/b> de obter o necessário à vida. Exemplos: replantio de espécies nativas, fontes renováveis de energia, economia de água, reciclagem.","x":"Recursos não renováveis (petróleo, minérios) não podem ser usados de forma sustentável; o objetivo é minimizar seu esgotamento por reciclagem e substituição.","r":"Vol. 3 · Cap. 12 · 12.1 O conceito de desenvolvimento sustentável · p. 264","e":null,"h":null,"q":null},{"id":"BIO-V3C12-02","a":"BIO","d":"Volume 3","t":"Cap. 12 · A humanidade e o ambiente","k":"pegadinha","f":"O ozônio (O<sub>3<\/sub>) é benéfico ou poluente? E qual é o papel dos CFCs?","v":"Depende da altitude. Na <b>estratosfera<\/b> (12 a 50 km), a camada de ozônio <b>filtra a radiação UV<\/b>. <b>Junto ao solo<\/b>, é <b>poluente<\/b>: irrita olhos e vias respiratórias e danifica a vegetação. Os <b>CFCs<\/b> (aerossóis, geladeiras) liberam cloro na estratosfera, que destrói o O<sub>3<\/sub>; uma molécula de CFC pode destruir cerca de 100 mil moléculas de ozônio.","x":"Não confunda o buraco na camada de ozônio (CFCs, UV) com o aquecimento global (gases de efeito estufa, infravermelho).","r":"Vol. 3 · Cap. 12 · 12.2 Poluição e desequilíbrios ambientais · p. 266","e":null,"h":null,"q":null},{"id":"BIO-V3C12-03","a":"BIO","d":"Volume 3","t":"Cap. 12 · A humanidade e o ambiente","k":"processo","f":"Como se formam as chuvas ácidas?","v":"A queima de carvão mineral e óleo diesel libera <b>SO<sub>2<\/sub><\/b>, e motores liberam <b>NO<sub>2<\/sub><\/b>. Esses óxidos reagem com o vapor-d'água e formam <b>H<sub>2<\/sub>SO<sub>4<\/sub><\/b> e <b>HNO<sub>3<\/sub><\/b>, que se dissolvem nas nuvens e precipitam. Consequências: dano à vegetação e corrosão de construções e monumentos.","x":"O CO<sub>2<\/sub> não é o principal causador da chuva ácida; os vilões são os óxidos de enxofre e de nitrogênio.","r":"Vol. 3 · Cap. 12 · 12.2 Poluição e desequilíbrios ambientais · p. 266","e":null,"h":null,"q":null},{"id":"BIO-V3C12-04","a":"BIO","d":"Volume 3","t":"Cap. 12 · A humanidade e o ambiente","k":"processo","f":"O que é inversão térmica e por que agrava a poluição urbana?","v":"Normalmente o ar junto ao solo é mais quente, sobe e leva os poluentes (<b>correntes de convecção<\/b>). No <b>inverno<\/b>, o solo esfria e a camada baixa fica <b>mais fria<\/b> que a de cima; a convecção para, e os poluentes ficam presos perto da superfície, aumentando irritações e problemas respiratórios.","x":"É um fenômeno natural, mais comum no inverno; a poluição não o causa, mas ele impede a dispersão dos poluentes.","r":"Vol. 3 · Cap. 12 · 12.2 Poluição e desequilíbrios ambientais · p. 267","e":null,"h":null,"q":null},{"id":"BIO-V3C12-05","a":"BIO","d":"Volume 3","t":"Cap. 12 · A humanidade e o ambiente","k":"comparação","f":"Efeito estufa natural × intensificação do efeito estufa: qual a diferença?","v":"O <b>efeito estufa natural<\/b> (vapor-d'água, CO<sub>2<\/sub>, CH<sub>4<\/sub> absorvendo o infravermelho reirradiado pela superfície) <b>mantém a Terra aquecida<\/b> e possibilita a vida. Sua <b>intensificação<\/b> vem do aumento antrópico desses gases: CO<sub>2<\/sub> dos combustíveis fósseis (+40% desde a Revolução Industrial) e CH<sub>4<\/sub> de lixo, esgoto, arrozais alagados e ruminantes. Resultado: aquecimento global.","x":"Pegadinha: o efeito estufa em si não é um problema; o problema é sua intensificação.","r":"Vol. 3 · Cap. 12 · 12.2 Poluição e desequilíbrios ambientais · p. 268","e":null,"h":null,"q":null},{"id":"BIO-V3C12-06","a":"BIO","d":"Volume 3","t":"Cap. 12 · A humanidade e o ambiente","k":"processo","f":"Por que o lançamento de esgoto em rios e lagos mata peixes por asfixia?","v":"O esgoto orgânico enriquece a água em nutrientes (nitratos, fosfatos), a <b>eutrofização<\/b>. Ocorre proliferação intensa de <b>bactérias aeróbicas<\/b> decompositoras, que consomem rapidamente o <b>O<sub>2<\/sub> dissolvido<\/b>. A maioria dos seres aquáticos morre por asfixia, inclusive as próprias bactérias aeróbicas.","x":"O que mata os peixes não é a toxicidade da matéria orgânica, e sim a queda do oxigênio dissolvido causada pelos decompositores aeróbicos.","r":"Vol. 3 · Cap. 12 · 12.2 Poluição e desequilíbrios ambientais · p. 272","e":"ENEM PPL 2025 · Q118 — Despejo de esgoto e oxigênio dissolvido","h":"H12","q":458},{"id":"BIO-V3C12-07","a":"BIO","d":"Volume 3","t":"Cap. 12 · A humanidade e o ambiente","k":"processo","f":"Até que ponto um rio consegue decompor esgoto sozinho, e o que acontece quando esse limite é ultrapassado?","v":"Ecossistemas aquáticos têm <b>capacidade natural de decompor<\/b> matéria orgânica (autodepuração). Se o aporte excede essa capacidade, os decompositores consomem O<sub>2<\/sub> mais rápido do que a fotossíntese e a difusão do ar o repõem → <b>condições anaeróbias<\/b>. O excesso de fosfato e nitrato também faz as algas proliferarem e sombrearem outras plantas aquáticas.","x":"Questões de autodepuração mostram que, rio abaixo do despejo, o O<sub>2<\/sub> cai e depois se recupera à medida que a matéria orgânica é decomposta.","r":"Vol. 3 · Cap. 12 · 12.2 Poluição e desequilíbrios ambientais · p. 273","e":"ENEM 2020 · Q119 — Autodepuração de rios","h":"H10","q":615},{"id":"BIO-V3C12-08","a":"BIO","d":"Volume 3","t":"Cap. 12 · A humanidade e o ambiente","k":"processo","f":"Por que poluentes como DDT e mercúrio atingem concentrações maiores nos predadores de topo?","v":"Não são degradados nem excretados com facilidade e <b>se acumulam<\/b> no organismo (bivalves filtradores concentram DDT até 70 mil vezes). Como cada nível trófico come grande quantidade do nível anterior, a concentração <b>aumenta a cada nível<\/b>: no exemplo do livro, de 0,000003 ppm na água para 25 ppm na ave do topo (<b>magnificação trófica<\/b>).","x":"O ENEM cobra que o maior teor estará no último consumidor (ex.: botos, aves piscívoras, ser humano), mesmo com baixa concentração na água.","r":"Vol. 3 · Cap. 12 · 12.2 Poluição e desequilíbrios ambientais · p. 274","e":"ENEM 2017 · Q111 — Bioacumulação de mercúrio (botos-cinza)","h":"H4","q":777},{"id":"BIO-V3C12-09","a":"BIO","d":"Volume 3","t":"Cap. 12 · A humanidade e o ambiente","k":"aplicação","f":"O que é controle biológico de pragas? Dê o exemplo do livro.","v":"Uso de uma espécie <b>inimiga natural<\/b> (predador, parasita ou parasitoide) para combater uma praga, em vez de agrotóxicos. Exemplo: introdução controlada de <b>joaninhas<\/b> para comer <b>pulgões<\/b> nas lavouras, sem provocar desequilíbrios na teia alimentar.","x":"A vantagem cobrada é reduzir agrotóxicos e a magnificação trófica; o risco é introduzir uma espécie exótica sem controle.","r":"Vol. 3 · Cap. 12 · 12.2 Poluição e desequilíbrios ambientais · p. 274","e":null,"h":null,"q":null},{"id":"BIO-V3C12-10","a":"BIO","d":"Volume 3","t":"Cap. 12 · A humanidade e o ambiente","k":"processo","f":"O que é biodigestão e quais são seus produtos úteis?","v":"Após a triagem do lixo, a <b>parte orgânica<\/b> é degradada por <b>microrganismos<\/b> em tanques fechados (biodigestores), em ausência de O<sub>2<\/sub>. Produz <b>metano (CH<sub>4<\/sub>)<\/b>, o biogás, usado como combustível residencial, industrial ou veicular; o resíduo sólido serve de <b>fertilizante<\/b>.","x":"A biodigestão transforma um problema (lixo e esgoto orgânicos) em energia e adubo; o metano captado deixa de ir para a atmosfera.","r":"Vol. 3 · Cap. 12 · 12.2 Poluição e desequilíbrios ambientais · p. 275","e":"ENEM 2025 · Q111 — Biodigestão (resíduos)","h":"H9","q":641},{"id":"BIO-V3C12-11","a":"BIO","d":"Volume 3","t":"Cap. 12 · A humanidade e o ambiente","k":"aplicação","f":"Quais as consequências do desmatamento para o solo?","v":"Sem cobertura vegetal, chuva e vento causam <b>erosão<\/b>: o solo perde rapidamente as camadas férteis e fica pobre e acidentado. A queimada ainda prejudica o solo e polui o ar. Comunidades e espécies podem ser extintas.","x":"Quando se remove a mata ciliar, o solo erodido vai para o rio e causa assoreamento; a vegetação das margens protege os corpos d'água.","r":"Vol. 3 · Cap. 12 · 12.2 Poluição e desequilíbrios ambientais · p. 275","e":"ENEM PPL 2024 · Q132 — Mata ciliar e assoreamento","h":"H4","q":590},{"id":"BIO-V3C12-12","a":"BIO","d":"Volume 3","t":"Cap. 12 · A humanidade e o ambiente","k":"conceito","f":"Por que a introdução de espécies exóticas pode desequilibrar um ecossistema?","v":"Transportada pelo ser humano para fora de sua área de origem, a espécie exótica pode encontrar ambiente favorável e <b>ausência de inimigos naturais<\/b>, proliferar sem controle e competir com espécies nativas, prejudicá-las ou eliminá-las, rompendo teias estabelecidas há milhares de anos. Ex.: o aguapé, ornamental, pode virar praga.","x":"Ao lado da destruição de hábitats, da caça e pesca predatórias e do tráfico de animais, é uma das principais causas de extinção de espécies.","r":"Vol. 3 · Cap. 12 · 12.2 Poluição e desequilíbrios ambientais · p. 275","e":null,"h":null,"q":null},{"id":"BIO-V3C12-13","a":"BIO","d":"Volume 3","t":"Cap. 12 · A humanidade e o ambiente","k":"comparação","f":"Protocolo de Montreal × Protocolo de Kyoto: qual problema cada um enfrenta?","v":"<b>Montreal (1987)<\/b>: listou e levou à proibição de substâncias que destroem a <b>camada de ozônio<\/b>, como os <b>CFCs<\/b>; a depleção está sob controle. <b>Kyoto (1997)<\/b>: países industrializados deveriam reduzir em pelo menos 5% as emissões de <b>gases de efeito estufa<\/b> (sobretudo CO<sub>2<\/sub>) em relação a 1990; os EUA assinaram, mas não o ratificaram.","x":"Pegadinha frequente: associar Kyoto à camada de ozônio ou Montreal ao aquecimento global.","r":"Vol. 3 · Cap. 12 · 12.3 Alternativas para o futuro · p. 277","e":null,"h":null,"q":null},{"id":"BIO-V3C12-14","a":"BIO","d":"Volume 3","t":"Cap. 12 · A humanidade e o ambiente","k":"pegadinha","f":"A hidrelétrica é uma fonte pouco poluente. Quais impactos ambientais ela ainda causa?","v":"A construção exige <b>desviar rios e alagar extensas áreas<\/b>, o que pode alterar o clima local e causar o <b>desaparecimento de comunidades biológicas<\/b> da área inundada.","x":"\"Renovável\" não significa \"sem impacto\": barragens também bloqueiam a migração reprodutiva de peixes (piracema), e a vegetação submersa no reservatório se decompõe.","r":"Vol. 3 · Cap. 12 · 12.3 Alternativas para o futuro · p. 279","e":"ENEM PPL 2020 · Q123 — Impactos de hidrelétricas","h":"H12","q":514},{"id":"BIO-V3C12-15","a":"BIO","d":"Volume 3","t":"Cap. 12 · A humanidade e o ambiente","k":"aplicação","f":"O que é um sistema agroflorestal e por que ele recupera e conserva o solo?","v":"Cultivo em <b>consórcio<\/b> de hortaliças, frutíferas e árvores (madeira) na mesma área, imitando a floresta. A grande biodiversidade reduz pragas; plantas como o <b>feijão-guandu fixam nitrogênio<\/b>; poda e húmus servem de adubo. Assim, o sistema é sustentável, sem fertilizantes sintéticos nem agrotóxicos.","x":"Na produção orgânica, por definição, não se usam fertilizantes sintéticos, agrotóxicos nem transgênicos; o SAF vai além ao manter a diversidade de espécies.","r":"Vol. 3 · Cap. 12 · 12.3 Alternativas para o futuro · p. 280","e":"ENEM 2024 · Q108 — Sistemas agroflorestais (recuperação)","h":"H4","q":641}],"topics":{"LC|Português e Artes|Literatura: prosa, conto, romance e crônica":{"n":107,"qp":4.46,"tr":1.17,"tri":602},"LC|Português e Artes|Tecnologias da informação, gêneros digitais e redes sociais":{"n":102,"qp":4.25,"tr":-0.56,"tri":564},"LC|Português e Artes|Variação linguística, norma e preconceito linguístico":{"n":98,"qp":4.08,"tr":-0.11,"tri":571},"LC|Português e Artes|Artes visuais, artes plásticas e patrimônio artístico":{"n":86,"qp":3.58,"tr":0.11,"tri":610},"LC|Português e Artes|Publicidade, campanhas e textos multimodais":{"n":72,"qp":3.0,"tr":-0.44,"tri":534},"LC|Inglês|Leitura e compreensão: ideia central, inferência e propósito":{"n":71,"qp":2.96,"tr":-0.61,"tri":570},"LC|Português e Artes|Música, canção e cultura popular":{"n":61,"qp":2.54,"tr":1.06,"tri":578},"LC|Português e Artes|Educação Física: esporte, saúde e exercício":{"n":58,"qp":2.42,"tr":1.0,"tri":538},"LC|Português e Artes|Gêneros textuais e propósito comunicativo":{"n":56,"qp":2.33,"tr":-0.44,"tri":580},"LC|Português e Artes|Argumentação, tese e estratégias persuasivas":{"n":56,"qp":2.33,"tr":0.0,"tri":577},"LC|Português e Artes|Literatura: poesia e texto poético":{"n":56,"qp":2.33,"tr":0.44,"tri":627},"LC|Espanhol|Leitura e compreensão: ideia central, inferência e propósito":{"n":49,"qp":2.04,"tr":-0.5,"tri":581},"LC|Português e Artes|Figuras de linguage <script>

const isDark = () => tema ? tema === 'dark' : !!(mq && mq.matches);

document.getElementById('tema').onclick = () => {

const lv = id => (id in P.lv) ? P.lv[id] : -1;
function status(id){ const l = lv(id); return l < 0 ? 'novo' : l === 0 ? 'b' : l === 1 ? 'm' : 'g'; }

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (n,d=1) => Number(n).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const tkey = c => c.a+'|'+c.d+'|'+c.t;
function level(a, tri){ if(!tri) return null; const c = AREAS[a].cuts; let i = 0; while(i < 4 && tri > c[i]) i++; return LEVELS[i]; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function counts(list){ const r = {g:0,m:0,b:0,novo:0}; list.forEach(c => r[status(c.id)]++); return r; }
function barHTML(list){
  const r = counts(list), n = list.length || 1;
  return `<div class="bar" role="img" aria-label="${r.g} dominados, ${r.m} quase, ${r.b} a rever, ${r.novo} novos">

}
function legendHTML(list){
  const r = counts(list);
  return `<div class="legend"><em style="--dot:var(--good)">${r.g} dominados</em><em style="--dot:var(--mid)">${r.m} quase</em><em style="--dot:var(--bad)">${r.b} a rever</em><em style="--dot:var(--surface-2)">${r.novo} novos</em></div>`;
}
const areaCards = a => CARDS.filter(c => c.a === a);
function topicsOf(a){
  const m = {};
  areaCards(a).forEach(c => { const k = tkey(c); (m[k] = m[k] || {k, d:c.d, t:c.t, cards:[], ...TOPICS[k]}).cards.push(c); });
  return Object.values(m).sort((x,y) => isBook(a) ? x.o - y.o : y.n - x.n);
}
const groupOf = t => t.mod || t.d;

/* ---------- estado de navegação ---------- */

function render(){
  if(view === 'home') renderHome();

}

  const maxqp = Math.max(...tops.map(t => t.qp)) || 1;
  const groups = book ? [...new Set(shown.map(groupOf))] : (cur.disc === 'Todas' && discs.length > 1 ? discs : [cur.disc === 'Todas' ? discs[0] : cur.disc]);
  const all = areaCards(a);
  const n = sessionCards().length;
  const rowHTML = t => {
    const g = t.cards.filter(c => lv(c.id) >= 2).length;
    const tr = t.tr >= .5 ? `<span class="trend up">em alta +${fmt(t.tr)}</span>` : t.tr <= -.5 ? `<span class="trend down">em queda ${fmt(t.tr)}</span>` : '';
    const sub = book
      ? `<span>Livro, ${esc(t.pg)}</span><span>${t.cards.length} cartões</span>`
      : `<span>${t.n} questões em 24 provas</span>${t.tri?`<span>TRI média ${t.tri}</span>`:''}${tr}`;
    const freq = book
      ? `${t.n} ${t.n===1?'questão':'questões'} no ENEM`
      : `${fmt(t.qp)} questões/prova`;
    return `<label class="trow">
      <input type="checkbox" data-k="${esc(t.k)}" ${cur.sel.has(t.k)?'checked':''}>
      <span class="tname"><b>${esc(t.t)}</b><small>${sub}</small></span>
      <span class="freq"><span class="num">${freq}</span><span class="track"><i style="width:${t.qp/maxqp*100}%"></i></span></span>
      <span class="tprog ${g===t.cards.length?'done':''}">${g}/${t.cards.length}</span>
    </label>`;
  };
  const orderOpts = book
    ? [['rec','Ordem do livro'],['enem','Mais cobrados no ENEM primeiro'],['mix','Embaralhada']]
    : [['rec','Mais cobrados primeiro'],['mix','Embaralhada']];
  if(!orderOpts.some(o => o[0] === cur.order)) cur.order = 'rec';
  app.innerHTML = `
  <div style="--c:var(--${a})">
  <section class="ahead">
    <div><button class="voltar" id="back">← Áreas</button></div>
    <h1><span class="code">${a}</span>${AREAS[a].name}</h1>
    <p>${book
      ? `${AREAS[a].full}. ${all.length} cartões em ${tops.length} capítulos, na ordem do livro. Cada resposta indica a seção e a página; a barra mostra quantas questões do ENEM 2013–2025 cobraram o conteúdo do capítulo.`
      : `${AREAS[a].full}. ${all.length} cartões em ${tops.length} tópicos, do mais cobrado ao menos cobrado.`} Marque o que quer estudar agora.</p>
    <div class="prog" style="max-width:520px">${barHTML(all)}${legendHTML(all)}</div>
  </section>
  ${discs.length > 1 ? `<div class="tabs" role="group" aria-label="${book?'Volume':'Disciplina'}">${['Todas',...discs].map(d => `<button class="tab" aria-pressed="${cur.disc===d}" data-d="${esc(d)}">${esc(d)}</button>`).join('')}</div>` : ''}
  <div class="tools">
    <button class="linkbtn" id="selAll">Marcar todos</button>
    <button class="linkbtn" id="selNone">Desmarcar todos</button>
    <span class="grow"></span>
    <label><input type="checkbox" id="pending" ${cur.pending?'checked':''}> Só o que ainda não domino</label>
    <label>Ordem <select id="order">${orderOpts.map(o => `<option value="${o[0]}" ${cur.order===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></label>
    <label>Rodada <select id="size">${['10','20','40','all'].map(s => `<option value="${s}" ${cur.size===s?'selected':''}>${s==='all'?'Todos':s+' cartões'}</option>`).join('')}</select></label>
  </div>
  <div class="topics">
    ${groups.map(d => {
      const ts = shown.filter(t => (book ? groupOf(t) : t.d) === d);
      const label = book && cur.disc !== 'Todas' ? d.replace(/^Volume \d+ · /,'') : d;
      const head = groups.length > 1 || book ? `<div class="dhead"><span>${esc(label)}</span><span>${ts.reduce((s,t)=>s+t.n,0)} questões${book?' no ENEM':''}</span></div>` : '';
      return head + ts.map(rowHTML).join('');
    }).join('')}
  </div>
  <div class="startbar"><div class="inner">
    <span class="info"><b>${Math.min(n, cur.size==='all'?n:+cur.size)}</b> de ${n} ${n===1?'cartão selecionado':'cartões selecionados'}</span>
    <button class="btn primary" id="start" ${n?'':'disabled'}>Começar rodada</button>
  </div></div>
  </div>`;
  document.getElementById('back').onclick = () => go('home');
  app.querySelectorAll('.tab').forEach(b => b.onclick = () => { cur.disc = b.dataset.d; renderArea(); });
  app.querySelectorAll('.trow input').forEach(i => i.onchange = () => { i.checked ? cur.sel.add(i.dataset.k) : cur.sel.delete(i.dataset.k); renderArea(); });
  document.getElementById('selAll').onclick = () => { shown.forEach(t => cur.sel.add(t.k)); renderArea(); };
  document.getElementById('selNone').onclick = () => { shown.forEach(t => cur.sel.delete(t.k)); renderArea(); };
  document.getElementById('pending').onchange = e => { cur.pending = e.target.checked; renderArea(); };
  document.getElementById('order').onchange = e => { cur.order = e.target.value; };
  document.getElementById('size').onchange = e => { cur.size = e.target.value; renderArea(); };
  document.getElementById('start').onclick = () => {
    let cards = sessionCards();
    if(cur.order === 'mix') shuffle(cards);
    else if(book && cur.order === 'rec') cards.sort((x,y) => TOPICS[tkey(x)].o - TOPICS[tkey(y)].o || (x.id < y.id ? -1 : 1));
    else {
      // mais cobrados primeiro, mas sem repetir o mesmo tópico em sequência: intercala por rodadas
      const by = {}; cards.forEach(c => (by[tkey(c)] = by[tkey(c)] || []).push(c));
      const ks = Object.keys(by).sort((x,y) => TOPICS[y].n - TOPICS[x].n);
      const out = []; let i = 0, left = true;
      while(left){ left = false; ks.forEach(k => { if(by[k][i]){ out.push(by[k][i]); left = true; } }); i++; }
      cards = out;
    }
    if(cur.size !== 'all') cards = cards.slice(0, +cur.size);
    startSession(cards, AREAS[cur.area].name, cur.area);
  };
}

/* ---------- ESTUDO ---------- */
function startSession(cards, label, area){
  S = {queue:cards.slice(), i:0, label, area, flipped:false, res:{0:0,1:0,2:0}, wrong:[], again:{}, total:cards.length};
  go('study');
}
function renderStudy(){
  const c = S.queue[S.i];
  if(!c){ go('done'); return; }
  const tp = TOPICS[tkey(c)];
  const lvq = level(c.a, c.q);
  const book = isBook(c.a);
  const pct = Math.min(100, S.i / S.queue.length * 100);
  app.innerHTML = `
  <div style="--c:var(--${c.a})">
  <div class="sbar">
    <button class="voltar" id="quit">← Sair</button>
    <span class="eyebrow">${esc(S.label)}</span>
    <span class="count num">${S.i+1} / ${S.queue.length}</span>
  </div>
  <div class="sprog"><i style="width:${pct}%"></i></div>
  <div class="stage">
    <div class="card ${S.flipped?'flipped':''}" id="card" role="button" tabindex="0" aria-label="${S.flipped?'Resposta':'Pergunta'}. Toque para virar o cartão.">
      <div class="inner">
        <section class="face front" aria-hidden="${S.flipped}">
          <div class="meta"><span class="chip area">${c.a}</span><span class="chip">${esc(c.d)}</span><span class="chip k-${esc(c.k)}">${esc(c.k)}</span></div>
          <div class="topicline">${book ? `${esc(c.d)} · ${esc(c.t)}` : `${esc(c.t)} · <span class="num">${fmt(tp.qp)}</span> questões/prova`}</div>
          <div class="q">${c.f}</div>
          <div class="hint"><span>Pense na resposta antes de virar.</span><span>Toque para ver a resposta</span></div>
        </section>
        <section class="face back" aria-hidden="${!S.flipped}">
          <div class="meta"><span class="chip area">${c.a}</span><span class="chip">${esc(c.d)}</span><span class="chip k-${esc(c.k)}">${esc(c.k)}</span></div>
          <div class="qmini">${c.f}</div>
          <div class="a">${c.v}</div>
          <div class="tip"><span class="eyebrow">${book ? 'Como cai na prova' : 'Como o ENEM cobra'}</span><span>${c.x}</span></div>
          ${book ? `<div class="ref">
            <span class="eyebrow">No livro</span>
            <span>${esc(c.r)}</span>
            ${c.e ? `<span class="eyebrow" style="margin-top:4px">Caiu no ENEM</span><span>${esc(c.e)}</span>
            <div class="row">${c.h?`<span class="lvl">Habilidade ${esc(c.h)}</span>`:''}${lvq?`<span class="lvl">${lvq} · TRI ${c.q}</span>`:''}</div>` : ''}
          </div>` : `<div class="ref">
            <span class="eyebrow">Caiu em</span>
            <span>${esc(c.r)}</span>
            <div class="row">${c.h?`<span class="lvl">Habilidade ${esc(c.h)}</span>`:''}${lvq?`<span class="lvl">${lvq} · TRI ${c.q}</span>`:''}</div>
          </div>`}
        </section>
      </div>
    </div>
    ${S.flipped ? `<div class="rate" role="group" aria-label="Como foi?">
        <button class="r0" data-r="0">Não sabia<small>volta no fim</small></button>
        <button class="r1" data-r="1">Quase<small>lembrei em parte</small></button>
        <button class="r2" data-r="2">Sabia<small>de primeira</small></button>
      </div>` : `<div class="flipbtn"><button class="btn primary" id="flip">Ver resposta</button></div>`}
  </div>
  <div class="keys"><kbd>espaço</kbd> vira · <kbd>1</kbd> não sabia · <kbd>2</kbd> quase · <kbd>3</kbd> sabia · <kbd>esc</kbd> sai</div>
  </div>`;
  document.getElementById('quit').onclick = quit;
  document.getElementById('card').onclick = flip;
  const fb = document.getElementById('flip'); if(fb) fb.onclick = e => { e.stopPropagation(); flip(); };
  app.querySelectorAll('.rate button').forEach(b => b.onclick = () => rate(+b.dataset.r));
}
function flip(){ S.flipped = !S.flipped; renderStudy(); const card = document.getElementById('card'); if(card) card.focus({preventScroll:true}); }
function rate(r){
  const c = S.queue[S.i]; const l = lv(c.id);
  if(r === 2) P.lv[c.id] = Math.min(3, Math.max(l, 0) + 1);
  else if(r === 1) P.lv[c.id] = 1;
  else P.lv[c.id] = 0;
  save();
  S.res[r]++;
  if(r === 0){
    if(!S.wrong.includes(c)) S.wrong.push(c);
    S.again[c.id] = (S.again[c.id] || 0) + 1;
    if(S.again[c.id] <= 2) S.queue.push(c);
  }
  S.i++; S.flipped = false; renderStudy();
}
function quit(){ if(S.area){ cur.area = S.area; go('area'); } else go('home'); }

/* ---------- FIM ---------- */
function renderDone(){
  const w = S.wrong.filter(c => lv(c.id) < 2);
  app.innerHTML = `
  <section class="done">
    <span class="eyebrow">${esc(S.label)} · rodada concluída</span>
    <h2>${S.total} ${S.total===1?'cartão revisado':'cartões revisados'}</h2>
    <div class="tally">
      <div><b class="num" style="color:var(--good)">${S.res[2]}</b><span>Sabia</span></div>
      <div><b class="num" style="color:var(--mid)">${S.res[1]}</b><span>Quase</span></div>
      <div><b class="num" style="color:var(--bad)">${S.res[0]}</b><span>Não sabia</span></div>
    </div>
    <p>${w.length ? `Ficaram ${w.length} ${w.length===1?'cartão':'cartões'} para rever. Uma rodada curta agora fixa melhor do que deixar para amanhã.` : 'Nenhum cartão pendente desta rodada.'}</p>
    <div class="actions">
      ${w.length ? `<button class="btn primary" id="redo">Rever os ${w.length} que errei</button>` : ''}
      ${S.area ? `<button class="btn" id="toArea">Voltar a ${AREAS[S.area].name}</button>` : ''}
      <button class="btn" id="toHome">Todas as áreas</button>
    </div>
  </section>`;
  const r = document.getElementById('redo'); if(r) r.onclick = () => startSession(w, S.label, S.area);
  const a = document.getElementById('toArea'); if(a) a.onclick = () => { cur.area = S.area; go('area'); };
  document.getElementById('toHome').onclick = () => go('home');
}

document.addEventListener('keydown', e => {
  if(view !== 'study' || e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.key === ' ' || e.key === 'Enter'){ if(e.target.tagName === 'BUTTON' && e.target.id !== 'card') return; e.preventDefault(); flip(); }
  else if(S.flipped && ['1','2','3'].includes(e.key)){ rate(+e.key - 1); }
  else if(e.key === 'Escape'){ quit(); }
});

render();
})();
</script>

</body>
