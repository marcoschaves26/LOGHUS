|Função exponencial e logaritmo":{"n":28,"qp":1.17,"tr":0.0,"tri":718},"MT|Matemática|Álgebra: equações, sistemas, inequações e matrizes":{"n":25,"qp":1.04,"tr":-0.5,"tri":641},"MT|Matemática|Função afim (1º grau)":{"n":20,"qp":0.83,"tr":0.89,"tri":623},"MT|Matemática|Sequências e progressões (PA e PG)":{"n":19,"qp":0.79,"tr":1.17,"tri":664},"MT|Matemática|Função quadrática (2º grau)":{"n":19,"qp":0.79,"tr":-0.39,"tri":748},"MT|Matemática|Semelhança, Pitágoras e trigonometria no triângulo":{"n":18,"qp":0.75,"tr":-0.33,"tri":703},"MT|Matemática|Funções trigonométricas e periodicidade":{"n":10,"qp":0.42,"tr":0.11,"tri":751}}}</script>
<script>
(function(){
const DATA = JSON.parse(document.getElementById('data').textContent);
const CARDS = DATA.cards, TOPICS = DATA.topics;
const AREAS = {
  LC:{name:'Linguagens',full:'Linguagens, Códigos e suas Tecnologias',cuts:[471,541,611,681]},
  CH:{name:'Humanas',full:'Ciências Humanas e suas Tecnologias',cuts:[493,565,637,708]},
  CN:{name:'Natureza',full:'Ciências da Natureza e suas Tecnologias',cuts:[522,595,669,742]},
  MT:{name:'Matemática',full:'Matemática e suas Tecnologias',cuts:[558,643,727,812]}
};
const ORDER = ['LC','CH','CN','MT'];
const LEVELS = ['Muito fácil','Fácil','Média','Difícil','Muito difícil'];
const KEY = 'loghus-flashcards-enem-v1';
const app = document.getElementById('app');

/* tema claro/escuro: começa pelo do aparelho; a escolha do aluno fica salva */
const TKEY = 'loghus-flashcards-tema';
const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
let tema = null;
try{ tema = localStorage.getItem(TKEY); }catch(e){}
const isDark = () => tema ? tema === 'dark' : !!(mq && mq.matches);
function applyTema(){
  if(tema) document.documentElement.setAttribute('data-theme', tema);
  else document.documentElement.removeAttribute('data-theme');
  const b = document.getElementById('tema');
  const dark = isDark();
  b.innerHTML = (dark ? SUN : MOON) + `<span>${dark ? 'Tema claro' : 'Tema escuro'}</span>`;
  b.setAttribute('aria-label', dark ? 'Mudar para o tema claro' : 'Mudar para o tema escuro');
}
document.getElementById('tema').onclick = () => {
  tema = isDark() ? 'light' : 'dark';
  try{ localStorage.setItem(TKEY, tema); }catch(e){}
  applyTema();
};
if(mq && mq.addEventListener) mq.addEventListener('change', () => { if(!tema) applyTema(); });
applyTema();

/* progresso: lv 0 = não sabia, 1 = quase, 2+ = domina; ausente = novo */
let P = {lv:{}};
try{ const s = localStorage.getItem(KEY); if(s){ const o = JSON.parse(s); if(o && o.lv) P = o; } }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(P)); }catch(e){} }
const lv = id => (id in P.lv) ? P.lv[id] : -1;
function status(id){ const l = lv(id); return l < 0 ? 'novo' : l === 0 ? 'b' : l === 1 ? 'm' : 'g'; }

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (n,d=1) => Number(n).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const tkey = c => c.a+'|'+c.d+'|'+c.t;
function level(a, tri){ if(!tri) return null; const c = AREAS[a].cuts; let i = 0; while(i < 4 && tri > c[i]) i++; return LEVELS[i]; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function counts(list){ const r = {g:0,m:0,b:0,novo:0}; list.forEach(c => r[status(c.id)]++); return r; }
function barHTML(list){
  const r = counts(list), n = list.length || 1;
  return `<div class="bar" role="img" aria-label="${r.g} dominados, ${r.m} quase, ${r.b} a rever, ${r.novo} novos">
    <i class="g" style="width:${r.g/n*100}%"></i><i class="m" style="width:${r.m/n*100}%"></i><i class="b" style="width:${r.b/n*100}%"></i></div>`;
}
function legendHTML(list){
  const r = counts(list);
  return `<div class="legend"><em style="--dot:var(--good)">${r.g} dominados</em><em style="--dot:var(--mid)">${r.m} quase</em><em style="--dot:var(--bad)">${r.b} a rever</em><em style="--dot:var(--surface-2)">${r.novo} novos</em></div>`;
}
const areaCards = a => CARDS.filter(c => c.a === a);
function topicsOf(a){
  const m = {};
  areaCards(a).forEach(c => { const k = tkey(c); (m[k] = m[k] || {k, d:c.d, t:c.t, cards:[], ...TOPICS[k]}).cards.push(c); });
  return Object.values(m).sort((x,y) => y.n - x.n);
}

/* ---------- estado de navegação ---------- */
let view = 'home', cur = {area:null, disc:'Todas', sel:new Set(), pending:false, order:'rec', size:'20'};
let S = null; // sessão

function go(v){ view = v; render(); window.scrollTo({top:0}); }

function render(){
  if(view === 'home') renderHome();
  else if(view === 'area') renderArea();
  else if(view === 'study') renderStudy();
  else if(view === 'done') renderDone();
}

/* ---------- HOME ---------- */
function renderHome(){
  const total = CARDS.length, nTop = Object.keys(TOPICS).length;
  const rev = CARDS.filter(c => lv(c.id) === 0).length;
  const g = counts(CARDS).g;
  app.innerHTML = `
  <section class="hero">
    <span class="eyebrow">ENEM · 4 áreas · baseado em recorrência</span>
    <h1>Os conceitos que mais caem, em cartões.</h1>
    <p>Cada cartão foi escrito a partir das 4.440 questões do ENEM de 2013 a 2025 (1ª aplicação e PPL), classificadas tópico a tópico. Os assuntos que mais aparecem na prova têm mais cartões, e cada resposta mostra uma questão real em que o conceito caiu.</p>
    <div class="stats">
      <div><b class="num">${total}</b><span>cartões</span></div>
      <div><b class="num">${nTop}</b><span>tópicos recorrentes</span></div>
      <div><b class="num">${g}</b><span>você já domina</span></div>
    </div>
  </section>
  <section class="areas" aria-label="Áreas">
    ${ORDER.map(a => {
      const list = areaCards(a), tops = topicsOf(a);
      return `<button class="area" style="--c:var(--${a})" data-area="${a}">
        <div class="top"><span class="code">${a}</span><div><h2>${AREAS[a].name}</h2><div class="sub">${list.length} cartões · ${tops.length} tópicos</div></div></div>
        <ol>${tops.slice(0,3).map(t => `<li><span>${esc(t.t)}</span><span class="num">${fmt(t.qp)}/prova</span></li>`).join('')}</ol>
        <div class="prog">${barHTML(list)}${legendHTML(list)}</div>
      </button>`;
    }).join('')}
  </section>
  ${rev ? `<div class="panel"><p><b>${rev} ${rev===1?'cartão':'cartões'}</b> que você marcou como “Não sabia”, em todas as áreas. Vale revisar antes de seguir.</p><button class="btn primary" id="revAll">Revisar os que errei</button></div>` : ''}
  <section class="how" aria-label="Como estudar">
    <div><b>Escolha os tópicos</b>Dentro de cada área, os tópicos vêm em ordem de recorrência, com a média de questões por prova.</div>
    <div><b>Responda de cabeça e vire</b>Toque no cartão (ou aperte espaço) para ver a resposta, a dica de prova e a questão em que caiu.</div>
    <div><b>Seja honesto na nota</b>“Não sabia” volta no fim da rodada. Dois “Sabia” seguidos marcam o cartão como dominado.</div>
  </section>
  <footer>
    <p>Fontes: planilha de conteúdos recorrentes ENEM 2013–2025 (24 provas, 4.440 itens, microdados do Inep), questões por nível de dificuldade (parâmetro b da TRI) e e-books Loghus de 11 anos de ENEM e PPL 2016–2025. O nível de cada questão segue os cortes calculados por área.</p>
    <p>Seu progresso fica salvo só neste aparelho e neste navegador. <span id="resetWrap"><button class="linkbtn" id="reset">Zerar meu progresso</button></span></p>
  </footer>`;
  app.querySelectorAll('.area').forEach(b => b.onclick = () => openArea(b.dataset.area));
  const r = document.getElementById('revAll');
  if(r) r.onclick = () => startSession(CARDS.filter(c => lv(c.id) === 0), 'Revisão dos erros', null);
  bindReset();
}
function bindReset(){
  const b = document.getElementById('reset'); if(!b) return;
  b.onclick = () => {
    const w = document.getElementById('resetWrap');
    w.innerHTML = `Apagar todo o progresso? <button class="linkbtn danger" id="rYes">Sim, zerar</button> · <button class="linkbtn" id="rNo">Cancelar</button>`;
    document.getElementById('rYes').onclick = () => { P = {lv:{}}; save(); render(); };
    document.getElementById('rNo').onclick = () => render();
  };
}

/* ---------- ÁREA ---------- */
function openArea(a){
  cur.area = a; cur.disc = 'Todas';
  cur.sel = new Set(topicsOf(a).map(t => t.k));
  go('area');
}
function sessionCards(){
  let list = topicsOf(cur.area).filter(t => cur.sel.has(t.k) && (cur.disc === 'Todas' || t.d === cur.disc));
  let cards = [];
  list.forEach(t => t.cards.forEach(c => cards.push(c)));
  if(cur.pending) cards = cards.filter(c => lv(c.id) < 2);
  return cards;
}
function renderArea(){
  const a = cur.area, tops = topicsOf(a);
  const discs = [...new Set(tops.map(t => t.d))];
  const shown = tops.filter(t => cur.disc === 'Todas' || t.d === cur.disc);
  const maxqp = Math.max(...tops.map(t => t.qp));
  const groups = cur.disc === 'Todas' && discs.length > 1 ? discs : [cur.disc === 'Todas' ? discs[0] : cur.disc];
  const all = areaCards(a);
  const n = sessionCards().length;
  const rowHTML = t => {
    const g = t.cards.filter(c => lv(c.id) >= 2).length;
    const tr = t.tr >= .5 ? `<span class="trend up">em alta +${fmt(t.tr)}</span>` : t.tr <= -.5 ? `<span class="trend down">em queda ${fmt(t.tr)}</span>` : '';
    return `<label class="trow">
      <input type="checkbox" data-k="${esc(t.k)}" ${cur.sel.has(t.k)?'checked':''}>
      <span class="tname"><b>${esc(t.t)}</b><small><span>${t.n} questões em 24 provas</span>${t.tri?`<span>TRI média ${t.tri}</span>`:''}${tr}</small></span>
      <span class="freq"><span class="num">${fmt(t.qp)} questões/prova</span><span class="track"><i style="width:${t.qp/maxqp*100}%"></i></span></span>
      <span class="tprog ${g===t.cards.length?'done':''}">${g}/${t.cards.length}</span>
    </label>`;
  };
  app.innerHTML = `
  <div style="--c:var(--${a})">
  <section class="ahead">
    <div><button class="back" id="back">← Áreas</button></div>
    <h1><span class="code">${a}</span>${AREAS[a].name}</h1>
    <p>${AREAS[a].full}. ${all.length} cartões em ${tops.length} tópicos, do mais cobrado ao menos cobrado. Marque o que quer estudar agora.</p>
    <div class="prog" style="max-width:520px">${barHTML(all)}${legendHTML(all)}</div>
  </section>
  ${discs.length > 1 ? `<div class="tabs" role="group" aria-label="Disciplina">${['Todas',...discs].map(d => `<button class="tab" aria-pressed="${cur.disc===d}" data-d="${esc(d)}">${esc(d)}</button>`).join('')}</div>` : ''}
  <div class="tools">
    <button class="linkbtn" id="selAll">Marcar todos</button>
    <button class="linkbtn" id="selNone">Desmarcar todos</button>
    <span class="grow"></span>
    <label><input type="checkbox" id="pending" ${cur.pending?'checked':''}> Só o que ainda não domino</label>
    <label>Ordem <select id="order"><option value="rec" ${cur.order==='rec'?'selected':''}>Mais cobrados primeiro</option><option value="mix" ${cur.order==='mix'?'selected':''}>Embaralhada</option></select></label>
    <label>Rodada <select id="size">${['10','20','40','all'].map(s => `<option value="${s}" ${cur.size===s?'selected':''}>${s==='all'?'Todos':s+' cartões'}</option>`).join('')}</select></label>
  </div>
  <div class="topics">
    ${groups.map(d => {
      const ts = shown.filter(t => t.d === d);
      const head = groups.length > 1 ? `<div class="dhead"><span>${esc(d)}</span><span>${ts.reduce((s,t)=>s+t.n,0)} questões</span></div>` : '';
      return head + ts.map(rowHTML).join('');
    }).join('')}
  </div>
  <div class="startbar"><div class="inner">
    <span class="info"><b>${Math.min(n, cur.size==='all'?n:+cur.size)}</b> de ${n} ${n===1?'cartão selecionado':'cartões selecionados'}</span>
    <button class="btn primary" id="start" ${n?'':'disabled'}>Começar rodada</button>
  </div></div>
  </div>`;
  document.getElementById('back').onclick = () => go('home');
  app.querySelectorAll('.tab').forEach(b => b.onclick = () => { cur.disc = b.dataset.d; renderArea(); });
  app.querySelectorAll('.trow input').forEach(i => i.onchange = () => { i.checked ? cur.sel.add(i.dataset.k) : cur.sel.delete(i.dataset.k); renderArea(); });
  document.getElementById('selAll').onclick = () => { shown.forEach(t => cur.sel.add(t.k)); renderArea(); };
  document.getElementById('selNone').onclick = () => { shown.forEach(t => cur.sel.delete(t.k)); renderArea(); };
  document.getElementById('pending').onchange = e => { cur.pending = e.target.checked; renderArea(); };
  document.getElementById('order').onchange = e => { cur.order = e.target.value; };
  document.getElementById('size').onchange = e => { cur.size = e.target.value; renderArea(); };
  document.getElementById('start').onclick = () => {
    let cards = sessionCards();
    if(cur.order === 'mix') shuffle(cards);
    else {
      // mais cobrados primeiro, mas sem repetir o mesmo tópico em sequência: intercala por rodadas
      const by = {}; cards.forEach(c => (by[tkey(c)] = by[tkey(c)] || []).push(c));
      const ks = Object.keys(by).sort((x,y) => TOPICS[y].n - TOPICS[x].n);
      const out = []; let i = 0, left = true;
      while(left){ left = false; ks.forEach(k => { if(by[k][i]){ out.push(by[k][i]); left = true; } }); i++; }
      cards = out;
    }
    if(cur.size !== 'all') cards = cards.slice(0, +cur.size);
    startSession(cards, AREAS[cur.area].name, cur.area);
  };
}

/* ---------- ESTUDO ---------- */
function startSession(cards, label, area){
  S = {queue:cards.slice(), i:0, label, area, flipped:false, res:{0:0,1:0,2:0}, wrong:[], again:{}, total:cards.length};
  go('study');
}
function renderStudy(){
  const c = S.queue[S.i];
  if(!c){ go('done'); return; }
  const tp = TOPICS[tkey(c)];
  const lvq = level(c.a, c.q);
  const pct = Math.min(100, S.i / S.queue.length * 100);
  app.innerHTML = `
  <div style="--c:var(--${c.a})">
  <div class="sbar">
    <button class="back" id="quit">← Sair</button>
    <span class="eyebrow">${esc(S.label)}</span>
    <span class="count num">${S.i+1} / ${S.queue.length}</span>
  </div>
  <div class="sprog"><i style="width:${pct}%"></i></div>
  <div class="stage">
    <div class="card ${S.flipped?'flipped':''}" id="card" role="button" tabindex="0" aria-label="${S.flipped?'Resposta':'Pergunta'}. Toque para virar o cartão.">
      <div class="inner">
        <section class="face front" aria-hidden="${S.flipped}">
          <div class="meta"><span class="chip area">${c.a}</span><span class="chip">${esc(c.d)}</span><span class="chip k-${esc(c.k)}">${esc(c.k)}</span></div>
          <div class="topicline">${esc(c.t)} · <span class="num">${fmt(tp.qp)}</span> questões/prova</div>
          <div class="q">${c.f}</div>
          <div class="hint"><span>Pense na resposta antes de virar.</span><span>Toque para ver a resposta</span></div>
        </section>
        <section class="face back" aria-hidden="${!S.flipped}">
          <div class="meta"><span class="chip area">${c.a}</span><span class="chip">${esc(c.d)}</span><span class="chip k-${esc(c.k)}">${esc(c.k)}</span></div>
          <div class="qmini">${c.f}</div>
          <div class="a">${c.v}</div>
          <div class="tip"><span class="eyebrow">Como o ENEM cobra</span>${c.x}</div>
          <div class="ref">
            <span class="eyebrow">Caiu em</span>
            <span>${esc(c.r)}</span>
            <div class="row">${c.h?`<span class="lvl">Habilidade ${esc(c.h)}</span>`:''}${lvq?`<span class="lvl">${lvq} · TRI ${c.q}</span>`:''}</div>
          </div>
        </section>
      </div>
    </div>
    ${S.flipped ? `<div class="rate" role="group" aria-label="Como foi?">
        <button class="r0" data-r="0">Não sabia<small>volta no fim</small></button>
        <button class="r1" data-r="1">Quase<small>lembrei em parte</small></button>
        <button class="r2" data-r="2">Sabia<small>de primeira</small></button>
      </div>` : `<div class="flipbtn"><button class="btn primary" id="flip">Ver resposta</button></div>`}
  </div>
  <div class="keys"><kbd>espaço</kbd> vira · <kbd>1</kbd> não sabia · <kbd>2</kbd> quase · <kbd>3</kbd> sabia · <kbd>esc</kbd> sai</div>
  </div>`;
  document.getElementById('quit').onclick = quit;
  document.getElementById('card').onclick = flip;
  const fb = document.getElementById('flip'); if(fb) fb.onclick = e => { e.stopPropagation(); flip(); };
  app.querySelectorAll('.rate button').forEach(b => b.onclick = () => rate(+b.dataset.r));
}
function flip(){ S.flipped = !S.flipped; renderStudy(); const card = document.getElementById('card'); if(card) card.focus({preventScroll:true}); }
function rate(r){
  const c = S.queue[S.i]; const l = lv(c.id);
  if(r === 2) P.lv[c.id] = Math.min(3, Math.max(l, 0) + 1);
  else if(r === 1) P.lv[c.id] = 1;
  else P.lv[c.id] = 0;
  save();
  S.res[r]++;
  if(r === 0){
    if(!S.wrong.includes(c)) S.wrong.push(c);
    S.again[c.id] = (S.again[c.id] || 0) + 1;
    if(S.again[c.id] <= 2) S.queue.push(c);
  }
  S.i++; S.flipped = false; renderStudy();
}
function quit(){ if(S.area){ cur.area = S.area; go('area'); } else go('home'); }

/* ---------- FIM ---------- */
function renderDone(){
  const w = S.wrong.filter(c => lv(c.id) < 2);
  app.innerHTML = `
  <section class="done">
    <span class="eyebrow">${esc(S.label)} · rodada concluída</span>
    <h2>${S.total} ${S.total===1?'cartão revisado':'cartões revisados'}</h2>
    <div class="tally">
      <div><b class="num" style="color:var(--good)">${S.res[2]}</b><span>Sabia</span></div>
      <div><b class="num" style="color:var(--mid)">${S.res[1]}</b><span>Quase</span></div>
      <div><b class="num" style="color:var(--bad)">${S.res[0]}</b><span>Não sabia</span></div>
    </div>
    <p>${w.length ? `Ficaram ${w.length} ${w.length===1?'cartão':'cartões'} para rever. Uma rodada curta agora fixa melhor do que deixar para amanhã.` : 'Nenhum cartão pendente desta rodada.'}</p>
    <div class="actions">
      ${w.length ? `<button class="btn primary" id="redo">Rever os ${w.length} que errei</button>` : ''}
      ${S.area ? `<button class="btn" id="toArea">Voltar a ${AREAS[S.area].name}</button>` : ''}
      <button class="btn" id="toHome">Todas as áreas</button>
    </div>
  </section>`;
  const r = document.getElementById('redo'); if(r) r.onclick = () => startSession(w, S.label, S.area);
  const a = document.getElementById('toArea'); if(a) a.onclick = () => { cur.area = S.area; go('area'); };
  document.getElementById('toHome').onclick = () => go('home');
}

document.addEventListener('keydown', e => {
  if(view !== 'study' || e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.key === ' ' || e.key === 'Enter'){ if(e.target.tagName === 'BUTTON' && e.target.id !== 'card') return; e.preventDefault(); flip(); }
  else if(S.flipped && ['1','2','3'].includes(e.key)){ rate(+e.key - 1); }
  else if(e.key === 'Escape'){ quit(); }
});

render();
})();
</script>

</body>
