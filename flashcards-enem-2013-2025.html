a autonomia da política.","r":"ENEM PPL 2022 · Q63 — Autonomia da política e virtù (Maquiavel)","h":"H1","q":508},{"id":"CH-011","a":"CH","d":"Filosofia","t":"Corpo, existência, subjetividade e tempo","k":"conceito","f":"O que significa “a existência precede a essência” no existencialismo?","v":"O ser humano não tem natureza predefinida: primeiro existe e depois <b>se define por suas escolhas<\/b>. Por isso está <b>condenado a ser livre<\/b> e é responsável pelo que faz de si (Sartre).","x":"Liberdade + responsabilidade + angústia são as palavras-chave do existencialismo.","r":"ENEM PPL 2022 · Q84 — Existencialismo e realidade humana (Abbagnano)","h":"H3","q":633},{"id":"CH-012","a":"CH","d":"Filosofia","t":"Corpo, existência, subjetividade e tempo","k":"conceito","f":"O que é o amor fati em Nietzsche?","v":"“Amor ao destino”: <b>aceitar e afirmar a vida<\/b> inteira, inclusive o sofrimento, sem desejar que nada fosse diferente. Liga-se à ideia de <b>eterno retorno<\/b>.","x":"Nietzsche aparece como crítico da moral cristã e defensor da afirmação da vida.","r":"ENEM 2021 · Q87 — Amor fati (Nietzsche)","h":"H3","q":658},{"id":"CH-013","a":"CH","d":"Filosofia","t":"Filosofia, ciência e natureza","k":"conceito","f":"O que buscavam os pré-socráticos e quais respostas se destacam?","v":"A <b>arché<\/b> (princípio de todas as coisas). Tales: água; Heráclito: <b>devir<\/b> e unidade dos opostos (“tudo flui”); Parmênides: o ser é imutável; Empédocles: quatro elementos; Demócrito: <b>átomos<\/b>.","x":"Marca a passagem do mito ao logos: explicação racional da natureza (physis).","r":"ENEM 2025 · Q72 — Unidade dos opostos (Heráclito)","h":"H1","q":623},{"id":"CH-014","a":"CH","d":"Filosofia","t":"Filosofia, ciência e natureza","k":"conceito","f":"Qual o projeto de ciência de Francis Bacon?","v":"<b>“Saber é poder”<\/b>: conhecer a natureza para <b>dominá-la<\/b> em benefício humano, pelo <b>método indutivo-experimental<\/b>, depois de eliminar os “ídolos” (preconceitos) da mente.","x":"Cai em questões sobre ciência moderna e crítica à exploração da natureza.","r":"ENEM 2019 · Q75 — Domínio da natureza (Bacon)","h":"H27","q":534},{"id":"CH-015","a":"CH","d":"Filosofia","t":"Democracia, cidadania e participação","k":"conceito","f":"Por que Norberto Bobbio diz que os direitos humanos são históricos?","v":"Porque <b>não nascem todos de uma vez<\/b>: surgem gradualmente, em lutas concretas contra velhos poderes, e se ampliam com o tempo (direitos civis, políticos, sociais, difusos).","x":"O ENEM opõe “históricos/conquistados” a “naturais/dados” — Bobbio fica com a primeira opção.","r":"ENEM 2025 · Q76 — Historicidade dos direitos humanos (Bobbio)","h":"H22","q":657},{"id":"CH-016","a":"CH","d":"Filosofia","t":"Democracia, cidadania e participação","k":"conceito","f":"Que risco da democracia John Stuart Mill aponta?","v":"A <b>tirania da maioria<\/b>: a maioria pode oprimir indivíduos e minorias. Defende a liberdade individual, limitada só pelo <b>princípio do dano<\/b> (não prejudicar os outros).","x":"Associe Mill a liberalismo e liberdade de expressão.","r":"ENEM PPL 2017 · Q66 — Autogoverno e democracia (Mill)","h":"H24","q":529},{"id":"CH-017","a":"CH","d":"Filosofia","t":"Lógica, linguagem e argumentação","k":"pegadinha","f":"O que é a falácia ad hominem?","v":"Atacar <b>a pessoa<\/b> que argumenta (caráter, origem, vida pessoal) em vez de refutar o <b>argumento<\/b>. É um raciocínio inválido, muito comum em debates políticos.","x":"Outras falácias frequentes: espantalho, apelo à autoridade, falsa dicotomia.","r":"ENEM PPL 2023 · Q87 — Falácia ad hominem na política","h":"H1","q":520},{"id":"CH-018","a":"CH","d":"Filosofia","t":"Lógica, linguagem e argumentação","k":"conceito","f":"Por que, para Aristóteles, o ser humano é um “animal político”?","v":"Porque só realiza plenamente sua natureza na <b>pólis<\/b>, e possui o <b>logos<\/b> (palavra/razão), que permite discutir o justo e o injusto — algo que a mera voz animal não faz.","x":"Linguagem e política aparecem juntas: deliberar em comum é o que funda a cidade.","r":"ENEM PPL 2020 · Q50 — Linguagem e vida política (Aristóteles)","h":"H5","q":486},{"id":"CH-019","a":"CH","d":"Filosofia","t":"Estética, arte e técnica","k":"conceito","f":"O que Adorno e Horkheimer criticam como “razão instrumental”?","v":"A razão reduzida a <b>meio de cálculo e dominação<\/b> (da natureza e dos homens), sem refletir sobre fins. Em <i>Dialética do Esclarecimento<\/i>, mostram que o progresso técnico pode desembocar em <b>barbárie<\/b>.","x":"Escola de Frankfurt = teoria crítica; liga-se a indústria cultural e técnica.","r":"ENEM PPL 2024 · Q55 — Razão instrumental e barbárie (Adorno)","h":"H11","q":637},{"id":"CH-020","a":"CH","d":"Filosofia","t":"Estética, arte e técnica","k":"conceito","f":"Qual a tese de Rousseau no Discurso sobre as ciências e as artes?","v":"O avanço das ciências e das artes <b>não tornou os costumes melhores<\/b>: favoreceu vaidade, luxo e aparência, corrompendo a virtude natural.","x":"Rousseau é o crítico da civilização; o “bom selvagem” vem dessa linha.","r":"ENEM PPL 2020 · Q88 — Arte e civilização (Rousseau)","h":"H30","q":644},{"id":"CH-021","a":"CH","d":"Geografia","t":"Relevo, geologia, solos e dinâmica da Terra","k":"conceito","f":"Diferencie agentes internos e externos do relevo.","v":"<b>Internos (endógenos)<\/b>: tectonismo, vulcanismo, abalos sísmicos — <b>criam<\/b> formas. <b>Externos (exógenos)<\/b>: intemperismo, erosão por água, vento, gelo e ação humana — <b>modelam/desgastam<\/b>.","x":"O relevo é resultado do embate permanente entre as duas forças.","r":"ENEM 2022 · Q64 — Agentes internos e externos do relevo","h":"H29","q":null},{"id":"CH-022","a":"CH","d":"Geografia","t":"Relevo, geologia, solos e dinâmica da Terra","k":"aplicação","f":"Por que o Himalaia e os Andes existem, e por que o Chile tem tantos terremotos?","v":"Ambos estão em <b>limites convergentes<\/b> de placas. Himalaia: <b>colisão continental<\/b> (Indo-Australiana × Euro-Asiática). Andes: <b>subducção<\/b> da placa de Nazca sob a Sul-Americana — o atrito gera sismos e vulcões.","x":"O Brasil fica no centro da placa Sul-Americana: abalos fracos e sem vulcanismo ativo.","r":"ENEM 2023 · Q53 — Formação de cordilheiras (Himalaia)","h":"H26","q":582},{"id":"CH-023","a":"CH","d":"Geografia","t":"Relevo, geologia, solos e dinâmica da Terra","k":"conceito","f":"O que são dolinas e por que provocam colapsos de terreno?","v":"Depressões típicas do <b>relevo cárstico<\/b>, formadas pela <b>dissolução química<\/b> de rochas solúveis (calcário) pela água. Cavidades subterrâneas podem ceder e abrir crateras.","x":"Intemperismo químico domina em climas úmidos; físico, em climas secos/frios.","r":"ENEM 2025 · Q70 — Dolinas e colapso do terreno (Flórida)","h":"H27","q":675},{"id":"CH-024","a":"CH","d":"Geografia","t":"Relevo, geologia, solos e dinâmica da Terra","k":"conceito","f":"O que é salinização do solo e onde ocorre?","v":"Acúmulo de sais na superfície por <b>irrigação mal manejada<\/b> em <b>climas áridos/semiáridos<\/b>: a evaporação intensa retira a água e deixa os sais, reduzindo a fertilidade.","x":"Outros processos de degradação: lixiviação, laterização, voçorocas, desertificação.","r":"ENEM 2022 · Q55 — Salinização dos solos (regiões áridas)","h":"H28","q":734},{"id":"CH-025","a":"CH","d":"Geografia","t":"Agricultura, agronegócio e espaço agrário","k":"conceito","f":"O que foi a Revolução Verde e quais seus efeitos?","v":"Pacote tecnológico do pós-1950: <b>sementes selecionadas, fertilizantes, agrotóxicos e mecanização<\/b>. Elevou a produtividade, mas trouxe <b>concentração fundiária<\/b>, êxodo rural, dependência de insumos e contaminação ambiental.","x":"O ENEM costuma exigir o lado crítico: não acabou com a fome, que é questão de distribuição.","r":"ENEM 2025 · Q75 — Revolução Verde e agroquímicos","h":"H19","q":580},{"id":"CH-026","a":"CH","d":"Geografia","t":"Agricultura, agronegócio e espaço agrário","k":"conceito","f":"O que é o MATOPIBA?","v":"Fronteira agrícola no <b>Cerrado<\/b> de <b>Maranhão, Tocantins, Piauí e Bahia<\/b>, com expansão de soja, milho e algodão mecanizados para exportação — e conflitos com povos e comunidades tradicionais.","x":"Liga-se a desmatamento do Cerrado, grilagem e concentração de terras.","r":"ENEM PPL 2024 · Q81 — Agricultura moderna no Matopiba","h":"H16","q":618},{"id":"CH-027","a":"CH","d":"Geografia","t":"Agricultura, agronegócio e espaço agrário","k":"conceito","f":"O que é a função social da propriedade rural na Constituição de 1988?","v":"A terra deve ser <b>produtiva<\/b>, respeitar o <b>meio ambiente<\/b> e as <b>leis trabalhistas<\/b>. O imóvel que não cumpre a função social pode ser <b>desapropriado para reforma agrária<\/b>, mediante indenização.","x":"O direito de propriedade não é absoluto no Brasil — base de várias questões de cidadania.","r":"ENEM 2025 · Q67 — Função social da terra (desapropriação)","h":"H10","q":768},{"id":"CH-028","a":"CH","d":"Geografia","t":"Agricultura, agronegócio e espaço agrário","k":"conceito","f":"Qual o papel da agricultura familiar no Brasil?","v":"Responde por grande parte dos <b>alimentos do mercado interno<\/b> e pela maior parte da <b>ocupação no campo<\/b>, em pequenas áreas. Políticas como o <b>PAA<\/b> e o PNAE compram sua produção.","x":"Contraste típico: agronegócio = commodities para exportação; familiar = alimentos e emprego.","r":"ENEM 2022 · Q59 — Agricultura familiar e compras públicas (PAA)","h":"H19","q":569},{"id":"CH-029","a":"CH","d":"Geografia","t":"Questões ambientais, sustentabilidade e mudanças climáticas","k":"aplicação","f":"O que foi o desastre de Mariana (2015)?","v":"Rompimento da barragem de rejeitos de <b>Fundão<\/b> (Samarco), em MG: a lama de minério devastou o distrito de Bento Rodrigues e a <b>bacia do Rio Doce<\/b> até o litoral do ES.","x":"Junto com Brumadinho (2019), é usado para discutir mineração e riscos socioambientais.","r":"ENEM 2024 · Q48 — Desastre de Mariana (barragem de Fundão)","h":"H27","q":528},{"id":"CH-030","a":"CH","d":"Geografia","t":"Questões ambientais, sustentabilidade e mudanças climáticas","k":"conceito","f":"Como funciona o mercado de créditos de carbono?","v":"Criado a partir do <b>Protocolo de Kyoto<\/b>: quem reduz emissões gera créditos (1 crédito ≈ 1 t de CO₂ equivalente) que podem ser vendidos a quem precisa compensar emissões.","x":"Crítica recorrente: vira um “direito de poluir” para países e empresas ricos.","r":"ENEM PPL 2022 · Q51 — Mercado de créditos de carbono","h":"H30","q":651},{"id":"CH-031","a":"CH","d":"Geografia","t":"Questões ambientais, sustentabilidade e mudanças climáticas","k":"conceito","f":"O que mede a pegada ecológica?","v":"A <b>área produtiva<\/b> de terra e água necessária para sustentar o consumo e absorver os resíduos de uma pessoa ou país. Quando supera a biocapacidade, há <b>déficit ecológico<\/b>.","x":"Países ricos têm pegada muito maior: liga consumo a impacto ambiental.","r":"ENEM PPL 2024 · Q62 — Pegada ecológica e fontes renováveis","h":"H30","q":509},{"id":"CH-032","a":"CH","d":"Geografia","t":"Questões ambientais, sustentabilidade e mudanças climáticas","k":"conceito","f":"Diferencie inundações graduais de inundações bruscas (enxurradas).","v":"<b>Graduais<\/b>: a água sobe lentamente e permanece, típicas de grandes rios em cheia. <b>Bruscas<\/b>: chuvas intensas e concentradas, escoamento rápido, comuns em encostas e cidades <b>impermeabilizadas<\/b>.","x":"Nas cidades, asfalto e ocupação de várzeas agravam os eventos extremos.","r":"ENEM 2024 · Q53 — Inundações graduais e bruscas","h":"H26","q":658},{"id":"CH-033","a":"CH","d":"Geografia","t":"Urbanização, rede urbana e problemas urbanos","k":"conceito","f":"O que é macrocefalia urbana?","v":"Crescimento <b>desproporcional<\/b> de uma metrópole em relação às demais cidades da rede, concentrando população, serviços e problemas (favelização, trânsito, desemprego).","x":"Típica de países periféricos com urbanização rápida e desigual.","r":"ENEM 2022 · Q87 — Macrocefalia urbana","h":"H19","q":574},{"id":"CH-034","a":"CH","d":"Geografia","t":"Urbanização, rede urbana e problemas urbanos","k":"aplicação","f":"O que é gentrificação, como no projeto Porto Maravilha (RJ)?","v":"Requalificação de áreas centrais que <b>valoriza o solo<\/b> e atrai moradores e comércio de maior renda, <b>expulsando<\/b> indiretamente a população pobre original.","x":"O ENEM cobra o efeito colateral: “revitalizar” pode aprofundar a segregação socioespacial.","r":"ENEM 2021 · Q61 — Requalificação urbana (Porto Maravilha)","h":"H18","q":524},{"id":"CH-035","a":"CH","d":"Geografia","t":"Urbanização, rede urbana e problemas urbanos","k":"conceito","f":"O que estabelece o Estatuto da Cidade (Lei 10.257/2001)?","v":"Regulamenta a política urbana da CF/88: <b>função social da propriedade urbana<\/b>, <b>plano diretor<\/b> obrigatório (cidades com mais de 20 mil hab.), <b>IPTU progressivo<\/b> e <b>gestão democrática<\/b> com participação popular.","x":"Ferramenta contra imóveis ociosos usados para especulação.","r":"ENEM 2021 · Q72 — Estatuto da Cidade e gestão participativa","h":"H10","q":578},{"id":"CH-036","a":"CH","d":"Geografia","t":"Urbanização, rede urbana e problemas urbanos","k":"conceito","f":"Por que a urbanização brasileira foi tão rápida após 1950?","v":"Pela <b>industrialização<\/b> desenvolvimentista (Vargas, JK) concentrada no Sudeste e pelo <b>êxodo rural<\/b> causado pela modernização e concentração fundiária no campo. O país ficou urbano em poucas décadas.","x":"Urbanização sem planejamento = periferias, favelas e segregação.","r":"ENEM PPL 2025 · Q66 — Urbanização brasileira e desenvolvimentismo","h":"H15","q":571},{"id":"CH-037","a":"CH","d":"Geografia","t":"Clima, atmosfera e domínios naturais","k":"conceito","f":"Qual a meta central do Acordo de Paris (2015), retomada nas COPs?","v":"Limitar o aquecimento global a <b>bem menos de 2 °C<\/b> acima dos níveis pré-industriais, buscando <b>1,5 °C<\/b>. Cada país define suas metas (<b>NDCs<\/b>).","x":"Kyoto (1997) obrigava só países desenvolvidos; Paris envolve todos.","r":"ENEM 2024 · Q71 — COP-26 e governança climática","h":"H9","q":609},{"id":"CH-038","a":"CH","d":"Geografia","t":"Clima, atmosfera e domínios naturais","k":"aplicação","f":"Que efeito geopolítico o degelo do Ártico provoca?","v":"Abre <b>novas rotas marítimas<\/b> (Passagem do Noroeste, Rota do Mar do Norte), encurtando o comércio Europa–Ásia, e aumenta a disputa por <b>recursos<\/b> (petróleo, gás) na região.","x":"Mudança climática aparece ligada a economia e geopolítica, não só a ambiente.","r":"ENEM PPL 2024 · Q78 — Degelo e novas rotas comerciais","h":"H18","q":598},{"id":"CH-039","a":"CH","d":"Geografia","t":"Clima, atmosfera e domínios naturais","k":"conceito","f":"Quais as características do clima equatorial?","v":"<b>Baixas latitudes<\/b>, temperaturas altas o ano todo, <b>pequena amplitude térmica anual<\/b> e chuvas abundantes e bem distribuídas (convectivas). Ex.: Amazônia.","x":"Latitude, altitude, maritimidade e massas de ar são os fatores climáticos mais cobrados.","r":"ENEM PPL 2023 · Q71 — Clima equatorial e baixa latitude","h":"H7","q":668},{"id":"CH-040","a":"CH","d":"Geografia","t":"Geopolítica, blocos econômicos e conflitos internacionais","k":"conceito","f":"Como é composto o Conselho de Segurança da ONU?","v":"<b>5 membros permanentes com poder de veto<\/b> (EUA, Rússia, China, Reino Unido e França) e 10 rotativos eleitos por dois anos. O veto de um permanente bloqueia decisões.","x":"Críticas: estrutura reflete o pós-1945; Brasil pleiteia assento permanente.","r":"ENEM 2024 · Q89 — Conselho de Segurança da ONU","h":"H7","q":670},{"id":"CH-041","a":"CH","d":"Geografia","t":"Geopolítica, blocos econômicos e conflitos internacionais","k":"conceito","f":"Que tipo de bloco é o Mercosul e o que é a TEC?","v":"É uma <b>união aduaneira<\/b> (imperfeita): livre comércio interno + <b>Tarifa Externa Comum<\/b>, tarifa igual aplicada pelos membros a produtos de fora do bloco.","x":"Etapas: zona de livre comércio → união aduaneira → mercado comum → união econômica.","r":"ENEM 2022 · Q62 — Mercosul e Tarifa Externa Comum","h":"H9","q":660},{"id":"CH-042","a":"CH","d":"Geografia","t":"Geopolítica, blocos econômicos e conflitos internacionais","k":"conceito","f":"Por que os curdos são chamados de “a maior nação sem Estado”?","v":"Povo de dezenas de milhões dividido entre <b>Turquia, Iraque, Irã e Síria<\/b> após a partilha do Império Otomano; reivindica <b>autodeterminação<\/b> e sofre repressão.","x":"Nação (identidade cultural) ≠ Estado (soberania sobre território).","r":"ENEM PPL 2021 · Q77 — Questão curda (autodeterminação)","h":"H7","q":687},{"id":"CH-043","a":"CH","d":"Geografia","t":"Cartografia, escalas e representação do espaço","k":"pegadinha","f":"O que a projeção de Mercator preserva e o que distorce?","v":"É <b>conforme<\/b>: preserva <b>formas e ângulos<\/b> (útil à navegação), mas <b>exagera as áreas<\/b> em altas latitudes (Europa e Groenlândia parecem enormes). A de Peters é <b>equivalente<\/b>: preserva áreas e distorce formas.","x":"Nenhuma projeção é neutra: escolhas cartográficas expressam visões de mundo e poder.","r":"ENEM PPL 2023 · Q74 — Projeções cartográficas e distorção","h":"H6","q":584},{"id":"CH-044","a":"CH","d":"Geografia","t":"Cartografia, escalas e representação do espaço","k":"conceito","f":"O que é sensoriamento remoto e como é usado no Brasil?","v":"Obtenção de informações sobre a superfície <b>à distância<\/b>, por satélites/sensores. O INPE usa para monitorar <b>desmatamento e queimadas<\/b> na Amazônia e no Cerrado.","x":"Relaciona-se com GPS e SIG (geoprocessamento).","r":"ENEM 2025 · Q84 — Sensoriamento remoto e incêndios (Cerrado)","h":"H28","q":542},{"id":"CH-045","a":"CH","d":"Geografia","t":"Demografia, migrações e estrutura populacional","k":"conceito","f":"Quais as fases da transição demográfica e seu efeito na pirâmide etária?","v":"Primeiro cai a <b>mortalidade<\/b>, depois a <b>natalidade/fecundidade<\/b>. A pirâmide estreita a base e alarga o topo: <b>envelhecimento<\/b>. Há uma fase de <b>bônus demográfico<\/b> (muita gente em idade ativa).","x":"O Brasil já tem fecundidade abaixo da reposição (≈2,1 filhos por mulher).","r":"ENEM 2023 · Q76 — Queda da fecundidade (transição demográfica)","h":"H6","q":544},{"id":"CH-046","a":"CH","d":"Geografia","t":"Demografia, migrações e estrutura populacional","k":"conceito","f":"Quem é considerado refugiado pela Convenção da ONU de 1951?","v":"Quem deixa seu país por <b>fundado temor de perseguição<\/b> (raça, religião, nacionalidade, grupo social ou opinião política) e não pode contar com a proteção dele. Vale o princípio da <b>não devolução<\/b>.","x":"Migrante econômico ≠ refugiado — distinção cobrada em várias edições.","r":"ENEM 2021 · Q55 — Condição do refugiado","h":"H8","q":613},{"id":"CH-047","a":"CH","d":"Geografia","t":"Recursos hídricos e bacias hidrográficas","k":"conceito","f":"Por que a impermeabilização urbana agrava enchentes?","v":"Asfalto e concreto <b>reduzem a infiltração<\/b> da água no solo e aumentam o <b>escoamento superficial<\/b>, que chega rápido aos rios e galerias e transborda.","x":"Soluções: áreas verdes, piscinões, pavimentos permeáveis e preservação de várzeas.","r":"ENEM 2018 · Q67 — Urbanização e escoamento (ciclo hidrológico)","h":"H26","q":645},{"id":"CH-048","a":"CH","d":"Geografia","t":"Recursos hídricos e bacias hidrográficas","k":"conceito","f":"O que é o fenômeno da ressurgência, como em Cabo Frio (RJ)?","v":"Subida de <b>águas profundas frias e ricas em nutrientes<\/b> para a superfície, impulsionada por ventos; aumenta o plâncton e a <b>piscosidade<\/b> (pesca).","x":"Explica também a pesca abundante na costa do Peru.","r":"ENEM PPL 2019 · Q89 — Ressurgência (Cabo Frio)","h":"H27","q":631},{"id":"CH-049","a":"CH","d":"Geografia","t":"Globalização, redes e novas tecnologias","k":"conceito","f":"O que Manuel Castells chama de sociedade em rede?","v":"Organização social e econômica baseada em <b>redes de informação<\/b> e tecnologias digitais: produção, finanças e comunicação funcionam em escala global e em tempo real (<b>economia informacional<\/b>).","x":"Incluídos e excluídos das redes: globalização é seletiva e desigual.","r":"ENEM 2022 · Q51 — Economia informacional em rede (Castells)","h":"H17","q":620},{"id":"CH-050","a":"CH","d":"Geografia","t":"Globalização, redes e novas tecnologias","k":"pegadinha","f":"Diferencie desemprego estrutural de desemprego conjuntural.","v":"<b>Estrutural<\/b>: postos eliminados por <b>automação<\/b>/mudanças tecnológicas — não voltam com o crescimento. <b>Conjuntural<\/b>: causado por crises econômicas temporárias.","x":"Robôs e IA substituindo trabalhadores = estrutural.","r":"ENEM 2015 · Q29 — Globalização técnica: automatização fabril e desemprego estrutural","h":"H20","q":566},{"id":"CH-051","a":"CH","d":"Geografia","t":"Indústria, estruturas produtivas e circulação","k":"conceito","f":"Qual a posição do Brasil na Divisão Internacional do Trabalho atual?","v":"Exporta sobretudo <b>commodities<\/b> (soja, minério, petróleo, carnes) de <b>baixo valor agregado<\/b> e importa bens industrializados — sinal de <b>desindustrialização<\/b> e reprimarização da pauta.","x":"Relação com a China é o exemplo mais cobrado dessa assimetria.","r":"ENEM 2017 · Q56 — Logística de exportação de commodities de baixo valor agregado","h":"H18","q":579},{"id":"CH-052","a":"CH","d":"Geografia","t":"Indústria, estruturas produtivas e circulação","k":"conceito","f":"O que são cadeias globais de valor?","v":"Fragmentação da produção em <b>etapas espalhadas por vários países<\/b> (pesquisa, componentes, montagem, marketing), conforme custos de mão de obra, impostos e logística.","x":"Etapas de maior valor (P&D, marca) ficam nos países centrais.","r":"ENEM 2019 · Q56 — Reestruturação industrial e cadeias globais de valor","h":"H17","q":600},{"id":"CH-053","a":"CH","d":"Geografia","t":"Território, formação territorial e regionalização","k":"conceito","f":"O que Milton Santos chama de meio técnico-científico-informacional?","v":"O espaço geográfico atual, em que <b>ciência, técnica e informação<\/b> estão incorporadas ao território (redes, satélites, agricultura de precisão), servindo sobretudo aos interesses do capital globalizado.","x":"Milton Santos é o geógrafo brasileiro mais citado no ENEM.","r":"ENEM 2024 · Q70 — Sistemas técnicos e território (Santos)","h":"H17","q":550},{"id":"CH-054","a":"CH","d":"Geografia","t":"Território, formação territorial e regionalização","k":"conceito","f":"Qual o objetivo geopolítico da construção de Brasília (1960)?","v":"<b>Interiorizar<\/b> o desenvolvimento e <b>integrar o território<\/b> nacional, deslocando o centro político do litoral para o Planalto Central, com rodovias ligando as regiões (Plano de Metas de JK).","x":"Faz parte da “marcha para o Oeste” iniciada na Era Vargas.","r":"ENEM PPL 2024 · Q46 — Brasília e integração do território nacional","h":"H26","q":625},{"id":"CH-055","a":"CH","d":"Geografia","t":"Sociedade e natureza; saberes e povos tradicionais","k":"conceito","f":"O que é uma indicação geográfica (IG)?","v":"Selo que liga um produto à sua <b>origem territorial<\/b>, por reputação (Indicação de Procedência) ou por características dadas pelo meio natural e humano (Denominação de Origem). Ex.: queijo da Canastra.","x":"Valoriza saberes tradicionais e a economia regional.","r":"ENEM PPL 2025 · Q80 — Indicações geográficas e autenticidade","h":"H5","q":546},{"id":"CH-056","a":"CH","d":"Geografia","t":"Sociedade e natureza; saberes e povos tradicionais","k":"aplicação","f":"Como saberes indígenas contribuem para a conservação ambiental, como no manejo do fogo?","v":"O <b>fogo controlado<\/b> em época certa reduz o acúmulo de biomassa e previne grandes incêndios no Cerrado; terras indígenas estão entre as áreas <b>mais preservadas<\/b> do país.","x":"O ENEM valoriza saberes tradicionais como conhecimento legítimo, não como atraso.","r":"ENEM 2021 · Q70 — Saberes indígenas e manejo do fogo","h":"H26","q":530},{"id":"CH-057","a":"CH","d":"Geografia","t":"Recursos minerais, energéticos e matriz energética","k":"aplicação","f":"Por que crises hídricas afetam a energia elétrica no Brasil?","v":"A matriz elétrica brasileira depende muito de <b>hidrelétricas<\/b>. Com reservatórios baixos, aciona-se <b>termelétricas<\/b> — mais caras e poluentes — e a conta de luz sobe.","x":"Matriz energética (toda energia) ≠ matriz elétrica (só eletricidade).","r":"ENEM 2025 · Q59 — Matriz energética e crise hídrica","h":"H26","q":638},{"id":"CH-058","a":"CH","d":"Geografia","t":"Recursos minerais, energéticos e matriz energética","k":"conceito","f":"Como se formou o petróleo do pré-sal?","v":"A partir de <b>matéria orgânica<\/b> marinha soterrada em <b>bacias sedimentares<\/b>, transformada por pressão e temperatura, aprisionada sob uma espessa <b>camada de sal<\/b> no litoral SE do Brasil.","x":"Petróleo só ocorre em bacias sedimentares, nunca em escudos cristalinos.","r":"ENEM PPL 2022 · Q82 — Formação do petróleo (pré-sal)","h":"H17","q":560},{"id":"CH-059","a":"CH","d":"História","t":"Brasil Colônia: colonização, economia colonial e conquista da América","k":"conceito","f":"O que foi o Debate de Valladolid (1550)?","v":"Disputa sobre a <b>humanidade dos indígenas<\/b>: <b>Las Casas<\/b> defendia que eram plenamente humanos e deviam ser convertidos pacificamente; <b>Sepúlveda<\/b>, que eram “servos por natureza” e cabia a guerra justa.","x":"Tema de etnocentrismo e justificativas da conquista.","r":"ENEM PPL 2024 · Q49 — Debate de Valladolid e etnocentrismo","h":"H15","q":627},{"id":"CH-060","a":"CH","d":"História","t":"Brasil Colônia: colonização, economia colonial e conquista da América","k":"conceito","f":"Quais as consequências da mineração do século XVIII para o Brasil?","v":"<b>Interiorização<\/b> da ocupação, deslocamento do eixo econômico para o Centro-Sul, capital transferida para o <b>Rio (1763)<\/b>, urbanização, mercado interno e <b>controle fiscal<\/b> rígido (quinto, derrama).","x":"A derrama ajuda a explicar a Inconfidência Mineira (1789).","r":"ENEM PPL 2022 · Q65 — Mineração e ocupação de Minas Gerais","h":"H29","q":502},{"id":"CH-061","a":"CH","d":"História","t":"Brasil Colônia: colonização, economia colonial e conquista da América","k":"conceito","f":"Como atuaram os jesuítas na colonização?","v":"Catequese em <b>aldeamentos<\/b> (missões), uso da <b>língua geral<\/b> (tupi) e do teatro para converter; impuseram valores cristãos, mas geraram <b>sincretismo<\/b> e conflitos com colonos que queriam escravizar indígenas.","x":"Os jesuítas combatiam a escravidão indígena, mas não a africana.","r":"ENEM PPL 2023 · Q70 — Catequese jesuítica e sincretismo religioso","h":"H14","q":665},{"id":"CH-062","a":"CH","d":"História","t":"Brasil Colônia: colonização, economia colonial e conquista da América","k":"conceito","f":"Como se organizava o Império Inca?","v":"Estado centralizado (Tawantinsuyu) com capital em Cusco, extensa <b>rede de estradas<\/b>, armazéns, trabalho comunitário obrigatório (<b>mita<\/b>) e comunidades de parentesco (<b>ayllu<\/b>).","x":"O ENEM valoriza a complexidade das sociedades pré-colombianas.","r":"ENEM 2023 · Q74 — Organização territorial do Império Inca","h":"H9","q":557},{"id":"CH-063","a":"CH","d":"História","t":"Escravidão, tráfico atlântico e resistência negra","k":"conceito","f":"Por que o tráfico de africanos para o Brasil acabou em 1850?","v":"Pela <b>pressão inglesa<\/b> (Bill Aberdeen, 1845, que autorizava apreender navios negreiros), levando à <b>Lei Eusébio de Queirós<\/b> (1850).","x":"Lei anterior (Feijó, 1831) foi “para inglês ver” — não foi cumprida.","r":"ENEM PPL 2025 · Q50 — Pressão inglesa e fim do tráfico atlântico","h":"H8","q":508},{"id":"CH-064","a":"CH","d":"História","t":"Escravidão, tráfico atlântico e resistência negra","k":"conceito","f":"O que historiadores chamam de “brecha camponesa” na escravidão?","v":"Espaços em que escravizados cultivavam <b>roças próprias<\/b> e vendiam excedentes, obtendo certa <b>autonomia<\/b> e renda — inclusive para comprar alforria.","x":"Mostra o escravizado como sujeito histórico, não só vítima passiva.","r":"ENEM PPL 2025 · Q65 — Brecha camponesa e economia escrava","h":"H11","q":642},{"id":"CH-065","a":"CH","d":"História","t":"Escravidão, tráfico atlântico e resistência negra","k":"conceito","f":"O que garante a Constituição de 1988 às comunidades quilombolas?","v":"O <b>direito à propriedade definitiva das terras<\/b> que ocupam, com títulos emitidos pelo Estado (ADCT, art. 68). Quilombos foram e são espaços de <b>resistência<\/b> e identidade.","x":"Quilombola hoje = território, ancestralidade e cultura, não só “fuga”.","r":"ENEM 2024 · Q81 — Comunidades quilombolas e território","h":"H2","q":523},{"id":"CH-066","a":"CH","d":"História","t":"Escravidão, tráfico atlântico e resistência negra","k":"pegadinha","f":"A abolição (1888) foi apenas uma concessão da Princesa Isabel?","v":"Não. Resultou de <b>mobilização social<\/b>: movimento abolicionista, imprensa, fugas em massa, quilombos (ex.: Jabaquara) e leis graduais — <b>Ventre Livre (1871)<\/b> e <b>Sexagenários (1885)<\/b> — até a <b>Lei Áurea<\/b>.","x":"Após 1888 não houve integração: terra, educação e emprego foram negados aos libertos.","r":"ENEM PPL 2024 · Q71 — Mobilização social e abolição","h":"H13","q":518},{"id":"CH-067","a":"CH","d":"História","t":"Cultura, religião, patrimônio e memória","k":"conceito","f":"Qual a diferença entre tombamento e registro de patrimônio?","v":"<b>Tombamento<\/b> protege bens <b>materiais<\/b> (edifícios, conjuntos urbanos). <b>Registro<\/b> protege bens <b>imateriais<\/b> (saberes, festas, celebrações, formas de expressão). Ambos pelo IPHAN.","x":"Patrimônio = memória e identidade coletiva, não só monumentos da elite.","r":"ENEM PPL 2021 · Q51 — Tombamento e preservação da memória (Sobral)","h":"H2","q":526},{"id":"CH-068","a":"CH","d":"História","t":"Cultura, religião, patrimônio e memória","k":"conceito","f":"Diferencie etnocentrismo de relativismo cultural.","v":"<b>Etnocentrismo<\/b>: julgar outras culturas pelos valores da própria, tida como superior. <b>Relativismo<\/b>: compreender cada cultura a partir de seus próprios significados.","x":"O ENEM quase sempre pede a postura crítica ao etnocentrismo.","r":"ENEM PPL 2023 · Q89 — Crítica ao etnocentrismo na historiografia","h":"H2","q":520},{"id":"CH-069","a":"CH","d":"História","t":"Cultura, religião, patrimônio e memória","k":"aplicação","f":"O que Norbert Elias chama de processo civilizador (ex.: uso do garfo)?","v":"Mudança de longo prazo em que normas de etiqueta e <b>autocontrole das emoções e do corpo<\/b> se difundem a partir das cortes, sendo internalizadas pelos indivíduos.","x":"Hábitos “naturais” à mesa são construções históricas.","r":"ENEM 2023 · Q59 — Civilização dos costumes (uso do garfo)","h":"H3","q":511},{"id":"CH-070","a":"CH","d":"História","t":"Revolução Industrial, capitalismo e movimento operário","k":"conceito","f":"Quais as características da Primeira Revolução Industrial?","v":"Inglaterra, <b>séc. XVIII<\/b>: máquina a vapor, carvão, <b>indústria têxtil<\/b>, cercamentos que expulsaram camponeses, formação do <b>proletariado<\/b> com jornadas longas e exploração de mulheres e crianças.","x":"Segunda Revolução (fim do séc. XIX): aço, petróleo, eletricidade, química.","r":"ENEM PPL 2022 · Q89 — Trabalho feminino e infantil na indústria","h":"H11","q":574},{"id":"CH-071","a":"CH","d":"História","t":"Revolução Industrial, capitalismo e movimento operário","k":"conceito","f":"Qual a origem do Dia do Trabalhador (1º de Maio)?","v":"As greves de <b>Chicago (1886)<\/b> pela <b>jornada de 8 horas<\/b>, reprimidas com violência; os líderes foram condenados. A data virou símbolo internacional da luta operária.","x":"Movimento operário: sindicatos, socialismo e anarquismo (forte no Brasil até 1920).","r":"ENEM 2022 · Q73 — Origens do Primeiro de Maio","h":"H13","q":597},{"id":"CH-072","a":"CH","d":"História","t":"Era Vargas e Estado Novo","k":"conceito","f":"Qual o papel do DIP no Estado Novo (1937–1945)?","v":"O <b>Departamento de Imprensa e Propaganda<\/b> fazia <b>censura<\/b> e <b>propaganda<\/b> do regime, construindo o culto a Vargas como “pai dos pobres” (rádio, cinema, festas cívicas).","x":"Estado Novo: autoritário, centralizador, nacionalista, inspirado em regimes fascistas.","r":"ENEM 2022 · Q81 — DIP e censura no Estado Novo","h":"H12","q":596},{"id":"CH-073","a":"CH","d":"História","t":"Era Vargas e Estado Novo","k":"conceito","f":"O que é “cidadania regulada” na Era Vargas?","v":"Direitos sociais (férias, salário mínimo, previdência) garantidos <b>apenas a trabalhadores urbanos com carteira<\/b> e sindicato reconhecido pelo Estado. Rurais e informais ficavam de fora. CLT: 1943.","x":"Sindicatos atrelados ao Ministério do Trabalho = controle do movimento operário.","r":"ENEM PPL 2025 · Q57 — Direitos sociais e cidadania regulada (Vargas)","h":"H22","q":642},{"id":"CH-074","a":"CH","d":"História","t":"Movimentos sociais, cidadania e luta por direitos","k":"conceito","f":"O que mudou com a Lei Saraiva (1881)?","v":"Instituiu eleições <b>diretas<\/b>, mas <b>proibiu o voto dos analfabetos<\/b>, reduzindo drasticamente o eleitorado num país majoritariamente analfabeto.","x":"Restrições do voto no Brasil: renda (1824), alfabetização (1881), mulheres (até 1932).","r":"ENEM 2025 · Q58 — Restrição do voto (Lei Saraiva)","h":"H9","q":562},{"id":"CH-075","a":"CH","d":"História","t":"Movimentos sociais, cidadania e luta por direitos","k":"aplicação","f":"Qual a importância de Rosa Parks no movimento pelos direitos civis dos EUA?","v":"Em 1955 recusou ceder o assento a um branco em Montgomery, desencadeando o <b>boicote aos ônibus<\/b> liderado por Martin Luther King: <b>desobediência civil não violenta<\/b> contra a segregação.","x":"Resultado: Civil Rights Act (1964) e Voting Rights Act (1965).","r":"ENEM PPL 2024 · Q84 — Rosa Parks e movimento por direitos civis","h":"H22","q":516},{"id":"CH-076","a":"CH","d":"História","t":"Idade Média e transição para a Modernidade","k":"conceito","f":"Como se organizava a sociedade feudal?","v":"Sociedade <b>estamental<\/b> e trifuncional, com mobilidade quase nula: <b>clero<\/b> (os que oram), <b>nobreza<\/b> (os que guerreiam) e <b>servos<\/b> (os que trabalham), justificada pela Igreja como ordem divina.","x":"Servos presos à terra, com obrigações como corveia e talha.","r":"ENEM 2015 · Q5 — Sociedade de ordens medieval: ideologia estamental e revoltas camponesas","h":"H13","q":644},{"id":"CH-077","a":"CH","d":"História","t":"Idade Média e transição para a Modernidade","k":"conceito","f":"O que marcou o renascimento comercial e urbano da Baixa Idade Média?","v":"Expansão do comércio (feiras, rotas pelo Mediterrâneo), crescimento dos <b>burgos<\/b>, surgimento da <b>burguesia<\/b> e das <b>corporações de ofício<\/b>, que regulavam a produção artesanal.","x":"Cruzadas reabriram rotas; esse processo prepara a transição para o capitalismo.","r":"ENEM 2019 · Q60 — Cidade medieval: artesanato e comércio","h":"H11","q":602},{"id":"CH-078","a":"CH","d":"História","t":"Antiguidade Clássica e Oriental","k":"pegadinha","f":"Quem era cidadão na democracia ateniense?","v":"Apenas <b>homens adultos, livres, filhos de pais atenienses<\/b>. Mulheres, escravizados e estrangeiros (<b>metecos<\/b>) eram excluídos. Era uma democracia <b>direta<\/b>, na Eclésia.","x":"Contraste com a cidadania moderna, universal e representativa.","r":"ENEM 2019 · Q79 — Cidadania na pólis grega","h":"H24","q":621},{"id":"CH-079","a":"CH","d":"História","t":"Antiguidade Clássica e Oriental","k":"conceito","f":"O que caracteriza o Código de Hamurábi?","v":"Um dos primeiros códigos <b>escritos<\/b> (Babilônia, c. séc. XVIII a.C.), baseado na <b>lei de talião<\/b> (“olho por olho”), com penas que variavam conforme a camada social.","x":"Lei escrita = limita o arbítrio e dá publicidade às regras.","r":"ENEM PPL 2021 · Q88 — Código de Hamurabi (lei de talião)","h":"H12","q":528},{"id":"CH-080","a":"CH","d":"História","t":"Movimentos culturais, ciência e tecnologia na história","k":"conceito","f":"Por que a Impressão Régia (1808) foi um marco?","v":"Até a chegada da Corte, a <b>imprensa era proibida<\/b> no Brasil. Com D. João, surgiu a Impressão Régia e a <i>Gazeta do Rio de Janeiro<\/i> — imprensa oficial e controlada.","x":"1808 também trouxe a abertura dos portos e instituições como o Banco do Brasil.","r":"ENEM 2025 · Q83 — Impressão Régia e imprensa (1808)","h":"H21","q":659},{"id":"CH-081","a":"CH","d":"História","t":"Movimentos culturais, ciência e tecnologia na história","k":"conceito","f":"Qual a relação entre a imprensa de Gutenberg e a Reforma Protestante?","v":"A prensa barateou textos e permitiu difundir rapidamente as ideias de <b>Lutero<\/b> (panfletos, Bíblia traduzida), estimulando a <b>leitura individual<\/b> e a livre interpretação.","x":"Reforma: crítica às indulgências, salvação pela fé, Bíblia como autoridade.","r":"ENEM 2020 · Q52 — Imprensa e Reforma (cultura popular)","h":"H15","q":574},{"id":"CH-082","a":"CH","d":"História","t":"Economia, Estado, instituições e políticas públicas","k":"conceito","f":"O que estabeleceu a Lei de Terras de 1850?","v":"A terra só poderia ser adquirida por <b>compra<\/b>, não mais por posse. Dificultou o acesso de <b>ex-escravizados, imigrantes e pobres<\/b>, perpetuando a <b>concentração fundiária<\/b>.","x":"Mesmo ano da Lei Eusébio de Queirós: a terra fica “cativa” quando o trabalho começa a ser livre.","r":"ENEM PPL 2019 · Q62 — Lei de Terras de 1850","h":"H9","q":606},{"id":"CH-083","a":"CH","d":"História","t":"Economia, Estado, instituições e políticas públicas","k":"conceito","f":"Como a economia cafeeira transformou o Sudeste?","v":"Expansão do Vale do Paraíba para o <b>Oeste Paulista<\/b>, com <b>ferrovias<\/b>, <b>imigração<\/b> europeia, urbanização e acumulação de capital que financiou a industrialização de São Paulo.","x":"Café = eixo da economia do Segundo Reinado e da Primeira República.","r":"ENEM PPL 2023 · Q62 — Economia cafeeira e transformação do espaço","h":"H19","q":544},{"id":"CH-084","a":"CH","d":"História","t":"Ditadura militar e redemocratização no Brasil","k":"conceito","f":"O que foi o AI-5 (1968)?","v":"O ato institucional mais duro da ditadura: permitiu <b>fechar o Congresso<\/b>, cassar mandatos, <b>suspendeu o habeas corpus<\/b> para crimes políticos e ampliou censura, prisões, tortura e exílios.","x":"Período mais repressivo: “anos de chumbo” (governo Médici).","r":"ENEM 2018 · Q69 — Ditadura militar: repressão e exílio","h":"H15","q":705},{"id":"CH-085","a":"CH","d":"História","t":"Ditadura militar e redemocratização no Brasil","k":"conceito","f":"Quais os marcos da redemocratização brasileira?","v":"<b>Lei da Anistia (1979)<\/b>, greves do <b>ABC<\/b> (1978–80), <b>Diretas Já<\/b> (1984, emenda rejeitada), eleição indireta de Tancredo (1985) e <b>Constituição Cidadã (1988)<\/b>.","x":"Transição “lenta, gradual e segura”, com continuidade de políticos do regime.","r":"ENEM PPL 2016 · Q2 — Greves operárias do ABC em 1979 e redemocratização do Brasil","h":"H13","q":680},{"id":"CH-086","a":"CH","d":"História","t":"Revoluções burguesas, Iluminismo e Estado moderno","k":"conceito","f":"Quais ideias iluministas inspiraram a Declaração dos Direitos do Homem (1789)?","v":"<b>Direitos naturais<\/b> (Locke: vida, liberdade, propriedade), <b>separação dos poderes<\/b> (Montesquieu), soberania popular (Rousseau) e igualdade perante a lei, contra o absolutismo.","x":"Igualdade jurídica, não social: a burguesia é a grande beneficiária.","r":"ENEM 2017 · Q49 — Iluminismo e Declaração dos Direitos do Homem e do Cidadão (1789)","h":"H3","q":558},{"id":"CH-087","a":"CH","d":"História","t":"Revoluções burguesas, Iluminismo e Estado moderno","k":"conceito","f":"Quais as características da Constituição de 1824?","v":"Outorgada por D. Pedro I: <b>Poder Moderador<\/b> do imperador, <b>voto censitário<\/b> (por renda) e indireto, catolicismo como religião oficial, centralização.","x":"Liberal no papel, mas excludente: escravidão mantida.","r":"ENEM 2019 · Q72 — Voto censitário (Constituição de 1824)","h":"H24","q":561},{"id":"CH-088","a":"CH","d":"História","t":"Século XX: guerras mundiais, totalitarismos e Guerra Fria","k":"conceito","f":"Segundo Hannah Arendt, o que caracteriza o totalitarismo?","v":"Domínio total da sociedade pelo <b>terror<\/b> e pela <b>ideologia<\/b>, partido único, polícia política e <b>campos de concentração<\/b>, que transformam pessoas em seres supérfluos. Ex.: nazismo e stalinismo.","x":"Arendt também cunhou a “banalidade do mal” (caso Eichmann).","r":"ENEM 2019 · Q76 — Totalitarismo e campos de concentração (Arendt)","h":"H23","q":688},{"id":"CH-089","a":"CH","d":"História","t":"Século XX: guerras mundiais, totalitarismos e Guerra Fria","k":"conceito","f":"O que foi o New Deal?","v":"Resposta de Roosevelt à <b>Crise de 1929<\/b>: <b>intervenção do Estado<\/b> na economia com obras públicas, regulação bancária, seguridade social e apoio a agricultores — inspirado nas ideias de <b>Keynes<\/b>.","x":"Rompe com o liberalismo clássico do laissez-faire.","r":"ENEM 2017 · Q62 — New Deal: intervenção estatal na crise de 1929","h":"H8","q":600},{"id":"CH-090","a":"CH","d":"História","t":"Primeira República e República Velha","k":"conceito","f":"O que foram o coronelismo e a política dos governadores?","v":"<b>Coronelismo<\/b>: chefes locais controlavam votos (<b>voto de cabresto<\/b>, voto aberto, fraudes). <b>Política dos governadores<\/b> (Campos Sales): apoio mútuo entre presidente e oligarquias estaduais. Base da “política do café com leite”.","x":"Voto não secreto + clientelismo = cidadania limitada na República Velha.","r":"ENEM 2018 · Q84 — Coronelismo e voto de cabresto (República Velha)","h":"H24","q":597},{"id":"CH-091","a":"CH","d":"História","t":"Primeira República e República Velha","k":"conceito","f":"O que motivou a Revolta da Vacina (1904)?","v":"A <b>vacinação obrigatória<\/b> contra a varíola (Oswaldo Cruz), aplicada de forma autoritária, somada à <b>reforma urbana<\/b> de Pereira Passos (“bota-abaixo”) que expulsou pobres do centro do Rio.","x":"Não foi “ignorância”: foi reação a autoritarismo e exclusão.","r":"ENEM 2019 · Q80 — Revolta da Vacina (1904)","h":"H15","q":598},{"id":"CH-092","a":"CH","d":"História","t":"História e cultura africana","k":"conceito","f":"Qual o papel da tradição oral nas sociedades africanas?","v":"Transmissão de memória, história e saberes pela palavra, com os <b>griôs<\/b> como guardiões. É <b>fonte histórica legítima<\/b>, não inferior à escrita.","x":"O ENEM combate a visão da África como continente “sem história”.","r":"ENEM PPL 2023 · Q88 — Tradição oral e história africana","h":"H2","q":528},{"id":"CH-093","a":"CH","d":"História","t":"História e cultura africana","k":"conceito","f":"Por que o Império do Mali e Tombuctu são destacados?","v":"O Mali (séc. XIII–XV) enriqueceu com o <b>comércio transaariano<\/b> de ouro e sal; <b>Tombuctu<\/b> foi grande centro de <b>saber islâmico<\/b>, com bibliotecas e mesquitas (Mansa Musa).","x":"Mostra reinos africanos ricos e letrados antes da colonização.","r":"ENEM 2017 · Q46 — África: Império do Mali e centralidade cultural de Tombuctu (séc. XIV)","h":"H5","q":598},{"id":"CH-094","a":"CH","d":"História","t":"Imperialismo, colonialismo e descolonização na África e Ásia","k":"conceito","f":"Como o neocolonialismo do século XIX foi justificado?","v":"Pela “<b>missão civilizadora<\/b>” e pelo “fardo do homem branco”, apoiados no <b>darwinismo social<\/b> e no racismo científico. A <b>Conferência de Berlim (1884–85)<\/b> partilhou a África.","x":"Fronteiras artificiais explicam conflitos étnicos atuais.","r":"ENEM PPL 2021 · Q82 — Argumento civilizatório e partilha da África","h":"H9","q":709},{"id":"CH-095","a":"CH","d":"História","t":"Imperialismo, colonialismo e descolonização na África e Ásia","k":"conceito","f":"O que foi o apartheid?","v":"Regime de <b>segregação racial legal<\/b> na África do Sul (1948–1994): leis de passe, áreas separadas, negros sem direitos políticos. Terminou com a luta de Mandela e do CNA.","x":"Paralelos com a segregação nos EUA (Jim Crow).","r":"ENEM 2016 · Q33 — Apartheid: lei do passe e controle da movimentação dos negros","h":"H8","q":499},{"id":"CH-096","a":"CH","d":"História","t":"Povos indígenas: história, cultura e direitos","k":"pegadinha","f":"Qual o sentido da antropofagia ritual entre os tupis?","v":"Não era alimentar: era um <b>ritual<\/b> ligado à <b>vingança<\/b> e à incorporação das qualidades do inimigo valente capturado em guerra, ordenando relações entre grupos.","x":"Os relatos europeus (Staden, Léry) são fontes marcadas por olhar etnocêntrico.","r":"ENEM 2025 · Q73 — Antropofagia ritual (tupis)","h":"H15","q":539},{"id":"CH-097","a":"CH","d":"História","t":"Povos indígenas: história, cultura e direitos","k":"conceito","f":"O que a Constituição de 1988 assegura às terras indígenas?","v":"Reconhece os <b>direitos originários<\/b> dos indígenas sobre as terras que tradicionalmente ocupam (art. 231), cabendo à União <b>demarcá-las<\/b> e protegê-las. Caso emblemático: Raposa Serra do Sol (RR).","x":"Terra indígena é da União com usufruto exclusivo dos povos.","r":"ENEM PPL 2017 · Q78 — Demarcação indígena (Raposa Serra do Sol)","h":"H12","q":626},{"id":"CH-098","a":"CH","d":"História","t":"Brasil Império: independência, Estado nacional e conflitos","k":"conceito","f":"Quais foram as principais revoltas do Período Regencial (1831–1840)?","v":"<b>Cabanagem<\/b> (PA), <b>Sabinada<\/b> (BA), <b>Balaiada<\/b> (MA), <b>Farroupilha<\/b> (RS) e <b>Revolta dos Malês<\/b> (BA, escravizados muçulmanos). Expressavam tensões entre províncias e centro e desigualdades sociais; a instabilidade levou ao <b>Golpe da Maioridade<\/b> (1840).","x":"Regência = experiência de descentralização (Ato Adicional de 1834) seguida de recuo centralizador.","r":"ENEM PPL 2019 · Q70 — Rebeliões do Período Regencial","h":"H15","q":617},{"id":"CH-099","a":"CH","d":"História","t":"Brasil Império: independência, Estado nacional e conflitos","k":"pegadinha","f":"A independência do Brasil foi pacífica? Pense na Bahia.","v":"Não. Houve <b>guerras de independência<\/b> contra tropas portuguesas, como na <b>Bahia<\/b>, encerrada em <b>2 de julho de 1823<\/b>, com participação popular e de figuras como <b>Maria Quitéria<\/b>.","x":"O ENEM desconstrói a ideia de independência “sem sangue” proclamada só por D. Pedro.","r":"ENEM 2019 · Q55 — Independência da Bahia (Maria Quitéria)","h":"H15","q":632},{"id":"CH-100","a":"CH","d":"Sociologia","t":"Trabalho, capitalismo e transformações produtivas","k":"conceito","f":"Diferencie fordismo e toyotismo (acumulação flexível).","v":"<b>Fordismo<\/b>: linha de montagem, produção em massa padronizada, trabalhador especializado em tarefa repetitiva, estoques. <b>Toyotismo<\/b>: produção <b>flexível<\/b> sob demanda (<b>just in time<\/b>), trabalhador polivalente, terceirização.","x":"Taylorismo = controle de tempos e movimentos; base do fordismo.","r":"ENEM PPL 2022 · Q48 — Especialização flexível (acumulação flexível)","h":"H16","q":789},{"id":"CH-101","a":"CH","d":"Sociologia","t":"Trabalho, capitalismo e transformações produtivas","k":"aplicação","f":"O que caracteriza o trabalho por plataformas (“uberização”)?","v":"Trabalhadores tratados como “parceiros” autônomos, <b>sem direitos trabalhistas<\/b>, com renda instável e gestão por <b>algoritmos<\/b> que controlam tarefas, avaliações e punições.","x":"O ENEM foca na precarização disfarçada de empreendedorismo.","r":"ENEM PPL 2025 · Q70 — Economia de plataforma e controle algorítmico","h":"H17","q":594},{"id":"CH-102","a":"CH","d":"Sociologia","t":"Trabalho, capitalismo e transformações produtivas","k":"conceito","f":"O que é alienação do trabalho para Marx?","v":"O trabalhador não controla o processo nem o <b>produto<\/b> do seu trabalho, que pertence ao capitalista; a divisão do trabalho o torna estranho à própria atividade e a si mesmo. Base da <b>mais-valia<\/b> e da luta de classes.","x":"Marx: burguesia (meios de produção) × proletariado (força de trabalho).","r":"ENEM PPL 2023 · Q63 — Divisão do trabalho e alienação","h":"H18","q":550},{"id":"CH-103","a":"CH","d":"Sociologia","t":"Racismo, relações étnico-raciais e ações afirmativas","k":"conceito","f":"O que é racismo estrutural?","v":"Racismo que não depende só de atos individuais: está entranhado nas <b>instituições, economia e cultura<\/b>, reproduzindo desigualdades raciais de forma “normal” (Silvio Almeida; raízes no colonialismo, como analisa Fanon).","x":"Ligado ao mito da democracia racial e à ideologia do branqueamento no Brasil.","r":"ENEM PPL 2023 · Q83 — Colonialidade e racismo estrutural (Fanon)","h":"H3","q":457},{"id":"CH-104","a":"CH","d":"Sociologia","t":"Racismo, relações étnico-raciais e ações afirmativas","k":"conceito","f":"O que são ações afirmativas?","v":"Políticas <b>temporárias<\/b> para corrigir desigualdades históricas de grupos discriminados — ex.: <b>cotas<\/b> raciais e sociais nas universidades (Lei 12.711/2012). Ganharam força após a Conferência de <b>Durban (2001)<\/b>.","x":"Igualdade material (tratar desiguais desigualmente), não apenas formal.","r":"ENEM PPL 2025 · Q60 — Conferência de Durban e ações afirmativas","h":"H13","q":506},{"id":"CH-105","a":"CH","d":"Sociologia","t":"Indústria cultural, mídia e consumo","k":"conceito","f":"O que é indústria cultural para Adorno e Horkheimer?","v":"Produção de cultura como <b>mercadoria<\/b> padronizada, em série, para o lucro. Gera <b>consumo passivo<\/b> e conformismo; a diversão é prolongamento do trabalho. Marcuse, da mesma escola, fala em “falsas necessidades”.","x":"Escola de Frankfurt: visão crítica da cultura de massa.","r":"ENEM 2023 · Q55 — Indústria cultural e diversão (Adorno)","h":"H21","q":567},{"id":"CH-106","a":"CH","d":"Sociologia","t":"Indústria cultural, mídia e consumo","k":"conceito","f":"O que é a “sociedade do espetáculo” de Guy Debord?","v":"Sociedade em que as relações sociais são <b>mediadas por imagens<\/b>; a aparência e o consumo de representações substituem a experiência vivida.","x":"Aparece com mídias, publicidade e redes sociais.","r":"ENEM PPL 2021 · Q90 — Circulação de imagens (Debord)","h":"H4","q":656},{"id":"CH-107","a":"CH","d":"Sociologia","t":"Cidadania, democracia e Estado","k":"conceito","f":"O que Pierre Clastres afirma sobre as “sociedades contra o Estado”?","v":"Sociedades indígenas não são “incompletas” por não terem Estado: elas <b>impedem ativamente<\/b> a formação de um poder separado e coercitivo; o chefe tem prestígio, não mando.","x":"Crítica ao evolucionismo e ao etnocentrismo político.","r":"ENEM 2018 · Q48 — Sociedades sem Estado e poder (Pierre Clastres)","h":"H11","q":631},{"id":"CH-108","a":"CH","d":"Sociologia","t":"Cidadania, democracia e Estado","k":"conceito","f":"Para Amartya Sen, o que é desenvolvimento?","v":"É a <b>expansão das liberdades reais<\/b> das pessoas (saúde, educação, participação política, oportunidades), e não apenas crescimento do PIB ou da renda.","x":"Base do IDH: renda + educação + longevidade.","r":"ENEM 2017 · Q60 — Desenvolvimento como liberdade (Amartya Sen)","h":"H24","q":590},{"id":"CH-109","a":"CH","d":"Sociologia","t":"Movimentos sociais e luta por direitos","k":"conceito","f":"Como Castells interpreta os movimentos sociais em rede?","v":"Movimentos que se organizam pela <b>internet<\/b>, sem lideranças centrais rígidas, ocupam espaços urbanos e exercem <b>contrapoder<\/b> diante de instituições e da mídia tradicional.","x":"Ex.: Primavera Árabe, Occupy, jornadas de 2013.","r":"ENEM PPL 2022 · Q46 — Contrapoder e movimentos sociais (Castells)","h":"H13","q":701},{"id":"CH-110","a":"CH","d":"Sociologia","t":"Movimentos sociais e luta por direitos","k":"conceito","f":"O que Sérgio Buarque de Holanda chama de “homem cordial”?","v":"O brasileiro que age pelo <b>coração<\/b> (afeto, intimidade), não pela polidez: tende ao <b>personalismo<\/b> e a confundir o <b>público com o privado<\/b>, dificultando relações impessoais no Estado.","x":"Cordial ≠ gentil! É a pegadinha clássica de <i>Raízes do Brasil<\/i>.","r":"ENEM 2015 · Q14 — Sérgio Buarque: personalismo e cordialidade na vida pública brasileira","h":"H3","q":600},{"id":"CH-111","a":"CH","d":"Sociologia","t":"Cultura, identidade e diversidade cultural","k":"conceito","f":"O que é hibridismo cultural, como na congada?","v":"Mistura de elementos de culturas diferentes que gera expressões novas — na congada, tradições <b>africanas<\/b> e <b>católicas<\/b> ibéricas (coroação de reis do Congo, louvor a santos).","x":"Néstor García Canclini é o autor associado ao conceito.","r":"ENEM PPL 2025 · Q59 — Congada e hibridismo cultural","h":"H10","q":500},{"id":"CH-112","a":"CH","d":"Sociologia","t":"Cultura, identidade e diversidade cultural","k":"aplicação","f":"Por que o ofício das paneleiras de Goiabeiras (ES) é patrimônio?","v":"Foi o <b>primeiro bem registrado<\/b> como patrimônio <b>imaterial<\/b> pelo IPHAN (2002): saber-fazer tradicional de panelas de barro, transmitido entre gerações, de origem indígena.","x":"Patrimônio imaterial protege o saber, não apenas o objeto.","r":"ENEM 2022 · Q90 — Paneleiras de Goiabeiras","h":"H3","q":636},{"id":"CH-113","a":"CH","d":"Sociologia","t":"Gênero, sexualidade e feminismos","k":"conceito","f":"O que Simone de Beauvoir quis dizer com “ninguém nasce mulher: torna-se mulher”?","v":"Que o “ser mulher” é uma <b>construção social e cultural<\/b>, não um destino biológico: papéis de gênero são aprendidos e impostos.","x":"Gênero = social; sexo = biológico. Margaret Mead mostrou papéis variando entre culturas.","r":"ENEM 2015 · Q42 — Beauvoir e o feminismo: protestos pela igualdade de gênero","h":"H10","q":531},{"id":"CH-114","a":"CH","d":"Sociologia","t":"Gênero, sexualidade e feminismos","k":"conceito","f":"Quais formas de violência a Lei Maria da Penha (2006) reconhece?","v":"Violência <b>física, psicológica, sexual, patrimonial e moral<\/b> contra a mulher no âmbito doméstico e familiar.","x":"Violência patrimonial = reter, destruir bens, documentos ou recursos da mulher.","r":"ENEM 2023 · Q60 — Violência patrimonial (direitos)","h":"H22","q":509},{"id":"CH-115","a":"CH","d":"Sociologia","t":"Teoria sociológica clássica e conceitos fundantes","k":"conceito","f":"O que é fato social para Durkheim?","v":"Maneira de agir, pensar e sentir <b>exterior<\/b> ao indivíduo, <b>coercitiva<\/b> e <b>geral<\/b>. Deve ser estudado “como coisa”, com objetividade, à maneira das ciências naturais.","x":"Durkheim: solidariedade mecânica × orgânica; anomia.","r":"ENEM 2016 · Q32 — Durkheim: sociologia com métodos das ciências naturais","h":"H1","q":660},{"id":"CH-116","a":"CH","d":"Sociologia","t":"Teoria sociológica clássica e conceitos fundantes","k":"conceito","f":"O que Max Weber chama de racionalização e desencantamento do mundo?","v":"Na modernidade, ações e instituições passam a ser guiadas pelo <b>cálculo racional<\/b> (burocracia, ciência, capitalismo), e explicações mágico-religiosas perdem força.","x":"Weber: ação social e tipos de dominação (tradicional, carismática, racional-legal).","r":"ENEM 2015 · Q40 — Weber: racionalização e desencantamento do mundo moderno","h":"H16","q":754},{"id":"CH-117","a":"CH","d":"Sociologia","t":"Desigualdade social, classes e estratificação","k":"conceito","f":"O que é interseccionalidade?","v":"Conceito (Kimberlé Crenshaw) que analisa como <b>gênero, raça e classe<\/b> se cruzam e se somam, produzindo opressões específicas — ex.: a mulher negra e pobre.","x":"Exemplo recorrente: Carolina Maria de Jesus.","r":"ENEM 2022 · Q70 — Interseccionalidade e pobreza","h":"H15","q":456},{"id":"CH-118","a":"CH","d":"Sociologia","t":"Desigualdade social, classes e estratificação","k":"conceito","f":"O que é justiça (ou racismo) ambiental?","v":"Constatação de que os <b>riscos ambientais<\/b> (lixões, enchentes, poluição, deslizamentos) recaem desproporcionalmente sobre <b>pobres e grupos racializados<\/b>.","x":"Desastre “natural” atinge desigualmente: é também questão social.","r":"ENEM PPL 2022 · Q78 — Justiça ambiental e desigualdade dos riscos","h":"H27","q":621},{"id":"CH-119","a":"CH","d":"Sociologia","t":"Globalização, tecnologia e sociedade em rede","k":"conceito","f":"Como Stuart Hall vê a identidade na pós-modernidade?","v":"A identidade torna-se <b>fragmentada, descentrada<\/b> e móvel; a globalização produz tanto homogeneização quanto <b>reafirmação de identidades locais<\/b> e hibridismos.","x":"Contraste: sujeito do Iluminismo (fixo) × sujeito pós-moderno (múltiplo).","r":"ENEM 2024 · Q65 — Globalização e identidades culturais (Hall)","h":"H10","q":557},{"id":"CH-120","a":"CH","d":"Sociologia","t":"Globalização, tecnologia e sociedade em rede","k":"aplicação","f":"Que crítica Nicholas Carr faz à internet?","v":"A abundância de informação e hiperlinks favorece uma leitura <b>fragmentada e superficial<\/b>, prejudicando a concentração e a reflexão profunda.","x":"Questões sobre redes discutem sociabilidade, bolhas e fake news.","r":"ENEM 2016 · Q42 — Internet (Carr): experiência superficial e abundância de informações","h":"H21","q":709},{"id":"CH-121","a":"CH","d":"Sociologia","t":"Religião, religiosidade e secularização","k":"aplicação","f":"Por que a intolerância às religiões afro-brasileiras é tema recorrente?","v":"Candomblé e umbanda sofrem <b>racismo religioso<\/b> (ataques a terreiros, estigmas), herança da escravidão. Em um <b>Estado laico<\/b>, a liberdade de crença é direito constitucional e a discriminação é crime.","x":"Laico ≠ ateu: o Estado não adota religião, mas protege todas.","r":"ENEM 2025 · Q74 — Religiões afro-brasileiras e preconceito","h":"H11","q":665},{"id":"CH-122","a":"CH","d":"Sociologia","t":"Religião, religiosidade e secularização","k":"conceito","f":"O que o Círio de Nazaré exemplifica?","v":"<b>Religiosidade popular<\/b> e patrimônio <b>imaterial<\/b> (registrado pelo IPHAN em 2004): festa católica de Belém que mistura fé, devoção e cultura local.","x":"Festas religiosas aparecem ligadas a memória, identidade e sincretismo.","r":"ENEM 2024 · Q74 — Círio de Nazaré (religiosidade popular)","h":"H3","q":644},{"id":"CN-001","a":"CN","d":"Física","t":"Eletrodinâmica: circuitos, potência e consumo","k":"fórmula","f":"Quais as três formas de calcular a potência elétrica dissipada num resistor?","v":"<b>P = U·i = R·i² = U²/R<\/b> (W). Com tensão fixa (tomada), use P = U²/R: <b>menor R → maior potência<\/b>.","x":"Chuveiro na posição \"inverno\" tem resistência MENOR — pegadinha clássica.","r":"ENEM 2025 · Q94 — Réguas elétricas e potência (circuitos)","h":"H5","q":647},{"id":"CN-002","a":"CN","d":"Física","t":"Eletrodinâmica: circuitos, potência e consumo","k":"fórmula","f":"Como calcular o consumo de energia de um aparelho e seu custo na conta de luz?","v":"<b>E = P·Δt<\/b>. Em kWh: potência em kW × tempo em horas. Custo = kWh × tarifa (R$/kWh).","x":"Converta W → kW (÷1000) e minutos → horas antes de multiplicar.","r":"ENEM PPL 2025 · Q129 — Associação de aquecedores (potência e tempo)","h":"H5","q":752},{"id":"CN-003","a":"CN","d":"Física","t":"Eletrodinâmica: circuitos, potência e consumo","k":"conceito","f":"O que muda entre associar resistores em série e em paralelo?","v":"<b>Série:<\/b> mesma corrente, R<sub>eq<\/sub> = R<sub>1<\/sub> + R<sub>2<\/sub> + … (soma).<br><b>Paralelo:<\/b> mesma tensão, 1/R<sub>eq<\/sub> = Σ 1/R<sub>i<\/sub> (R<sub>eq<\/sub> menor que o menor resistor).","x":"Tomadas de uma casa estão em paralelo: cada aparelho recebe a tensão da rede.","r":"ENEM 2023 · Q120 — Associação mista de resistores","h":"H5","q":733},{"id":"CN-004","a":"CN","d":"Física","t":"Eletrodinâmica: circuitos, potência e consumo","k":"aplicação","f":"Lâmpadas idênticas ligadas em série a uma mesma fonte: o que acontece com o brilho e se uma queimar?","v":"A tensão se divide entre elas → cada uma brilha <b>menos<\/b>. Se uma queima, o circuito abre e <b>todas apagam<\/b>.","x":"Em paralelo, cada lâmpada mantém o brilho e funciona independente das outras.","r":"ENEM 2024 · Q132 — Associação de lâmpadas em série","h":"H5","q":732},{"id":"CN-005","a":"CN","d":"Física","t":"Eletrodinâmica: circuitos, potência e consumo","k":"aplicação","f":"Para que serve o resistor ligado em série a um LED e como dimensioná-lo?","v":"Limita a corrente. O resistor \"absorve\" a tensão excedente: <b>R = (U<sub>fonte<\/sub> − U<sub>LED<\/sub>) / i<sub>LED<\/sub><\/b>.","x":"Use a corrente nominal do LED (geralmente em mA → converta para A).","r":"ENEM 2024 · Q131 — LED e limitação de corrente (circuitos)","h":"H5","q":723},{"id":"CN-006","a":"CN","d":"Física","t":"Eletrodinâmica: circuitos, potência e consumo","k":"conceito","f":"Como funciona um fusível e por que ele protege o circuito?","v":"Fio de baixo ponto de fusão em <b>série<\/b> com o circuito: corrente excessiva → efeito Joule aquece e funde o fio, abrindo o circuito.","x":"Fusível/disjuntor deve ser escolhido pela corrente máxima: i = P/U.","r":"ENEM PPL 2024 · Q98 — Fusível (efeito Joule e ponto de fusão)","h":"H18","q":672},{"id":"CN-007","a":"CN","d":"Física","t":"Termologia: calor, temperatura e trocas de calor","k":"fórmula","f":"Qual a diferença entre calor sensível e calor latente? Fórmulas.","v":"<b>Sensível<\/b> (varia temperatura): Q = m·c·ΔT.<br><b>Latente<\/b> (muda estado, T constante): Q = m·L.","x":"Queimadura por vapor é pior que por água a 100 °C: o vapor libera o calor latente ao condensar.","r":"ENEM 2023 · Q122 — Calor latente (condensação do vapor)","h":"H6","q":699},{"id":"CN-008","a":"CN","d":"Física","t":"Termologia: calor, temperatura e trocas de calor","k":"conceito","f":"Quais os três processos de propagação de calor e onde cada um ocorre?","v":"<b>Condução<\/b>: contato, sólidos (agitação molecular).<br><b>Convecção<\/b>: correntes em fluidos (líquidos e gases).<br><b>Radiação<\/b>: ondas eletromagnéticas (infravermelho), inclusive no vácuo.","x":"Iglu, garrafa térmica e aquecedor solar exploram os três processos ao mesmo tempo.","r":"ENEM 2024 · Q103 — Aquecedor solar (transferência de calor)","h":"H18","q":680},{"id":"CN-009","a":"CN","d":"Física","t":"Termologia: calor, temperatura e trocas de calor","k":"pegadinha","f":"Por que um metal \"parece mais frio\" que a madeira na mesma temperatura?","v":"Os dois estão à mesma temperatura; o metal tem <b>maior condutividade térmica<\/b> e retira calor da mão mais rápido.","x":"O ENEM testa a confusão entre temperatura e sensação térmica (taxa de fluxo de calor).","r":"ENEM PPL 2022 · Q95 — Condutividade térmica (metal x madeira)","h":"H21","q":505},{"id":"CN-010","a":"CN","d":"Física","t":"Física moderna: radiação, radioatividade e efeito fotoelétrico","k":"conceito","f":"O que é meia-vida e quanto resta de um radioisótopo após n meias-vidas?","v":"Tempo para metade dos núcleos decair. Restam <b>m = m<sub>0<\/sub>/2<sup>n<\/sup><\/b> (após 3 meias-vidas: 1/8).","x":"Usado em datação (C-14, K-40) e na escolha de radiofármacos de meia-vida curta.","r":"ENEM PPL 2025 · Q102 — Radionuclídeo para imagem (meia-vida)","h":"H22","q":542},{"id":"CN-011","a":"CN","d":"Física","t":"Física moderna: radiação, radioatividade e efeito fotoelétrico","k":"conceito","f":"Compare o poder de penetração das radiações α, β e γ.","v":"<b>α<\/b> (núcleo de He): pouco penetrante, barrada por papel/pele, muito ionizante.<br><b>β<\/b> (elétron): barrada por alumínio fino.<br><b>γ<\/b> (onda EM): muito penetrante, exige chumbo/concreto.","x":"Irradiar alimento com γ NÃO o torna radioativo — a radiação apenas atravessa.","r":"ENEM PPL 2021 · Q101 — Poder de penetração das radiações","h":"H22","q":616},{"id":"CN-012","a":"CN","d":"Física","t":"Física moderna: radiação, radioatividade e efeito fotoelétrico","k":"fórmula","f":"Como a energia de um fóton se relaciona com a frequência da radiação?","v":"<b>E = h·f = h·c/λ<\/b>. Maior frequência (menor λ) → maior energia: UV e raios X ionizam; IV e micro-ondas não.","x":"Fototerapia da icterícia usa luz azul: energia certa para degradar a bilirrubina.","r":"ENEM 2025 · Q135 — Fototerapia da icterícia (radiação)","h":"H1","q":663},{"id":"CN-013","a":"CN","d":"Física","t":"Óptica: reflexão, refração, lentes e visão","k":"conceito","f":"Quando ocorre reflexão interna total e onde ela é aplicada?","v":"Luz indo do meio <b>mais refringente para o menos refringente<\/b> com ângulo de incidência maior que o ângulo limite. Aplicação: fibra óptica.","x":"Lei de Snell: n<sub>1<\/sub>·sen θ<sub>1<\/sub> = n<sub>2<\/sub>·sen θ<sub>2<\/sub>.","r":"ENEM PPL 2022 · Q115 — Fibra óptica e reflexão interna total","h":"H1","q":753},{"id":"CN-014","a":"CN","d":"Física","t":"Óptica: reflexão, refração, lentes e visão","k":"aplicação","f":"Miopia e hipermetropia: onde se forma a imagem e qual lente corrige?","v":"<b>Miopia<\/b>: imagem antes da retina → lente <b>divergente<\/b>.<br><b>Hipermetropia<\/b>: imagem depois da retina → lente <b>convergente<\/b>.","x":"Debaixo d'água a visão embaça porque a córnea perde poder de refração (n da água ≈ n da córnea).","r":"ENEM PPL 2022 · Q99 — Refração e formação de imagem no olho","h":"H1","q":592},{"id":"CN-015","a":"CN","d":"Física","t":"Ondulatória: som e acústica","k":"conceito","f":"Diferencie altura, intensidade e timbre de um som.","v":"<b>Altura<\/b>: frequência (grave × agudo).<br><b>Intensidade<\/b>: amplitude/energia (forte × fraco, em dB).<br><b>Timbre<\/b>: forma da onda/harmônicos (distingue instrumentos).","x":"Subir uma oitava = dobrar a frequência.","r":"ENEM PPL 2023 · Q110 — Frequência das notas musicais (oitavas)","h":"H17","q":623},{"id":"CN-016","a":"CN","d":"Física","t":"Ondulatória: som e acústica","k":"conceito","f":"O que é o efeito Doppler?","v":"Mudança da frequência <b>percebida<\/b> pelo movimento relativo fonte–observador: aproximação → mais agudo; afastamento → mais grave.","x":"Radares de velocidade e o desvio para o vermelho das galáxias usam o mesmo princípio.","r":"ENEM 2024 · Q99 — Efeito Doppler (radar/sirene)","h":"H7","q":627},{"id":"CN-017","a":"CN","d":"Física","t":"Eletromagnetismo e indução","k":"conceito","f":"O que é indução eletromagnética (Lei de Faraday)?","v":"Surge corrente induzida quando o <b>fluxo magnético varia<\/b> num circuito. Fluxo constante não induz nada.","x":"Base de usinas (geradores), transformadores, fogão por indução e cartões RFID.","r":"ENEM 2023 · Q108 — Fogão por indução (eletromagnetismo)","h":"H6","q":678},{"id":"CN-018","a":"CN","d":"Física","t":"Eletromagnetismo e indução","k":"aplicação","f":"Por que o fogão por indução só aquece panelas de material ferromagnético?","v":"O campo magnético alternado induz <b>correntes parasitas (de Foucault)<\/b> no fundo da panela, que aquecem por efeito Joule; o ferro concentra o campo.","x":"A superfície do fogão não esquenta diretamente — quem gera o calor é a panela.","r":"ENEM 2025 · Q122 — Indução eletromagnética (fogão)","h":"H23","q":665},{"id":"CN-019","a":"CN","d":"Física","t":"Cinemática: movimento, velocidade e aceleração","k":"fórmula","f":"Quais as equações do MUV?","v":"v = v<sub>0<\/sub> + a·t<br>s = s<sub>0<\/sub> + v<sub>0<\/sub>·t + a·t²/2<br>Torricelli: v² = v<sub>0<\/sub>² + 2·a·Δs","x":"Velocidade média = Δs/Δt; converta km/h ÷ 3,6 → m/s.","r":"ENEM 2023 · Q124 — Movimento e passagem por pedágio","h":"H20","q":600},{"id":"CN-020","a":"CN","d":"Física","t":"Cinemática: movimento, velocidade e aceleração","k":"pegadinha","f":"Desprezando o ar, um corpo pesado cai mais rápido que um leve?","v":"<b>Não.<\/b> Na queda livre todos têm a mesma aceleração g, independentemente da massa (Galileu).","x":"O ENEM contrapõe Aristóteles (corpo pesado cai antes) à física de Galileu.","r":"ENEM PPL 2024 · Q107 — Queda livre (independência da massa)","h":"H3","q":604},{"id":"CN-021","a":"CN","d":"Física","t":"Hidrostática: pressão, empuxo e densidade","k":"fórmula","f":"Como calcular a pressão no fundo de um líquido (Lei de Stevin)?","v":"<b>p = p<sub>atm<\/sub> + d·g·h<\/b>. A cada 10 m de água, a pressão aumenta ≈ 1 atm.","x":"Pressão depende da profundidade, não do formato do recipiente.","r":"ENEM 2020 · Q106 — Pressão hidrostática (caverna submersa)","h":"H17","q":636},{"id":"CN-022","a":"CN","d":"Física","t":"Hidrostática: pressão, empuxo e densidade","k":"conceito","f":"O que diz o Princípio de Arquimedes e quando um corpo flutua?","v":"Empuxo = peso do líquido deslocado: <b>E = d<sub>líq<\/sub>·V<sub>sub<\/sub>·g<\/b>. Flutua se d<sub>corpo<\/sub> < d<sub>líq<\/sub>.","x":"Densímetro afunda mais em líquido menos denso (ex.: álcool adulterado).","r":"ENEM 2018 · Q95 — Medida de densidade com densímetro","h":"H19","q":654},{"id":"CN-023","a":"CN","d":"Física","t":"Ondulatória: ondas e fenômenos ondulatórios","k":"fórmula","f":"Qual a equação fundamental da ondulatória?","v":"<b>v = λ·f<\/b>. A frequência é definida pela fonte e não muda ao trocar de meio; mudam v e λ.","x":"Eco: distância = v·t/2 (ida e volta).","r":"ENEM 2020 · Q114 — Medição de profundidade por eco","h":"H1","q":763},{"id":"CN-024","a":"CN","d":"Física","t":"Ondulatória: ondas e fenômenos ondulatórios","k":"conceito","f":"Como funcionam os fones com cancelamento de ruído?","v":"Emitem onda de mesma frequência e amplitude, <b>em oposição de fase<\/b> → <b>interferência destrutiva<\/b>.","x":"Ressonância (taça que quebra) é outro fenômeno: frequência externa igual à natural do corpo.","r":"ENEM 2020 · Q111 — Cancelamento de ruído (interferência)","h":"H1","q":669},{"id":"CN-025","a":"CN","d":"Física","t":"Gravitação e astronomia","k":"conceito","f":"O que causa as estações do ano?","v":"A <b>inclinação do eixo terrestre<\/b> (~23,5°) em relação ao plano da órbita, que muda a incidência dos raios solares em cada hemisfério.","x":"Pegadinha: NÃO é a distância Terra–Sol.","r":"ENEM 2022 · Q111 — Inclinação do eixo terrestre (estações)","h":"H17","q":597},{"id":"CN-026","a":"CN","d":"Física","t":"Gravitação e astronomia","k":"pegadinha","f":"Massa e peso mudam na Lua?","v":"<b>Massa<\/b> (kg) não muda. <b>Peso<\/b> P = m·g muda: g da Lua ≈ 1/6 do da Terra. Balança de braços mede massa; de mola/plataforma, peso.","x":"Questões comparam balança de pratos com balança digital.","r":"ENEM PPL 2021 · Q119 — Balança de braços vs plataforma (massa e peso)","h":"H19","q":630},{"id":"CN-027","a":"CN","d":"Física","t":"Dinâmica: leis de Newton, forças e atrito","k":"conceito","f":"Enuncie as três leis de Newton.","v":"1ª <b>Inércia<\/b>: sem força resultante, mantém repouso ou MRU.<br>2ª <b>F<sub>R<\/sub> = m·a<\/b>.<br>3ª <b>Ação e reação<\/b>: forças iguais e opostas, em corpos diferentes.","x":"Ação e reação nunca se anulam, pois atuam em corpos distintos.","r":"ENEM 2018 · Q128 — Ação e reação (vela e ventilador)","h":"H3","q":617},{"id":"CN-028","a":"CN","d":"Física","t":"Dinâmica: leis de Newton, forças e atrito","k":"conceito","f":"Qual o sentido da força de atrito sobre os pés (ou pneus) de quem anda ou acelera?","v":"O atrito estático no pé/pneu aponta <b>para frente<\/b>: o pé empurra o chão para trás e o chão empurra para frente.","x":"Atrito se opõe ao deslizamento relativo, não necessariamente ao movimento.","r":"ENEM 2013 · Q76 — Direção e sentido do atrito (subida de rampa)","h":"H20","q":695},{"id":"CN-029","a":"CN","d":"Física","t":"Termodinâmica e máquinas térmicas","k":"fórmula","f":"Qual o rendimento máximo de uma máquina térmica (Carnot)?","v":"<b>η = 1 − T<sub>fria<\/sub>/T<sub>quente<\/sub><\/b> (temperaturas em kelvin). Nenhuma máquina converte todo calor em trabalho (2ª lei).","x":"Converta °C → K somando 273.","r":"ENEM PPL 2016 · Q69 — Entropia e rendimento (ciclo de Carnot)","h":"H21","q":739},{"id":"CN-030","a":"CN","d":"Física","t":"Termodinâmica e máquinas térmicas","k":"conceito","f":"Como funciona uma geladeira do ponto de vista termodinâmico?","v":"Recebe <b>trabalho<\/b> do compressor para retirar calor do interior (fonte fria) e rejeitá-lo no ambiente (fonte quente). Q<sub>quente<\/sub> = Q<sub>fria<\/sub> + W.","x":"Deixar a porta aberta aquece a cozinha: rejeita-se mais calor do que se retira.","r":"ENEM PPL 2020 · Q122 — Funcionamento da geladeira","h":"H6","q":606},{"id":"CN-031","a":"CN","d":"Física","t":"Impulso, quantidade de movimento e colisões","k":"conceito","f":"Por que airbag, capacete e zonas de deformação reduzem lesões?","v":"Teorema do impulso: <b>F·Δt = Δq<\/b>. Para a mesma variação de quantidade de movimento, <b>aumentar Δt<\/b> diminui a força média.","x":"Eles NÃO reduzem a variação de quantidade de movimento, só a força.","r":"ENEM 2024 · Q91 — Impulso e deformação (segurança veicular)","h":"H18","q":547},{"id":"CN-032","a":"CN","d":"Física","t":"Impulso, quantidade de movimento e colisões","k":"conceito","f":"O que se conserva em colisões elásticas e inelásticas?","v":"A <b>quantidade de movimento<\/b> (q = m·v) se conserva em ambas (sistema isolado). Energia cinética só se conserva na <b>elástica<\/b>.","x":"Inelástica perfeita: corpos seguem juntos, máxima perda de energia cinética.","r":"ENEM 2016 · Q77 — Colisão inelástica (trilho de ar)","h":"H20","q":673},{"id":"CN-033","a":"CN","d":"Física","t":"Trabalho, energia e potência mecânica","k":"fórmula","f":"Quais as fórmulas de energia cinética, potencial gravitacional e potência?","v":"E<sub>c<\/sub> = m·v²/2 · E<sub>p<\/sub> = m·g·h · <b>P = E/Δt<\/b> (W = J/s).","x":"Dobrar a velocidade quadruplica a energia cinética.","r":"ENEM PPL 2022 · Q131 — Energia do meteorito (energia cinética)","h":"H20","q":584},{"id":"CN-034","a":"CN","d":"Física","t":"Trabalho, energia e potência mecânica","k":"aplicação","f":"Como calcular a potência de uma bomba que eleva água?","v":"P = m·g·h / Δt. Com vazão: P = d·Vazão·g·h. Considere o rendimento: P<sub>útil<\/sub> = η·P<sub>total<\/sub>.","x":"1 L de água ≈ 1 kg.","r":"ENEM PPL 2020 · Q121 — Trabalho e potência (bombeamento)","h":"H23","q":699},{"id":"CN-035","a":"CN","d":"Física","t":"Energia: fontes, geração e transmissão","k":"conceito","f":"Qual a cadeia de transformações de energia numa hidrelétrica?","v":"Potencial gravitacional → cinética (água) → cinética de rotação (turbina) → <b>elétrica<\/b> (gerador, por indução).","x":"Potência disponível ≈ d·Vazão·g·h; parte se perde (rendimento < 100%).","r":"ENEM 2016 · Q47 — Potência não aproveitada (usina de Itaipu)","h":"H8","q":701},{"id":"CN-036","a":"CN","d":"Física","t":"Energia: fontes, geração e transmissão","k":"aplicação","f":"Por que a energia é transmitida em alta tensão?","v":"Para a mesma potência, maior U → menor corrente → menor perda por efeito Joule nos fios (<b>P<sub>perdida<\/sub> = R·i²<\/b>).","x":"Microgeração perto do consumo também reduz perdas na transmissão.","r":"ENEM PPL 2023 · Q100 — Microgeração e perdas na transmissão","h":"H23","q":754},{"id":"CN-037","a":"CN","d":"Física","t":"Estática e equilíbrio","k":"fórmula","f":"Quais as condições de equilíbrio de um corpo extenso?","v":"Força resultante nula e <b>momento (torque) resultante nulo<\/b>: M = F·d (d = braço de alavanca).","x":"Alavancas: F<sub>1<\/sub>·d<sub>1<\/sub> = F<sub>2<\/sub>·d<sub>2<\/sub>.","r":"ENEM 2015 · Q82 — Momento das forças em barra (alavanca)","h":"H17","q":612},{"id":"CN-038","a":"CN","d":"Física","t":"Estática e equilíbrio","k":"pegadinha","f":"Por que uma corda (ou slackline) quase horizontal fica muito tracionada?","v":"As componentes verticais das trações devem equilibrar o peso; com ângulo pequeno, sen θ é pequeno → <b>T = P/(2·sen θ)<\/b> fica enorme.","x":"Quanto mais esticada a corda, maior a tração.","r":"ENEM 2019 · Q106 — Tensão e equilíbrio de forças (slackline)","h":"H17","q":694},{"id":"CN-039","a":"CN","d":"Física","t":"Movimento circular","k":"fórmula","f":"Como se relacionam velocidade linear, angular e raio em engrenagens e polias?","v":"<b>v = ω·R = 2πR·f<\/b>. Polias ligadas por correia ou engrenagens em contato: <b>mesma v<\/b> → f<sub>1<\/sub>R<sub>1<\/sub> = f<sub>2<\/sub>R<sub>2<\/sub>. Coaxiais: mesma ω.","x":"Trocar aro do pneu sem recalibrar o velocímetro altera a velocidade real.","r":"ENEM 2013 · Q66 — Polias e velocidade linear (serra de fita)","h":"H7","q":702},{"id":"CN-040","a":"CN","d":"Física","t":"Movimento circular","k":"conceito","f":"O que é a força centrípeta e como a centrífuga separa materiais?","v":"Resultante que aponta para o centro: <b>F<sub>c<\/sub> = m·v²/R<\/b>. Na centrífuga, partículas mais densas tendem a seguir em linha reta (inércia) e vão para o fundo.","x":"\"Força centrífuga\" é efeito de inércia no referencial girante.","r":"ENEM 2017 · Q115 — Centrífuga e força centrípeta","h":"H7","q":549},{"id":"CN-041","a":"CN","d":"Física","t":"Oscilações, MHS e elasticidade","k":"fórmula","f":"Lei de Hooke e energia elástica: quais as fórmulas?","v":"<b>F = k·x<\/b> e <b>E<sub>el<\/sub> = k·x²/2<\/b>. A energia elástica pode se converter em cinética/potencial.","x":"Dobrar a deformação quadruplica a energia armazenada.","r":"ENEM 2015 · Q70 — Lei de Hooke e alcance (estilingue)","h":"H6","q":null},{"id":"CN-042","a":"CN","d":"Física","t":"Oscilações, MHS e elasticidade","k":"fórmula","f":"De que depende o período de um pêndulo simples?","v":"<b>T = 2π√(L/g)<\/b>: só do comprimento e da gravidade — <b>não<\/b> da massa nem da amplitude (pequenas oscilações).","x":"Relógio de pêndulo atrasa se o fio dilatar (L aumenta → T aumenta).","r":"ENEM 2014 · Q46 — Período do pêndulo simples (relógio)","h":"H1","q":693},{"id":"CN-043","a":"CN","d":"Física","t":"Eletrostática","k":"conceito","f":"Como ocorre a eletrização por atrito?","v":"Dois materiais diferentes trocam <b>elétrons<\/b>: um fica positivo e o outro negativo, com cargas de mesmo módulo.","x":"Só elétrons se movem; prótons não são transferidos.","r":"ENEM 2020 · Q91 — Eletrização por atrito","h":"H3","q":563},{"id":"CN-044","a":"CN","d":"Física","t":"Eletrostática","k":"fórmula","f":"O que indica a capacidade de uma bateria em mAh e como calcular o tempo de uso?","v":"É carga elétrica: <b>Q = i·Δt<\/b>. Tempo = capacidade / corrente (ex.: 3000 mAh a 500 mA → 6 h).","x":"mAh é carga, não energia; energia = Q·U.","r":"ENEM PPL 2017 · Q117 — Capacidade de bateria (Ah)","h":"H19","q":707},{"id":"CN-045","a":"CN","d":"Biologia","t":"Genética e hereditariedade","k":"aplicação","f":"Qual a proporção do cruzamento Aa × Aa (1ª Lei de Mendel)?","v":"Genótipos <b>1 AA : 2 Aa : 1 aa<\/b>; fenótipos <b>3 dominantes : 1 recessivo<\/b>.","x":"Entre os de fenótipo dominante, a chance de ser heterozigoto é 2/3.","r":"ENEM 2025 · Q107 — Cruzamento e proporção fenotípica","h":"H13","q":563},{"id":"CN-046","a":"CN","d":"Biologia","t":"Genética e hereditariedade","k":"conceito","f":"Por que o daltonismo é mais frequente em homens?","v":"Herança <b>recessiva ligada ao X<\/b>: homem (XY) tem um só X e manifesta com um alelo; mulher precisa de dois (X<sup>d<\/sup>X<sup>d<\/sup>).","x":"Pai afetado passa o X para todas as filhas (portadoras) e nunca para os filhos.","r":"ENEM 2024 · Q112 — Herança ligada ao X (daltonismo)","h":"H13","q":577},{"id":"CN-047","a":"CN","d":"Biologia","t":"Genética e hereditariedade","k":"conceito","f":"Como se herda o DNA mitocondrial?","v":"Exclusivamente pela <b>linhagem materna<\/b>: as mitocôndrias do zigoto vêm do óvulo.","x":"Útil para rastrear ancestralidade materna e identificar parentes.","r":"ENEM PPL 2022 · Q98 — DNA mitocondrial e linhagem materna","h":"H13","q":599},{"id":"CN-048","a":"CN","d":"Biologia","t":"Genética e hereditariedade","k":"conceito","f":"O que causa a síndrome de Down?","v":"<b>Trissomia do cromossomo 21<\/b>, geralmente por <b>não disjunção<\/b> na meiose (mais comum com idade materna avançada).","x":"É alteração cromossômica numérica (
